<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant Plyo</title>
<style>
  /* Assistant Plyo v2 — maquette : docs/plyo/maquette-assistant-plyo.html (colonne de droite).
     Variables --orca-* injectées par OrcaSlicer (thème clair ou sombre, attribut data-orca-theme) ; valeurs de repli
     pour un navigateur. Tailles, rayons et espacements de la maquette. */
  :root {
    --bg: var(--orca-bg, #ffffff);
    --fg: var(--orca-fg, #1d2527);
    --muted: var(--orca-muted, #667074);
    --border: var(--orca-border, #e1e5e4);
    --accent: var(--orca-accent, #00897b);
    --font: var(--orca-font, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif);
    /* Blanc sur l'accent d'Orca ne fait pas 4,5:1 : les fonds pleins et textes accentués prennent un vert plus sombre. */
    --accent-fill: #00796b;
    --on-accent: #ffffff;
    --accent-text: #00695c;
    --accent-soft: color-mix(in srgb, var(--accent) 10%, var(--bg));
    --surface: color-mix(in srgb, var(--fg) 4%, var(--bg));
    --raised: color-mix(in srgb, var(--fg) 8%, var(--bg));
    --warn: #d18a00;
    --warn-text: #8a5300;
    --warn-soft: color-mix(in srgb, var(--warn) 13%, var(--bg));
    --danger: #d64545;
    --danger-text: #b3261e;
    --danger-soft: color-mix(in srgb, var(--danger) 10%, var(--bg));
    --ok: #2e7d32;
    --ok-soft: color-mix(in srgb, var(--ok) 11%, var(--bg));
    --shadow: 0 10px 30px rgba(20, 30, 30, .14);
    --shadow-sm: 0 2px 8px rgba(20, 30, 30, .08);
    --r: 14px; --r-sm: 9px; --pill: 999px;
    color-scheme: light;
  }
  :root[data-orca-theme="dark"] {
    --accent-fill: #0f766e; /* audit 24/11 : blanc sur l'accent sombre en AA (maquette) */
    --accent-text: #6fd1c5;
    --accent-soft: color-mix(in srgb, var(--accent) 18%, var(--bg));
    --warn-text: #f2b544;
    --danger-text: #ff8a80;
    --ok: #66bb6a;
    --ok-soft: color-mix(in srgb, #66bb6a 14%, var(--bg));
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* Préfixées par « html » : ces règles gagnent sur les styles par défaut qu'Orca injecte (boutons en texte blanc…). */
  html, body { height: 100%; }
  html body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
  html button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
  html button[disabled] { cursor: default; }
  html textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  /* Lu par les lecteurs d'écran seulement (#announce : le changement d'étape). */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  /* Moins d'animations demandées : rien ne bouge ni ne clignote. */
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  svg.i { flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  /* Bouton d'une seule icône : une boîte fixe et l'icône au centre exact (ni marge de texte ni ligne de base). */
  html button.only-icon, html .iconbtn, html .send { display: inline-grid; place-items: center; padding: 0; line-height: 0; }
  html button.only-icon > svg.i, html .iconbtn > svg.i, html .send > svg.i { display: block; margin: 0; }
  .small { font-size: 12.5px; }
  .muted { color: var(--muted); }

  /* En-tête */
  .phead { position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--border); }
  .pdot { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #4db6ac); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
  .phead strong { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .spacer { flex: 1; }
  html .phone-pill { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent-text); background: var(--accent-soft); border-radius: var(--pill); padding: 6px 8px; }
  html .gauge { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg); border-radius: var(--pill); padding: 5px 9px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .gauge .gname { font-size: 11.5px; }
  .gauge .bar { width: 40px; height: 6px; border-radius: 6px; background: var(--raised); overflow: hidden; }
  .gauge .bar i { display: block; height: 100%; width: 3%; background: var(--accent); border-radius: 6px; transition: width .6s; }
  .gauge b { color: var(--fg); font-variant-numeric: tabular-nums; }
  .gauge.low .bar i { background: var(--warn); }
  html .gauge.empty { border-color: var(--danger); color: var(--danger-text); }
  .gauge.empty .bar i { background: var(--danger); }
  /* Panneau étroit : la barre de la jauge cède la place (comme dans la maquette), le pourcentage reste. */
  @media (max-width: 440px) { .gauge .bar { display: none; } }
  @media (max-width: 340px) { .gauge .gname { display: none; } }
  html .iconbtn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); flex: none; }
  html .iconbtn:hover { background: var(--surface); color: var(--fg); }
  .menu { position: absolute; right: 12px; top: 52px; width: 290px; max-width: calc(100vw - 24px); max-height: calc(100vh - 70px); overflow: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; z-index: 30; }
  .menu .g { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px 4px; }
  html .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 9px; text-align: left; }
  html .menu button:hover { background: var(--surface); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 5px 0; }
  .menu hr:first-child { display: none; }
  #menu-items > hr:first-child { display: none; }
  .menu svg.i { color: var(--muted); }
  html .menu button[disabled] { opacity: .45; }
  html .menu button[disabled]:hover { background: none; }
  .menu .grow { flex: 1; min-width: 0; }
  .menu .who { font-size: 12px; color: var(--muted); padding: 2px 10px 4px; overflow-wrap: anywhere; }
  .menu .tg { margin-left: auto; width: 30px; height: 18px; border-radius: 9px; background: var(--raised); position: relative; flex: none; transition: background .15s; }
  .menu .tg::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: left .15s; }
  .menu .tg.on { background: var(--accent-fill); } .menu .tg.on::after { left: 14px; }

  /* Fenêtres (v2/fenetres.js) : par-dessus le panneau, une à la fois. */
  .ov { position: fixed; inset: 0; background: rgba(15, 20, 20, .38); display: grid; place-items: center; z-index: 50; padding: 16px; }
  :root[data-orca-theme="dark"] .ov { background: rgba(0, 0, 0, .55); }
  .modal { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); width: 100%; max-width: 440px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; padding: 18px 18px 14px; }
  .modal.wide { max-width: 560px; }
  .mhead { display: flex; align-items: flex-start; gap: 8px; }
  .mhead h3 { margin: 4px 0 6px; font-size: 19px; letter-spacing: -.01em; flex: 1; min-width: 0; }
  html .mhead .mx { width: 32px; height: 32px; margin: -4px -6px 0 0; }
  .modal > p.sub { margin-bottom: 12px; font-size: 13px; }
  .mbody { overflow: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; padding: 2px; }
  .mfoot { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding-top: 12px; flex-wrap: wrap; }
  .mfoot .grow { flex: 1; }
  h4.mh { margin: 6px 0 0; font-size: 14px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; }
  .li.cur { border-color: var(--accent); background: var(--accent-soft); }
  .li .lic { color: var(--accent-text); display: flex; }
  .li strong { display: block; font-size: 14px; overflow-wrap: anywhere; }
  .li small { display: block; color: var(--muted); font-size: 12.5px; }
  .li p { margin: 0; font-size: 13px; }
  html .btn.danger { color: var(--danger-text); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
  html .btn.main, html .mfoot .btn.main { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
  .gbig { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 14px; background: var(--surface); }
  .gbig .pct { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .gbig small { color: var(--muted); font-size: 12.5px; }
  .gbig .progress { margin: 6px 0 2px; }
  .gbig.low .progress i { background: var(--warn); } .gbig.empty .progress i { background: var(--danger); }
  .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (max-width: 420px) { .plans { grid-template-columns: 1fr; } }
  .plan { border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .plan.cur { border-color: var(--accent); background: var(--accent-soft); }
  .plan h4 { margin: 0; font-size: 14px; }
  .plan .hint { margin: 0; }
  .jpart { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .jpart h4 { margin: 0; font-size: 14px; }
  .jev { display: flex; gap: 10px; align-items: flex-start; }
  .jev .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; }
  .jev .thumb.ph { display: grid; place-items: center; background: var(--surface); color: var(--muted); }
  .jev p { margin: 2px 0; font-size: 13px; }
  .jtop { display: flex; justify-content: space-between; gap: 8px; align-items: center; color: var(--muted); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.bad, .badge.error { background: var(--danger-soft); color: var(--danger-text); } .badge.warn { background: var(--warn-soft); color: var(--warn-text); }
  .machines { display: flex; flex-direction: column; gap: 8px; }
  .machines .machine-row { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .machines .machine-row.off { opacity: .6; }
  .machines .row-acts, .machines .printer-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .machines p { margin: 0; }
  .machines .muted { color: var(--muted); } .machines .small { font-size: 12.5px; }
  ol.welcome { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  ol.welcome li { display: flex; gap: 12px; align-items: center; }
  ol.welcome b { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; flex: none; }
  .check-line { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .check-line input { margin: 2px 0 0; flex: none; accent-color: var(--accent-fill); }
  .notice textarea.field { margin-top: 8px; font-size: 13px; padding: 8px 10px; }
  .notice .check-line { margin-top: 8px; }
  .ai-foot { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  html .link.muted.flagged, html .ai-foot .link { font-size: 12.5px; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
  .feedback { display: flex; flex-direction: column; gap: 6px; }
  .feedback .acts { margin-top: 0; align-items: center; }
  details.fold-detail summary { cursor: pointer; color: var(--accent-text); font-weight: 600; font-size: 12.5px; margin-top: 6px; }
  .notice .done-line { margin-top: 6px; }
  .reliable { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .reliable .hint { margin: 0; }
  .notice .link > svg, .done-line .link > svg { margin-right: 4px; vertical-align: -3px; }

  /* Barre des étapes */
  .stepper { display: flex; justify-content: space-between; align-items: center; gap: 3px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  html .st { display: flex; align-items: center; gap: 5px; padding: 4px 4px; border-radius: var(--pill); color: var(--muted); font-weight: 550; font-size: 12.5px; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
  .st .l { overflow: hidden; text-overflow: ellipsis; }
  html .st.cur, html .st.open { flex-shrink: 0; }
  .st .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 2px solid var(--border); background: var(--bg); flex: none; }
  html .st.cur, html .st.done { color: var(--fg); }
  .st.cur .n { border-color: var(--accent); color: var(--accent-text); }
  .st.done .n { background: var(--accent); border-color: var(--accent); color: #fff; }
  html .st:not([disabled]):hover { background: var(--surface); }
  html .st.open { background: var(--accent-soft); }
  .st-line { flex: 1 0 6px; min-width: 6px; height: 2px; background: var(--border); border-radius: 2px; }
  .st-line.on { background: var(--accent); }
  @media (max-width: 340px) { .st .l { display: none; } .st.cur .l { display: inline; } }

  /* Deux zones : l'étape et la conversation. Une seule dépliée (pleine hauteur), l'autre en barre avec « Afficher ». */
  /* Avis en haut de l'étape : un problème arrivé pendant qu'on y travaille (rien ne part en silence dans la conversation). */
  .stepalert { margin-bottom: 12px; }
  .stepalert .notice { position: relative; padding-right: 34px; }
  html .stepalert .x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
  html .stepalert .x:hover { background: var(--surface); color: var(--fg); }
  .zones { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .zone-step, .zone-chat { display: flex; flex-direction: column; min-height: 0; }
  .zbody { flex: 1; min-height: 0; overflow: auto; }
  #stepscroll { padding: 14px 16px 16px; }
  .pscroll { padding: 10px 16px 10px; display: flex; flex-direction: column; gap: 14px; }
  html .zbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); cursor: pointer; text-align: left; }
  #stepbar { border-bottom: 1px solid var(--border); }
  #chatbar { border-top: 1px solid var(--border); }
  .zbar .zt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .zl { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .zbar b { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zbar small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  html .zshow { flex: none; border: 1px solid var(--accent); color: var(--accent-text); background: var(--bg); border-radius: var(--pill); padding: 5px 12px; font-size: 12.5px; font-weight: 650; cursor: pointer; }
  .zbadge { flex: none; background: var(--accent-fill); color: var(--on-accent); border-radius: var(--pill); font-size: 11px; font-weight: 700; padding: 1px 7px; }
  #stepbar-go { flex: none; }
  .zbar .pdot { flex: none; width: 22px; height: 22px; border-radius: 7px; font-size: 11px; }
  .zhead { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 16px 0; }
  .ztitle { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .ztitle::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  html .zreduce { border: 0; background: none; color: var(--accent-text); font-weight: 600; font-size: 12.5px; padding: 0; cursor: pointer; }
  .zones[data-open="step"] .zone-step { flex: 1; }
  .zones[data-open="step"] #stepbar, .zones[data-open="step"] .zhead, .zones[data-open="step"] #pscroll { display: none; }
  .zones[data-open="chat"] .zone-chat { flex: 1; }
  .zones[data-open="chat"] #stepscroll, .zones[data-open="chat"] #chatbar { display: none; }
  /* Un message arrivé plus bas pendant qu'on travaille dans la carte : le panneau ne bouge pas, ce bouton y mène. */
  html .newmsg { position: sticky; bottom: 4px; align-self: center; z-index: 2; border: 1px solid var(--accent); background: var(--bg); color: var(--accent-text); border-radius: var(--pill); padding: 5px 12px; font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow-sm, 0 2px 8px rgba(20, 30, 30, .08)); cursor: pointer; }
  .stepcard { border: 1px solid var(--border); border-radius: 16px; padding: 18px 18px 16px; background: var(--bg); box-shadow: var(--shadow-sm); flex: none; }
  .kicker { font-size: 12px; font-weight: 650; color: var(--accent-text); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px; }
  h2.t { font-size: 21px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.015em; }
  p.sub { color: var(--muted); margin: 0; }
  .card-content { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .chosen { display: grid; gap: 8px; }
  .chosen-line { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; }
  .chosen-line .ic { color: var(--accent-text); display: flex; }
  .chosen-line .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  /* Bouton plein en bas de la carte, dans le fil (lot 5) : plus collé par-dessus le contenu, rien de la carte n'est masqué. */
  .stepcard .foot { padding: 14px 0 2px; display: flex; flex-direction: column; gap: 8px; }
  .stepcard .foot .hint { text-align: center; }
  .note { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 11px 13px; background: var(--surface); font-size: 13px; }
  .note.tip { background: var(--accent-soft); }
  .note.tip > svg { color: var(--accent-text); margin-top: 1px; }
  .note p { margin: 0; }

  html .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); padding: 10px 16px; font-weight: 600; }
  html .btn:hover { background: var(--surface); }
  html .btn.primary, html .notice .acts .btn.main, html .questions .acts .btn { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
  html .btn.primary { padding: 14px 18px; font-size: 15px; }
  html .btn.primary:hover, html .notice .acts .btn.main:hover { filter: brightness(1.06); background: var(--accent-fill); }
  html .btn[disabled] { opacity: .45; box-shadow: none; }
  html .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .btn.wide { width: 100%; }
  html .link { color: var(--accent-text); font-weight: 600; padding: 4px 0; text-align: left; }
  .link:hover { text-decoration: underline; }

  .msgs { display: flex; flex-direction: column; gap: 12px; flex: none; }
  .hello h3 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  html .chip { border: 1.5px solid var(--border); background: var(--bg); border-radius: var(--pill); padding: 6px 11px; font-weight: 550; font-size: 12.5px; text-align: left; }
  html .chip:not([disabled]):hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  html .chip.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
  html .chip.colour { display: inline-flex; align-items: center; gap: 6px; padding-left: 7px; }
  .new-spool { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.colours-box .colour-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
html .colours-box .colour-chips .chip.on { border-color: var(--accent); background: var(--accent-soft); }
.colours-box .colour-spread { margin: 8px 0 12px; }
.slot-temps { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; background: var(--surface); overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--accent-fill); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg .who { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .msg .who i { width: 16px; height: 16px; border-radius: 5px; background: var(--accent-fill); color: #fff; font-style: normal; font-size: 10px; font-weight: 700; display: grid; place-items: center; }

  .rich p { margin: 0 0 6px; } .rich p:last-child { margin-bottom: 0; }

  .rich .ui { font-weight: 600; color: var(--accent-text); }
  .sheet { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); }
  .sheet-title { margin: 0 0 4px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
  .proposed { margin: 0; padding-left: 18px; }

  .typing { display: flex; align-items: center; gap: 4px; }

  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  .typing .wait-text { margin: 0 8px 0 6px; color: var(--muted); font-size: 13px; }
  @keyframes bl { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .notice { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 11px 13px; background: var(--surface); font-size: 13px; }
  .notice > svg { margin-top: 1px; color: var(--accent-text); }
  .notice.warn { background: var(--warn-soft); } .notice.warn > svg { color: var(--warn-text); }
  .notice.error { background: var(--danger-soft); } .notice.error > svg { color: var(--danger-text); }
  .notice-body { flex: 1; min-width: 0; }
  html .note .acts .btn.main { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
  .note .acts { margin-top: 8px; }
  .note-body { flex: 1; min-width: 0; }

  .note.ok { background: var(--ok-soft); } .note.ok > svg { color: var(--ok); }
  .note.error { background: var(--danger-soft); } .note.error > svg { color: var(--danger-text); }

  /* Étape 1 « Ta pièce » (v2/piece.js) : zone de dépôt, choix, galerie, création par l'IA, pièce posée */
  .center { text-align: center; align-self: center; }
  html .link.muted { color: var(--muted); font-weight: 500; text-align: center; }
  .dropzone { border: 2px dashed color-mix(in srgb, var(--accent) 45%, var(--border)); border-radius: 14px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .dropzone > svg { color: var(--accent-text); }
  .dropzone.over { background: var(--accent-soft); border-color: var(--accent); }
  .dropzone strong { display: block; color: var(--fg); font-size: 15px; margin: 6px 0 2px; }
  .cards { display: grid; gap: 10px; }
  html .card { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; border: 1.5px solid var(--border); background: var(--bg); border-radius: var(--r); padding: 12px 14px; transition: border-color .12s, background .12s; }
  html .card:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .card .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; color: var(--accent-text); flex: none; }
  .card .mid { min-width: 0; flex: 1; }
  .card strong { display: block; font-size: 15px; overflow-wrap: anywhere; }
  .card small { color: var(--muted); font-size: 12.5px; display: block; }
  .card .end { margin-left: auto; color: var(--muted); display: flex; align-items: center; gap: 6px; flex: none; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 650; border-radius: var(--pill); padding: 2px 8px; background: var(--accent-soft); color: var(--accent-text); white-space: nowrap; }
  .badge.ai { background: linear-gradient(90deg, color-mix(in srgb, #7c4dff 14%, var(--bg)), color-mix(in srgb, var(--accent) 14%, var(--bg))); color: var(--fg); }
  .sec { margin: 10px 0 0; font-size: 13px; font-weight: 650; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .sec::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .tabs { margin-bottom: 2px; }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 340px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
  html .gitem { border: 1.5px solid var(--border); border-radius: 12px; background: var(--bg); padding: 8px 8px 10px; text-align: center; min-width: 0; }
  html .gitem:hover { border-color: var(--accent); }
  .gitem .th { height: 74px; border-radius: 9px; background: var(--surface); display: grid; place-items: center; margin-bottom: 6px; color: var(--accent-text); overflow: hidden; }
  .gitem .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gitem strong { display: block; font-size: 12.5px; overflow-wrap: anywhere; }
  .gitem small { font-size: 11px; color: var(--muted); display: block; overflow-wrap: anywhere; }
  html textarea.field { width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; background: var(--bg); resize: vertical; font-size: 14px; }
  html textarea.field:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > .btn { flex: 1 1 140px; }
  .att-line { display: flex; align-items: center; gap: 10px; }
  .att-line img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
  .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .scan { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--surface); font-size: 13px; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); animation: sp .8s linear infinite; flex: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .summary-line { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; }
  .summary-line .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; color: var(--accent-text); flex: none; }
  .summary-line small { display: block; color: var(--muted); font-size: 12.5px; }
  .acts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  html .act { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--bg); padding: 10px 4px; font-size: 12px; color: var(--fg); text-align: center; }
  html .act:not([disabled]):hover { border-color: var(--accent); }
  html .act.on { border-color: var(--accent); background: var(--accent-soft); }
  .act > svg { color: var(--accent-text); }
  html .act[disabled] { opacity: .5; }
  /* « Quelle pièce ? » (plusieurs pièces sur le plateau) : mise en avant quand un geste attend le choix. */
  .target-pick { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); }
  .target-pick.ask { outline: 1.5px solid var(--accent); }
  .target-pick.ask > span { color: var(--accent-text); font-weight: 600; }
  .inline-pop { padding: 12px; border-radius: 12px; background: var(--surface); font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
  .inline-pop.pop-head { flex-direction: row; align-items: center; gap: 10px; }
  .pop-head { display: flex; justify-content: space-between; align-items: center; }
  .inline-pop input[type=range] { width: 100%; accent-color: var(--accent); }
  .inline-pop .count { font-size: 18px; min-width: 24px; text-align: center; }
  .done-line { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; }
  .done-line.ok > svg { color: var(--ok); }
  .done-line.error { color: var(--danger-text); }
  .cmds { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .msg .acts .btn { padding: 6px 11px; font-size: 12.5px; }
  html .msg .acts .btn.main, html .note .acts .btn.main { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
  .q { margin: 4px 0 0; font-weight: 600; }

  /* Champ de saisie, toujours en bas */
  /* Étape 2 « Imprimante et bobine » (v2/materiel.js) : cartes à cocher, emplacements, « Préciser ma bobine ». */
  html .card.sel { border-color: var(--accent); background: var(--accent-soft); }
  .card.sel .ic { background: var(--bg); }
  .card.sel small { color: color-mix(in srgb, var(--fg) 72%, var(--accent-soft)); }
  html .card[disabled] { opacity: .6; cursor: default; }
  .card .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; flex: none; }
  .card.sel .check { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
  .badge.usb { background: var(--raised); color: color-mix(in srgb, var(--fg) 78%, var(--raised)); }
  .cyl { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(0, 0, 0, .12); background: var(--raised); display: block; }
  .cyl.small { width: 16px; height: 16px; border-width: 2px; flex: none; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 340px) { .slots { grid-template-columns: repeat(3, 1fr); } }
  html .slot { border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 4px; text-align: center; font-size: 12px; background: var(--bg); min-width: 0; overflow-wrap: anywhere; }
  .slot .cyl { width: 30px; height: 30px; margin: 0 auto 6px; }
  .slot b { display: block; font-size: 13px; }
  html .slot.sel { border-color: var(--accent); background: var(--accent-soft); }
  html .slot:not(.sel):not([disabled]):hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .slot.empty { color: var(--muted); border-style: dashed; }
  .slot.empty .cyl { background: transparent; border-style: dashed; }
  .fold { border: 1px solid var(--border); border-radius: 12px; }
  html .fold > button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 11px 13px; font-weight: 600; color: var(--muted); text-align: left; }
  .fold > button svg:last-child { margin-left: auto; transition: transform .15s; }
  .fold.open > button svg:last-child { transform: rotate(180deg); }
  .fold .in { padding: 0 13px 13px; display: flex; flex-direction: column; gap: 8px; }
  .fld { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); flex: 1 1 130px; min-width: 0; }
  html .fld input, html .fld select, html input.search, html .row2 select, html .note input { border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; background: var(--bg); color: var(--fg); font: inherit; font-size: 14px; width: 100%; min-width: 0; }
  html input.search { border-width: 1.5px; border-radius: 12px; padding: 11px 12px; }
  html .fld input:focus, html .fld select:focus, html input.search:focus { outline: none; border-color: var(--accent); }
  .row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row2.manual, .row2.colour-line { align-items: center; flex-wrap: nowrap; }
  .row2.manual select, .row2.colour-line select { flex: 1; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 0; }
  /* Sur un avis coloré (orange, rouge, vert), le gris d'aide passe sous 4,5:1 : il se fonce un peu (AA). */
  .note.warn .hint, .note.error .hint, .note.ok .hint, .notice.warn .hint, .notice.error .hint { color: color-mix(in srgb, var(--fg) 72%, var(--bg)); }
  ol.hint { padding-left: 18px; }
  .err { font-size: 12.5px; color: var(--danger-text); margin: 0; }
  .hwline { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  html .hwline .link { padding: 0; font-size: 12.5px; min-height: 24px; }
  .fixed { padding: 9px 0; color: var(--fg); font-size: 14px; }
  .left { display: flex; }
  .num { width: 18px; text-align: center; flex: none; }
  .chips.mats .chip { padding: 8px 14px; font-size: 13.5px; }
  /* Carte « Couleurs » : la vue partagée avec le classique (colours-view.js). */
  .colours-box { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .colours-box .project-body { display: flex; flex-direction: column; gap: 8px; }
  .colours-box p { margin: 0; }
  .colours-box .muted { color: var(--muted); }
  .colours-box .small { font-size: 12.5px; }
  .colours-box .project-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .colours-box .project-label { display: flex; flex-direction: column; min-width: 0; }
  .colours-box .colour-right { display: flex; align-items: center; gap: 8px; }
  .colours-box .colour-spool { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .colours-box .colour-part { padding-left: 14px; }
  .colours-box .swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .2); display: inline-block; flex: none; background: var(--raised); }
  .colours-box .printer-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  html .colours-box .btn.ghost { padding: 6px 10px; font-size: 12.5px; border-radius: 10px; }
  html .colours-box .btn.on { border-color: var(--accent); background: var(--accent-soft); }
  .colours-box .project-error { color: var(--danger-text); font-size: 12.5px; }
  .colours-box .project-ok { color: var(--ok); font-size: 12px; }
  .colours-box .brand-ask { padding: 10px; border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
  html .colours-box .disclosure { color: var(--accent-text); font-weight: 600; text-align: left; font-size: 13px; }

  /* Étape 3 « Imprimer » (v2/imprimer.js) : usage, préparation, « Tout est prêt », suivi, résultat, fiche de réglages. */
  .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat.two { grid-template-columns: repeat(2, 1fr); }
  .stat div { background: var(--surface); border-radius: 12px; padding: 11px 12px; min-width: 0; }
  .stat b { display: block; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; }
  .stat small { color: var(--muted); font-size: 12px; }
  ul.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
  .checks li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 2px; border-bottom: 1px solid var(--border); }
  .checks li:last-child { border-bottom: 0; }
  .checks .ok { color: var(--ok); display: flex; } .checks .w { color: var(--warn-text); display: flex; }
  .checks li > span:first-child { display: flex; }
  .checks li > span:first-child:not(.ok):not(.w) { color: var(--muted); }
  .checks .txt { flex: 1; min-width: 0; }
  .checks .txt small { display: block; color: var(--muted); font-size: 12.5px; }
  html .checks .mini { color: var(--accent-text); font-size: 12.5px; font-weight: 600; white-space: nowrap; padding: 2px 0; }
  html .checks .mini:hover { text-decoration: underline; }
  .checks.prep li { opacity: .4; transition: opacity .3s; } .checks.prep li.on { opacity: 1; }
  .checks.prep .spin { margin-top: 1px; }
  .progress { height: 10px; border-radius: 10px; background: var(--raised); overflow: hidden; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #4db6ac); border-radius: 10px; transition: width .5s; }
  .big-choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  html .big-choice button { border: 1.5px solid var(--border); background: var(--bg); border-radius: var(--r); padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 600; }
  html .big-choice button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .big-choice .emo { font-size: 30px; line-height: 1; }
  .steps3 { display: grid; gap: 12px; }
  .steps3 > div { display: flex; gap: 12px; align-items: center; }
  .steps3 b { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; flex: none; }
  .stepcard .foot .links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
  html .link.center { text-align: center; }
  .adjust { padding: 2px 4px 0; display: flex; flex-direction: column; gap: 6px; }
  .adjust .hint { margin-top: 4px; }
  .cards.uses .card { padding: 10px 14px; }
  .cards.uses .card .ic { width: 40px; height: 40px; }
  .sheet.live { display: flex; flex-direction: column; gap: 6px; }
  .set-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--border); }
  .set-row:first-of-type { border-top: 0; }
  .set-row input { margin-top: 3px; accent-color: var(--accent-fill); }
  .set-row > svg { margin-top: 3px; color: var(--ok); }
  .set-row .grow { display: flex; flex-direction: column; gap: 1px; }
  html .setting-name { font-weight: 600; text-align: left; padding: 0; text-decoration: underline dotted; text-underline-offset: 3px; }
  span.setting-name { text-decoration: none; }
  .set-row .delta { font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .set-row small { color: var(--muted); font-size: 12px; }
  .set-row small.caution { color: var(--warn-text); }
  .group-title { margin: 6px 0 0; font-size: 11.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .pick-row { display: flex; gap: 10px; align-items: center; padding: 6px 0; }
  .pick-row.best { font-weight: 650; }
  .pick-row input { accent-color: var(--accent-fill); }
  .msg .fiche-h { margin: 8px 0 2px; font-weight: 650; font-size: 13px; }
  .msg .fiche-p { margin: 0; }
  .calib-choose { display: flex; flex-direction: column; gap: 8px; }

  .composer { border-top: 1px solid var(--border); padding: 10px 12px 12px; }
  /* Toast (v2/ui.js) : « Pièce tournée », « Parois : 3 → 4 » avec « Annuler ». */
  .toast-host { position: fixed; left: 12px; right: 12px; bottom: 86px; display: flex; justify-content: center; z-index: 40; pointer-events: none; }
  .toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: 100%; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 13px; box-shadow: var(--shadow); }
  html .toast .tbtn { color: inherit; font-weight: 700; text-decoration: underline; padding: 2px 0; min-height: 24px; flex: none; }
  /* « Changé par l'assistant » et « Réglages en chiffres » (« Tout est prêt »). */
  .checks.changed li { border-left: 3px solid var(--accent); padding-left: 10px; }
  .vals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vals label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  html .vals select { border: 0; background: none; font: inherit; font-weight: 650; color: var(--fg); font-size: 14px; padding: 0; }
  .field-row { font-size: 12px; color: var(--muted); font-weight: 650; margin: 12px 0 6px; }
  .pausebar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .prog-row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
  .prog-row .muted { font-weight: 500; }
  /* « Tu regardes : … » (clic sur un réglage d'Orca) */
  .focus-chip { display: flex; align-items: center; gap: 6px; padding: 6px 10px; margin-bottom: 8px; border-radius: var(--pill); border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; max-width: 100%; }
  .focus-chip b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .focus-chip > span { white-space: nowrap; color: var(--muted); }
  html .focus-chip .go { color: var(--accent-text); font-weight: 600; white-space: nowrap; margin-left: auto; }
  html .focus-chip .x { width: 24px; height: 24px; border-radius: 7px; color: var(--muted); display: inline-grid; place-items: center; padding: 0; line-height: 0; }
  html .focus-chip .x > svg.i { display: block; }
  .cbox { border: 1.5px solid var(--border); border-radius: 14px; padding: 8px 8px 6px 12px; background: var(--bg); }
  .cbox:focus-within { border-color: var(--accent); }
  .cost { margin: 5px 4px 0; font-size: 12px; color: var(--muted); }
  .cbox textarea { width: 100%; border: 0; outline: 0; resize: none; background: none; min-height: 24px; font-size: 14px; display: block; }
  .cbar { display: flex; align-items: center; gap: 2px; }
  html .cbar .iconbtn { width: 32px; height: 32px; }
  html .cbar .iconbtn.listen { color: var(--danger-text); background: var(--danger-soft); }
  html .send { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; background: var(--accent-fill); color: #fff; display: grid; place-items: center; }
  html .send[disabled] { opacity: .45; }
  /* Flèche centrée : l'icône sans le décalage de ligne de texte des autres icônes. */
  html .send { padding: 0; line-height: 0; }
  html .send .ic, html .send svg { display: block; vertical-align: 0; margin: 0; }
  .attached { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .att { position: relative; }
  .att img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; display: block; }
  html .att-x { position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
  html .att-x > svg.i { width: 11px; height: 11px; }
</style>
</head>
<body>
  <header class="phead">
    <span class="pdot" aria-hidden="true">P</span><strong>Assistant Plyo</strong><span class="spacer"></span>
    <button class="phone-pill hidden" id="phone-pill" type="button" title="Téléphone relié : clique pour revoir le QR code" aria-label="Téléphone relié"></button>
    <button class="gauge hidden" id="gauge" type="button" title="Ce qu’il te reste d’IA ce mois-ci" aria-label="IA restante ce mois-ci"><span class="gname">IA restante</span><span class="bar"><i id="gauge-fill"></i></span><b id="gauge-pct">…</b></button>
    <button class="iconbtn" id="btn-more" type="button" title="Menu" aria-label="Menu" aria-haspopup="menu" aria-expanded="false"></button>
    <div class="menu hidden" id="menu" role="menu">
      <div id="menu-items"></div>
      <hr>
      <button type="button" id="m-ui" role="menuitem">Revenir à l’ancien assistant</button>
    </div>
  </header>
  <nav class="stepper" id="stepper" aria-label="Étapes"></nav>
  <!-- Deux zones, une seule dépliée à la fois (data-open) ; l'autre est une barre nommée avec « Afficher ». -->
  <div class="zones" id="zones" data-open="step">
    <div class="zone-step">
      <div class="zbar" id="stepbar">
        <span class="zt"><span class="zl" id="stepbar-kicker"></span><b id="stepbar-title"></b><small id="stepbar-sub"></small></span>
        <button class="zshow" id="stepbar-show" type="button">Afficher</button>
        <button class="btn primary sm" id="stepbar-go" type="button"></button>
      </div>
      <div class="zbody" id="stepscroll">
        <div class="stepalert hidden" id="stepalert" role="alert"></div>
        <div id="announce" class="sr-only" aria-live="polite"></div>
        <section class="stepcard" id="stepcard"></section>
      </div>
    </div>
    <div class="zone-chat" id="zone-chat">
      <div class="zbar" id="chatbar" role="button" tabindex="0" aria-label="Afficher la conversation avec l’assistant">
        <span class="pdot" aria-hidden="true">P</span>
        <span class="zt"><span class="zl">Conversation</span><small id="chatbar-last">Pose une question à l’assistant quand tu veux.</small></span>
        <span class="zbadge hidden" id="chatbar-badge"></span>
        <span class="zshow">Afficher</span>
      </div>
      <div class="zhead"><span class="ztitle">Conversation avec l’assistant</span><button class="zreduce" id="chat-reduce" type="button">Réduire</button></div>
      <div class="pscroll zbody" id="pscroll">
        <div class="hello" id="hello"></div>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <button class="newmsg hidden" id="newmsg" type="button">Nouveau message ↓</button>
      </div>
    </div>
  </div>
  <div class="toast-host hidden" id="toast" role="status" aria-live="polite"></div>
  <div class="composer" id="composer">
    <div class="focus-chip hidden" id="focus-chip"><span>Tu regardes :</span><b id="focus-label"></b><button type="button" class="go" id="focus-explain">Explique-moi</button><button type="button" class="x" id="focus-close" title="Masquer" aria-label="Masquer"></button></div>
    <div class="cbox">
      <div class="attached hidden" id="attached"></div>
      <textarea id="note" rows="1" maxlength="500" placeholder="Une question ? Décris-la avec tes mots…" aria-label="Ta question"></textarea>
      <div class="cbar">
        <button class="iconbtn" id="c-file" type="button" title="Joindre une photo ou une pièce 3D" aria-label="Joindre une photo ou une pièce 3D"></button>
        <button class="iconbtn" id="c-phone" type="button" title="Prendre une photo avec mon téléphone" aria-label="Photo avec le téléphone"></button>
        <button class="iconbtn hidden" id="c-mic" type="button" title="Dicter à la voix" aria-label="Dicter à la voix" aria-pressed="false"></button>
        <button class="send" id="c-send" type="button" title="Envoyer" aria-label="Envoyer"></button>
      </div>
    </div>
    <p class="cost hidden" id="c-cost"></p>
    <input type="file" id="file-input" class="hidden" accept="image/*,.stl,.3mf,.obj,.step,.stp,.amf" multiple>
  </div>

<script>
(function () {
  'use strict';
  // Icônes fixes de l'en-tête et du champ de saisie, puis le panneau (v2/panneau.js).
  var ui = window.PlyoV2.ui;
  [['phone-pill', 'phone', 16], ['focus-close', 'x', 14], ['btn-more', 'menu', 20], ['c-file', 'clip', 20], ['c-phone', 'phone', 20], ['c-mic', 'mic', 20], ['c-send', 'up', 16]].forEach(function (x) {
    document.getElementById(x[0]).appendChild(ui.icon(x[1], x[2]));
  });
  var back = document.getElementById('m-ui');
  back.insertBefore(ui.icon('undo', 16), back.firstChild);
  window.PlyoV2.start();
})();
