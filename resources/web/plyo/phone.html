<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos depuis le téléphone</title>
<style>
  /* Variables --orca-* injectées par OrcaSlicer (thème clair ou sombre) ; valeurs de repli pour un navigateur. */
  :root {
    --bg: var(--orca-bg, #ffffff);
    --fg: var(--orca-fg, #262e30);
    --muted: var(--orca-muted, #6b6b6b);
    --border: var(--orca-border, #dbdbdb);
    --accent: var(--orca-accent, #009688);
    --font: var(--orca-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    --danger: #e14747;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; }
  main { flex: 1; padding: 24px 28px 10px; display: grid; grid-template-columns: 172px 1fr; gap: 22px; align-content: start; }
  .qr { width: 172px; height: 172px; border-radius: 12px; background: #fff; padding: 8px; display: grid; place-items: center; border: 1px solid #e4e4e4; }
  .qr img { width: 100%; height: 100%; image-rendering: pixelated; }
  .qr .wait { color: #888; font-size: 12px; }
  h1 { margin: 2px 0 4px; font-size: 19px; font-weight: 700; line-height: 1.25; }
  .why { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: step; }
  ol li { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; counter-increment: step; }
  ol li::before { content: counter(step); flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--bg)); }
  .live { margin: 4px 28px 0; padding: 14px; border-radius: 12px; border: 1px dashed var(--border); background: color-mix(in srgb, var(--fg) 4%, var(--bg)); }
  .status { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 13.5px; }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .pulse.on { background: var(--accent); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { .pulse.on { animation: none; } }
  .slots { display: flex; gap: 6px; margin-top: 10px; }
  .slot { width: 40px; height: 40px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 22%, var(--bg)); display: grid; place-items: center; color: var(--accent); }
  .slot svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hint { margin: 8px 0 0; color: var(--muted); font-size: 12.5px; }
  .error { color: var(--danger); }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 28px 22px; }
  footer .note { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .linkbtn { height: auto; padding: 0; border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 12.5px; text-decoration: underline; cursor: pointer; }
  button { height: 38px; padding: 0 18px; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .primary { color: var(--orca-accent-fg, #fff); background: var(--accent); border: 1px solid var(--accent); }
  .ghost { color: var(--fg); background: transparent; border: 1px solid var(--border); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <main>
    <div class="qr" id="qr"><span class="wait">Génération…</span></div>
    <div>
      <h1 id="title">Montre-moi le défaut</h1>
      <p class="why" id="why">Avec ton téléphone : les photos arrivent ici, dans ton projet.</p>
      <ol>
        <li>Ouvre l’appareil photo et vise ce code</li>
        <li>Suis les consignes sur ton téléphone</li>
        <li>Appuie sur « Envoyer à Plyo »</li>
      </ol>
    </div>
  </main>

  <div class="live">
    <div class="status"><span class="pulse" id="pulse"></span><span id="status">En attente du téléphone…</span></div>
    <div class="slots" id="slots"></div>
    <p class="hint" id="hint"></p>
  </div>

  <footer>
    <span class="note" id="note">Pas de téléphone sous la main&nbsp;? <button class="linkbtn" id="btn-computer" type="button">Choisir des photos sur l’ordinateur</button></span>
    <button class="ghost" id="btn-close" type="button">Fermer</button>
  </footer>

<script>
(function () {
  // Adresse du service Plyo, donnée par le slicer (Plyo::Config).
  var PLYO_API_URL = window.PLYO_API_URL;
  var POLL_MS = 2000;

  // Transmis par Orca : jeton de connexion et lien téléphone de la conversation ({ id, qr_svg, purpose, label }).
  var plyo = window.PLYO || {};
  var link = plyo.link || {};
  // Même titre que la page du téléphone (plyo-api, phone-purpose.ts), et le projet où arrivent les photos.
  var TITLES = { defect: 'Montre-moi le défaut', calibration: 'Montre-moi ton test', sketch: 'Montre-moi ton croquis' };
  document.getElementById('title').textContent = TITLES[link.purpose] || TITLES.defect;
  var where = link.purpose === 'sketch' ? 'ta pièce sur mesure' : link.label ? '« ' + link.label + ' »' : 'ton projet';
  document.getElementById('why').textContent = 'Avec ton téléphone : les photos arrivent ici, dans ' + where + '.';
  var qr = document.getElementById('qr');
  var pulse = document.getElementById('pulse');
  var statusLine = document.getElementById('status');
  var slots = document.getElementById('slots');
  var hint = document.getElementById('hint');
  var timer = null;
  // Le QR vise le service hébergé (https) : Internet suffit, Wi-Fi ou données mobiles. Service local de développement
  // (http) : le QR vise l'adresse de cet ordinateur sur le Wi-Fi (plyo-api, publicBaseUrl), le même Wi-Fi est nécessaire.
  hint.textContent = /^https:\/\//i.test(String(PLYO_API_URL || '')) ? 'Ton téléphone a juste besoin d’Internet (Wi-Fi ou données mobiles).'
    : 'Ton téléphone doit être sur le même Wi-Fi que cet ordinateur.';
  var receivedAtOpen = null; // envois déjà reçus à l'ouverture : on ferme dès que ce nombre augmente

  function toSlicer(message) {
    if (window.wx && window.wx.postMessage) window.wx.postMessage(JSON.stringify(message));
  }

  function setPhotos(count) {
    slots.textContent = '';
    for (var i = 0; i < count; i++) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      // Icône « camera » du jeu dessiné du panneau (ICONS dans index.html), jamais d'émoji.
      slot.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>';
      slots.appendChild(slot);
    }
  }

  function stop(text, detail) {
    clearInterval(timer);
    pulse.classList.remove('on');
    statusLine.textContent = text;
    hint.textContent = detail;
    qr.style.opacity = '0.25';
  }

  function poll() {
    fetch(PLYO_API_URL + '/api/phone-sessions/' + encodeURIComponent(link.id), { headers: { Authorization: 'Bearer ' + plyo.accessToken } })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (s) {
        if (s.expired || s.status === 'closed') return stop('Ce lien a expiré.', 'Ferme cette fenêtre, puis reclique sur l’icône du téléphone pour avoir un nouveau QR code.');
        if (receivedAtOpen === null) receivedAtOpen = s.batches_received - s.pending_batches;
        // Le panneau peut avoir déjà récupéré l'envoi : on se fie au compteur, pas à la file d'attente.
        if (s.batches_received > receivedAtOpen) {
          clearInterval(timer);
          statusLine.textContent = 'Photos reçues : l’assistant les analyse…';
          return toSlicer({ command: 'phone_done' });
        }
        setPhotos(s.photo_count);
        if (s.status === 'waiting') return;
        pulse.classList.add('on');
        // Ce qu'il reste à faire sur le téléphone, avec le nom du bouton.
        statusLine.textContent = s.photo_count
          ? 'Téléphone relié · ' + s.photo_count + ' photo' + (s.photo_count > 1 ? 's' : '') + ' prise' + (s.photo_count > 1 ? 's' : '') + ' : appuie sur « Envoyer à Plyo »'
          : 'Téléphone relié : prends tes photos';
      })
      .catch(function (status) {
        if (status === 401) stop('Ta session a expiré.', 'Ferme cette fenêtre et reconnecte-toi.');
      });
  }

  if (!link.id || !link.qr_svg) {
    stop('Le lien avec le téléphone n’est pas disponible.', 'Ferme cette fenêtre et réessaie.');
  } else {
    var img = document.createElement('img');
    img.alt = 'QR code à scanner avec le téléphone';
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(link.qr_svg);
    qr.textContent = '';
    qr.appendChild(img);
    poll();
    timer = setInterval(poll, POLL_MS);
  }
  document.getElementById('btn-close').addEventListener('click', function () { toSlicer({ command: 'close_page' }); });
  // Sans téléphone : la fenêtre se ferme, et le panneau propose de choisir les photos sur l'ordinateur.
  document.getElementById('btn-computer').addEventListener('click', function () { toSlicer({ command: 'pick_files' }); });
})();
</script>
</body>
</html>
