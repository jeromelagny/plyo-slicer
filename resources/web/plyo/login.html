<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion à Plyo</title>
<style>
  /* Variables --orca-* injectées par OrcaSlicer (thème clair ou sombre) ; valeurs de repli pour un navigateur. */
  :root {
    --bg: var(--orca-bg, #ffffff);
    --fg: var(--orca-fg, #262e30);
    --muted: var(--orca-muted, #6b6b6b);
    --border: var(--orca-border, #dbdbdb);
    --accent: var(--orca-accent, #009688);
    --accent-fg: var(--orca-accent-fg, #ffffff);
    --font: var(--orca-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    --danger: #e14747;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }
  main { flex: 1; padding: 28px 32px 12px; display: flex; flex-direction: column; }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .brand .icon {
    width: 40px; height: 40px; border-radius: 10px; flex: none;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 14%, var(--bg));
    color: var(--accent);
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2; }
  .lead { margin: 0 0 22px; color: var(--muted); font-size: 14px; }

  .field { display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 13px; font-weight: 600; }
  input {
    width: 100%; height: 42px; padding: 0 14px;
    font: inherit; font-size: 15px; color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius);
    outline: none; transition: border-color .15s;
  }
  input:focus { border-color: var(--accent); }
  #code { height: 50px; font-size: 24px; letter-spacing: 10px; text-align: left; font-variant-numeric: tabular-nums; }

  .hint { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .hint strong { color: var(--fg); font-weight: 600; }
  .error { margin: 12px 0 0; color: var(--danger); font-size: 13px; min-height: 20px; }
  .link {
    align-self: flex-start; margin-top: 0; padding: 0;
    background: none; border: 0; color: var(--accent); cursor: pointer;
    font: inherit; font-size: 13px;
  }
  .link:hover { text-decoration: underline; }

  footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 32px 24px; }
  footer button { height: 38px; padding: 0 18px; border-radius: var(--radius); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  #btn-main { min-width: 150px; color: var(--accent-fg); background: var(--accent); border: 1px solid var(--accent); }
  #btn-main:disabled { opacity: .6; cursor: default; }
  button.secondary { color: var(--fg); background: transparent; border: 1px solid var(--border); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
        </svg>
      </div>
      <h1>Connexion à Plyo</h1>
    </div>
    <p class="lead">Connectez-vous pour utiliser l'assistant. Pas de mot de passe : vous recevez un code par e-mail.</p>

    <div id="step-email" class="field">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" placeholder="votre@email.fr" autocomplete="email">
    </div>

    <div id="step-code" class="field hidden">
      <p class="hint" id="code-hint"></p>
      <label for="code">Code à 6 chiffres</label>
      <input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      <button class="link" id="btn-change" type="button">Changer d'adresse ou renvoyer le code</button>
    </div>

    <p class="error" id="error"></p>
  </main>

  <footer>
    <button id="btn-cancel" class="secondary" type="button">Annuler</button>
    <button id="btn-main" type="button">Recevoir le code</button>
  </footer>

<script>
(function () {
  // Service Plyo (prototype local) — même valeur que dans resources/web/plyo/index.html.
  var PLYO_API_URL = 'http://localhost:3000';

  var emailInput = document.getElementById('email');
  var codeInput = document.getElementById('code');
  var errorLine = document.getElementById('error');
  var mainButton = document.getElementById('btn-main');
  var stepEmail = document.getElementById('step-email');
  var stepCode = document.getElementById('step-code');
  var codeSent = false;
  var busy = false;

  // Pont vers OrcaSlicer (window.wx, fourni par la fenêtre web d'Orca).
  function toSlicer(message) {
    if (window.wx && window.wx.postMessage) window.wx.postMessage(JSON.stringify(message));
  }

  function postJson(path, body) {
    return fetch(PLYO_API_URL + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  function setBusy(value, label) {
    busy = value;
    mainButton.disabled = value;
    if (label) mainButton.textContent = label;
  }

  function showCodeStep(email) {
    codeSent = true;
    stepEmail.classList.add('hidden');
    stepCode.classList.remove('hidden');
    var hint = document.getElementById('code-hint');
    hint.textContent = 'Code envoyé à ';
    var strong = document.createElement('strong');
    strong.textContent = email;
    hint.appendChild(strong);
    hint.appendChild(document.createTextNode('. Il expire dans une heure.'));
    mainButton.textContent = 'Se connecter';
    codeInput.focus();
  }

  function sendCode() {
    var email = emailInput.value.trim();
    errorLine.textContent = '';
    setBusy(true, 'Envoi…');
    postJson('/api/auth/otp', { email: email })
      .then(function (r) {
        setBusy(false, 'Recevoir le code');
        if (r.status === 204) showCodeStep(email);
        else if (r.status === 429) errorLine.textContent = 'Trop de demandes : réessayez dans une minute.';
        else if (r.status === 400) errorLine.textContent = 'Adresse e-mail invalide.';
        else errorLine.textContent = "L'envoi du code a échoué. Réessayez.";
      })
      .catch(function () {
        setBusy(false, 'Recevoir le code');
        errorLine.textContent = 'Service Plyo injoignable.';
      });
  }

  function verifyCode() {
    errorLine.textContent = '';
    setBusy(true, 'Connexion…');
    postJson('/api/auth/verify', { email: emailInput.value.trim(), code: codeInput.value.trim() })
      .then(function (r) {
        if (r.ok) return r.json();
        setBusy(false, 'Se connecter');
        errorLine.textContent = r.status === 401 ? 'Code incorrect ou expiré.' : 'Le code doit comporter 6 chiffres.';
        return null;
      })
      .then(function (session) {
        if (session) toSlicer({ command: 'login_success', session: session });
      })
      .catch(function () {
        setBusy(false, 'Se connecter');
        errorLine.textContent = 'Service Plyo injoignable.';
      });
  }

  mainButton.addEventListener('click', function () {
    if (busy) return;
    if (codeSent) verifyCode(); else sendCode();
  });
  document.getElementById('btn-cancel').addEventListener('click', function () { toSlicer({ command: 'close_page' }); });
  document.getElementById('btn-change').addEventListener('click', function () {
    codeSent = false;
    codeInput.value = '';
    errorLine.textContent = '';
    stepCode.classList.add('hidden');
    stepEmail.classList.remove('hidden');
    mainButton.textContent = 'Recevoir le code';
    emailInput.focus();
  });
  [emailInput, codeInput].forEach(function (input) {
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') mainButton.click(); });
  });
  emailInput.focus();
})();
</script>
</body>
</html>
