<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant Plyo</title>
<style>
  /* Les variables --orca-* sont injectées par OrcaSlicer (thème clair ou sombre).
     Les valeurs de repli servent seulement à ouvrir la page dans un navigateur. */
  :root {
    --bg: var(--orca-bg, #ffffff);
    --fg: var(--orca-fg, #262e30);
    --muted: var(--orca-muted, #6b6b6b);
    --border: var(--orca-border, #dbdbdb);
    --accent: var(--orca-accent, #009688);
    --accent-fg: var(--orca-accent-fg, #ffffff);
    --font: var(--orca-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    --danger: #e14747;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--accent); }

  /* Conversation */
  #thread { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { padding: 8px 10px; border-radius: 6px; line-height: 1.45; border: 1px solid var(--border); }
  .bubble.user { align-self: flex-end; max-width: 85%; background: color-mix(in srgb, var(--accent) 12%, var(--bg)); border-color: transparent; }
  .bubble.user img { display: block; max-width: 100%; max-height: 120px; border-radius: 4px; margin-bottom: 4px; }
  .bubble.assistant { border-left: 3px solid var(--accent); }
  .bubble.info { color: var(--muted); border-style: dashed; }
  .bubble.error { border-left: 3px solid var(--danger); }
  .bubble h3 { margin: 0 0 4px; font-size: 13px; }
  .bubble p { margin: 0 0 6px; }
  .bubble p:last-child { margin-bottom: 0; }
  .suggestion { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--border); }
  .suggestion:first-of-type { margin-top: 6px; }
  .suggestion input { margin-top: 2px; }
  .suggestion .change { font-weight: 600; }
  .suggestion .why { color: var(--muted); font-size: 12px; display: block; }
  .choices { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .choices button, button.secondary { color: var(--fg); background: transparent; border: 1px solid var(--border); }
  .choices button:hover { border-color: var(--accent); }
  .bubble .apply { margin-top: 6px; width: 100%; }

  /* Zone de saisie */
  #composer { border-top: 1px solid var(--border); padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
  #composer textarea { width: 100%; box-sizing: border-box; resize: none; min-height: 52px; }
  #composer .row { display: flex; gap: 6px; align-items: center; }
  #composer .row .grow { flex: 1; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #photo-input { display: none; }

  /* Compte */
  #account { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  #account button { padding: 2px 8px; font-size: 11px; }
  #login { flex: 1; padding: 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  #login input { box-sizing: border-box; width: 100%; }
  #login .hint { color: var(--muted); font-size: 12px; margin: 0; }
  #login .error { color: var(--danger); font-size: 12px; margin: 0; }
  .hidden { display: none !important; }

  /* Sections repliées */
  details { border-top: 1px solid var(--border); padding: 8px 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  td { padding: 5px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
  .note { color: var(--muted); font-size: 11px; display: block; }
  td.value.changed { color: var(--accent); font-weight: 600; }
  .actions { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .actions button { width: 100%; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="status-dot" title="État de la connexion au slicer"></span>
    <h1>Assistant Plyo</h1>
    <div id="account" class="hidden">
      <span id="balance"></span>
      <button id="btn-logout" class="secondary" type="button">Se déconnecter</button>
    </div>
  </header>

  <div id="login" class="hidden">
    <p class="hint">Connectez-vous pour utiliser l'assistant. Pas de mot de passe : vous recevez un code par e-mail.</p>
    <button id="btn-login" type="button">Se connecter</button>
    <p class="error" id="login-error"></p>
  </div>

  <div id="thread" class="hidden">
    <div class="bubble info">Décrivez ce que vous voulez (par exemple « une surface bien lisse ») ou envoyez une photo d'une impression ratée.</div>
  </div>

  <div id="composer" class="hidden">
    <textarea id="note" maxlength="500" placeholder="Votre question ou le problème rencontré…"></textarea>
    <div class="row">
      <button id="btn-photo" class="secondary" type="button">📷 Photo</button>
      <span class="grow" id="photo-name"></span>
      <button id="btn-send" type="button">Envoyer</button>
    </div>
    <input id="photo-input" type="file" accept="image/*">
  </div>

  <details>
    <summary>Réglages lus</summary>
    <table><tbody id="params"></tbody></table>
  </details>

  <details>
    <summary>Tests</summary>
    <div class="actions">
      <button id="btn-suggest">Appliquer une suggestion factice</button>
      <button id="btn-refuse" class="secondary">Envoyer une valeur hors plage</button>
      <button id="btn-undo" class="secondary" disabled>Annuler la dernière modification</button>
      <button id="btn-network" class="secondary">Tester un appel réseau (https)</button>
    </div>
  </details>

<script>
(function () {
  // Service Plyo (prototype local). Plus tard : l'URL du service hébergé.
  var PLYO_API_URL = 'http://localhost:3000';
  var MAX_SIDE = 1600;
  var MAX_HISTORY = 10;

  var thread = document.getElementById('thread');
  var statusDot = document.getElementById('status-dot');
  var noteInput = document.getElementById('note');
  var photoInput = document.getElementById('photo-input');
  var photoName = document.getElementById('photo-name');
  var sendButton = document.getElementById('btn-send');
  var paramsBody = document.getElementById('params');
  var undoButton = document.getElementById('btn-undo');

  var lastValues = null;      // dernier message « values » du slicer (réglages, contexte, langue)
  var previousValues = {};
  var pendingPhoto = null;    // { media_type, data, preview }
  var history = [];           // [{ role: 'user' | 'assistant', text }]
  var busy = false;
  var session = null;         // { access_token, refresh_token, expires_at, email } conservée par le slicer

  var ERRORS = {
    config_missing: "Le service Plyo n'est pas configuré (clé API manquante).",
    assistant_unavailable: "L'assistant n'a pas pu répondre à cette demande. Essayez de la reformuler.",
    incomplete_answer: "La réponse de l'assistant est incomplète. Réessayez.",
    upstream_error: "Le service d'IA est momentanément indisponible. Réessayez dans un instant.",
    invalid_request: "La demande n'a pas pu être envoyée (photo trop lourde ou format non pris en charge ?).",
    insufficient_credits: "Crédits épuisés : rechargez votre compte pour continuer à utiliser l'assistant.",
    internal: "Erreur interne du service Plyo."
  };

  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function addBubble(kind, build) {
    var b = el('div', 'bubble ' + kind);
    if (typeof build === 'string') b.textContent = build; else build(b);
    thread.appendChild(b);
    thread.scrollTop = thread.scrollHeight;
    return b;
  }

  function showMessage(text, isError) {
    addBubble(isError ? 'error' : 'info', text);
  }

  // window.orca est fourni par OrcaSlicer (pont JS <-> C++). Absent dans un navigateur.
  if (!window.orca) {
    showMessage('Pont OrcaSlicer absent : page ouverte hors du slicer.', true);
    return;
  }

  // ---------- Compte : connexion par code e-mail, solde, session ----------
  var loginView = document.getElementById('login');
  var account = document.getElementById('account');
  var balanceLabel = document.getElementById('balance');
  var loginError = document.getElementById('login-error');
  var loginOffered = false;   // la fenêtre de connexion s'ouvre d'elle-même une seule fois par ouverture du panneau

  function showApp(loggedIn) {
    loginView.classList.toggle('hidden', loggedIn);
    account.classList.toggle('hidden', !loggedIn);
    thread.classList.toggle('hidden', !loggedIn);
    document.getElementById('composer').classList.toggle('hidden', !loggedIn);
  }

  function setBalance(balance) {
    if (typeof balance === 'number') balanceLabel.textContent = 'Crédits : ' + balance.toLocaleString('fr-FR');
  }

  function postJson(path, body, headers) {
    return fetch(PLYO_API_URL + path, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, headers || {}),
      body: JSON.stringify(body)
    });
  }

  // Appel authentifié : sur un 401, un seul renouvellement de session puis une nouvelle tentative.
  function apiFetch(path, init) {
    function attempt() {
      var headers = Object.assign({}, init.headers || {}, { Authorization: 'Bearer ' + (session ? session.access_token : '') });
      return fetch(PLYO_API_URL + path, Object.assign({}, init, { headers: headers }));
    }
    return attempt().then(function (response) {
      if (response.status !== 401 || !session) return response;
      return postJson('/api/auth/refresh', { refresh_token: session.refresh_token }).then(function (r) {
        if (!r.ok) return response;
        return r.json().then(function (fresh) {
          session = fresh;
          window.orca.postMessage({ type: 'session_save', session: fresh });
          return attempt();
        });
      });
    });
  }

  function refreshAccount() {
    apiFetch('/api/me', { method: 'GET' })
      .then(function (r) {
        if (r.status === 401) { logout('Votre session a expiré : reconnectez-vous.'); return null; }
        return r.ok ? r.json() : null;
      })
      .then(function (me) { if (me) setBalance(me.balance); })
      .catch(function () { balanceLabel.textContent = 'Service injoignable'; });
  }

  function logout(message) {
    session = null;
    window.orca.postMessage({ type: 'session_clear' });
    loginError.textContent = message || '';
    showApp(false);
  }

  // Fenêtre de connexion native d'Orca (PlyoLoginDialog) ; le slicer renvoie ensuite la session.
  function openLogin() {
    loginError.textContent = '';
    window.orca.postMessage({ type: 'login' });
  }
  document.getElementById('btn-login').addEventListener('click', openLogin);

  document.getElementById('btn-logout').addEventListener('click', function () { logout(); });

  // ---------- Réglages lus ----------
  function formatValue(p) {
    if (p.value === null || p.value === undefined) return '—';
    if (typeof p.value === 'boolean') return p.value ? 'Oui' : 'Non';
    if (typeof p.value === 'string') return p.value;
    var n = Math.round(p.value * 1000) / 1000;
    return n.toLocaleString('fr-FR') + (p.unit ? ' ' + p.unit : '');
  }

  function renderValues(msg) {
    lastValues = msg;
    paramsBody.innerHTML = '';
    msg.params.forEach(function (p) {
      var tr = el('tr');
      var label = el('td', '', p.label);
      label.appendChild(el('span', 'note', p.key + (p.note ? ' — ' + p.note : '')));
      var value = el('td', 'value', formatValue(p));
      if (p.id in previousValues && previousValues[p.id] !== p.value) value.classList.add('changed');
      previousValues[p.id] = p.value;
      tr.appendChild(label);
      tr.appendChild(value);
      paramsBody.appendChild(tr);
    });
    undoButton.disabled = !msg.can_undo;
  }

  function labelOf(id) {
    var p = lastValues && lastValues.params.find(function (x) { return x.id === id; });
    return p ? p : { label: id, unit: '' };
  }

  // ---------- Photo : réduite à 1600 px, JPEG 85 % ----------
  document.getElementById('btn-photo').addEventListener('click', function () { photoInput.click(); });
  photoInput.addEventListener('change', function () {
    var file = photoInput.files && photoInput.files[0];
    photoInput.value = '';
    if (!file) return;
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      pendingPhoto = { media_type: 'image/jpeg', data: dataUrl.split(',')[1], preview: dataUrl };
      photoName.textContent = file.name;
      URL.revokeObjectURL(url);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      showMessage('Ce fichier image ne peut pas être lu. Essayez une photo JPEG ou PNG.', true);
    };
    img.src = url;
  });

  // ---------- Envoi d'une demande ----------
  function send(note) {
    note = (note || '').trim();
    if (busy) return;
    if (!note && !pendingPhoto) {
      showMessage('Écrivez une demande ou ajoutez une photo.', true);
      return;
    }
    if (!lastValues) {
      showMessage('Les réglages du slicer ne sont pas encore lus. Réessayez dans un instant.', true);
      return;
    }

    var photo = pendingPhoto;
    addBubble('user', function (b) {
      if (photo) { var i = el('img'); i.src = photo.preview; b.appendChild(i); }
      if (note) b.appendChild(el('div', '', note));
    });

    var body = {
      locale: lastValues.locale || 'fr',
      settings: { params: lastValues.params.map(function (p) { return { id: p.id, value: p.value, unit: p.unit }; }) },
      context: lastValues.context,
      history: history.slice(-MAX_HISTORY)
    };
    if (photo) body.image = { media_type: photo.media_type, data: photo.data };
    if (note) body.note = note;

    pendingPhoto = null;
    photoName.textContent = '';
    noteInput.value = '';
    busy = true;
    sendButton.disabled = true;
    var waiting = addBubble('info', 'L’assistant réfléchit…');

    apiFetch('/api/diagnose', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function (response) {
        return response.json().then(function (data) { return { ok: response.ok, status: response.status, data: data }; });
      })
      .then(function (r) {
        waiting.remove();
        if (r.status === 401) {
          // Session impossible à renouveler : retour à la connexion, sans perdre le texte tapé.
          logout('Votre session a expiré : reconnectez-vous.');
          noteInput.value = note;
          return;
        }
        if (!r.ok) {
          showMessage(ERRORS[r.data.error] || ERRORS.internal, true);
          if (r.data.error === 'insufficient_credits') setBalance(r.data.balance);
          return;
        }
        if (r.data.credits) setBalance(r.data.credits.balance);
        history.push({ role: 'user', text: (photo ? '(photo envoyée) ' : '') + note });
        history.push({ role: 'assistant', text: summaryForHistory(r.data) });
        history = history.slice(-MAX_HISTORY);
        renderAnswer(r.data);
      })
      .catch(function () {
        waiting.remove();
        showMessage('Service Plyo injoignable. Est-il démarré (npm run dev dans plyo-api) ?', true);
      })
      .then(function () {
        busy = false;
        sendButton.disabled = false;
      });
  }

  // Ce que l'assistant a répondu, pour le renvoyer dans l'historique au tour suivant.
  function summaryForHistory(a) {
    var parts = [a.message];
    a.questions.forEach(function (q) { parts.push(q.text + ' (' + q.choices.join(' / ') + ')'); });
    a.suggestions.forEach(function (s) { parts.push('suggestion: ' + s.id + ' ' + (s.delta !== null ? 'delta ' + s.delta : '= ' + s.value)); });
    return parts.join('\n').slice(0, 2000);
  }

  function describeChange(s) {
    var p = labelOf(s.id);
    var unit = p.unit ? ' ' + p.unit : '';
    if (typeof s.value === 'boolean') return p.label + ' : ' + (s.value ? 'oui' : 'non');
    if (typeof s.value === 'string') return p.label + ' : ' + s.value;
    if (s.delta !== null) {
      var target = typeof p.value === 'number' ? ' (→ ' + formatValue({ value: p.value + s.delta, unit: p.unit }) + ')' : '';
      return p.label + ' : ' + (s.delta > 0 ? '+' : '') + s.delta.toLocaleString('fr-FR') + unit + target;
    }
    return p.label + ' : ' + formatValue({ value: s.value, unit: p.unit });
  }

  function renderAnswer(a) {
    addBubble('assistant', function (b) {
      // Pas de titre de défaut pour une question ou une demande hors sujet.
      var showDefect = a.status !== 'question' && a.status !== 'off_topic';
      if (showDefect && a.defect && a.defect.name) b.appendChild(el('h3', '', a.defect.name));
      if (showDefect && a.defect && a.defect.explanation) b.appendChild(el('p', '', a.defect.explanation));
      b.appendChild(el('p', '', a.message));

      // Questions : chaque choix est un bouton qui répond à la place de l'utilisateur.
      a.questions.forEach(function (q) {
        b.appendChild(el('p', '', q.text));
        var row = el('div', 'choices');
        q.choices.forEach(function (c) {
          var btn = el('button', '', c);
          btn.type = 'button';
          btn.addEventListener('click', function () { send(q.text + ' → ' + c); });
          row.appendChild(btn);
        });
        b.appendChild(row);
      });

      // Suggestions : cochées par défaut, appliquées en un seul lot (annulable).
      if (a.suggestions.length) {
        var boxes = [];
        a.suggestions.forEach(function (s) {
          var line = el('label', 'suggestion');
          var box = el('input');
          box.type = 'checkbox';
          box.checked = true;
          boxes.push({ box: box, s: s });
          var text = el('span');
          text.appendChild(el('span', 'change', describeChange(s)));
          text.appendChild(el('span', 'why', s.reason));
          line.appendChild(box);
          line.appendChild(text);
          b.appendChild(line);
        });
        var apply = el('button', 'apply', 'Appliquer la sélection');
        apply.type = 'button';
        apply.addEventListener('click', function () {
          var changes = boxes.filter(function (x) { return x.box.checked; }).map(function (x) {
            return x.s.delta !== null ? { id: x.s.id, delta: x.s.delta } : { id: x.s.id, value: x.s.value };
          });
          if (!changes.length) { showMessage('Aucune suggestion cochée.', true); return; }
          window.orca.postMessage({ type: 'apply', changes: changes });
          apply.disabled = true;
          boxes.forEach(function (x) { x.box.disabled = true; });
        });
        b.appendChild(apply);
      }
    });
  }

  sendButton.addEventListener('click', function () { send(noteInput.value); });
  noteInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send(noteInput.value);
  });

  // ---------- Messages du slicer ----------
  window.orca.onMessage(function (msg) {
    if (!msg || !msg.type) return;
    if (msg.type === 'status') {
      statusDot.classList.add('on');
    } else if (msg.type === 'session') {
      session = msg.session;
      showApp(!!session);
      if (session) refreshAccount();
      else if (!loginOffered) { loginOffered = true; openLogin(); }
    } else if (msg.type === 'values') {
      renderValues(msg);
    } else if (msg.type === 'result') {
      showMessage(msg.text, !msg.ok);
    }
  });

  // ---------- Tests (phase de faisabilité) ----------
  document.getElementById('btn-suggest').addEventListener('click', function () {
    window.orca.postMessage({ type: 'apply', changes: [
      { id: 'nozzle_temp', delta: -5 },
      { id: 'retraction', delta: 0.2 }
    ] });
  });
  document.getElementById('btn-refuse').addEventListener('click', function () {
    window.orca.postMessage({ type: 'apply', changes: [{ id: 'nozzle_temp', value: 400 }] });
  });
  undoButton.addEventListener('click', function () {
    window.orca.postMessage({ type: 'undo' });
  });

  // La page (chargée depuis file://) peut-elle appeler une API https ?
  // httpbin.org renvoie la requête reçue et autorise CORS ; example.com n'envoie pas d'en-têtes CORS.
  function networkTest(label, url, options) {
    var start = Date.now();
    return fetch(url, options)
      .then(function (response) {
        return response.text().then(function (body) {
          var origin = '';
          try { origin = JSON.parse(body).headers.Origin || '(aucun)'; } catch (e) {}
          showMessage(label + ' : HTTP ' + response.status + ' en ' + (Date.now() - start) + ' ms' +
                      (origin ? ', en-tête Origin envoyé : ' + origin : ''), !response.ok);
        });
      })
      .catch(function (error) {
        showMessage(label + ' : échec — ' + error.name + ' : ' + error.message, true);
      });
  }

  document.getElementById('btn-network').addEventListener('click', function () {
    showMessage('Page chargée depuis ' + location.protocol + '//… (origine : ' + location.origin + ')');
    networkTest('GET https avec CORS', 'https://httpbin.org/get?source=plyo')
      .then(function () {
        return networkTest('POST JSON avec CORS', 'https://httpbin.org/post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ test: 'plyo', nozzle_temp: 225 })
        });
      })
      .then(function () {
        return networkTest('GET https sans CORS', 'https://example.com/');
      });
  });

  window.orca.postMessage({ type: 'ready' });
  window.orca.postMessage({ type: 'session_load' });
})();
</script>
</body>
</html>
