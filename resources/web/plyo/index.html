<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant Plyo</title>
<style>
  /* Panneau Assistant Plyo — maquette validée : plyo-api/docs/design/assistant-v2-maquette.html.
     Variables --orca-* injectées par OrcaSlicer (thème clair ou sombre) ; valeurs de repli pour un navigateur.
     Charte des textes : docs/plyo/CHARTE-TON.md (tutoiement, phrases courtes, action suivante). */
  :root {
    --bg: var(--orca-bg, #ffffff);
    --fg: var(--orca-fg, #262e30);
    --muted: var(--orca-muted, #6b6b6b);
    --border: var(--orca-border, #dbdbdb);
    --accent: var(--orca-accent, #009688);
    --accent-fg: var(--orca-accent-fg, #ffffff);
    --font: var(--orca-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    --surface: color-mix(in srgb, var(--fg) 5%, var(--bg));
    --raised: color-mix(in srgb, var(--fg) 9%, var(--bg));
    --accent-soft: color-mix(in srgb, var(--accent) 15%, var(--bg));
    --danger: #e14747;
    --warn: #d18a00;
    --danger-soft: color-mix(in srgb, var(--danger) 10%, var(--bg));
    --warn-soft: color-mix(in srgb, var(--warn) 12%, var(--bg));
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .ic { display: inline-block; flex: none; vertical-align: -3px; }

  /* Composants communs : boutons, liens, alertes, puces */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 6px 14px; border-radius: 8px; font-weight: 600; line-height: 1.25; text-align: center; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
  .btn:hover:not(:disabled) { filter: brightness(1.06); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--fg); border-color: var(--border); }
  .btn.ghost:hover:not(:disabled) { border-color: var(--accent); filter: none; }
  .btn.sm { min-height: 30px; padding: 5px 11px; font-size: 12.5px; }
  .btn.wide { flex: 1; }
  .link { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; }
  .link:hover { color: var(--fg); }
  .row-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .alert { display: flex; gap: 9px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); }
  .alert > .ic { margin-top: 1px; color: var(--muted); }
  .alert .alert-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
  .alert p { margin: 0; }
  .alert.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); background: var(--warn-soft); }
  .alert.warn > .ic { color: var(--warn); }
  .alert.error { border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); background: var(--danger-soft); }
  .alert.error > .ic { color: var(--danger); }
  .alert.tip > .ic { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border); background: transparent; font-size: 12px; cursor: pointer; text-align: left; }
  .chip:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .chip:disabled { opacity: .55; cursor: default; }

  /* En-tête */
  .top { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); position: relative; flex: none; }
  .top h1 { margin: 0; font-size: 14px; font-weight: 650; }
  .top .push { margin-left: auto; }
  /* Jauge d'utilisation du mois : un pourcentage, jamais de crédits par message */
  .gauge { display: inline-flex; align-items: center; gap: 7px; padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; }
  .bar { position: relative; display: block; width: 42px; height: 6px; border-radius: 999px; background: var(--raised); overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: inherit; background: var(--accent); transition: width .3s ease; }
  .low .bar i { background: var(--warn); }
  .empty .bar i { background: var(--danger); }
  .gauge.empty { border-color: var(--danger); color: var(--danger); }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
  .icon-btn { width: 28px; height: 28px; padding: 0; display: grid; place-items: center; border-radius: 6px; border: 0; background: transparent; color: var(--muted); cursor: pointer; flex: none; }
  .icon-btn:hover { background: var(--surface); color: var(--fg); }
  .linked { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); background: transparent; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .menu { position: absolute; right: 10px; top: 46px; width: 240px; background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 6px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); z-index: 10; }
  .menu button { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
  .menu button .ic { color: var(--muted); }
  .menu button:hover:not(:disabled) { background: var(--surface); }
  .menu button:disabled { color: var(--muted); cursor: default; }
  .menu .who { padding: 6px 10px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }

  /* Corps défilant : accueil puis conversation */
  .body { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; }
  .hello { margin: 14px 2px 4px; }
  .hello h2 { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
  .hello p { margin: 0; color: var(--muted); }
  .home-more { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .home-mini { display: none; color: var(--muted); margin: 4px 2px 0; }
  body.touring .home-more { display: none; }
  body.touring .home-mini { display: block; }
  body.touring .hello { display: none; }
  .action { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; text-align: left; }
  .action:hover { border-color: var(--accent); }
  .action .badge { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
  .action b { display: block; font-size: 13.5px; font-weight: 600; }
  .action .sub { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
  .label { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 10px 2px 0; }

  /* Messages */
  .thread { display: flex; flex-direction: column; gap: 14px; }
  .me { align-self: flex-end; max-width: 86%; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .me .text { background: var(--accent-soft); padding: 8px 11px; border-radius: 12px 12px 3px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .me .from { font-size: 11px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 64px); gap: 4px; justify-content: end; }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 7px; display: block; }
  .ai { display: flex; flex-direction: column; gap: 8px; }
  .ai .who { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .ai .who .link { margin-left: auto; display: inline-flex; gap: 3px; align-items: center; }
  .ai .who i { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); display: grid; place-items: center; color: var(--accent-fg); font-style: normal; font-size: 11px; font-weight: 700; }
  .diag { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .diag h3 { margin: 0; font-size: 15px; font-weight: 650; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
  .ai p, .ai h3 { margin: 0; }
  .rich { display: flex; flex-direction: column; gap: 6px; overflow-wrap: anywhere; }
  .rich p { margin: 0; }
  .rich ul, .rich ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }
  .rich .ui { font-weight: 600; padding: 0 5px; border-radius: 4px; background: var(--raised); white-space: nowrap; }
  .caret::after { content: "▍"; color: var(--accent); animation: blink 1s infinite; }
  .questions { display: flex; flex-direction: column; gap: 8px; }
  .q { font-weight: 600; margin: 0; }
  .ai-foot { display: flex; gap: 12px; align-items: center; font-size: 11px; color: var(--muted); }
  .note-line { align-self: center; font-size: 12px; color: var(--muted); text-align: center; padding: 2px 8px; display: inline-flex; gap: 5px; align-items: center; }
  .note-line.ok { color: var(--accent); }
  .note-line.start { align-self: flex-start; text-align: left; }
  .thinking { color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .thinking i, .caret::after { animation: none; } }
  .feedback { display: flex; flex-direction: column; gap: 6px; }
  .feedback textarea { width: 100%; min-height: 54px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; padding: 6px 8px; resize: vertical; }

  /* Fiche de réglages : ancien → nouveau */
  .sheet { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .sheet header { padding: 9px 12px; font-size: 12px; font-weight: 650; color: var(--muted); border-bottom: 1px solid var(--border); }
  .row { display: grid; grid-template-columns: 18px 1fr; align-items: start; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .row:last-of-type { border-bottom: 0; }
  .row input { margin: 3px 0 0; accent-color: var(--accent); }
  .row .mark { color: var(--accent); display: grid; place-items: center; height: 20px; }
  .row .name { font-weight: 600; }
  .setting-name { border: 0; background: none; padding: 0; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; text-align: left; }
  .setting-name .ic { color: var(--muted); }
  .setting-name:hover { color: var(--accent); }
  .setting-name:hover .ic { color: var(--accent); }
  .delta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 3px 0 2px; font-variant-numeric: tabular-nums; font-size: 14px; }
  .delta .old { color: var(--muted); text-decoration: line-through; }
  .delta .arrow { color: var(--muted); }
  .delta .new { color: var(--accent); font-weight: 700; }
  .row .why { color: var(--muted); font-size: 12px; }
  .row.off { opacity: .45; }
  .row.best { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .row.static { cursor: default; }
  .sheet .status { padding: 8px 12px; color: var(--muted); font-size: 12px; }
  .sheet footer { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--bg); align-items: center; }
  .sheet footer .btn { flex: 1 1 calc(50% - 4px); }
  .sheet footer .btn.full { flex-basis: 100%; order: -1; }
  .sheet footer .link { flex-basis: 100%; text-align: center; padding-top: 2px; }
  .sheet footer.inline .btn { flex: 0 1 auto; }
  .sheet footer.inline .btn.wide { flex: 1; }
  .sheet footer.inline .link { flex-basis: auto; }
  .done { color: var(--accent); font-size: 12px; font-weight: 600; flex: 1; display: inline-flex; gap: 5px; align-items: center; }
  .fail { color: var(--danger); font-size: 12px; padding: 0 12px 10px; background: var(--bg); }

  /* Zone de saisie */
  .composer { border-top: 1px solid var(--border); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: none; }
  .attached { display: flex; gap: 6px; flex-wrap: wrap; }
  .att { position: relative; width: 46px; height: 46px; }
  .att img { width: 46px; height: 46px; object-fit: cover; border-radius: 7px; display: block; }
  .att button { position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .7); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .box { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 8px 8px 6px 12px; }
  .box:focus-within { border-color: var(--accent); }
  .box textarea { width: 100%; border: 0; background: transparent; color: var(--fg); font: inherit; resize: none; outline: none; min-height: 40px; max-height: 140px; }
  .box textarea::placeholder { color: var(--muted); }
  .tools { display: flex; align-items: center; gap: 2px; }
  .tools .hint { margin-left: auto; margin-right: 6px; font-size: 11px; color: var(--muted); }
  .send { width: 32px; height: 32px; padding: 0; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; cursor: pointer; }
  .send:disabled { opacity: .5; cursor: default; }

  /* Premiers pas : carte du parcours, puce « Tu regardes », fiche d'un réglage */
  .tour { border: 1px solid var(--accent); border-radius: var(--radius); background: color-mix(in srgb, var(--accent) 7%, var(--bg)); padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; }
  .tour .step { font-size: 11px; font-weight: 650; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
  .tour h3 { margin: 0; font-size: 15px; font-weight: 650; }
  .tour p { margin: 0; }
  .tour .where { color: var(--muted); font-size: 12px; display: flex; gap: 6px; }
  .tour .where:empty { display: none; }
  .tour .bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .focus-chip { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; align-self: flex-start; max-width: 100%; }
  .focus-chip b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .focus-chip .go { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; font-weight: 600; padding: 0; white-space: nowrap; }
  .focus-chip .x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; display: grid; place-items: center; }
  .fiche h4 { margin: 4px 0 0; font-size: 12px; color: var(--muted); font-weight: 650; }
  .fiche .value { font-variant-numeric: tabular-nums; }

  /* Volets : réglages lus, conversations, utilisation, aide */
  .drawer { position: absolute; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; }
  .drawer .list { flex: 1; overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .drawer table { width: 100%; border-collapse: collapse; }
  .drawer td { padding: 7px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  .drawer td.value { text-align: right; white-space: nowrap; padding-left: 12px; font-variant-numeric: tabular-nums; }
  .drawer .key { display: block; color: var(--muted); font-size: 11px; }
  .drawer h3 { margin: 6px 0 0; font-size: 13px; }
  .drawer p { margin: 0; }
  .drawer .muted { color: var(--muted); }
  .conv-list { display: flex; flex-direction: column; gap: 8px; }
  .conv-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; }
  .conv-item.current { border-color: var(--accent); }
  .conv-item button.open { flex: 1; border: 0; background: none; text-align: left; cursor: pointer; padding: 0; min-width: 0; }
  .conv-item .t { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item .d { display: block; color: var(--muted); font-size: 11px; }
  .gauge-big { display: flex; flex-direction: column; gap: 8px; }
  .gauge-big .bar { width: 100%; height: 10px; }
  .gauge-big .pct { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .plans { display: flex; flex-direction: column; gap: 8px; }
  .plan { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); }
  .plan.current { border-color: var(--accent); background: var(--accent-soft); }
  .plan .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 650; }
  .plan .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .plan .row-acts { margin-top: 4px; }
</style>
</head>
<body>
  <div class="top">
    <h1>Assistant Plyo</h1>
    <button class="linked hidden push" id="phone-linked" type="button" title="Téléphone relié à cette conversation : clique pour revoir le QR code"></button>
    <button class="gauge hidden push" id="gauge" type="button" title="Ton utilisation ce mois-ci : clique pour le détail"><span class="bar"><i id="gauge-fill"></i></span><span id="gauge-label">…</span></button>
    <button class="icon-btn" id="btn-more" type="button" title="Plus d'options" aria-haspopup="menu" aria-label="Plus d'options"></button>
    <div class="menu hidden" id="menu" role="menu">
      <button type="button" id="m-new" role="menuitem">Nouvelle conversation</button>
      <button type="button" id="m-convs" role="menuitem">Mes conversations</button>
      <button type="button" id="m-usage" role="menuitem">Mon utilisation</button>
      <hr>
      <button type="button" id="m-undo" role="menuitem" disabled>Annuler les derniers réglages appliqués</button>
      <button type="button" id="m-values" role="menuitem">Voir les réglages lus par l'assistant</button>
      <button type="button" id="m-tour" role="menuitem">Refaire la visite « Ma première impression »</button>
      <button type="button" id="m-help" role="menuitem">Aide</button>
      <hr id="m-account-sep">
      <div class="who" id="m-email"></div>
      <button type="button" id="m-logout" role="menuitem">Me déconnecter</button>
    </div>
  </div>

  <div class="body" id="body">
    <!-- Premiers pas : étape du parcours en cours -->
    <div id="tour-slot"></div>

    <!-- Accueil (conversation vide) -->
    <div class="hidden" id="home">
      <div class="hello">
        <h2>Bonjour 👋</h2>
        <p id="hello-text">Montre-moi une impression ratée ou dis-moi ce que tu veux obtenir. Je propose les réglages, tu choisis ce qu’on applique.</p>
      </div>
      <p class="home-mini">Une question pendant la visite ? Écris-la en bas, je réponds.</p>
      <div class="home-more">
        <button class="action" type="button" data-action="phone">
          <span class="badge" data-icon="phone"></span>
          <span><b>Prendre des photos avec mon téléphone</b><span class="sub">Scanne un QR code, les photos arrivent ici</span></span>
        </button>
        <button class="action" type="button" data-action="files">
          <span class="badge" data-icon="camera"></span>
          <span><b>Ajouter une photo depuis l'ordinateur</b><span class="sub">JPEG ou PNG, une ou plusieurs</span></span>
        </button>
        <button class="action" type="button" data-action="model">
          <span class="badge" data-icon="cube"></span>
          <span><b>Ajouter un modèle 3D</b><span class="sub">STL, 3MF, OBJ ou STEP : je le pose sur le plateau (ou glisse-le ici)</span></span>
        </button>
        <p class="label">Ou pars d’un objectif</p>
        <div class="chips" id="goals">
          <button class="chip" type="button">Je veux une surface du dessus bien lisse</button>
          <button class="chip" type="button">Je veux imprimer plus vite</button>
          <button class="chip" type="button">Je veux une pièce plus solide</button>
          <button class="chip" type="button">Quels supports pour une figurine ?</button>
          <button class="chip" type="button">Je veux plus de détails</button>
        </div>
      </div>
    </div>

    <!-- Conversation -->
    <div class="thread hidden" id="thread"></div>
  </div>

  <div class="composer" id="composer">
    <div class="focus-chip hidden" id="focus-chip"><span data-icon="search"></span><span>Tu regardes :</span><b id="focus-label"></b><button type="button" class="go" id="focus-explain">Explique-moi</button><button type="button" class="x" id="focus-close" title="Masquer" aria-label="Masquer"></button></div>
    <div class="attached hidden" id="attached"></div>
    <div class="box">
      <textarea id="note" maxlength="500" rows="2" placeholder="Décris le problème ou pose ta question…" aria-label="Ta demande"></textarea>
      <div class="tools">
        <button class="icon-btn" id="btn-files" type="button" title="Joindre des photos ou un modèle 3D (STL, 3MF…)" aria-label="Joindre un fichier"></button>
        <button class="icon-btn" id="btn-phone" type="button" title="Prendre des photos avec mon téléphone" aria-label="Photos avec le téléphone"></button>
        <span class="hint">Entrée pour envoyer</span>
        <button class="send" id="btn-send" type="button" title="Envoyer (Entrée) · Maj + Entrée pour aller à la ligne" aria-label="Envoyer"></button>
      </div>
    </div>
    <input id="file-input" type="file" accept="image/*,.stl,.3mf,.obj,.step,.stp,.amf" multiple hidden>
  </div>

  <div class="drawer hidden" id="drawer">
    <div class="top"><h1 id="drawer-title"></h1><button class="btn ghost sm push" id="drawer-close" type="button">Fermer</button></div>
    <div class="list" id="drawer-body"></div>
  </div>

<script>
(function () {
  // Service Plyo (prototype local). Plus tard : l'URL du service hébergé.
  var PLYO_API_URL = 'http://localhost:3000';
  var MAX_SIDE = 1600;
  var THUMB_SIDE = 160;
  var MAX_PHOTOS = 6;
  var MAX_HISTORY = 10;
  var IDLE_TIMEOUT_MS = 60000;    // rien reçu depuis une minute : la demande est abandonnée
  var ANSWER_MAX_MS = 240000;     // plafond d'une réponse, même si elle arrive encore
  // Offres affichées dans « Mon utilisation » ; le paiement n'est pas encore branché (boutons « Bientôt »).
  // Annuel = 2 mois offerts (10 fois le prix mensuel, arrondi).
  var PLANS = [
    { id: 'gratuit', name: 'Gratuit', month: '0 €', year: '0 €', text: 'Pour découvrir l’assistant.' },
    { id: 'plus', name: 'Plyo+', month: '9,99 € / mois', year: '99 € / an', perMonth: 'Soit 8,25 € par mois.', text: 'Pour imprimer chaque semaine et demander de l’aide sans compter.' },
    { id: 'pro', name: 'Pro', month: '24,99 € / mois', year: '249 € / an', perMonth: 'Soit 20,75 € par mois.', text: 'Pour un usage intensif ou professionnel : une jauge beaucoup plus grande.' }
  ];
  var NOTICE_KEY = 'plyo.gaugeNotice';

  var $ = function (id) { return document.getElementById(id); };
  var Logic = window.PlyoLogic, FS = window.PlyoFirstSteps;
  var bodyEl = $('body'), thread = $('thread'), home = $('home');
  var noteInput = $('note'), sendButton = $('btn-send'), fileInput = $('file-input'), attachedEl = $('attached');
  var menu = $('menu');

  var session = null;        // { access_token, refresh_token, expires_at, email }, conservée par le slicer
  var lastValues = null;     // dernier message « values » du slicer (réglages, contexte, langue)
  var lastGauge = null;      // dernière jauge reçue du service ({ plan, used_pct, resets_at, reserve, state })
  var attachments = [];      // [{ media_type, data, preview }]
  var busy = false;
  var pendingSheet = null;   // fiche dont on attend le résultat d'application ou d'annulation
  var undoneListeners = {};  // identifiant d'un lot appliqué → fiche à prévenir s'il est annulé (même depuis le menu)
  var phoneLink = null;      // lien téléphone de la conversation : { id, qr_svg }
  var phoneTimer = null;
  var phoneCreating = null;  // création du lien en cours (évite deux liens sur un double clic)
  var phoneCollecting = false;
  var phoneQueue = [];       // envois du téléphone récupérés, en attente que l'assistant soit libre
  var PHONE_POLL_MS = 3000;

  // ---------- Icônes (dessinées, mêmes traits partout) ----------
  var ICONS = {
    phone: '<rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M11 18h2"/>',
    camera: '<rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/>',
    cube: '<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',
    clip: '<path d="M21 12.5l-8.5 8.5a6 6 0 0 1-8.5-8.5L12.5 4a4 4 0 0 1 5.7 5.7l-8.5 8.5a2 2 0 0 1-2.8-2.8l8-8"/>',
    send: '<path d="M5 12h14M12.5 5.5L19 12l-6.5 6.5"/>',
    more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
    bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    pin: '<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
    folder: '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>',
    palette: '<path d="M12 3a9 9 0 0 0 0 18c1 0 1.5-.7 1.5-1.5 0-1.2-1-1.5-1-2.5s.8-1.5 1.8-1.5H17a4 4 0 0 0 4-4c0-4.7-4-8.5-9-8.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    undo: '<path d="M9 7H4V2"/><path d="M4.5 7A8 8 0 1 1 4 14"/>',
    alert: '<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.5"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17.5v.5"/>',
    flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    eye: '<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    wand: '<path d="M4 20L15 9M14 4v3M19 9h-3M18 5l-2 2M10 4l.5 1.5M20 14l-1.5-.5"/>',
    stop: '<rect x="7" y="7" width="10" height="10" rx="1.5"/>'
  };
  function icon(name, size) {
    var span = document.createElement('span');
    span.className = 'ic';
    span.setAttribute('aria-hidden', 'true');
    var s = size || 16;
    span.innerHTML = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
    return span;
  }
  document.querySelectorAll('[data-icon]').forEach(function (e) { e.appendChild(icon(e.getAttribute('data-icon'), e.classList.contains('badge') ? 20 : 14)); });
  $('btn-more').appendChild(icon('more', 18));
  $('btn-files').appendChild(icon('clip', 18));
  $('btn-phone').appendChild(icon('phone', 18));
  $('btn-send').appendChild(icon('send', 16));
  $('focus-close').appendChild(icon('x', 12));
  $('phone-linked').appendChild(icon('phone', 12));
  $('phone-linked').appendChild(document.createTextNode('Relié'));

  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function button(label, onClick, className, iconName) {
    var b = el('button', className || 'btn');
    b.type = 'button';
    if (iconName) b.appendChild(icon(iconName, 14));
    b.appendChild(document.createTextNode(label));
    if (onClick) b.addEventListener('click', onClick);
    return b;
  }
  function scrollDown() { bodyEl.scrollTop = bodyEl.scrollHeight; }
  function whoLine(suffix) {
    var who = el('div', 'who');
    who.appendChild(el('i', '', 'P'));
    who.appendChild(document.createTextNode('Assistant' + (suffix ? ' · ' + suffix : '')));
    return who;
  }
  function alertBox(kind, text, iconName) {
    var box = el('div', 'alert ' + kind);
    box.appendChild(icon(iconName || (kind === 'error' ? 'alert' : kind === 'warn' ? 'alert' : kind === 'tip' ? 'bulb' : 'info'), 16));
    var body = el('div', 'alert-body');
    if (text) body.appendChild(rich(text));
    box.appendChild(body);
    box.body = body;
    return box;
  }

  // Texte enrichi de l'IA (paragraphes, listes, gras, libellés d'Orca), toujours construit en texte, jamais en HTML.
  function rich(text, className) {
    var wrap = el('div', 'rich' + (className ? ' ' + className : ''));
    function fill(parent, parts) {
      parts.forEach(function (part) {
        if (part.t === 'bold') parent.appendChild(el('strong', '', part.v));
        else if (part.t === 'ui') parent.appendChild(el('span', 'ui', part.v));
        else parent.appendChild(document.createTextNode(part.v));
      });
    }
    window.PlyoRichText.parseRich(text).forEach(function (block) {
      if (block.type === 'p') {
        var p = el('p');
        block.lines.forEach(function (line, i) { if (i) p.appendChild(el('br')); fill(p, line); });
        wrap.appendChild(p);
      } else {
        var list = el(block.type);
        block.items.forEach(function (item) { var li = el('li'); fill(li, item); list.appendChild(li); });
        wrap.appendChild(list);
      }
    });
    return wrap;
  }

  function noteLine(text, tone, iconName) {
    showConversation();
    var line = el('div', 'note-line' + (tone ? ' ' + tone : ''));
    if (iconName) line.appendChild(icon(iconName, 13));
    line.appendChild(document.createTextNode(text));
    thread.appendChild(line);
    scrollDown();
    return line;
  }

  // window.orca est fourni par OrcaSlicer (pont JS <-> C++). Absent dans un navigateur.
  if (!window.orca) {
    home.classList.remove('hidden');
    $('hello-text').textContent = 'Ouvre ce panneau depuis Plyo Slicer : il a besoin du slicer pour fonctionner.';
    return;
  }

  // ---------- Vues ----------
  // Sans compte, tout reste visible (accueil, parcours, fiches) : la connexion n'est demandée qu'au moment
  // d'un appel à l'IA (requireLogin).
  function showLoggedIn(loggedIn) {
    $('gauge').classList.toggle('hidden', !loggedIn);
    ['m-email', 'm-logout', 'm-account-sep', 'm-usage'].forEach(function (id) { $(id).classList.toggle('hidden', !loggedIn); });
    if (!thread.children.length) { home.classList.remove('hidden'); thread.classList.add('hidden'); }
    else thread.classList.remove('hidden');
  }
  function showConversation() { home.classList.add('hidden'); thread.classList.remove('hidden'); }

  // ---------- Conversations : gardées sur l'ordinateur par le slicer, rouvertes au lancement ----------
  var conv = null;           // { id, title, updated, entries: [...], history: [...] }
  var saveTimer = null;
  function newId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6); }
  function startConversation() {
    conv = { id: newId(), title: '', updated: new Date().toISOString(), entries: [], history: [] };
  }
  function saveNow(c) {
    if (!c || !c.entries.length) return;
    c.updated = new Date().toISOString();
    window.orca.postMessage({ type: 'conv_save', id: c.id, conversation: { title: c.title, updated: c.updated, entries: c.entries, history: c.history } });
  }
  var saveTarget = null;
  function scheduleSave(c) {
    var target = c || conv;
    if (!target || !target.entries.length) return;
    // Un enregistrement en attente pour une autre conversation part tout de suite.
    if (saveTarget && saveTarget !== target) { clearTimeout(saveTimer); saveNow(saveTarget); }
    saveTarget = target;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { saveTarget = null; saveNow(target); }, 400);
  }
  function flushSave() { if (saveTarget) { clearTimeout(saveTimer); saveNow(saveTarget); saveTarget = null; } }
  // `c` : la conversation visée (celle de la demande en cours), par défaut celle affichée.
  function record(entry, c) {
    if (!conv) startConversation();
    var target = c || conv;
    target.entries.push(entry);
    scheduleSave(target);
    return entry;
  }
  // Pendant une réponse, on ne change pas de conversation (elle arriverait dans la mauvaise).
  function blockedWhileBusy() {
    if (!busy) return false;
    noteLine('Attends la fin de la réponse (ou annule-la) avant de changer de conversation.', '', 'info');
    return true;
  }
  function clearThread() {
    thread.textContent = '';
    thread.classList.add('hidden');
    home.classList.remove('hidden');
  }
  function newConversation() {
    if (blockedWhileBusy()) return;
    flushSave();
    unlinkPhone(true);
    clearThread();
    attachments = [];
    renderAttachments();
    noteInput.value = '';
    startConversation();
  }
  function openConversation(id) {
    if (blockedWhileBusy()) return;
    flushSave();
    window.orca.postMessage({ type: 'conv_load', id: id });
  }
  // Une conversation rouverte est en lecture : ses fiches de réglages ne s'appliquent plus (les réglages ont pu changer).
  function restoreConversation(id, c) {
    if (!c || !Array.isArray(c.entries) || busy) return;
    unlinkPhone(true);
    clearThread();
    conv = { id: id, title: c.title || '', updated: c.updated || '', entries: c.entries, history: Array.isArray(c.history) ? c.history : [] };
    if (!conv.entries.length) return;
    showConversation();
    conv.entries.forEach(function (entry) { try { renderEntry(entry, true); } catch (e) { /* élément abîmé : ignoré */ } });
    scrollDown();
  }
  function renderEntry(entry, archived) {
    if (entry.kind === 'me') return renderMe(entry);
    if (entry.kind === 'answer') return renderAnswer(entry, archived);
    if (entry.kind === 'fiche') return renderFiche(entry.msg, archived);
    if (entry.kind === 'model') return renderModel(entry, archived);
    if (entry.kind === 'note') return noteLine(entry.text, entry.tone, entry.icon);
  }

  // ---------- Compte : session, solde, connexion ----------
  function postJson(path, body) {
    return fetch(PLYO_API_URL + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }

  // Appel authentifié : sur un 401, un seul renouvellement de session puis une nouvelle tentative.
  // Seul un refus du renouvellement (401) renvoie le 401 d'origine, qui déconnecte ; une panne (503)
  // renvoie la réponse du renouvellement, et la session est gardée.
  function apiFetch(path, init) {
    function attempt() {
      var headers = Object.assign({}, init.headers || {}, { Authorization: 'Bearer ' + (session ? session.access_token : '') });
      return fetch(PLYO_API_URL + path, Object.assign({}, init, { headers: headers }));
    }
    return attempt().then(function (response) {
      if (response.status !== 401 || !session) return response;
      return postJson('/api/auth/refresh', { refresh_token: session.refresh_token }).then(function (r) {
        if (r.status === 401) return response;
        if (!r.ok) return r;
        return r.json().then(function (fresh) {
          session = fresh;
          window.orca.postMessage({ type: 'session_save', session: fresh });
          return attempt();
        });
      });
    });
  }

  function paintGauge(root, fill, v) {
    fill.style.width = v.pct + '%';
    root.classList.toggle('low', v.state === 'low');
    root.classList.toggle('empty', v.state === 'empty');
  }

  // quiet : l'erreur « jauge pleine » vient d'être affichée, le message doux ferait doublon.
  function setGauge(g, quiet) {
    var v = Logic.gaugeView(g);
    if (!v) return;
    lastGauge = g;
    $('gauge-label').textContent = v.label;
    $('gauge').title = 'Utilisé ce mois-ci : ' + v.label + '. Se recharge ' + v.resets + '. Clique pour le détail.';
    paintGauge($('gauge'), $('gauge-fill'), v);
    // Après la réponse qui a rempli la jauge, pas avant : la réponse s'affiche dans la même tâche.
    if (quiet) { try { localStorage.setItem(NOTICE_KEY, Logic.noticeKey(v.state, g)); } catch (e) { /* stockage indisponible */ } return; }
    setTimeout(function () { gaugeNotice(g, v); }, 0);
  }

  // Message doux vers 80 %, puis quand la jauge est pleine : une seule fois par mois (mémorisé sur cet ordinateur).
  function gaugeNotice(g, v) {
    var last = null;
    try { last = localStorage.getItem(NOTICE_KEY); } catch (e) { /* stockage indisponible : le message peut revenir */ }
    var kind = Logic.gaugeNotice(g, last);
    if (!kind || !thread.children.length) return;
    try { localStorage.setItem(NOTICE_KEY, Logic.noticeKey(kind, g)); } catch (e) { /* idem */ }
    var box = kind === 'low'
      ? alertBox('warn', 'Tu as utilisé **' + v.label + '** de ta jauge ce mois-ci. Elle se recharge ' + v.resets + '.')
      : alertBox('warn', 'Ta jauge du mois est pleine. Elle se recharge ' + v.resets + '.');
    var acts = el('div', 'row-acts');
    acts.appendChild(button('Voir mon utilisation', openUsage, 'btn ghost sm'));
    box.body.appendChild(acts);
    thread.appendChild(box);
    scrollDown();
  }

  // Vérifie la session (et la renouvelle au besoin) ; met à jour le solde. Résout à true si la session est valide.
  function refreshAccount() {
    return apiFetch('/api/me', { method: 'GET' })
      .then(function (r) {
        if (r.status === 401) { logout('Ta session a expiré : reconnecte-toi pour continuer.'); return false; }
        if (r.status === 503) { $('gauge-label').textContent = 'Indisponible'; return false; }
        return r.ok ? r.json().then(function (me) { setGauge(me.gauge); $('m-email').textContent = me.email; return true; }) : false;
      })
      .catch(function () { $('gauge-label').textContent = 'Hors ligne'; return false; });
  }

  function logout(message) {
    unlinkPhone(true);
    session = null;
    window.orca.postMessage({ type: 'session_clear' });
    showLoggedIn(false);
    if (message) noteLine(message, '', 'info');
  }

  function openLogin() { window.orca.postMessage({ type: 'login' }); }

  // Une action qui appelle l'IA sans compte : on dit pourquoi, et la connexion s'ouvre au clic ; l'action repart ensuite.
  var afterLogin = null;
  function requireLogin(reason, retry) {
    if (session) return false;
    afterLogin = retry || null;
    showConversation();
    var card = alertBox('info', reason + ' Pour ça, connecte-toi : pas de mot de passe, tu reçois un code par e-mail.', 'info');
    card.body.appendChild(button('Me connecter', openLogin, 'btn sm'));
    thread.appendChild(card);
    scrollDown();
    return true;
  }

  // ---------- Volets ----------
  function openDrawer(title, fill) {
    menu.classList.add('hidden');
    $('drawer-title').textContent = title;
    var body = $('drawer-body');
    body.textContent = '';
    fill(body);
    $('drawer').classList.remove('hidden');
  }
  function closeDrawer() { $('drawer').classList.add('hidden'); }
  $('drawer-close').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeDrawer(); menu.classList.add('hidden'); } });

  function openValues() {
    openDrawer('Réglages lus par l’assistant', function (body) {
      body.appendChild(el('p', 'muted', 'Ce que l’assistant voit de ton profil quand tu lui écris. Il ne peut proposer de changer que ces réglages-là.'));
      var table = el('table'), tbody = el('tbody');
      ((lastValues && lastValues.params) || []).forEach(function (p) {
        var tr = el('tr');
        var label = el('td', '', p.label);
        label.appendChild(el('span', 'key', p.key + (p.note ? ' — ' + p.note : '')));
        tr.appendChild(label);
        tr.appendChild(el('td', 'value', formatValue(p.value, p.unit)));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      body.appendChild(table);
    });
  }

  function openConversations() {
    openDrawer('Mes conversations', function (body) {
      body.appendChild(el('p', 'muted', 'Tes 30 dernières conversations restent sur cet ordinateur.'));
      var list = el('div', 'conv-list');
      body.appendChild(list);
      list.appendChild(el('p', 'muted', 'Chargement…'));
      convListTarget = list;
      window.orca.postMessage({ type: 'conv_list' });
    });
  }
  var convListTarget = null;
  function fillConversations(items) {
    if (!convListTarget || $('drawer').classList.contains('hidden')) return;
    var list = convListTarget;
    list.textContent = '';
    if (!items.length) { list.appendChild(el('p', 'muted', 'Pas encore de conversation.')); return; }
    items.forEach(function (it) {
      var row = el('div', 'conv-item' + (conv && conv.id === it.id ? ' current' : ''));
      var open = el('button', 'open');
      open.type = 'button';
      open.appendChild(el('span', 't', it.title || 'Conversation'));
      var d = it.updated ? new Date(it.updated) : null;
      open.appendChild(el('span', 'd', d && !isNaN(d) ? d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : ''));
      open.addEventListener('click', function () { closeDrawer(); openConversation(it.id); });
      var del = el('button', 'icon-btn');
      del.type = 'button';
      del.title = 'Supprimer cette conversation';
      del.setAttribute('aria-label', 'Supprimer « ' + (it.title || 'Conversation') + ' »');
      del.appendChild(icon('x', 14));
      del.addEventListener('click', function () {
        if (conv && conv.id === it.id) newConversation();
        window.orca.postMessage({ type: 'conv_delete', id: it.id });
      });
      row.appendChild(open);
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  function openUsage() {
    if (requireLogin('Ta jauge est liée à ton compte.', openUsage)) return;
    openDrawer('Mon utilisation', function (body) {
      var big = el('div', 'gauge-big');
      var pct = el('div', 'pct', '…');
      var bar = el('span', 'bar'), fill = el('i');
      bar.appendChild(fill);
      var when = el('p', 'muted', '');
      big.appendChild(pct);
      big.appendChild(bar);
      big.appendChild(when);
      body.appendChild(big);
      var reserve = el('p', 'muted hidden', 'Tu as aussi une réserve : elle prend le relais quand ta jauge est pleine.');
      body.appendChild(reserve);
      body.appendChild(rich('Chaque demande à l’IA remplit un peu ta jauge : un peu plus avec des photos, rien quand la demande sort de l’impression 3D. Une réponse commencée va toujours jusqu’au bout.'));
      body.appendChild(rich('Toujours gratuit : l’accueil, la visite guidée, les explications des réglages (« Explique-moi »), « Montre-moi » et la pose d’un modèle sur le plateau.'));
      body.appendChild(el('h3', '', 'Les formules'));
      // Mensuel par défaut : un débutant essaie sans s'engager ; l'annuel est à un clic.
      var yearly = false;
      var period = el('div', 'chips');
      var monthChip = button('Mensuel', function () { pick(false); }, 'chip on');
      var yearChip = button('Annuel · 2 mois offerts', function () { pick(true); }, 'chip');
      period.appendChild(monthChip);
      period.appendChild(yearChip);
      body.appendChild(period);
      function pick(y) {
        yearly = y;
        monthChip.classList.toggle('on', !y);
        yearChip.classList.toggle('on', y);
        show(lastGauge);
      }
      var plans = el('div', 'plans');
      body.appendChild(plans);
      function show(g) {
        var v = Logic.gaugeView(g);
        if (!v) return;
        pct.textContent = v.label + ' utilisés ce mois-ci';
        when.textContent = 'Formule ' + v.plan + ' · se recharge ' + v.resets;
        paintGauge(big, fill, v);

  // ---------- Réglages lus par le slicer ----------
  function formatValue(value, unit) {
    if (value === null || value === undefined) return '—';
    if (typeof value === 'boolean') return value ? 'Oui' : 'Non';
    if (typeof value === 'string') return value;
    return (Math.round(value * 1000) / 1000).toLocaleString('fr-FR') + (unit ? ' ' + unit : '');
  }

  function renderValues(msg) {
    lastValues = msg;
    $('m-undo').disabled = !msg.can_undo;

  function paramOf(id) {

  }

  // ---------- Photos : réduites à 1 600 px, JPEG 85 % (vignette de 160 px gardée dans la conversation) ----------
  function scaled(src, side, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = function () { reject(new Error('unreadable')); };
      img.src = src;
    });
  }
  function downscale(file) {
    var url = URL.createObjectURL(file);
    return scaled(url, MAX_SIDE, 0.85).then(function (dataUrl) {
      URL.revokeObjectURL(url);
      return { media_type: 'image/jpeg', data: dataUrl.split(',')[1], preview: dataUrl };
    }, function (e) { URL.revokeObjectURL(url); throw e; });
  }

    if (attachments.length >= MAX_PHOTOS) noteLine(MAX_PHOTOS + ' photos au plus par demande.', '', 'info');
    renderAttachments();
  }

  // Photos → pièces jointes de la demande ; modèles 3D → posés sur le plateau par Plyo (gratuit).
  var MAX_MODEL_BYTES = 50 * 1024 * 1024;
  function addFiles(all) {
    var models = all.filter(function (f) { return FS.isModelFile(f.name); });
    var files = all.filter(function (f) { return !FS.isModelFile(f.name); });
    models.forEach(sendModel);
    if (!files.length) return;
    Promise.all(files.map(function (f) { return downscale(f).catch(function () { return null; }); })).then(function (list) {
      var ok = list.filter(Boolean);
      if (ok.length < list.length) noteLine('Une image n’a pas pu être lue : prends plutôt du JPEG ou du PNG.', 'error', 'alert');
      addAttachments(ok);
      noteInput.focus();
    });
  }

  function sendModel(file) {
    if (file.size > MAX_MODEL_BYTES) { noteLine('« ' + file.name + ' » est trop lourd : 50 Mo au plus.', 'error', 'alert'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var data = String(reader.result || '');
      window.orca.postMessage({ type: 'model_add', name: file.name, data: data.slice(data.indexOf(',') + 1) });
    };
    reader.onerror = function () { noteLine('« ' + file.name + ' » n’a pas pu être lu.', 'error', 'alert'); };
    noteLine('Je pose « ' + file.name + ' » sur le plateau…', '', 'cube');
    reader.readAsDataURL(file);
  }

  // ---------- Actions sur le plateau et « Montre-moi » ----------
  var plateWaiters = {};     // identifiant de la demande → rappel du résultat
  var plateRequest = 0;
  var plateUndoLinks = [];   // un seul « Annuler » actif : celui de la dernière action
  function plateAction(kind, after, extra) {
    var id = ++plateRequest;
    plateWaiters[id] = after || null;
    window.orca.postMessage(Object.assign({ type: 'plate_action', kind: kind, request: id }, extra || {}));
  }
  function onPlateAction(msg) {
    var after = plateWaiters[msg.request];
    delete plateWaiters[msg.request];
    var line = noteLine(msg.text, msg.ok ? 'ok' : 'error', msg.ok ? 'check' : 'alert');
    if (msg.ok && msg.kind !== 'undo') plateUndoLinks.forEach(function (b) { b.remove(); });
    if (msg.ok && msg.undo_token !== undefined) {
      var undo = button('Annuler', function () {
        undo.disabled = true;
        plateAction('undo', function (ok) { if (ok) undo.remove(); else undo.disabled = false; }, { undo_token: msg.undo_token });
      }, 'link');
      plateUndoLinks = [undo];
      line.appendChild(undo);
    }
    if (msg.kind !== 'undo') record({ kind: 'note', text: msg.text, tone: msg.ok ? 'ok' : 'error', icon: msg.ok ? 'check' : 'alert' });
    if (after) after(msg.ok);
  }
  function showMe(target) { window.orca.postMessage({ type: 'show_me', target: target }); }
  function showSetting(key) { window.orca.postMessage({ type: 'show_setting', key: key }); }
  function onShowSetting(msg) {

    else if (msg.hidden) noteLine('J’ai ouvert la bonne page. Si tu ne vois pas le réglage, active le bouton « Avancé » en haut des réglages.', '', 'info');

  var PLATE_KINDS = ['orient', 'arrange', 'scale_to_fit', 'slice'];
