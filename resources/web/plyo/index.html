          if (!wait || (data.error && data.error !== 'request_in_progress')) return { error: data.error || 'request_in_progress', data: data };
          phase = 'retry';
          sayWaiting();
          return delay(wait).then(attempt);
        });
        if (response.status === 413 && photos.length) return response.json().catch(function () { return {}; }).then(function (data) {
          limit = Math.min(Logic.limitFrom413(data), lastBytes - 1); // le prochain envoi passe sous la limite du service
          return attempt();
        });
        return receive(response);
      });
    }
    function receive(response) {
      if (response.status === 401) return { error: 'unauthorized' };
      var type = response.headers.get('Content-Type') || '';
      if (type.indexOf('ndjson') < 0 || !response.body)
        return response.json().catch(function () { return {}; }).then(function (data) {
          if (response.ok) return { final: data };
          // Corps sans code (proxy, limite de débit) : le statut HTTP suffit à choisir le message.
          var code = data.error || (response.status === 429 ? 'rate_limited' : response.status === 409 ? 'request_in_progress' : response.status === 413 ? 'payload_too_large' : 'internal');
          return { error: code, gauge: data.gauge, data: Object.assign({}, data, { retry_after: Logic.retryAfter(data, response.headers.get('Retry-After')) }) };
        });
      // Réponse en flux : les textes s'affichent au fur et à mesure, puis la réponse complète remplace le brouillon.
      // Les lignes « wait » (signal de vie du service) ne s'affichent pas : elles relancent seulement le délai d'inactivité.
      streaming = true;
      var reader = response.body.getReader(), decoder = new TextDecoder(), nd = Logic.ndjsonReader();
      function handle(events) {
        events.forEach(function (ev) {
          if (ev.type === 'partial') { if (!live) { thinking.classList.add('hidden'); live = liveAnswer(function () { controller.abort('cancel'); }); } live.update(ev); }
          else if (ev.type === 'final') out.final = ev;
          else if (ev.type === 'error') { out.error = ev.error; out.data = ev; }
        });
      }
      function pump() {
        return reader.read().then(function (r) {
          touch();
          if (r.done) { handle(nd.end()); return out.final || out.error ? out : { error: 'incomplete_answer' }; }
          handle(nd.push(decoder.decode(r.value, { stream: true })));
          return pump();
        });
      }
      return pump();
    }

    aiContext().then(function (ctx) {
      if (ctx && ctx.plate && ctx.plate.objects) plateParts = ctx.plate.objects.map(function (o) { return o.name; });
      // Contexte (lot 6) : clé de plateau résolue, plafond de la machine et choix permis de chaque réglage ; plateau en cours,
      // matière et faits de l'imprimante lus par le slicer juste avant (lecture seule, filtrés par le C++).
      body = {
        locale: lastValues.locale || 'fr',
        settings: { params: Logic.diagnoseParams(lastValues.params) },
        context: Logic.aiContext(lastValues.context, ctx && ctx.context),
        history: Logic.historyForAI(conv.history.slice(-MAX_HISTORY))
      };
      // La bobine du projet : sans elle le serveur ne propose jamais « Retenir ces réglages ».
      var spoolName = conv.project && conv.project.filament && conv.project.filament.spool && conv.project.filament.spool.name;
      if (spoolName && typeof spoolName === 'string') body.context = Object.assign({}, body.context, { spool: spoolName.slice(0, 60) });
      if (note) body.note = note;
      if (calibHistory.length) body.calibrations = calibHistory;
      if (ctx && ctx.plate) body.plate = ctx.plate;
      if (ctx && ctx.memory && ctx.memory.length) body.memory = ctx.memory;
      if (ctx && ctx.limits && Object.keys(ctx.limits).length) body.filament_limits = ctx.limits;
      // Mode catalogue : toutes les valeurs Filament + Impression, pour que l'assistant puisse proposer n'importe quel réglage.
      if (ctx && ctx.snapshot && Object.keys(ctx.snapshot).length) body.snapshot = ctx.snapshot;
      body.explanation_level = PlyoMachines.levelOf(habits);
      if (pendingIntent) body.intent_questions = pendingIntent;
      // Où en est le projet (onglet Étapes) : l'étape en cours et le fil des deux onglets.
      body.project = PlyoThread.forAI(conv.project, PlyoJourney.currentStep(conv.project));
      body.capabilities = Logic.CAPABILITIES.slice(); // actions que ce panneau sait exécuter (aperçu, tests bruts d'Orca)
      // Pièce du projet dessinée par Plyo : une retouche de forme devient « Modifier ma pièce » (au lieu d'un autre logiciel).
      if (conv && conv.project.design && conv.project.design.part) body.capabilities.push('redesign');
      // Le service rend la réponse déjà réglée de ce même identifiant (« replayed ») sans la refaire ni la débiter.
      body.request_id = req.id;
      return attempt();
    }).then(function (r) {
      if (r.error) {
        if (r.error === 'insufficient_credits') setGauge(r.gauge, true);
        fail(r.error, r.data);
        return;
      }
      done(r.final);
    }).catch(function () {
      // Réponse complète déjà reçue (coupure juste après) : on la garde, elle est payée.
      if (out.final) { done(out.final); return; }
      fail(controller.signal.aborted ? (controller.signal.reason === 'cancel' ? 'cancel' : 'timeout') : streaming ? 'stream_cut' : 'network');
    });

    function done(a) {
      var switched = finish();
      lastAsked = null;
      // Réponse rejouée (« replayed ») : la même que la première fois, jauge comprise ; elle s'affiche comme une autre.
      if (a.credits) setGauge(a.credits.gauge);
      // Mode catalogue : les réglages de n'importe quel onglet arrivent dans « changes » ; la fiche les montre comme les autres.
      a.suggestions = (a.suggestions || []).concat(Logic.catalogToSuggestions(a.changes));
      if (sentNames) a.names = sentNames;
      // 2 000 caractères au plus : au-delà, l'API refuserait toutes les demandes suivantes de la conversation.
      target.history.push({ role: 'user', text: ((photos.length ? '(' + photos.length + ' photo(s) envoyée(s)) ' : '') + note).slice(0, 2000) });
      var hist = { role: 'assistant', text: summaryForHistory(a) };
      if (a.suggestions.length) hist.cards = 'proposed'; // devient « applied » ou « undone » (historyForAI le dit à l'IA)
      target.history.push(hist);
      target.history = target.history.slice(-MAX_HISTORY);
      var entry = record({ kind: 'answer', data: a, photoCount: photos.length, question: note, date: new Date().toISOString(), applied: false }, target);
      // Ce que les ordres ont réellement fait remplacera « demandé » dans l'historique (non enregistré avec l'entrée).
      Object.defineProperty(entry, 'hist', { value: hist, enumerable: false, writable: true });
      journalAnswer(a, target, plateParts, photos);
      if (pendingIntent && Array.isArray(a.intent_answers) && a.intent_answers.length && target === conv) applyIntentAnswers(a.intent_answers);
      // Autre projet ouvert pendant la réponse : elle reste lisible dans l'ancienne conversation, aucun de ses ordres ne part
      // sur le nouveau projet (ils ne s'exécutent qu'à l'affichage de la réponse).
      if (switched) { switchedNote(Logic.projectSwitchText(!!(a.commands && a.commands.length), true)); return; }
      // Un souci d'affichage n'est pas une erreur réseau : la réponse est gardée, rien n'est redemandé.
      if (target !== conv) return;
      try { renderAnswer(entry, false); }
      catch (e) { noteLine('La réponse est arrivée mais n’a pas pu s’afficher. Rouvre ce projet depuis « Mes projets » (menu « ⋯ »).', 'error', 'alert'); }
      applyPrintOutcome(a.print_outcome);
    }
  }

  // Une réponse sur une pièce du plateau entre dans le journal des pièces, avec une vignette de la première photo.
  function journalAnswer(a, target, parts, photos) {
    var key = a.defect && a.defect.key;
    if (a.status !== 'ok' || !parts.length || !key || key === 'general_question' || key === 'unknown') return;
    // Un simple ordre sur le plateau (« penche la pièce ») n'est pas un problème d'impression à suivre.
    if (a.commands && a.commands.length && !a.suggestions.length) return;
    var first = photos[0];
    var src = first ? (first.preview || 'data:' + first.media_type + ';base64,' + first.data) : null;
    (src ? scaled(src, 160, 0.7) : Promise.resolve('')).catch(function () { return ''; }).then(function (thumb) {
      var ctx = lastValues.context || {};
      window.orca.postMessage({ type: 'journal_add', conv: target.id, parts: parts.slice(0, 3), printer: ctx.printer || '', filament: ctx.filament || '',
        problem: a.defect.name || '', defect: key, thumb: thumb });
    });
  }

  // Chaque pièce imprimée ou exportée entre dans « Mes pièces », même sans question à l'IA.
  function journalPart(outcome) {
    var name = partName(conv), ctx = (lastValues && lastValues.context) || {};
    if (!name) return;
    window.orca.postMessage({ type: 'journal_add', conv: conv.id, parts: [name], printer: ctx.printer || '', filament: ctx.filament || '', problem: '', defect: '', thumb: '', outcome: outcome });
    scheduleSave(); // « Conversation » rouvre le projet de cette pièce
  }

  // Erreur : ce qui s'est passé et l'action suivante. La demande est gardée pour « Réessayer ».
  // `here` : l'erreur d'un clic s'affiche dans l'onglet ouvert ; sinon elle suit la conversation (avec la pastille).
  // `edit` : « Modifier ma demande » (texte et photos remis dans le champ, rien n'est renvoyé).
  var hereError = null;
  function showError(code, retry, data, here, edit) {
    if (hereError) { hereError.remove(); hereError = null; }
    if (!here) showConversation();
    var view = Logic.errorView(code, data);
    var g = code === 'insufficient_credits' ? Logic.gaugeView(lastGauge) : null;
    var box = view.action === 'none' ? alertBox('info', view.text, 'info')
      : alertBox('error', view.text + (g && g.resets ? ' Elle se recharge ' + g.resets + '.' : '') + (view.more ? ' ' + view.more : ''), 'alert');
    var acts = el('div', 'row-acts');
    if (view.action === 'credits') acts.appendChild(button('Voir mon utilisation', openUsage, 'btn sm'));
    else if (view.action === 'plans') acts.appendChild(button('Voir les formules', openUsage, 'btn sm'));
    else if (view.action === 'login') acts.appendChild(button('Me reconnecter', openLogin, 'btn sm'));
    else if (view.action === 'photo') acts.appendChild(button('Choisir une autre photo', function () { box.remove(); pickFiles(); }, 'btn sm', 'camera'));
    else if (view.action === 'edit' && edit) acts.appendChild(button('Modifier ma demande', function () { box.remove(); edit(); }, 'btn sm'));
    else if (view.action === 'retry' && retry) {
      var again = button('Réessayer', function () { box.remove(); retry(); }, 'btn sm');
      acts.appendChild(again);
      // Trop de demandes : le bouton attend la fin du délai annoncé, avec le compte à rebours.
      if (view.wait) {
        var left = view.wait;
        again.disabled = true;
        var tick = function () {
          if (!again.isConnected) return;
          if (left <= 0) { again.disabled = false; again.textContent = fr('Réessayer'); return; }
          again.textContent = fr('Réessayer dans ' + left + ' s');
          left--;
          setTimeout(tick, 1000);
        };
        setTimeout(tick, 0); // une fois la carte dans le fil
      }
    }
    box.body.appendChild(acts);
    if (here) { hereError = placeInOpenTab(box); return; }
    thread.appendChild(box);
    scrollDown();
    applyTab('answer');
  }

  // Brouillon de la réponse pendant que l'IA l'écrit ; « Arrêter » reste à portée de main.
  function liveAnswer(onStop) {
    var box = el('div', 'ai');
    var who = whoLine();
    who.appendChild(button('Arrêter', onStop, 'link', 'stop'));
    box.appendChild(who);
    var title = el('h3');
    var diag = el('div', 'diag');
    diag.appendChild(title);
    var explanation = el('div');
    var message = el('div');
    box.appendChild(diag);
    box.appendChild(explanation);
    box.appendChild(message);
    thread.appendChild(box);
    scrollToAnswerTop(box);
    // Le curseur suit la fin du texte en cours d'écriture.
    function set(target, text, caret) {
      target.textContent = '';
      if (!text) return;
      var r = rich(text);
      var last = r.lastElementChild;
      if (caret && last) (last.tagName === 'P' ? last : last.lastElementChild || last).classList.add('caret');
      target.appendChild(r);
    }
    return {
      box: box,
      update: function (p) {
        title.textContent = fr(p.name || '');
        set(explanation, p.explanation, !p.message);
        set(message, p.message, !!p.message);
        updateMoreBadge(); // le brouillon grandit vers le bas, la vue reste sur son début
      }
    };
  }

  // Ce que l'assistant a répondu, pour le renvoyer dans l'historique au tour suivant.
  function summaryForHistory(a, commandsResult) {
    var parts = [a.message];
    var orders = Logic.commandsForHistory(a, commandsResult || null);
    if (orders) parts.push(orders);
    a.questions.forEach(function (q) { parts.push(q.text + ' (' + q.choices.join(' / ') + ')'); });
    a.suggestions.forEach(function (s) { parts.push('suggestion: ' + s.id + ' ' + (s.delta !== null ? 'delta ' + s.delta : '= ' + s.value)); });
    return parts.join('\n').slice(0, 2000);
  }

  // Valeur avant et après pour la fiche de réglages.
  function change(s) {
    if (s.catalog) return { label: s.label, key: s.id, before: s.beforeText || formatValue(s.before, s.unit), after: s.valueText || formatValue(s.value, s.unit) };
    var p = paramOf(s.id);
    var after = s.delta !== null && typeof p.value === 'number' ? p.value + s.delta : s.value;
    return { label: p.label, key: p.key, before: formatValue(p.value, p.unit), after: formatValue(after, p.unit) };
  }

  // Nom du réglage : un clic l'explique (fiche gratuite) quand Plyo en a une.
  function settingName(label, key) {
    if (!key || !window.PLYO_FICHES[key]) return el('div', 'name', label);
    var b = el('button', 'setting-name');
    b.type = 'button';
    b.title = fr('C’est quoi ce réglage ?');
    b.appendChild(txt(label));
    b.appendChild(icon('help', 13));
    b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); explain(key); });
    return b;
  }

  // Une conversation rouverte montre ses fiches en lecture : appliquer un écart calculé sur d'anciennes valeurs serait faux.
  function renderSheet(container, entry, archived) {
    var suggestions = entry.data.suggestions;
    var sheet = el('div', 'sheet');
    var day = entry.date ? dayOf(entry.date) : '';
    sheet.appendChild(el('header', '', archived ? (entry.applied ? 'Réglages appliqués le ' + day : 'Réglages proposés le ' + day) : 'Réglages proposés'));
    // Débutant : ce que veulent dire les cases, avant la première.
    if (!archived && fsState.level !== 'expert') sheet.appendChild(el('p', 'sheet-help', 'Coché = je le change pour toi. Décoche ce que tu préfères garder.'));
    var rows = [];
    // Réglages du catalogue groupés par onglet d'Orca (Refroidissement, Qualité…) ; les autres restent en tête, sans titre.
    Logic.groupByTab(suggestions).forEach(function (g) {
      if (g.tab) sheet.appendChild(el('div', 'group-title', g.tab));
      g.items.forEach(function (s) { rows.push(buildRow(s)); });
    });
    function buildRow(s) {
      var c = archived && entry.changes && entry.changes[s.id] ? entry.changes[s.id] : change(s);
      var row = el(archived ? 'div' : 'label', 'row' + (archived ? ' static' : ''));
      var box = null;
      if (archived) row.appendChild(entry.applied ? markCell() : el('span', 'mark', '•'));
      else { box = el('input'); box.type = 'checkbox'; box.checked = Logic.defaultChecked(s); row.classList.toggle('off', !box.checked); row.appendChild(box); }
      var info = el('div');
      info.appendChild(settingName(c.label, c.key));
      var delta = el('div', 'delta');
      delta.appendChild(el('span', 'old', c.before));
      delta.appendChild(el('span', 'arrow', '→'));
      delta.appendChild(el('span', 'new', c.after));
      info.appendChild(delta);
      if (s.reason) info.appendChild(el('div', 'why', s.reason));
      if (!archived && s.beyond) info.appendChild(el('div', 'why', '⚠ Hors de la plage conseillée par le fabricant de ton filament : à toi de décider.'));
      else if (!archived && s.confirm) info.appendChild(el('div', 'why caution', fsState.level !== 'expert' ? '⚠ Réglage sensible : laisse-le décoché si tu débutes, ou coche-le pour l’essayer.' : '⚠ Réglage sensible : coche-le si tu veux l’appliquer.'));
      if (!archived && (s.confirm || s.beyond)) row.classList.add('sensitive');
      row.appendChild(info);
      sheet.appendChild(row);
      if (box) box.addEventListener('change', function () { row.classList.toggle('off', !box.checked); updateCount(); });
      return { box: box, s: s, row: row, c: c };
    }
    if (!archived) {
      // Libellés et valeurs gardés tels qu'affichés : une conversation rouverte ne dépend pas des réglages du moment.
      entry.changes = {};
      rows.forEach(function (r) { entry.changes[r.s.id] = r.c; });
      scheduleSave();
    }
    if (archived) {
      if (!entry.applied) sheet.appendChild(el('div', 'status', 'Pour les appliquer aujourd’hui, redemande-moi : tes réglages ont pu changer depuis.'));
      container.appendChild(sheet);
      return;
    }

    var footer = el('footer', 'inline');
    var apply = button('', null, 'btn wide');
    var ignore = button('Ignorer', null, 'btn ghost');
    footer.appendChild(apply);
    footer.appendChild(ignore);
    sheet.appendChild(footer);
    // Modifications manuelles non enregistrées : elles partent avec le lot, on le dit avant d'appliquer.
    var manualNote = el('div', 'status hidden');
    sheet.insertBefore(manualNote, footer);
    askManualEdits(function (items) {
      var line = Logic.manualEditsNote(items, conv && conv.project.assistant);
      if (line) { manualNote.textContent = fr(line); manualNote.classList.remove('hidden'); }
    });
    // Rien de coché (un réglage sensible seul, par exemple) : la consigne, plutôt qu'un bouton grisé sans explication.
    var pickHint = el('div', 'status hidden', 'Coche un réglage pour l’appliquer.');
    sheet.insertBefore(pickHint, footer);
    var fail = el('div', 'fail hidden');
    sheet.appendChild(fail);
    var completeSlot = el('div', 'row-acts hidden'); // fiche du projet incomplète : le bouton qui mène à l'étape à faire
    sheet.appendChild(completeSlot);

    function checked() { return rows.filter(function (r) { return r.box.checked; }); }
    function updateCount() {
      var n = checked().length;
      // « 1 réglage sur 2 » : le compte ne contredit plus les lignes affichées quand tout n'est pas coché.
      apply.textContent = fr(n ? 'Appliquer ' + n + ' réglage' + (n > 1 ? 's' : '') + (n < rows.length ? ' sur ' + rows.length : '') : 'Aucun réglage coché');
      apply.disabled = !n;
      pickHint.classList.toggle('hidden', n > 0);
    }
    updateCount();

    function lock(locked) { rows.forEach(function (r) { r.box.disabled = locked; }); apply.disabled = locked; ignore.disabled = locked; }
    // Réglages confirmés par l'utilisateur après un refus (« Je confirme, applique quand même ») ; une case cochée à la main
    // vaut aussi confirmation (Logic.sheetChange).
    var confirmedKeys = [];

    apply.addEventListener('click', function () {
      var picked = checked();
      var changes = picked.map(function (r) { return Logic.sheetChange(r.s, confirmedKeys); });
      fail.classList.add('hidden');
      completeSlot.classList.add('hidden');
      lock(true);
      pendingSheet = { kind: 'apply', extras: true, onResult: function (ok, text, result) {
        if (!ok) {
          lock(false); updateCount(); fail.textContent = fr(text); fail.classList.remove('hidden');
          // La fiche reste applicable : une fois la machine et la bobine choisies, « Appliquer » marche depuis ici.
          var complete = completeProjectButton(result && result.missing);
          completeSlot.textContent = '';
          if (complete) {
            completeSlot.appendChild(complete); completeSlot.classList.remove('hidden');
            // Machine et bobine choisies ensuite : le refus et son bouton partent, la fiche reste applicable (N2).
            var refusal = fail.textContent;
            watchMissing(result.missing, function () { if (fail.textContent === refusal) { fail.classList.add('hidden'); completeSlot.textContent = ''; completeSlot.classList.add('hidden'); } });
          }
          // Refus de la dernière barrière ou d'Orca : réessayer, confirmer ce réglage, ou le montrer.
          var fixes = refusalButtons(result, function (confirmKey) {
            if (confirmKey && confirmedKeys.indexOf(confirmKey) < 0) confirmedKeys.push(confirmKey);
            apply.click();
          });
          if (fixes) { while (fixes.firstChild) completeSlot.appendChild(fixes.firstChild); completeSlot.classList.remove('hidden'); }
          return;
        }
        completeSlot.textContent = '';
        var undoId = result && result.undo_id;
        // La conversation garde ce qui a été appliqué, valeurs comprises, pour la relire plus tard.
        entry.applied = true;
        if (entry.hist) entry.hist.cards = 'applied';
        entry.data.suggestions = picked.map(function (r) { return r.s; });
        scheduleSave();
        rows.forEach(function (r) { if (!r.box.checked) r.row.remove(); else r.box.replaceWith(markCell()); });
        sheet.querySelector('header').textContent = fr('Réglages appliqués');
        sheet.classList.add('applied');
        // L'onglet Étapes ne contredit plus la discussion : « je garde les réglages actuels » part, le lot appliqué y est dit.
        var keptNotes = document.querySelectorAll('#guide-notes .kept-settings');
        keptNotes.forEach(function (n) { n.remove(); });
        if (keptNotes.length) {
          var appliedNote = el('div', 'note-line ok');
          appliedNote.appendChild(icon('check', 14));
          appliedNote.appendChild(el('span', 'note-text', picked.length + (picked.length > 1 ? ' réglages appliqués' : ' réglage appliqué') + ' depuis la discussion.'));
          $('guide-notes').appendChild(appliedNote); // toujours dans l'onglet Étapes, même quand la discussion est ouverte
        }
        pickHint.remove();
        footer.textContent = '';
        footer.classList.add('undo-row');
        var preset = lastValues && lastValues.context ? lastValues.context.process : '';
        footer.appendChild(doneLabel('Appliqué'));
        // Ce qui est réellement en place en plus des lignes cochées : réglages ajoutés par Plyo, réglages changés par Orca.
        [Logic.addedList(result.applied), Logic.alsoChangedList(result.also_changed)].forEach(function (l) { if (l) footer.appendChild(alsoBlock(l, 'small footnote orca-also')); });
        var savedLine = Logic.savedText(result);
        if (savedLine) footer.appendChild(el('p', 'muted small footnote', fr(savedLine)));
        // Sans texte d'enregistrement : cas qui ne devrait plus arriver (save_applied répond toujours) ; noté pour le débogage,
        // sans rien demander à l'utilisateur.
        else if (preset && window.console) console.warn('Plyo : lot appliqué sans retour d’enregistrement pour « ' + preset + ' »');
        function showUndone(done) {
          entry.applied = false;
          if (entry.hist) entry.hist.cards = 'undone';
          scheduleSave();
          // La fiche a l'air annulée : son titre, ses coches et ses valeurs disent que les réglages d'avant sont revenus.
          sheet.classList.remove('applied');
          sheet.classList.add('undone');
          sheet.querySelector('header').textContent = fr('Réglages annulés');
          sheet.querySelectorAll('.row .mark').forEach(function (m) { m.textContent = ''; m.appendChild(icon('undo', 14)); });
          footer.textContent = '';
          footer.appendChild(doneLabel('Réglages d’avant remis', 'undo'));
          // Retouches faites à la main depuis : laissées telles quelles, et dit.
          var kept = Logic.keptText(done && done.kept);
          if (kept) footer.appendChild(el('p', 'small footnote', fr(kept)));
        }
        if (undoId) undoneListeners[undoId] = showUndone;
        footer.appendChild(undoButton('Annuler', function (undoBtn) {
          pendingSheet = { kind: 'undo', extras: true, onResult: function (okUndo, msg, undoResult) {
            if (okUndo) return; // la fiche est prévenue par undoneListeners
            // Annulation refusée : les valeurs d'avant, à remettre d'un clic, dans la fiche (une seule offre à la fois).
            var previous = sheet.querySelector('.restore-offer');
            if (previous) previous.remove();
            restoreOffer(undoResult && undoResult.restore, sheet);
            undoBtn.disabled = false;
            fail.textContent = fr(msg);
            fail.classList.remove('hidden');
          } };
          postRequest({ type: 'undo', undo_id: undoId || 0 });
        }));
        // Le compte rendu et « Annuler » doivent se voir, pas rester sous le badge « Voir la suite ».
        footer.scrollIntoView({ block: 'center' });
        updateMoreBadge();
      } };
      // `ask` : ces réglages viennent de l'IA, Plyo demandera plus tard si l'impression a marché.
      var names = Logic.namesForApply(entry.data, lastValues && lastValues.context);
      postRequest({ type: 'apply', changes: changes, print_name: names.process, filament_name: names.filament, printer_name: names.printer, why: (entry.data.defect && entry.data.defect.name) || '',
        ask: { conv: conv ? conv.id : '', defect: (entry.data.defect && entry.data.defect.key) || '' } });
    });
    ignore.addEventListener('click', function () { sheet.remove(); });
    container.appendChild(sheet);
  }

  // Questions de l'IA : une réponse par question, puis un seul envoi.
  function renderQuestions(container, entry, archived) {
    var qs = entry.data.questions;
    var picks = entry.answers || {};
    var wrap = el('div', 'questions');
    var sendBtn = button('Envoyer mes réponses', null, 'btn sm');
    qs.forEach(function (q, i) {
      wrap.appendChild(el('p', 'q', q.text));
      var row = el('div', 'chips');
      q.choices.forEach(function (c) {
        var chip = el('button', 'chip' + (picks[i] === c ? ' on' : ''), c);
        chip.type = 'button';
        chip.disabled = archived || !!entry.answered;
        chip.addEventListener('click', function () {
          picks[i] = c;
          row.querySelectorAll('.chip').forEach(function (b) { b.classList.toggle('on', b === chip); });
          sendBtn.disabled = !Logic.allAnswered(qs, picks);
        });
        row.appendChild(chip);
      });
      wrap.appendChild(row);
      if (!archived && PlyoSpools.isFilamentQuestion(q) && spoolMissing()) wrap.appendChild(chooseSpoolButton()); // même choix que l'accueil
    });
    if (!archived && !entry.answered) {
      sendBtn.disabled = !Logic.allAnswered(qs, picks);
      sendBtn.addEventListener('click', function () {
        entry.answered = true;
        entry.answers = picks;
        scheduleSave();
        wrap.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
        send(Logic.combineAnswers(qs, picks));
      });
      wrap.appendChild(el('div', 'row-acts')).appendChild(sendBtn);
    }
    container.appendChild(wrap);
  }

  // « Signaler » : la réponse semble fausse ou inutile. Gratuit ; sert à corriger l'assistant.
  function feedbackLink(entry) {
    var link = button('Signaler', null, 'link');
    link.addEventListener('click', function () {
      var form = el('div', 'feedback');
      var input = el('textarea', 'field');
      input.maxLength = 1000;
      input.placeholder = 'Qu’est-ce qui ne va pas dans cette réponse ? (facultatif)';
      input.setAttribute('aria-label', 'Ce qui ne va pas');
      var acts = el('div', 'row-acts');
      var go = button('Envoyer le signalement', function () {
        go.disabled = true;
        var a = entry.data;
        apiFetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
          verdict: 'bad', comment: input.value.trim() || undefined, question: (entry.question || '').slice(0, 2000), locale: (lastValues && lastValues.locale) || 'fr',
          answer: { status: a.status, defect: a.defect, message: a.message, suggestions: a.suggestions, actions: a.actions || [] },
          context: lastValues && lastValues.context ? { printer: lastValues.context.printer, filament: lastValues.context.filament } : undefined
        }) })
          .then(function (r) { return r.ok ? null : Promise.reject(); })
          .then(function () { form.replaceWith(doneLabel('Merci, c’est noté : on s’en sert pour corriger l’assistant.')); entry.flagged = true; scheduleSave(); })
          .catch(function () { go.disabled = false; go.textContent = fr('Réessayer l’envoi'); });
      }, 'btn sm');
      acts.appendChild(go);
      acts.appendChild(button('Laisser tomber', function () { form.replaceWith(link); }, 'link'));
      form.appendChild(input);
      form.appendChild(acts);
      link.parentNode.parentNode.insertBefore(form, link.parentNode.nextSibling);
      link.remove();
      input.focus();
    });
    return link;
  }

  function renderAnswer(entry, archived, reopened) {
    var a = entry.data;
    showConversation();
    var box = el('div', 'ai');
    box.appendChild(whoLine(entry.photoCount ? 'd’après ' + (entry.photoCount > 1 ? 'tes ' + entry.photoCount + ' photos' : 'ta photo') : ''));

    var isDefect = a.status === 'ok' && a.defect && ['user_goal', 'no_defect', 'unknown', 'general_question'].indexOf(a.defect.key) < 0;
    if (a.status !== 'question' && a.status !== 'off_topic' && a.defect && a.defect.name) {
      var diag = el('div', 'diag');
      diag.appendChild(el('h3', '', a.defect.name));
      if (isDefect && CONFIDENCE[a.confidence]) diag.appendChild(el('span', 'pill', CONFIDENCE[a.confidence]));
      box.appendChild(diag);
      if (a.defect.explanation) box.appendChild(rich(a.defect.explanation));
    }

    if (a.suggestions.length) {
      renderSheet(box, entry, Logic.sheetArchived(archived, reopened, !!entry.applied));
      if (a.message) { var tip = alertBox('tip', a.message, 'bulb'); box.appendChild(tip); }
    } else if (a.message) {
      box.appendChild(rich(a.message));
    }
    var costNote = Logic.offTopicCostNote(a);
    if (costNote) box.appendChild(el('p', 'muted small', fr(costNote)));
    var dropped = Logic.rejectedNote(a);
    if (dropped) box.appendChild(el('p', 'muted small', fr(dropped)));

    if (a.commands && a.commands.length) box.appendChild(renderCommands(entry, archived));
    var actions = renderActions(a.actions, archived);
    if (actions) box.appendChild(actions);
    // Un seul bouton principal par réponse : « Appliquer » s'il y a une fiche, le test passe alors en secondaire.
    if (!archived && a.calibration_offer && CALIB[a.calibration_offer.test]) box.appendChild(calibrationOffer(a.calibration_offer, a.suggestions.length > 0));
    if (a.questions && a.questions.length) renderQuestions(box, entry, archived);

    var foot = el('div', 'ai-foot');
    if (session && a.status !== 'off_topic' && !entry.flagged) foot.appendChild(feedbackLink(entry));
    if (foot.children.length) box.appendChild(foot);
    thread.appendChild(box);
    // Réponse neuve : on reste sur son début (le badge invite à lire la suite) ; réponse rouverte : comme avant, en bas.
    if (archived) scrollDown(); else { scrollToAnswerTop(box); applyTab('answer'); }
  }

  // ---------- Actions ----------
  sendButton.addEventListener('click', function () { send(noteInput.value); });
  // Entrée envoie, Maj + Entrée va à la ligne (pas pendant la saisie d'un caractère composé).
  // Le champ commence sur une ligne et grandit quand on écrit (six lignes au plus).
  function growNote() {
    noteInput.style.height = 'auto';
    noteInput.style.height = Math.min(noteInput.scrollHeight, 132) + 'px';
    $('note-hint').textContent = fr(Logic.noteHint(noteInput.value.length, noteInput.maxLength)); // près de la limite : le compteur, plutôt qu'un texte coupé sans le dire
  }
  noteInput.addEventListener('input', growNote);
  noteInput.addEventListener('keydown', function (e) {
    if (Logic.isSendKey(e)) { e.preventDefault(); send(noteInput.value); }
  });
  $('btn-files').addEventListener('click', pickFiles);
  $('btn-phone').addEventListener('click', openPhone);
  // Micro : un appui lance la dictée du système dans le champ, un second l'arrête (rien n'est enregistré par Plyo).
  // `dictating` : la dictée a été lancée d'ici et rien n'a dit qu'elle s'est arrêtée. Le système ne prévient pas quand il
  // arrête seul : on considère la dictée finie quand le champ perd le curseur, à l'envoi, sur Échap, ou après un silence.
  var dictating = false, dictationTimer = null;
  function setDictating(on) {
    dictating = on;
    clearTimeout(dictationTimer);
    dictationTimer = on ? setTimeout(stopDictation, Logic.DICTATION_SILENCE_MS) : null;
    var mic = $('btn-mic'), label = Logic.dictationLabel(on);
    mic.classList.toggle('on', on);
    mic.setAttribute('aria-pressed', on ? 'true' : 'false');
    mic.title = label;
    mic.setAttribute('aria-label', label);
    $('note-hint').textContent = fr(on ? Logic.DICTATION_LISTENING : Logic.noteHint(noteInput.value.length, noteInput.maxLength));
  }
  // Arrêt demandé au système : second appui, envoi de la demande, champ quitté, ou silence prolongé.
  function stopDictation() {
    if (!dictating) return;
    setDictating(false);
    window.orca.postMessage({ type: 'dictation_stop' });
  }
  // Le clic ne doit pas retirer le curseur du champ : la dictée s'arrêterait d'elle-même.
  $('btn-mic').addEventListener('mousedown', function (e) { e.preventDefault(); });
  $('btn-mic').addEventListener('click', function () {
    if (dictating) { stopDictation(); return; }
    noteInput.focus();
    window.orca.postMessage({ type: 'dictation_start' });
  });
  noteInput.addEventListener('blur', stopDictation);
  sendButton.addEventListener('click', stopDictation);
  // Échap arrête déjà la dictée du système ; Entrée envoie la demande : dans les deux cas le bouton revient à « Dicter ».
  noteInput.addEventListener('keydown', function (e) {
    if (!dictating) return;
    if (e.key === 'Escape') setDictating(false);
    else if (Logic.isSendKey(e)) stopDictation();
  });
  // Du texte arrive pendant la dictée : elle écoute encore, le délai de silence repart.
  noteInput.addEventListener('input', function () { if (dictating) setDictating(true); });
  // Réponse du slicer : au démarrage, le bouton n'apparaît que si le système sait dicter ; après un appui, la suite ou l'aide.
  function onDictation(msg) {
    $('btn-mic').classList.toggle('hidden', !msg.available);
    if (msg.started === true) setDictating(true);
    else if (msg.started === false) { setDictating(false); noteLine(Logic.dictationFailText(msg.platform), 'error', 'alert'); }
  }
  $('phone-linked').addEventListener('click', openPhone);
  $('goals').querySelectorAll('.chip').forEach(function (chip) { chip.addEventListener('click', function () { send(chip.textContent); }); });

  // ---------- Messages du slicer ----------
  var autoOpening = null;     // plus de réouverture d'office au lancement : reste à null
  var saveFailedShown = {};   // projet non enregistré : chaque raison dite une seule fois (trop long, disque, autre)
  var otherInstanceShown = false; // Plyo ouvert deux fois : dit une seule fois
  var valuesMachineSig = '';       // plateau, buse et modèle du dernier « values » (la fiche est redessinée s'ils changent)
  window.orca.onMessage(function (msg) {
    if (!msg || !msg.type) return;
    if (msg.type === 'session') {
      session = msg.session;
      showLoggedIn(!!session);
      if (session) {
        dropLoginCard();
        refreshAccount();
        if (afterLogin) { var retry = afterLogin; afterLogin = null; retry(); }
      }
    } else if (msg.type === 'values') {
      var firstValues = !lastValues;
      // Plateau, buse et modèle lus pour la machine en cours : la fiche et la question de l'étape Machine suivent.
      var machineSig = JSON.stringify([msg.bed || null, msg.machine || null, msg.context ? [msg.context.printer, msg.context.nozzle_mm] : null]);
      renderValues(msg);
      if (machineSig !== valuesMachineSig) { valuesMachineSig = machineSig; if (conv && !firstValues) renderProject(); }
      checkDivergence();
      checkAdoptOffer();
      if (firstValues) { askOutcome(); applyMachineQuestion(); } // au démarrage, une fois les libellés des réglages et la machine d'Orca connus
      window.orca.postMessage({ type: 'calib_history' }); // l'historique dépend du filament et de l'imprimante en cours
      drainPhoneQueue();
    } else if (msg.type === 'error') {
      // Erreur générale du slicer : seule la demande qui porte cet identifiant est prévenue ; sinon une simple ligne.
      var failed = msg.request && pendingResults[msg.request];
      // Carte « Couleurs » : une lecture ou un changement qui échoue ne la laisse pas en attente.
      if (msg.for === 'colours_get' && conv && coloursUI.conv === conv) { coloursUI.state = { ok: false }; renderProject(); return; }
      if (msg.for === 'colour_set' && coloursUI.token) { onColourSet({ token: coloursUI.token, ok: false, text: msg.text }); return; }
      if (failed) { delete pendingResults[msg.request]; failed.onResult(false, msg.text, msg); }
      else noteLine(msg.text, 'error', 'alert');
    } else if (msg.type === 'result') {
      syncProjectNames(msg.saved);
      if (msg.ok && msg.undo_id && Array.isArray(msg.applied)) threadNote(PlyoThread.appliedText(msg.applied, viewUI.tab === 'chat' ? 'discussion' : 'etapes'));
      if (msg.ok && msg.undone_id) threadNote('Réglages remis comme avant (« Annuler »).');
      // Réglages posés par l'assistant pour ce projet : retenus, et oubliés à l'annulation, pour ne jamais les présenter comme
      // tes modifications manuelles. Conversation plus ancienne sans relevé : on ne commence pas un relevé incomplet.
      if (conv && msg.ok && conv.project.assistant && typeof conv.project.assistant === 'object') {
        if (msg.undo_id && Array.isArray(msg.written)) { conv.project.assistant = Logic.noteWritten(conv.project.assistant, msg.written, BATCH_TAG + ':' + msg.undo_id); scheduleSave(); }
        if (msg.undone_id) { conv.project.assistant = Logic.forgetBatch(conv.project.assistant, BATCH_TAG + ':' + msg.undone_id); scheduleSave(); }
      }
      if (msg.ok && (msg.undo_id || msg.undone_id)) orcaUI.changedAt = Date.now(); // un réglage vient de changer (découpe à relancer)
      if (msg.can_restore) offerRestore();
      if (msg.undone_id && undoneListeners[msg.undone_id]) { undoneListeners[msg.undone_id](msg); delete undoneListeners[msg.undone_id]; }
      var waiting = msg.request && pendingResults[msg.request];
      if (waiting) { delete pendingResults[msg.request]; waiting.onResult(msg.ok, msg.text, msg); }
      else noteLine(msg.text, msg.ok ? 'ok' : 'error', msg.ok ? 'check' : 'alert');
      // Ce que le lot a vraiment fait, quand la fiche qui l'a demandé ne le montre pas elle-même : réglages ajoutés, réglages
      // changés en plus par Orca, retouches laissées par l'annulation ; et, pour une annulation refusée, les valeurs d'avant.
      if (!waiting || !waiting.extras) {
        if (msg.ok) [Logic.addedText(msg.applied), Logic.alsoChangedText(msg.also_changed), Logic.keptText(msg.kept)].forEach(function (t) { if (t) noteLine(t, '', 'info'); });
        else if (msg.restore && msg.restore.length) restoreOffer(msg.restore);
        else if (waiting && waiting.message && waiting.message.type === 'apply') {
          var fixes = refusalButtons(msg, function (confirmKey) {
            var again = JSON.parse(JSON.stringify(waiting.message));
            delete again.request;
            if (confirmKey) (again.changes || []).forEach(function (c) { if (c.key === confirmKey) c.confirmed = true; });
            pendingSheet = { kind: waiting.kind, extras: waiting.extras, onResult: waiting.onResult };
            postRequest(again);
          });
          if (fixes) noteLine('Que veux-tu faire ?', '', 'info').appendChild(fixes);
        }
      }
      // Un lot appliqué : Orca peut le refuser ou prévenir (validation). On relit ce qu'il en dit, une fois le lot pris en compte.
      if (msg.ok && msg.undo_id && conv) {
        orcaUI.afterApply = { tries: 0, keys: (Array.isArray(msg.applied) ? msg.applied : []).map(function (a) { return a && a.id; }) };
        setTimeout(function () { askOrca('after_apply'); }, 600);
      }
      // Corriger à l'étape Résultat, c'est préparer la prochaine impression : la découpe est à refaire.
      if (msg.ok && msg.undo_id && currentTourStep() === 'after') {
        projectUI.fixedAfter = conv;
        if (viewUI.tab === 'chat') noteLine('Ces réglages demandent une nouvelle découpe : l’étape Préparer, en haut du panneau, la relance.', '', 'info');
      }
    } else if (msg.type === 'calib_started') {
      onCalibStarted(msg);
    } else if (msg.type === 'calib_history') {
      calibHistory = Array.isArray(msg.items) ? msg.items : [];
    } else if (msg.type === 'phone_batch_ready') {
      pollPhone(); // la fenêtre QR s'est fermée sur un envoi : on le traite sans attendre le prochain tour
    } else if (msg.type === 'gallery') {
      projectUI.galleryItems = Array.isArray(msg.items) ? msg.items : [];
      if (conv && projectUI.gallery) renderProject();
    } else if (msg.type === 'design_lib') {
      onDesignLib(msg);
    } else if (msg.type === 'model_added') {
      onModelAdded(msg);
      designPlaced(msg); // après : le changement d'étape a déjà effacé les messages de l'étape
    } else if (msg.type === 'firststeps') {
      onFirstSteps(msg.state || {});
    } else if (msg.type === 'tour_signals') {
      onTourSignals(msg);
    } else if (msg.type === 'show_me') {
      if (!msg.ok && WHERE[msg.target]) noteLine(WHERE[msg.target], '', 'pin', 'guide');
    } else if (msg.type === 'show_setting') {
      onShowSetting(msg);
    } else if (msg.type === 'explain') {
      onExplain(msg);
    } else if (msg.type === 'focus_setting') {
      $('focus-label').textContent = fr(msg.label);
      focusKey = msg.key;
      $('focus-chip').classList.remove('hidden');
    } else if (msg.type === 'ai_context') {
      if (contextWaiter) contextWaiter(msg);
    } else if (msg.type === 'reliable') {
      if (reliableWaiter) { var rw = reliableWaiter; reliableWaiter = null; rw(msg); }
    } else if (msg.type === 'restore_reliable_result') {
      // Réglages posés par l'assistant pour ce projet (comme un lot appliqué) : jamais présentés comme tes modifications.
      if (conv && msg.ok && msg.undo_id && Array.isArray(msg.written) && conv.project.assistant && typeof conv.project.assistant === 'object') {
        conv.project.assistant = Logic.noteWritten(conv.project.assistant, msg.written, BATCH_TAG + ':' + msg.undo_id);
        scheduleSave();
      }
      if (msg.ok && msg.undo_id) orcaUI.changedAt = Date.now(); // un réglage vient de changer (découpe à relancer)
      if (reliableResult) { var rr = reliableResult; reliableResult = null; rr(msg); }
    } else if (msg.type === 'manual_edits') {
      if (manualWaiter) { var waiter = manualWaiter; manualWaiter = null; waiter(msg.items || []); }
      var listeners = manualListeners; manualListeners = []; listeners.forEach(function (f) { f(msg.items || []); });
    } else if (msg.type === 'limits') {
      onLimits(msg);
    } else if (msg.type === 'journal') {
      fillJournal(msg.events || [], msg.projects);
    } else if (msg.type === 'printer_scan_result' && projectUI.bgScan) {
      var asked = setup.phase === 'scan'; // l'installation a demandé la même recherche pendant celle d'arrière-plan : le résultat sert aux deux
      onBackgroundScan(msg.printers);
      if (asked) onSetupScan(msg.printers || []);
    } else if (msg.type === 'printer_scan_result') {
      var found = Array.isArray(msg.printers) ? msg.printers : [];
      if (setup.phase === 'scan') onSetupScan(found);
    } else if (msg.type === 'show_preview') {
      var pw = previewWaiters[msg.request]; delete previewWaiters[msg.request];
      if (pw) pw(msg);
    } else if (msg.type === 'open_calibration') {
      var rw = rawTestWaiters[msg.request]; delete rawTestWaiters[msg.request];
      if (rw) rw(msg);
    } else if (msg.type === 'project_changed') {
      // Nouveau projet ou projet ouvert : retour à l'accueil (la conversation précédente reste dans « Mes conversations »).
      // Pendant une réponse : retenu, appliqué à sa fin (ask, finish) ; d'ici là, rien ne s'applique (refuseStale).
      if (!busy) { closeDrawer(); newConversation(); }
      else projectSwitched = true;
      // Ce qu'Orca a laissé de côté en changeant de projet : retouches d'impression (UX-31), filament du fichier (UX-36).
      window.orca.postMessage({ type: 'file_filament_get' });
      askRetouches(300);
    } else if (msg.type === 'spools') {
      onSpools(msg);
    } else if (msg.type === 'brands') {
      onBrands(msg);
    } else if (msg.type === 'slot_brands') {
      onSlotBrands(msg);
    } else if (msg.type === 'spool_chosen') {
      onSpoolChosen(msg);
    } else if (msg.type === 'spool_success_done') {
      onSpoolSuccessDone(msg);
    } else if (msg.type === 'spool_failure_done') {
      onSpoolFailureDone(msg);
    } else if (msg.type === 'spool_adopt_offer') {
      onAdoptOffer(msg);
    } else if (msg.type === 'spool_adopted') {
      onSpoolAdopted(msg);
    } else if (msg.type === 'spool_current') {
      onSpoolCurrent(msg);
    } else if (msg.type === 'print_retouches') {
      onPrintRetouches(msg);
    } else if (msg.type === 'print_retouches_kept') {
      onPrintRetouchesKept(msg);
    } else if (msg.type === 'print_retouches_undone') {
      onPrintRetouchesUndone(msg);
    } else if (msg.type === 'spool_kept') {
      onSpoolKept(msg);
    } else if (msg.type === 'spool_kept_undone') {
      onSpoolKeptUndone(msg);
    } else if (msg.type === 'spool_keep_failed') {
      onSpoolKeepFailed(msg);
    } else if (msg.type === 'file_filament') {
      onFileFilament(msg);
    } else if (msg.type === 'file_filament_taken') {
      onFileFilamentTaken(msg);
    } else if (msg.type === 'print_started') {
      onPrintStarted(msg);
    } else if (msg.type === 'print_send_waiting') {
      onSendWaiting();
    } else if (msg.type === 'print_upload') {
      onPrintUpload(msg);
    } else if (msg.type === 'orca_dialog') {
      onOrcaDialog(msg);
    } else if (msg.type === 'printer_link_rechecked') {
      onLinkRechecked(msg);
    } else if (msg.type === 'printer_link_current_closed') {
      onLinkCurrentClosed(msg);
    } else if (msg.type === 'setup_catalog') {
      onSetupCatalog(Array.isArray(msg.catalog) ? msg.catalog : []);
    } else if (msg.type === 'setup_installed') {
      onSetupInstalled(msg);
    } else if (msg.type === 'bed_type_set') {
      onBedTypeSet(msg);
    } else if (msg.type === 'printer_link_state') {
      onLinkState(msg);
    } else if (msg.type === 'printer_profile_selected') {
      if (projectUI.pending && projectUI.pending.kind === 'printer') onProjectPrinterSelected(msg); else onProfileSelected(msg);
    } else if (msg.type === 'printer_link_tested') {
      onLinkTested(msg);
    } else if (msg.type === 'printer_link_saved') {
      onLinkSaved(msg);
    } else if (msg.type === 'printer_link_dialog_closed') {
      onLinkDialogClosed(msg);
    } else if (msg.type === 'outcome_pending') {
      onOutcomePending(msg.items);
    } else if (msg.type === 'outcome_result_done') {
      onOutcomeResult(msg);
    } else if (msg.type === 'preflight') {
      onPreflight(msg.data);
    } else if (msg.type === 'slice_result') {
      onSliceResult(msg);
    } else if (msg.type === 'orca_issues') {
      onOrcaIssues(msg);
    } else if (msg.type === 'plate_action') {
      onPlateAction(msg);
    } else if (msg.type === 'commands') {
      var waiter = commandWaiters[msg.request];
      delete commandWaiters[msg.request];
      if (waiter) waiter(msg);
    } else if (msg.type === 'open_tool') {
      noteLine(msg.text, msg.ok ? '' : 'error', msg.ok ? 'eye' : 'alert');
    } else if (msg.type === 'project_resume') {
      onProjectResume(msg);
    } else if (msg.type === 'conv_pruned') {
      onConvPruned(msg);
    } else if (msg.type === 'conv_list') {
      // Au lancement, le panneau reste sur son accueil (plus de réouverture d'office) : la liste ne sert qu'au volet.
      fillConversations(msg.items || []);
    } else if (msg.type === 'conv_save_failed') {
      var why = msg.reason || 'too_big';
      if (!saveFailedShown[why]) { saveFailedShown[why] = true; noteLine(Logic.saveFailedText(why), 'error', 'alert'); }
    } else if (msg.type === 'dictation') {
      onDictation(msg);
    } else if (msg.type === 'other_instance') {
      if (!otherInstanceShown) { otherInstanceShown = true; noteLine(Logic.OTHER_INSTANCE_TEXT, 'error', 'alert'); }
    } else if (msg.type === 'project_restored') {
      onProjectRestored(msg);
    } else if (msg.type === 'project_opened') {
      onProjectOpened(msg);
    } else if (msg.type === 'project_file') {
      onProjectFile(msg);
    } else if (msg.type === 'project_attach_refused') {
      onAttachRefused(msg);
    } else if (msg.type === 'project_attached') {
      attachDone();
    } else if (msg.type === 'project_detached') {
      onProjectDetached(msg);
    } else if (msg.type === 'model_adapted') {
      var ad = msg.adaptation;
      if (ad && (ad.adapted && ad.adapted.length || ad.dropped && ad.dropped.length || ad.error)) { syncProjectNames(ad.saved); $('guide-notes').appendChild(renderAdaptation(ad, false)); }
    } else if (msg.type === 'habits') {
      habits = Object.assign(PlyoMachines.emptyHabits(), msg.habits || {});
      updateLevelLabel();
      applyMachineQuestion();
    } else if (msg.type === 'project_printers') {
      onProjectPrinters(msg);
    } else if (msg.type === 'canvas_state') {
      onCanvasState(msg);
    } else if (msg.type === 'canvas_applied') {
      onCanvasApplied(msg);
    } else if (msg.type === 'colours') {
      onColours(msg);
    } else if (msg.type === 'colour_set') {
      onColourSet(msg);
    } else if (msg.type === 'canvas_refused') {
      canvasUI.refused = msg.text || 'La CC2 a refusé les emplacements choisis.';
      canvasUI.refusedConv = conv;
      canvasUI.refusedPlain = true;
      projectUI.sentConv = null; // refus après l'envoi : l'impression n'a pas démarré
      noteLine(canvasUI.refused, 'warn', 'alert', 'guide');
      if (conv) renderProject();
    } else if (msg.type === 'slots_manual_state') {
      onManualState(msg);
    } else if (msg.type === 'slots_manual_saved') {
      onManualSaved(msg);
    } else if (msg.type === 'print_watch') {
      onPrintWatch(msg);
    } else if (msg.type === 'canvas_sent') {
      onCanvasSent(msg);
    } else if (msg.type === 'canvas_started') {
      noteLine(msg.text || '', msg.ok ? 'ok' : 'warn', msg.ok ? 'check' : 'alert', 'guide');
      if (msg.ok) { canvasUI.refused = ''; projectUI.sentConv = conv; if (conv) renderProject(); }
    } else if (msg.type === 'project_state') {
      onProjectState(msg);
    } else if (msg.type === 'project_reachable') {
      projectUI.reachable[msg.preset] = !!msg.ok;
      renderProject();
    } else if (msg.type === 'conv_loaded') {
      var then = afterConvLoaded, auto = autoOpening === msg.id;
      afterConvLoaded = null;
      autoOpening = null;
      var loaded = Logic.convLoaded(msg, !!then, auto);
      if (loaded.restore) restoreConversation(msg.id, msg.conversation);
      if (loaded.followUp) then();
      if (loaded.error) {
        // Supprimé, ou rangé pour faire de la place : on le dit, et la suite reste à portée (la liste à jour).
        var gone = noteLine('Ce projet n’existe plus : il a été supprimé, ou rangé pour faire de la place.', 'error', 'alert');
        gone.appendChild(button('Voir mes projets', openConversations, 'btn ghost sm', 'folder'));
      }
      // Projet d'une correction introuvable : sa question « Ça a marché ? » est posée ici, elle n'est jamais perdue.
      if (!loaded.restore && outcomeOpening && outcomeOpening.conv === msg.id) { var lost = outcomeOpening; outcomeOpening = null; renderOutcome(lost, false); }
    }
  });

  startConversation();
  // Panneau ouvert : le plateau encore attaché à une conversation (panneau fermé puis rouvert) la rouvre à son étape ; sinon le
  // plateau d'avant est détaché comme avant, et un projet récent peut être proposé (onProjectResume). Sans réponse du slicer
  // en 1,5 s, on fait comme avant (détachement), pour ne jamais bloquer la reprise de la pièce posée.
  window.orca.postMessage({ type: 'project_resume_get' });
  resumeUI.timer = setTimeout(function () { if (resumeUI.waiting) onProjectResume({}); }, 1500);
  // Fermeture du panneau : ce qui attend d'être enregistré part tout de suite.
  window.addEventListener('pagehide', flushSave);
  window.addEventListener('beforeunload', flushSave);
  window.orca.postMessage({ type: 'habits_get' });
  askProjectPrinters();
  showLoggedIn(false);
  window.orca.postMessage({ type: 'ready' });
  window.orca.postMessage({ type: 'session_load' });
  loadSharedModels();
  window.orca.postMessage({ type: 'firststeps_state' });
  askRetouches(2500); // retouches d'impression laissées à la dernière fermeture d'Orca (UX-31)
})();
</script>
</body>
</html>
