<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant Plyo</title>
<style>
  /* Panneau Assistant Plyo — maquette validée : plyo-api/docs/design/assistant-v2-maquette.html.
     Variables --orca-* injectées par OrcaSlicer (thème clair ou sombre, attribut data-orca-theme) ; valeurs de
     repli pour un navigateur. Ton des textes : tutoiement, phrases courtes, toujours l’action suivante.

     Système de design (à réutiliser, ne pas inventer de valeurs à côté) :
     - texte : 11 / 12 / 13 / 15 / 20 px (--fs-*) ;
     - espaces : multiples de 4 px (--s1 à --s6) ;
     - arrondis : 6 px (contrôles), 10 px (cartes), pilule (--r-*) ;
     - boutons : .btn (principal, un seul par carte), .btn.ghost (secondaire), .link (tertiaire), taille .sm ;
     - couleurs de texte et de fond plein en AA (≥ 4,5:1, vérifié par tests/contrast.test.mjs) :
       --accent-fill (fond des boutons pleins), --accent-text, --warn-text, --danger-text ;
       --accent, --warn, --danger restent pour le décor (jauges, bordures, icônes). */
  :root {
    --bg: var(--orca-bg, #ffffff);
    --fg: var(--orca-fg, #262e30);
    --muted: var(--orca-muted, #6b6b6b);
    --border: var(--orca-border, #dbdbdb);
    --accent: var(--orca-accent, #009688);
    --font: var(--orca-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    /* Blanc sur #009688 ne fait que 3,7:1 : les fonds pleins et textes accentués prennent un vert plus sombre. */
    --accent-fill: #00796b;
    --on-accent: #ffffff;
    --accent-text: #00796b;
    --warn: #d18a00;
    --warn-text: #9a5b00;
    --danger: #e14747;
    --danger-text: #c62828;
    --surface: color-mix(in srgb, var(--fg) 5%, var(--bg));
    --raised: color-mix(in srgb, var(--fg) 9%, var(--bg));
    --accent-soft: color-mix(in srgb, var(--accent) 10%, var(--bg));
    --warn-soft: color-mix(in srgb, var(--warn) 12%, var(--bg));
    --danger-soft: color-mix(in srgb, var(--danger) 10%, var(--bg));
    --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-lg: 15px; --fs-xl: 20px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
    --r-sm: 6px; --r-md: 10px; --r-pill: 999px;
    --shadow: 0 8px 24px rgba(0, 0, 0, .18);
    --motion: 150ms;
    color-scheme: light;
  }
  /* Thème sombre d'Orca : textes accentués plus clairs pour rester lisibles sur #2d2d31. */
  :root[data-orca-theme="dark"] {
    --accent-text: #4db6ac;
    --warn-text: #f0a020;
    --danger-text: #ff7b72;
    --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg));
    --shadow: 0 8px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* Le panneau d'Orca injecte des styles par défaut (orca-plugin-defaults : boutons en texte blanc, etc.) avant cette
     feuille sous macOS, mais après elle sous Windows (WebView2), où ils l'emportaient : texte blanc sur fond clair.
     Préfixées par « html », ces règles de base gagnent quel que soit l'ordre d'injection. */
  html, body { height: 100%; }
  html body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: var(--fs-md); line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; }
  html button { font: inherit; color: inherit; }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--accent-fill); }
  textarea { resize: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .ic { display: inline-block; flex: none; vertical-align: -3px; }
  .muted { color: var(--muted); }
  .small { font-size: var(--fs-sm); }

  /* Mouvement léger : les cartes arrivent en fondu (150 ms), sauf si le système demande moins d'animations. */
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .ai, .me, .alert, .note-line, .card, .tour, .menu { animation: rise var(--motion) ease-out; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* Boutons : un principal par carte, puis secondaires et liens */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: var(--s1) var(--s3); border-radius: var(--r-sm); font-weight: 600; line-height: 1.25; text-align: center; cursor: pointer; border: 1px solid var(--accent-fill); background: var(--accent-fill); color: var(--on-accent); }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--fg); border-color: var(--border); }
  .btn.ghost:hover:not(:disabled) { border-color: var(--accent); background: var(--surface); filter: none; }
  .btn.sm { min-height: 28px; padding: 2px 10px; font-size: var(--fs-sm); }
  .btn.wide { flex: 1; }
  .link { display: inline-flex; align-items: center; gap: var(--s1); min-height: 24px; border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: var(--fs-sm); padding: 0; }
  .link:hover:not(:disabled) { color: var(--fg); }
  .link:disabled { opacity: .5; cursor: default; }
  /* Volet repliable : « Comment le faire moi-même » */
  .disclosure { display: inline-flex; align-items: center; gap: var(--s1); min-height: 24px; border: 0; background: none; padding: 0; color: var(--fg); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }
  .disclosure .ic { color: var(--muted); transition: transform var(--motion) ease; }
  .disclosure[aria-expanded="true"] .ic { transform: rotate(90deg); }
  .row-acts { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
  .stack { display: flex; flex-direction: column; gap: var(--s2); align-items: stretch; }
  .alert { display: flex; gap: var(--s2); align-items: flex-start; padding: var(--s3); border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); }
  .alert > .ic { margin-top: 2px; color: var(--muted); }
  .alert .alert-body { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; flex: 1; }
  .alert .alert-body > .btn { align-self: flex-start; }
  .alert p { margin: 0; }
  .alert.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); background: var(--warn-soft); }
  .alert.warn > .ic { color: var(--warn-text); }
  .alert.error { border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); background: var(--danger-soft); }
  .alert.error > .ic { color: var(--danger-text); }
  .alert.tip > .ic { color: var(--accent-text); }
  .offer-title { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .chip { padding: 6px var(--s3); border-radius: var(--r-pill); border: 1px solid var(--border); background: transparent; font-size: var(--fs-sm); cursor: pointer; text-align: left; }
  .chip:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-text); }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .chip:disabled { opacity: .55; cursor: default; }
  .badge-pill { display: inline-flex; align-items: center; gap: var(--s1); font-size: var(--fs-xs); font-weight: 600; padding: 1px var(--s2); border-radius: var(--r-pill); white-space: nowrap; background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
  .badge-pill.ok { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
  .badge-pill.warn { background: var(--warn-soft); color: var(--warn-text); border-color: transparent; }
  .badge-pill.bad { background: var(--danger-soft); color: var(--danger-text); border-color: transparent; }

  /* Carte générique (Ça a marché ?, Avant d'imprimer, journal) : neutre, l'état passe par un badge */
  .card { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
  .card > header { display: flex; align-items: center; gap: var(--s2); font-weight: 600; font-size: var(--fs-md); }
  .card > header > .ic { color: var(--accent-text); }
  .card > header .push { margin-left: auto; }
  .card p { margin: 0; }
  .card .meta { color: var(--muted); font-size: var(--fs-sm); }
  .card ul { margin: 0; padding-left: var(--s4); }
  .card.attention > header > .ic { color: var(--warn-text); }
  .card .badge-pill { flex: none; }
  .card > header > span:not(.badge-pill) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pf-part { display: flex; flex-direction: column; gap: 2px; }
  .pf-part b { overflow-wrap: anywhere; }
  .pf-part ul { font-size: var(--fs-sm); }
  .fix-list { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--bg); overflow: hidden; }
  .fix-list .fix-head { padding: 6px var(--s3); font-size: var(--fs-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); }
  .fix-list .row { padding: var(--s2) var(--s3); }
  .journal-list { display: flex; flex-direction: column; gap: var(--s3); }
  .journal-part { background: transparent; }
  .journal-part h4 { margin: 0; font-size: var(--fs-md); font-weight: 600; overflow-wrap: anywhere; }
  .journal-event { display: grid; grid-template-columns: 40px 1fr; gap: var(--s2) var(--s3); align-items: start; border-top: 1px solid var(--border); padding-top: var(--s3); }
  .journal-event .thumb { width: 40px; height: 40px; border-radius: var(--r-sm); object-fit: cover; }
  .journal-event .thumb.placeholder { display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
  .journal-body { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
  .journal-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s2); }
  .journal-top .meta { min-width: 0; }
  .journal-body .problem { font-weight: 600; }
  .journal-event > .row-acts { grid-column: 1 / -1; }

  /* En-tête */
  .top { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s3) var(--s3) var(--s4); border-bottom: 1px solid var(--border); position: relative; flex: none; }
  .top h1 { margin: 0; font-size: var(--fs-lg); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .push { margin-left: auto; }
  /* Jauge d'utilisation du mois : un pourcentage, jamais de crédits par message */
  .gauge { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--border); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; }
  .gauge .gauge-name { color: var(--muted); }
  @media (max-width: 340px) { .gauge .gauge-name { display: none; } }
  .bar { position: relative; display: block; width: 36px; height: 6px; border-radius: var(--r-pill); background: var(--raised); overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: inherit; background: var(--accent); transition: width .3s ease; }
  .low .bar i { background: var(--warn); }
  .empty .bar i { background: var(--danger); }
  .gauge.empty { border-color: var(--danger); color: var(--danger-text); }
  .icon-btn { width: 28px; height: 28px; padding: 0; display: grid; place-items: center; border-radius: var(--r-sm); border: 0; background: transparent; color: var(--muted); cursor: pointer; flex: none; }
  .icon-btn:hover { background: var(--surface); color: var(--fg); }
  .linked { display: inline-flex; align-items: center; gap: var(--s1); min-height: 28px; padding: 0 var(--s2); border-radius: var(--r-pill); border: 1px solid var(--accent); color: var(--accent-text); background: transparent; font-size: var(--fs-xs); font-weight: 600; cursor: pointer; white-space: nowrap; }
  .menu { position: absolute; right: var(--s2); top: 48px; width: 264px; max-width: calc(100vw - 16px); background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s1); box-shadow: var(--shadow); z-index: 10; }
  .menu button { display: flex; gap: var(--s2); align-items: center; width: 100%; min-height: 32px; text-align: left; padding: 6px var(--s2); border: 0; border-radius: var(--r-sm); background: transparent; cursor: pointer; }
  .menu button .ic { color: var(--muted); }
  .menu button:hover:not(:disabled) { background: var(--surface); }
  .menu button:disabled { color: var(--muted); opacity: .55; cursor: default; }
  .menu .group { padding: var(--s2) var(--s2) 2px; color: var(--muted); font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .menu .who { padding: 0 var(--s2) var(--s1); color: var(--muted); font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: var(--s1) 0; }

  /* Zone fixe du haut : fiche du projet, barre des six étapes, prochaine action. Ne défile jamais. */
  #journey-fiche { max-height: 22vh; overflow-y: auto; }
  #journey-fiche:empty { display: none; }
  .journey-extra { white-space: nowrap; }
  .journey { flex: none; background: var(--surface); border-bottom: 1px solid var(--border); padding: var(--s2) var(--s3) var(--s2); display: flex; flex-direction: column; gap: var(--s2); }
  .journey .project { border: 0; background: transparent; padding: 0; margin: 0; gap: var(--s1); }
  .journey .project.compact { flex-direction: row; }
  .project-summary { font-weight: 600; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .journey-bar { display: flex; gap: 3px; }
  #journey-bar { margin-bottom: var(--s3); }
  #journey-bar:empty { display: none; }
  .journey:has(#journey-fiche:empty) { display: none; }
  .journey-seg { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; align-items: stretch; }
  .journey-fill { display: block; height: 5px; border-radius: 3px; background: var(--border); }
  .journey-seg.is-done .journey-fill { background: var(--accent); }
  .journey-seg.is-current .journey-fill { background: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .journey-name { font-size: 10px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .journey-seg.is-current .journey-name { color: var(--accent-text); font-weight: 700; }
  .journey-bar.pills .journey-name { font-size: var(--fs-xs); }
  .journey-seg.is-done .journey-name { color: var(--accent-text); }
  .step-card { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
  .journey-action { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .journey-prompt { flex: 1; min-width: 12ch; font-weight: 600; font-size: var(--fs-lg); }
  .suggestions { display: flex; flex-wrap: wrap; gap: var(--s1); margin-bottom: var(--s2); }
  .suggestions:empty { display: none; }
  .intent-q { margin: 0; font-weight: 700; font-size: var(--fs-lg); }
  .intent-details summary { cursor: pointer; color: var(--accent-text); }
  .btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }

  /* Corps défilant : accueil puis conversation */
  .body { flex: 1; overflow-y: auto; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
  .tabs { flex: none; display: flex; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; background: transparent; border: 0; border-bottom: 3px solid transparent; padding: var(--s3) var(--s2); color: var(--muted); font: inherit; font-size: var(--fs-lg); cursor: pointer; }
  .tab.on { color: var(--accent-text); font-weight: 700; border-bottom-color: var(--accent); }
  .tab-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); margin-left: 6px; vertical-align: middle; }
  .view { display: flex; flex-direction: column; gap: var(--s3); }
  .view.hidden { display: none; }
  #guide-notes { display: flex; flex-direction: column; gap: var(--s2); }
  .more-badge { position: sticky; bottom: var(--s2); align-self: center; z-index: 2; border: 1px solid var(--accent); background: var(--accent-fill); color: var(--on-accent); border-radius: var(--r-pill); padding: 6px 14px; font-weight: 600; font-size: var(--fs-sm); box-shadow: var(--shadow); cursor: pointer; }
  .more-badge.hidden { display: none; }
  .ai { scroll-margin-top: var(--s2); }
  .body > div:empty { display: none; } /* emplacements vides : pas d'espace fantôme en haut */
  .hello { margin: var(--s3) 0 var(--s1); }
  .hello h2 { margin: 0 0 var(--s1); font-size: var(--fs-xl); font-weight: 600; line-height: 1.3; }
  .hello p { margin: 0; color: var(--muted); }
  .home-more { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s3); }
  .home-mini { display: none; color: var(--muted); margin: var(--s1) 0 0; }
  body.touring .home-more { display: none; }
  body.touring .home-mini { display: block; }
  body.touring .hello { display: none; }
  body.touring #view-guide .step-card { display: none; } /* installation en cours : une seule carte à l'écran */
  .action { display: flex; gap: var(--s3); align-items: center; width: 100%; padding: var(--s3); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); cursor: pointer; text-align: left; }
  .action:hover { border-color: var(--accent); }
  .action .badge { width: 36px; height: 36px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
  .action b { display: block; font-size: var(--fs-md); font-weight: 600; }
  .action .sub { display: block; color: var(--muted); font-size: var(--fs-sm); }
  .label { font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: var(--s2) 0 0; }

  /* Messages */
  .thread { display: flex; flex-direction: column; gap: var(--s4); }
  .me { align-self: flex-end; max-width: 86%; display: flex; flex-direction: column; gap: var(--s1); align-items: flex-end; }
  .me .text { background: var(--accent-soft); padding: var(--s2) var(--s3); border-radius: var(--r-md) var(--r-md) 2px var(--r-md); white-space: pre-wrap; overflow-wrap: anywhere; }
  .me .from { font-size: var(--fs-xs); color: var(--muted); display: inline-flex; gap: var(--s1); align-items: center; }
  /* Photos alignées à droite, comme le texte de la demande : 3 par ligne au plus, les dernières se calent à droite. */
  .thumbs { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s1); max-width: calc(3 * 64px + 2 * var(--s1)); }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: var(--r-sm); display: block; }
  .ai { display: flex; flex-direction: column; gap: var(--s2); }
  .ai .who { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); color: var(--muted); }
  .ai .who .link { margin-left: auto; }
  .ai .who i { width: 18px; height: 18px; border-radius: var(--r-sm); background: var(--accent-fill); display: grid; place-items: center; color: var(--on-accent); font-style: normal; font-size: var(--fs-xs); font-weight: 700; }
  .diag { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
  .diag h3 { margin: 0; font-size: var(--fs-lg); font-weight: 600; line-height: 1.35; }
  .pill { font-size: var(--fs-xs); padding: 1px var(--s2); border-radius: var(--r-pill); background: var(--accent-soft); color: var(--accent-text); font-weight: 600; white-space: nowrap; }
  .ai p, .ai h3 { margin: 0; }
  .rich { display: flex; flex-direction: column; gap: 6px; overflow-wrap: anywhere; }
  .rich p { margin: 0; }
  .rich ul, .rich ol { margin: 0; padding-left: var(--s5); display: flex; flex-direction: column; gap: var(--s1); }
  /* Libellé d'Orca : serré, sinon il ouvre un blanc avant la virgule qui suit. */
  .rich .ui { font-weight: 600; padding: 0 2px; margin: 0; border-radius: var(--r-sm); background: var(--raised); white-space: nowrap; }
  .caret::after { content: "▍"; color: var(--accent); animation: blink 1s infinite; }
  .questions { display: flex; flex-direction: column; gap: var(--s2); }
  .q { font-weight: 600; margin: 0; }
  .ai-foot { display: flex; gap: var(--s3); align-items: center; }
  /* Note du fil : alignée à gauche comme une réponse, jamais centrée seule au milieu de l'écran. */
  .note-line { align-self: flex-start; font-size: var(--fs-sm); color: var(--muted); display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; }
  .note-line > .ic { margin-top: 3px; }
  .note-line .note-text { flex: 1 1 0; min-width: 60%; }
  .note-line.ok { color: var(--accent-text); }
  .note-line.error { color: var(--danger-text); }
  .cmds { display: flex; flex-direction: column; gap: var(--s2); align-items: flex-start; }
  .cmds-list { display: flex; flex-direction: column; gap: var(--s1); align-items: flex-start; }
  .howto { border-left: 3px solid var(--accent); padding: var(--s1) 0 var(--s1) var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
  .thinking { color: var(--muted); font-size: var(--fs-sm); display: flex; gap: var(--s2); align-items: center; }
  .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .feedback { display: flex; flex-direction: column; gap: var(--s2); }
  .field { width: 100%; min-height: 56px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--bg); color: var(--fg); font: inherit; padding: 6px var(--s2); }
  .field:focus { outline: none; border-color: var(--accent); }
  .field::placeholder { color: var(--muted); }

  /* Fiche de réglages : ancien → nouveau */
  .sheet { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
  .sheet .group-title { padding: var(--s2) var(--s3) 0; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
  .sheet header { padding: var(--s2) var(--s3); font-size: var(--fs-sm); font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); }
  .row { display: grid; grid-template-columns: 18px 1fr; align-items: start; gap: var(--s2) var(--s3); padding: var(--s3); border-bottom: 1px solid var(--border); cursor: pointer; }
  .row:last-of-type { border-bottom: 0; }
  .row input { margin: 3px 0 0; }
  .row .mark { color: var(--accent-text); display: grid; place-items: center; height: 20px; }
  .row .name { font-weight: 600; }
  .setting-name { border: 0; background: none; padding: 0; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s1); text-align: left; }
  .setting-name .ic { color: var(--muted); }
  .setting-name:hover, .setting-name:hover .ic { color: var(--accent-text); }
  .delta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 2px 0; font-variant-numeric: tabular-nums; font-size: var(--fs-lg); }
  .delta .old { color: var(--muted); text-decoration: line-through; }
  .delta .arrow { color: var(--muted); }
  .delta .new { color: var(--accent-text); font-weight: 700; }
  .row .why { color: var(--muted); font-size: var(--fs-sm); }
  .row.off { opacity: .45; }
  .row.best { background: var(--accent-soft); }
  .row.static { cursor: default; }
  .sheet .status { padding: var(--s2) var(--s3); color: var(--muted); font-size: var(--fs-sm); }
  .sheet .status:empty { display: none; }
  .calib-head { display: flex; flex-direction: column; gap: 2px; }
  .calib-head b { color: var(--fg); font-size: var(--fs-md); }
  .calib-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
  .sheet footer { display: flex; flex-wrap: wrap; gap: var(--s2); padding: var(--s3); border-top: 1px solid var(--border); background: var(--bg); align-items: center; }
  .sheet footer .btn { flex: 1 1 calc(50% - 4px); }
  .sheet footer .btn.full { flex-basis: 100%; order: -1; }
  .sheet footer .link { flex-basis: 100%; justify-content: center; }
  .sheet footer.inline .btn { flex: 0 1 auto; }
  .sheet footer.inline .btn.wide { flex: 1; }
  .sheet footer.inline .link { flex-basis: auto; }
  .done { color: var(--accent-text); font-size: var(--fs-sm); font-weight: 600; flex: 1; display: inline-flex; gap: 6px; align-items: flex-start; }
  .done > .ic { margin-top: 2px; }
  .fail { color: var(--danger-text); font-size: var(--fs-sm); padding: 0 var(--s3) var(--s3); background: var(--bg); }
  /* « Fait ✓ · Annuler » : même ligne et même bouton pour toute action annulable */
  .undo-row { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; align-self: stretch; }
  .undo-row .done { flex: 1 1 auto; }
  .undo-row > .btn, .note-line > .btn { flex: none; margin-left: auto; }
  .undo-row .footnote { margin: 0; flex-basis: 100%; order: 2; }

  /* Zone de saisie */
  .composer { border-top: 1px solid var(--border); padding: var(--s3) var(--s3) var(--s2); display: flex; flex-direction: column; gap: var(--s2); flex: none; }
  .attached { display: flex; gap: 6px; flex-wrap: wrap; }
  .att { position: relative; width: 48px; height: 48px; }
  .att img { width: 48px; height: 48px; object-fit: cover; border-radius: var(--r-sm); display: block; }
  .att button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .7); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .box { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--s2) var(--s2) 6px var(--s3); }
  .box:focus-within { border-color: var(--accent); }
  .box textarea { width: 100%; border: 0; background: transparent; color: var(--fg); font: inherit; outline: none; min-height: 40px; max-height: 140px; }
  .box textarea::placeholder { color: var(--muted); }
  .tools { display: flex; align-items: center; gap: 2px; }
  .tools .hint { margin-left: auto; margin-right: 6px; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .send { width: 32px; height: 32px; padding: 0; border-radius: var(--r-sm); border: 0; background: var(--accent-fill); color: var(--on-accent); display: grid; place-items: center; cursor: pointer; flex: none; }
  .send:disabled { opacity: .5; cursor: default; }
  /* Une ligne, même à 320 px : le détail (réglages dans des plages sûres) est dans l'aide. */
  .disclaimer { margin: 0; display: flex; justify-content: center; align-items: baseline; gap: var(--s1); font-size: var(--fs-xs); line-height: 1.35; color: var(--muted); white-space: nowrap; min-width: 0; }
  .disclaimer span { overflow: hidden; text-overflow: ellipsis; }
  .disclaimer .link { font-size: var(--fs-xs); min-height: 0; flex: none; }

  /* Premiers pas : carte du parcours, puce « Tu regardes », fiche d'un réglage */
  .project { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); margin-bottom: var(--s3); }
  .project-title { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .project-row { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding: 4px 0; border-bottom: 1px solid var(--border); }
  .project-row:last-of-type { border-bottom: 0; }
  .project-row.current .project-label { font-weight: 600; }
  .project-label { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .project-missing { color: var(--warn-text); font-style: italic; }
  .project-ok { color: var(--accent-text); font-size: var(--fs-sm); margin-left: var(--s1); }
  .project-body { display: flex; flex-direction: column; gap: var(--s2); padding-top: var(--s1); }
  .project-body p, .project-hint { margin: 0; }
  .project-error { color: var(--danger-text); margin: 0; }
  .project-spool { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s1); }
  .spool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--border); margin-right: 6px; vertical-align: -2px; flex: none; }
  .canvas-row { display: flex; align-items: center; gap: var(--s2); }
  .canvas-colour { min-width: 5.5em; }
  .canvas-select { flex: 1; min-width: 0; }
  .project-temps { padding-left: 20px; }
  .tour { border: 1px solid var(--accent); border-radius: var(--r-md); background: var(--accent-soft); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
  .tour .step { font-size: var(--fs-xs); font-weight: 600; color: var(--accent-text); text-transform: uppercase; letter-spacing: .04em; }
  .tour h3 { margin: 0; font-size: var(--fs-lg); font-weight: 600; }
  .tour p { margin: 0; }
  .tour .where { color: var(--muted); font-size: var(--fs-sm); display: flex; gap: 6px; }
  .tour .where:empty { display: none; }
  .tour .bottom { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
  .focus-chip { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface); font-size: var(--fs-sm); align-self: flex-start; max-width: 100%; }
  .focus-chip b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .focus-chip > span { white-space: nowrap; }
  .focus-chip .go { border: 0; background: none; color: var(--accent-text); cursor: pointer; font: inherit; font-weight: 600; padding: 0; white-space: nowrap; }
  .focus-chip .x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; display: grid; place-items: center; }
  .fiche h4 { margin: var(--s1) 0 0; font-size: var(--fs-sm); color: var(--muted); font-weight: 600; }
  .fiche .value { font-variant-numeric: tabular-nums; }

  /* Volets : réglages lus, conversations, utilisation, aide */
  .drawer { position: absolute; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; }
  .drawer .list { flex: 1; overflow-y: auto; padding: var(--s3) var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
  .drawer table { width: 100%; border-collapse: collapse; }
  .drawer td { padding: var(--s2) 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  .drawer td.value { text-align: right; white-space: nowrap; padding-left: var(--s3); font-variant-numeric: tabular-nums; }
  .drawer .key { display: block; color: var(--muted); font-size: var(--fs-xs); }
  .drawer h3 { margin: var(--s2) 0 0; font-size: var(--fs-md); font-weight: 600; }
  .drawer p { margin: 0; }
  .conv-list { display: flex; flex-direction: column; gap: var(--s2); }
  .printer-row { display: flex; align-items: center; gap: var(--s3); color: var(--accent-text); }
  .printer-info { display: flex; flex-direction: column; color: var(--fg); min-width: 0; flex: 1; }
  .printer-status { display: flex; flex-direction: column; gap: var(--s2); border-top: 1px solid var(--border); padding-top: var(--s2); }
  .printer-step { display: flex; gap: var(--s2); align-items: flex-start; margin: 0; }
  .printer-step .ic { margin-top: 3px; }
  .printer-step .rich p { margin: 0; }
  .printer-step.ok .ic { color: var(--accent-text); }
  .printer-step.warn .ic { color: var(--warn-text); }
  .printer-step.error .ic { color: var(--danger-text); }
  .printer-actions { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .setup-found { padding: var(--s2) 0; border-top: 1px solid var(--border); }
  .setup-checks { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: var(--s1); }
  .setup-checks .rich p { margin: 0; }
  .setup-search { min-height: 36px; }
  .setup-results { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .temp-row { display: flex; gap: var(--s2); }
  .temp-field { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .temp-field .field { min-height: 32px; }
  .conv-item { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) 10px; border: 1px solid var(--border); border-radius: var(--r-sm); }
  .conv-item.current { border-color: var(--accent); }
  .conv-item button.open { flex: 1; border: 0; background: none; text-align: left; cursor: pointer; padding: 0; min-width: 0; }
  .conv-item .t { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item .d { display: block; color: var(--muted); font-size: var(--fs-xs); }
  .empty-state { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s2); padding: var(--s4); border: 1px dashed var(--border); border-radius: var(--r-md); }
  .empty-state > .ic { color: var(--accent-text); }
  .empty-state b { font-size: var(--fs-md); }
  .empty-state p { margin: 0; }
  .gauge-big { display: flex; flex-direction: column; gap: var(--s2); }
  .gauge-big .bar { width: 100%; height: 8px; }
  .gauge-big .pct { font-size: var(--fs-xl); font-weight: 700; font-variant-numeric: tabular-nums; }
  .plans { display: flex; flex-direction: column; gap: var(--s2); }
  .plan { display: flex; flex-direction: column; gap: var(--s1); padding: var(--s3); border: 1px solid var(--border); border-radius: var(--r-md); }
  .plan.current { border-color: var(--accent); background: var(--accent-soft); }
  .plan .head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); font-weight: 600; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .check-line { display: flex; gap: var(--s2); align-items: flex-start; font-size: var(--fs-sm); color: var(--muted); cursor: pointer; }
  .check-line input { margin: 3px 0 0; flex: none; }
  .fail-text { margin: 0; color: var(--danger-text); font-size: var(--fs-sm); }
</style>
</head>

  <div class="top">
    <h1>Assistant Plyo</h1>

      <div class="group" role="presentation">Conversation</div>
      <button type="button" id="m-new" role="menuitem" data-icon="plus">Nouvelle conversation</button>

      <button type="button" id="m-intent" role="menuitem" data-icon="help" class="hidden">Reposer les questions sur ma pièce</button>
      <button type="button" id="m-level" role="menuitem" data-icon="chat">Mes explications : détaillées</button>
      <button type="button" id="m-undo" role="menuitem" data-icon="undo" disabled title="Rien à annuler pour l’instant">Annuler les derniers réglages appliqués</button>
      <hr id="m-account-sep">
      <div class="group" role="presentation">Compte</div>
      <div class="who" id="m-email"></div>
      <button type="button" id="m-usage" role="menuitem" data-icon="bars">Mon utilisation</button>
      <button type="button" id="m-logout" role="menuitem" data-icon="logout">Me déconnecter</button>
      <button type="button" id="m-login" role="menuitem" data-icon="login">Me connecter</button>

<script>
(function () {
  // Adresse du service Plyo, donnée par le slicer (Plyo::Config, variable d'environnement PLYO_API_URL en développement).
  var PLYO_API_URL = window.PLYO_API_URL;
  var MAX_SIDE = 1600;
  var THUMB_SIDE = 160;
  var MAX_PHOTOS = 6;
  var MAX_HISTORY = 10;
  var IDLE_TIMEOUT_MS = 60000;    // rien reçu depuis une minute : la demande est abandonnée
  var ANSWER_MAX_MS = 240000;     // plafond d'une réponse, même si elle arrive encore
  // « Mon utilisation » : le paiement n'est pas branché. On montre la formule en cours et un seul encart
  // « les formules arrivent », sans boutons factices.
  var PLAN_TEXT = { gratuit: 'Pour découvrir l’assistant : une jauge qui se recharge chaque mois.',
    plus: 'Pour imprimer chaque semaine et demander de l’aide sans compter.',
    pro: 'Pour un usage intensif ou professionnel : une jauge beaucoup plus grande.' };
  var NOTICE_KEY = 'plyo.gaugeNotice';

  var $ = function (id) { return document.getElementById(id); };
  var Logic = window.PlyoLogic, FS = window.PlyoFirstSteps, fr = Logic.fr;
  // Chaque modification (apply, commands) part avec le projet de la conversation : le slicer la refuse si la fiche est
  // incomplète ou si Orca n'est plus sur l'imprimante et le filament du projet (PlyoAssistant.cpp, project_refusal).
  (function () {
    var host = window.orca, raw = host && host.postMessage ? host.postMessage.bind(host) : null;
    if (!raw) return;
    host.postMessage = function (m) {
      if (m && (m.type === 'apply' || m.type === 'commands') && !m.project) m.project = conv ? conv.project : null;
      raw(m);
    };
  })();
  var bodyEl = $('body'), thread = $('thread'), home = $('home');
  var noteInput = $('note'), sendButton = $('btn-send'), fileInput = $('file-input'), attachedEl = $('attached');
  var menu = $('menu');

  var session = null;        // { access_token, refresh_token, expires_at, email }, conservée par le slicer
  var lastValues = null;     // dernier message « values » du slicer (réglages, contexte, langue)
  var lastGauge = null;      // dernière jauge reçue du service ({ plan, used_pct, resets_at, extra_pct, state })
  var attachments = [];      // [{ media_type, data, preview }]
  var busy = false;
  var pendingSheet = null;   // fiche dont on attend le résultat d'application ou d'annulation
  var undoneListeners = {};  // identifiant d'un lot appliqué → fiche à prévenir s'il est annulé (même depuis le menu)
  var phoneLink = null;      // lien téléphone de la conversation : { id, qr_svg }
  var phoneTimer = null;
  var phoneCreating = null;  // création du lien en cours (évite deux liens sur un double clic)
  var phoneCollecting = false;
  var phoneQueue = [];       // envois du téléphone récupérés, en attente que l'assistant soit libre
  var PHONE_POLL_MS = 3000;

  var conv = null;           // { id, title, updated, entries: [...], history: [...] }

  // ---------- Fiche « Mon projet » : imprimante, filament (buse et plateau), pièce ----------

  // Seulement pour une CC2 reliée (liste des machines du slicer) : les autres imprimantes gardent la liste des filaments.

  }
  function canvasMode(step) {
    if (!canvasWanted(step) || canvasUI.useList) return null;

  }

    canvasUI.mapping = null;

    }
    return out;
  }
  function applyCanvas(mapping) {
    var trays = PlyoCanvas.trays(canvasUI.state), entries = [], full = [];
    mapping.forEach(function (m) {
      var tray = trays.filter(function (t) { return t.tray_id === m.tray_id && t.canvas_id === m.canvas_id; })[0];
      if (!tray) return;
      entries.push({ t: m.t, type: tray.type, color: tray.color });
      full.push({ t: m.t, canvas_id: tray.canvas_id, tray_id: tray.tray_id, type: tray.type, color: tray.color });
    });
    if (!entries.length || entries.length !== mapping.length) { canvasUI.error = 'Choisis un emplacement pour chaque couleur.'; renderProject(); return; }
    canvasUI.error = '';

  function onCanvasApplied(msg) {

    var presets = {};
    (msg.presets || []).forEach(function (p) { presets[p.t] = p.preset; });

  // ---------- Compte : session, solde, connexion ----------
  function postJson(path, body) {
    return fetch(PLYO_API_URL + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }

  // Appel authentifié : sur un 401, un seul renouvellement de session puis une nouvelle tentative.
  // Seul un refus du renouvellement (401) renvoie le 401 d'origine, qui déconnecte ; une panne (503)
  // renvoie la réponse du renouvellement, et la session est gardée.
  function apiFetch(path, init) {
    function attempt() {
      var headers = Object.assign({}, init.headers || {}, { Authorization: 'Bearer ' + (session ? session.access_token : '') });
      return fetch(PLYO_API_URL + path, Object.assign({}, init, { headers: headers }));
    }
    return attempt().then(function (response) {
      if (response.status !== 401 || !session) return response;
      return postJson('/api/auth/refresh', { refresh_token: session.refresh_token }).then(function (r) {
        if (r.status === 401) return response;
        if (!r.ok) return r;
        return r.json().then(function (fresh) {
          session = fresh;
          window.orca.postMessage({ type: 'session_save', session: fresh });
          return attempt();
        });
      });
    });
  }

  function paintGauge(root, fill, v) {

  // quiet : l'erreur « jauge pleine » vient d'être affichée, le message doux ferait doublon.
  var gaugeState = null;       // état de la jauge vu juste avant (passage d'un seuil)
  var noticeShown = null;      // repli en mémoire si le stockage du panneau est indisponible
  function setGauge(g, quiet) {
    var v = Logic.gaugeView(g);
    if (!v) return;
    lastGauge = g;
    var prev = gaugeState;
    gaugeState = v.state;
    $('gauge-label').textContent = fr(v.label);
    $('gauge').title = fr('Jauge IA : ' + v.label + ' utilisés ce mois-ci. Elle se recharge ' + v.resets + '. Clique pour le détail.');
    $('gauge').setAttribute('aria-label', fr('Jauge IA du mois : ' + v.label + ' utilisés'));
    paintGauge($('gauge'), $('gauge-fill'), v);
    // Après la réponse qui a rempli la jauge, pas avant : la réponse s'affiche dans la même tâche.
    if (quiet) { noticeShown = Logic.noticeKey(v.state, g); try { localStorage.setItem(NOTICE_KEY, noticeShown); } catch (e) { /* stockage indisponible */ } return; }
    setTimeout(function () { gaugeNotice(g, v, prev); }, 0);
  }

  // Message doux vers 80 %, puis quand la jauge est pleine : une seule fois par mois (mémorisé sur cet ordinateur).
  function gaugeNotice(g, v, prev) {
    var last = noticeShown;
    try { last = localStorage.getItem(NOTICE_KEY) || last; } catch (e) { /* stockage indisponible : la mémoire suffit */ }
    var kind = Logic.gaugeNotice(g, last, prev);
    if (!kind || !thread.children.length) return;
    noticeShown = Logic.noticeKey(kind, g);
    try { localStorage.setItem(NOTICE_KEY, noticeShown); } catch (e) { /* idem */ }
    var box = kind === 'low'
      ? alertBox('warn', 'Tu as utilisé **' + v.label + '** de ta jauge ce mois-ci. Elle se recharge ' + v.resets + '.')
      : alertBox('warn', 'Ta jauge du mois est pleine. Elle se recharge ' + v.resets + '.');
    var acts = el('div', 'row-acts');
    acts.appendChild(button('Voir mon utilisation', openUsage, 'btn ghost sm'));
    box.body.appendChild(acts);
    thread.appendChild(box);
    scrollDown();
  }

    if (!msg.ok) { linkStep('Je ne peux pas relier cette imprimante.', 'error', 'alert'); return; }
    if (msg.linked) { linkStep('Déjà reliée à ton profil « ' + msg.current + ' ».', 'ok', 'check'); return; }
    if (msg.matches) { testLink(); return; }
    var candidates = Array.isArray(msg.candidates) ? msg.candidates : [];
    var box = linkStep('Ton profil actuel est « ' + msg.current + ' », mais l’imprimante trouvée est **' + name + '**. ' +
      (candidates.length ? 'Choisis le profil qui lui correspond :' : 'Je n’ai pas encore son profil : ajoute-la dans la liste des imprimantes, puis reviens ici.'), 'warn', 'alert');
    var acts = el('div', 'printer-actions');
    candidates.forEach(function (c) {
      acts.appendChild(button('Utiliser « ' + c + ' »', function () {
        linkStep('Je change de profil…', '', 'search');
        window.orca.postMessage({ type: 'printer_select_profile', name: c });
      }, 'btn ghost sm'));
    });
    if (!candidates.length) acts.appendChild(button('Ajouter mon imprimante', function () { window.orca.postMessage({ type: 'printer_wizard' }); }, 'btn sm', 'plus'));
    box.appendChild(acts);
  }
  function onProfileSelected(msg) {
    if (!link) return;
    if (!msg.ok) { linkStep('Je n’ai pas pu changer de profil. Choisis-le à la main sous « Imprimante », puis réessaie.', 'error', 'alert'); return; }
    startLink(link.printer, link.box);
  }
  function testLink() {
    linkStep('Je teste la connexion avec ' + (link.printer.name || 'ton imprimante') + '…', '', 'wifi');
    window.orca.postMessage({ type: 'printer_link_test', printer: link.printer, access_code: link.code || '' });
  }
  // Ce qu'il faut faire quand le test échoue, selon le type de connexion.
  var LINK_HELP = {
    octoprint: 'OctoPrint demande une **clé API** : dans OctoPrint, ouvre Paramètres, puis Clé API, et copie-la dans la fenêtre « Connexion ».',
    flashforge: 'Flashforge demande le **numéro de série** et le **code de vérification** : tu les trouves sur l’écran de l’imprimante, dans Réglages, puis Réseau.',
    elegoolink: 'Vérifie que le mode réseau local est activé sur l’écran de l’imprimante.'
  };
  // L'imprimante répond mais refuse : elle demande son code d'accès (affiché sur son écran). Gardé le temps du test et de
  // l'enregistrement, puis rangé dans le profil d'imprimante par le slicer.
  function askAccessCode(wrong) {
    var name = link.printer.name || 'ton imprimante';
    var box = linkStep((wrong ? 'Ce code d’accès est refusé par **' + name + '**. Vérifie-le sur son écran et réessaie.' :
      '**' + name + '** est joignable, mais elle demande son **code d’accès**. Tu le trouves sur son écran, dans les réglages réseau.'), 'warn', 'alert');
    var input = el('input', 'field');
    input.type = 'password';
    input.maxLength = 64;
    input.autocomplete = 'off';
    input.placeholder = 'Code d’accès de l’imprimante';
    input.setAttribute('aria-label', 'Code d’accès de l’imprimante');
    function submit() {
      var code = input.value.trim();
      if (!code) { input.focus(); return; }
      link.code = code;
      testLink();
    }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    box.appendChild(input);
    var acts = el('div', 'printer-actions');
    acts.appendChild(button('Tester avec ce code', submit, 'btn sm', 'wifi'));
    box.appendChild(acts);
    setTimeout(function () { input.focus(); }, 0);
  }
  function onLinkTested(msg) {
    if (!link) return;
    if (msg.ok) {
      var okBox = linkStep('La connexion fonctionne. Enregistre-la dans ton profil d’imprimante pour envoyer tes impressions directement.', 'ok', 'check');
      var webui = typeof msg.webui === 'string' ? msg.webui : '';
      okBox.appendChild(button('Enregistrer la connexion', function () {
        linkStep('J’enregistre…', '', 'search');
        window.orca.postMessage({ type: 'printer_link_save', printer: link.printer, webui: webui, access_code: link.code || '' });
      }, 'btn sm', 'check'));
      return;
    }
    if (msg.auth) { askAccessCode(!!link.code); return; }
    var box = linkStep('Je n’arrive pas à joindre ' + (link.printer.name || 'l’imprimante') + '. ' +
      (LINK_HELP[link.printer.host_type] || 'Vérifie qu’elle est allumée et sur le même Wi-Fi, puis réessaie.'), 'error', 'alert');
    if (msg.message) box.appendChild(el('p', 'muted small', msg.message));
    var acts = el('div', 'printer-actions');
    acts.appendChild(button('Réessayer', testLink, 'btn sm'));
    acts.appendChild(button('Ouvrir la fenêtre Connexion', function () { window.orca.postMessage({ type: 'printer_link_dialog', printer: link.printer }); }, 'btn ghost sm'));
    box.appendChild(acts);
  }
  function onLinkSaved(msg) {
    if (!link) return;
    if (msg.ok) {
      linkStep('C’est relié ! Ton profil d’imprimante s’appelle maintenant « ' + msg.profile + ' ». `Imprimer la plaque` enverra tes impressions directement à ' + (link.printer.name || 'ton imprimante') + '.', 'ok', 'check');
      if (link.onDone) link.onDone();
    }
    else linkStep('Je n’ai pas pu enregistrer la connexion. Réessaie, ou ouvre la fenêtre « Connexion » depuis le bouton Wi-Fi à côté de « Imprimante ».', 'error', 'alert');
  }
  function onLinkDialogClosed(msg) {
    if (!link) return;
    if (msg.saved) {
      linkStep('C’est relié ! `Imprimer la plaque` enverra maintenant tes impressions directement à ' + (link.printer.name || 'ton imprimante') + '.', 'ok', 'check');
      if (link.onDone) link.onDone();
    } else {
      var box = linkStep('Rien n’a été enregistré. Tu peux recommencer quand tu veux.', '', 'info');
      box.appendChild(button('Relier', function () { startLink(link.printer, link.box); }, 'btn sm'));
    }
  }

  // ---------- Configurer l'imprimante (remplace l'assistant de configuration d'Orca) ----------
  // Recherche sur le réseau, « C'est la tienne ? », installation du profil, puis liaison. Sans Wi-Fi : recherche
  // dans le catalogue des imprimantes fournies. Les adresses restent dans ce panneau, jamais envoyées au service.
  var setup = { phase: null, offered: false, printers: [], catalog: null, query: '', pick: null, found: null };
  function startSetup() {
    projectUI.adopt = true;
    setup = { phase: 'scan', offered: true, printers: [], catalog: setup.catalog, query: '', pick: null, found: null, retried: false };
    window.orca.postMessage({ type: 'printer_scan' });
  }
  function setupPhase(phase) { setup.phase = phase; renderSetupFlow(); }
  function endSetup() {
    setup.phase = null;
    renderSetupFlow();
    // Une imprimante vient d'être installée et sélectionnée dans Orca : elle devient celle du projet.
    if (projectUI.adopt && setup.preset) { window.orca.postMessage({ type: 'project_state' }); window.orca.postMessage({ type: 'project_printers' }); }
  }
  function onSetupScan(printers) {
    // La première recherche tombe souvent pendant la demande d'autorisation (réseau local sur macOS, pare-feu sur
    // Windows) et ne voit rien : on relance une fois tout seul avant d'annoncer « aucune imprimante ».
    if (!printers.length && !setup.retried) { setup.retried = true; window.orca.postMessage({ type: 'printer_scan' }); return; }
    setup.printers = printers;
    // Rien trouvé : on demande directement le modèle (pas de carte d'échec d'entrée) ; l'aide Wi-Fi reste à un clic.
    if (printers.length) setupPhase('found'); else { setup.noneFound = true; openSearch(); }
  }
  function onSetupCatalog(catalog) { setup.catalog = catalog; if (setup.phase === 'search') renderSetupFlow(); }
  function openSearch() {
    if (!setup.catalog) window.orca.postMessage({ type: 'setup_catalog' });
    setupPhase('search');
  }
  // Choix d'un modèle (trouvé ou cherché) : la buse 0,4 mm (livrée avec presque toutes les imprimantes) d'office.
  function chooseModel(match, printer) {
    setup.pick = match;
    setup.found = printer || null;
    setup.linkBox = null;
    var nozzles = match.nozzles || [];
    if (nozzles.length === 1 || nozzles.indexOf('0.4') >= 0) installModel(nozzles.indexOf('0.4') >= 0 ? '0.4' : nozzles[0]);
    else setupPhase('nozzle');
  }
  function installModel(nozzle) {
    setup.nozzle = nozzle;
    setupPhase('installing');
    window.orca.postMessage({ type: 'setup_install', vendor: setup.pick.vendor, model: setup.pick.model, nozzle: nozzle });
  }
  function onSetupInstalled(msg) {
    if (msg.cancelled) { setupPhase(setup.found ? 'found' : 'search'); return; }
    if (!msg.ok) { setup.error = true; setupPhase(setup.found ? 'found' : 'search'); return; }
    setup.error = false;
    setup.preset = msg.preset;
    window.orca.postMessage({ type: 'get_values' });
    setupPhase(setup.found ? 'link' : 'done');
  }
  function searchMatches(catalog, query) {
    var words = String(query || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[\s\-_]+/).filter(Boolean);
    if (!words.length) return [];
    return catalog.filter(function (m) {
      var hay = (m.vendor + ' ' + m.model).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\-_]+/g, ' ');
      return words.every(function (w) { return hay.indexOf(w) >= 0; });
    }).slice(0, 8);
  }
  function renderSetup(slot) {
    var box = el('div', 'tour setup');
    box.appendChild(el('div', 'step', 'Ton imprimante'));
    var acts = el('div', 'row-acts');
    var later = button('Plus tard', endSetup, 'link');
    if (setup.phase === 'scan') {
      box.appendChild(el('h3', '', 'Je cherche ton imprimante…'));
      box.appendChild(el('p', '', 'Allume-la si ce n’est pas déjà fait : je regarde sur le Wi-Fi de ta maison. Ça prend une dizaine de secondes.'));
      acts.appendChild(button('Je préfère la choisir dans la liste', openSearch, 'btn ghost sm', 'search'));
    } else if (setup.phase === 'found') {
      var known = setup.printers.filter(function (p) { return p.match; });
      box.appendChild(el('h3', '', known.length === 1 ? 'J’ai trouvé une imprimante' : 'J’ai trouvé des imprimantes'));
      if (setup.error) box.appendChild(alertBox('error', 'Je n’ai pas pu installer ce profil. Réessaie, ou choisis ton imprimante dans la liste.'));
      setup.printers.forEach(function (p) {
        var row = el('div', 'printer-row setup-found');
        row.appendChild(icon('wifi', 16));
        var info = el('div', 'printer-info');
        info.appendChild(el('b', '', p.match ? p.match.model : (p.name || 'Imprimante')));
        info.appendChild(el('span', 'muted small', p.ip + (p.match ? '' : ' · modèle inconnu')));
        row.appendChild(info);
        if (p.match) row.appendChild(button('C’est la mienne', function () { chooseModel(p.match, p); }, 'btn sm'));
        else row.appendChild(button('Choisir son modèle', function () { setup.found = p; openSearch(); }, 'btn ghost sm'));
        box.appendChild(row);
      });
      acts.appendChild(button('Ce n’est pas la mienne', openSearch, 'btn ghost sm', 'search'));
    } else if (setup.phase === 'none') {
      box.appendChild(el('h3', '', 'Elle est en Wi-Fi mais je ne la vois pas'));
      box.appendChild(el('p', '', 'Trois choses à vérifier :'));
      var list = el('ol', 'setup-checks');
      ['Elle est **allumée**, avec son écran actif.',
       'Elle est **connectée au Wi-Fi** : sur son écran, va dans Réglages, puis Réseau ou Wi-Fi, choisis ta box et entre le **mot de passe du Wi-Fi** (souvent écrit sous la box ou sur une étiquette).',
       'Elle est sur **le même Wi-Fi que cet ordinateur** (pas le Wi-Fi « invités » de la box).'].forEach(function (t) {
        var li = el('li'); li.appendChild(rich(t)); list.appendChild(li);
      });
      box.appendChild(list);
      box.appendChild(el('p', 'muted small', 'Beaucoup d’imprimantes n’ont pas de Wi-Fi : ce n’est pas grave, on passera par la clé USB ou la carte SD.'));
      acts.appendChild(button('Chercher encore', function () { startSetup(); renderSetupFlow(); }, 'btn sm', 'search'));
      acts.appendChild(button('La choisir dans la liste', openSearch, 'btn ghost sm'));
    } else if (setup.phase === 'search') {
      box.appendChild(el('h3', '', 'Quelle imprimante as-tu ?'));
      box.appendChild(el('p', '', 'Son nom est écrit dessus, souvent à l’avant : par exemple « Ender 3 V3 », « K1C » ou « A1 mini ».'));
      if (setup.error) box.appendChild(alertBox('error', 'Je n’ai pas pu installer ce profil. Réessaie ou choisis-en un autre.'));
      var input = el('input', 'field setup-search');
      input.type = 'search';
      input.placeholder = 'Tape le nom de ton imprimante';
      input.setAttribute('aria-label', 'Nom de ton imprimante');
      input.value = setup.query;
      var results = el('div', 'setup-results');
      function refresh() {
        setup.query = input.value;
        results.textContent = '';
        if (!setup.catalog) { results.appendChild(el('p', 'muted small', 'Chargement de la liste…')); return; }
        var found = searchMatches(setup.catalog, setup.query);
        if (setup.query && !found.length) results.appendChild(el('p', 'muted small', 'Aucune imprimante ne correspond. Essaie avec moins de mots, par exemple juste « Ender ».'));
        found.forEach(function (m) { results.appendChild(button(m.model, function () { chooseModel(m, setup.found); }, 'btn ghost sm setup-pick')); });
      }
      input.addEventListener('input', refresh);
      box.appendChild(input);
      box.appendChild(results);
      if (setup.noneFound) box.appendChild(button('Elle est en Wi-Fi mais je ne la vois pas', function () { setupPhase('none'); }, 'link'));
      refresh();
      setTimeout(function () { input.focus(); }, 0);
      acts.appendChild(button('Chercher sur le Wi-Fi', function () { startSetup(); renderSetupFlow(); }, 'btn ghost sm', 'wifi'));
    } else if (setup.phase === 'nozzle') {
      box.appendChild(el('h3', '', 'Quelle taille de buse ?'));
      box.appendChild(el('p', '', 'Si tu ne sais pas, garde celle livrée avec l’imprimante. Tu pourras la changer plus tard.'));
      (setup.pick.nozzles || []).forEach(function (n) { acts.appendChild(button(n.replace('.', ',') + ' mm', function () { installModel(n); }, 'btn ghost sm')); });
    } else if (setup.phase === 'installing') {
      box.appendChild(el('h3', '', 'J’installe ' + setup.pick.model + '…'));
      box.appendChild(el('p', '', 'Profil de l’imprimante, qualités d’impression et filaments conseillés.'));
      later = null;
    } else if (setup.phase === 'link') {
      box.appendChild(el('h3', '', setup.pick.model + ' est installée'));
      box.appendChild(el('p', '', 'Dernière étape : je la relie pour que tes impressions partent directement dessus.'));
      // La liaison écrit dans son propre bloc : gardé d'un affichage à l'autre, et lancée une seule fois.
      if (!setup.linkBox) {
        setup.linkBox = el('div', 'printer-status');
        startLink(setup.found, setup.linkBox, function () { setup.phase = 'done'; setTimeout(renderSetupFlow, 1500); });
      }
      box.appendChild(setup.linkBox);
      later = button('Passer cette étape', function () { setupPhase('done'); }, 'link');
    } else if (setup.phase === 'done') {
      box.appendChild(el('h3', '', 'Ton imprimante est prête'));
      box.appendChild(el('p', '', setup.found ? 'Elle est installée et reliée : `Imprimer la plaque` lui enverra tes impressions.' :
        'Elle est installée. Pour imprimer : `Exporter le fichier G-code`, puis copie-le sur la clé USB ou la carte SD de ton imprimante.'));
      acts.appendChild(button('Continuer', endSetup, 'btn sm', 'check'));
      later = null;
    }
    if (acts.children.length) box.appendChild(acts);
    if (later) { var foot = el('div', 'row-acts'); foot.appendChild(later); box.appendChild(foot); }
    slot.appendChild(box);
  }

  // ---------- Journal des pièces ----------
  var journalTarget = null;
  function openJournal() {
    openDrawer('Mes pièces', function (body) {
      body.appendChild(el('p', 'muted', 'Les pièces que tu as traitées avec l’assistant : le problème vu, les réglages appliqués et le résultat. Tout reste sur cet ordinateur.'));
      var list = el('div', 'journal-list');
      list.appendChild(el('p', 'muted', 'Chargement…'));
      body.appendChild(list);
      journalTarget = list;
      window.orca.postMessage({ type: 'journal_list' });
    });
  }
  function fillJournal(events) {
    if (!journalTarget || $('drawer').classList.contains('hidden')) return;
    var list = journalTarget;
    list.textContent = '';
    var groups = Logic.journalGroups(events);
    if (!groups.length) {
      list.appendChild(emptyState('cube', 'Pas encore de pièce', 'Pose une question à l’assistant avec une pièce sur le plateau : elle apparaîtra ici, avec les réglages essayés et le résultat.',
        'Poser une question', function () { closeDrawer(); noteInput.focus(); }));
      return;
    }
    var here = lastValues && lastValues.context;
    groups.forEach(function (g) {
      var card = el('div', 'card journal-part');
      card.appendChild(el('h4', '', g.part));
      g.events.forEach(function (e) {
        var row = el('div', 'journal-event');
        // Sans photo, une vignette neutre avec l'icône de pièce plutôt qu'un carré gris vide.
        if (e.thumb) { var img = el('img', 'thumb'); img.src = e.thumb; img.alt = ''; row.appendChild(img); }
        else { var ph = el('span', 'thumb placeholder'); ph.appendChild(icon('cube', 20)); row.appendChild(ph); }
        var col = el('div', 'journal-body');
        var top = el('div', 'journal-top');
        top.appendChild(el('span', 'meta', [dayOf(e.at), Logic.shortMachine(e.printer, e.filament)].filter(Boolean).join(' · ')));
        var st = Logic.journalStatus(e);
        top.appendChild(el('span', 'badge-pill' + (st.tone ? ' ' + st.tone : ''), st.label));
        col.appendChild(top);
        col.appendChild(el('p', 'problem', e.problem || 'Question à l’assistant'));
        var q = Logic.outcomeQuestion(e, function (id) { var p = paramOf(id); return p.label === id ? null : p; });
        if (q.changes.length) {
          var ul = el('ul', 'meta');
          q.changes.forEach(function (c) { ul.appendChild(el('li', '', c)); });
          col.appendChild(ul);
        }
        if (e.note) col.appendChild(el('p', 'meta', 'Ton mot : « ' + e.note + ' »'));
        var acts = el('div', 'row-acts');
        var reopen = button('Conversation', function () { closeDrawer(); openConversation(e.conv); }, 'btn ghost sm', 'chat');
        reopen.title = fr('Rouvrir la conversation');
        acts.appendChild(reopen);
        var again = Logic.reapplyChanges(e, here);
        if (again) {
          var re = button('Réappliquer', function () {
            re.disabled = true;
            pendingSheet = { kind: 'apply', onResult: function (ok, text) {
              noteLine(ok ? 'Réglages de « ' + g.part + ' » réappliqués.' : text, ok ? 'ok' : 'error', ok ? 'check' : 'alert');
              if (ok) closeDrawer(); else re.disabled = false;
            } };
            window.orca.postMessage({ type: 'apply', changes: again, why: 'Journal : ' + g.part });
          }, 'btn ghost sm', 'wand');
          re.title = fr('Remettre ces réglages sur ton profil actuel');
          acts.appendChild(re);
        }
        if (!again && e.changes && e.changes.length && e.outcome !== 'bad')
          col.appendChild(el('p', 'meta', 'Trouvés pour une autre imprimante ou un autre filament : pas réappliqués ici.'));
        row.appendChild(col);
        row.appendChild(acts); // sur toute la largeur : les deux boutons tiennent sur une ligne à 320 px
        card.appendChild(row);
      });
      list.appendChild(card);
    });
  }

      function show(g) {

  // ---------- Réglages lus par le slicer ----------
  function formatValue(value, unit) {
    if (value === null || value === undefined) return '—';
    if (typeof value === 'boolean') return value ? 'Oui' : 'Non';
    if (typeof value === 'string') return Logic.choiceLabel(value);
    return (Math.round(value * 1000) / 1000).toLocaleString('fr-FR') + (unit ? ' ' + unit : '');
  }

  function renderValues(msg) {

  function paramOf(id) {

  }

  // ---------- Photos : réduites à 1 600 px, JPEG 85 % (vignette de 160 px gardée dans la conversation) ----------
  // La vue web peut signaler l'image chargée avant de l'avoir décodée : le dessin reste alors vide, et un canevas
  // vide exporté en JPEG donne une image noire. On attend donc le décodage, on peint un fond blanc, et on vérifie
  // que l'image a bien été dessinée (un second essai, puis abandon plutôt qu'une photo noire).
  function drawn(ctx, w, h) {
    var px = ctx.getImageData(0, 0, w, h).data;
    var step = Math.max(4, Math.floor(px.length / 4 / 400) * 4);
    for (var i = 0; i < px.length; i += step) if (px[i] < 250 || px[i + 1] < 250 || px[i + 2] < 250) return true;
    return false;
  }
  function scaled(src, side, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      function render(retry) {
        var scale = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        if (drawn(ctx, canvas.width, canvas.height)) return resolve(canvas.toDataURL('image/jpeg', quality));
        if (retry) return setTimeout(function () { render(false); }, 150);
        reject(new Error('blank'));
      }
      img.onload = function () {
        var ready = img.decode ? img.decode().catch(function () {}) : Promise.resolve();
        ready.then(function () { render(true); });
      };
      img.onerror = function () { reject(new Error('unreadable')); };
      img.src = src;
    });
  }
  function downscale(file) {
    var url = URL.createObjectURL(file);
    return scaled(url, MAX_SIDE, 0.85).then(function (dataUrl) {
      URL.revokeObjectURL(url);
      return { media_type: 'image/jpeg', data: dataUrl.split(',')[1], preview: dataUrl };
    }, function (e) { URL.revokeObjectURL(url); throw e; });
  }

  function addAttachments(list) {
    list.forEach(function (a) { if (attachments.length < MAX_PHOTOS) attachments.push(a); });
    if (attachments.length >= MAX_PHOTOS) noteLine(MAX_PHOTOS + ' photos au plus par demande.', '', 'info');
    renderAttachments();
  }

  function renderAttachments() {
    attachedEl.textContent = '';
    attachedEl.classList.toggle('hidden', !attachments.length);
    attachments.forEach(function (a, i) {
      var box = el('div', 'att');
      var img = el('img');
      img.src = a.preview;
      img.alt = 'Photo ' + (i + 1);
      var remove = el('button');
      remove.type = 'button';
      remove.title = 'Retirer cette photo';
      remove.setAttribute('aria-label', 'Retirer la photo ' + (i + 1));
      remove.appendChild(icon('x', 10));
      remove.addEventListener('click', function () { attachments.splice(i, 1); renderAttachments(); });
      box.appendChild(img);
      box.appendChild(remove);
      attachedEl.appendChild(box);
    });
  }

  function pickFiles() { fileInput.click(); }
  fileInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(fileInput.files || []);
    fileInput.value = '';
    addFiles(files);
  });

  // Photos → pièces jointes de la demande ; modèles 3D → posés sur le plateau par Plyo (gratuit).
  var MAX_MODEL_BYTES = 150 * 1024 * 1024;
  function addFiles(all) {
    var models = all.filter(function (f) { return FS.isModelFile(f.name); });
    var files = all.filter(function (f) { return !FS.isModelFile(f.name); });
    models.forEach(sendModel);
    if (!files.length) return;
    Promise.all(files.map(function (f) { return downscale(f).catch(function () { return null; }); })).then(function (list) {
      var ok = list.filter(Boolean);
      if (ok.length < list.length) noteLine(FS.unreadableFileText(files.filter(function (f, i) { return !list[i]; })[0].name), 'error', 'alert');
      addAttachments(ok);
      noteInput.focus();
    });
  }

  // Un projet = une pièce, et la pièce vient après l'imprimante et le filament (fiche « Mon projet »).
  function sendModel(file) {
    applyTab('show-guide'); // la pièce se pose et se vérifie dans le Guide
    var step = PlyoProject.nextStep(conv.project);
    var adopted = conv.project.part && conv.project.part.fromPlate;
    if (step === 'printer' && (adopted || !(conv.project.part && conv.project.part.name))) { // la machine d'abord : l'adaptation d'un 3MF en dépend
      // Le fichier déposé est prioritaire sur ce qui traîne sur le plateau : l'ancienne pièce est signalée à l'import.
      if (adopted) conv.project.part = null;
      projectUI.waitingFile = file;
      if (tourSignals && tourSignals.objects > 0) projectUI.newProjectFile = true;
      renderProject();
      noteLine('« ' + file.name + ' » attend : choisis d’abord ton imprimante, je le pose ensuite.', '', 'info', 'guide');
      return;
    }
    var part = conv.project.part && conv.project.part.name;
    if (part && file.name !== part) { offerNewProject(file); return; }
    if (part && !(tourSignals && tourSignals.objects === 0)) { noteLine('« ' + part + ' » est déjà sur le plateau.', '', 'info', 'guide'); return; }
    // La pièce de ce projet n'est plus sur le plateau (relance d'Orca, pièce supprimée) : on la repose, le projet continue.
    projectUI.reposing = !!part;
    importModel(file);
  }
  // Une autre pièce, c'est un autre projet : on propose une nouvelle conversation avec sa propre fiche.
  function offerNewProject(file) {
    var slot = $('project-alert');
    slot.textContent = '';
    var box = alertBox('warn', '« ' + file.name + ' » est une autre pièce que « ' + conv.project.part.name + ' ». Chaque pièce a son propre projet : j’ouvre une nouvelle conversation ?', 'alert');
    var acts = el('div', 'printer-actions');
    acts.appendChild(button('Nouvelle conversation', function () {
      slot.textContent = '';
      if (busy) { blockedWhileBusy(); return; }
      newConversation();
      projectUI.waitingFile = file;
      projectUI.newProjectFile = true;
      projectChanged();
    }, 'btn sm'));
    acts.appendChild(button('Annuler', function () { slot.textContent = ''; }, 'btn ghost sm'));
    box.body.appendChild(acts);
    slot.appendChild(box);
  }
  function dropPlacing() { if (projectUI.placing) { projectUI.placing.remove(); projectUI.placing = null; } }
  function importModel(file) {
    if (file.size > MAX_MODEL_BYTES) { noteLine('« ' + file.name + ' » est trop lourd pour passer par ce panneau (150 Mo au plus). Importe-le plutôt par Fichier › Importer dans Orca : je verrai la pièce arriver.', 'error', 'alert', 'guide'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var data = String(reader.result || '');
      window.orca.postMessage({ type: 'model_add', name: file.name, data: data.slice(data.indexOf(',') + 1), project: conv.project });
    };
    reader.onerror = function () { dropPlacing(); noteLine('« ' + file.name + ' » n’a pas pu être lu.', 'error', 'alert', 'guide'); };
    projectUI.placing = noteLine('Je pose « ' + file.name + ' » sur le plateau…', '', 'cube', 'guide');
    reader.readAsDataURL(file);
  }

  // Glisser-déposer sur le panneau : mêmes règles que le trombone.
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  // Coller une image (capture d'écran, copie d'image) dans le champ de saisie la joint à la demande, comme le glisser-déposer.
  noteInput.addEventListener('paste', function (e) {
    var files = Logic.imageFilesFromClipboard(e.clipboardData && e.clipboardData.items);
    if (!files.length) return; // du texte : le collage normal continue
    e.preventDefault();
    addFiles(files);
  });

  document.addEventListener('drop', function (e) {
    e.preventDefault();
    var files = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []);
    if (files.length) addFiles(files);
  });

  // ---------- Actions sur le plateau et « Montre-moi » ----------
  var plateWaiters = {};     // identifiant de la demande → rappel du résultat
  var plateRequest = 0;
  var plateUndoLinks = [];   // un seul « Annuler » actif : celui de la dernière action
  var plateCounts = {};      // demande → nombre de pièces concernées (singulier ou pluriel du texte affiché)
  function plateAction(kind, after, extra, count) {
    var id = ++plateRequest;
    plateWaiters[id] = after || null;
    plateCounts[id] = count;
    window.orca.postMessage(Object.assign({ type: 'plate_action', kind: kind, request: id }, extra || {}));
  }
  function onPlateAction(msg) {
    var after = plateWaiters[msg.request];
    delete plateWaiters[msg.request];
    var text = Logic.plateText(msg, plateCounts[msg.request]);
    delete plateCounts[msg.request];
    var line = noteLine(text, msg.ok ? 'ok' : 'error', msg.ok ? 'check' : 'alert', 'guide');
    if (msg.ok && msg.kind !== 'undo') plateUndoLinks.forEach(function (b) { b.remove(); });
    if (msg.ok && msg.undo_token !== undefined) {
      var undo = undoButton('Annuler', function (b) {
        plateAction('undo', function (ok) { if (ok) b.remove(); else b.disabled = false; }, { undo_token: msg.undo_token });
      });
      plateUndoLinks = [undo];
      line.appendChild(undo);
    }
    if (msg.kind !== 'undo') record({ kind: 'note', text: text, tone: msg.ok ? 'ok' : 'error', icon: msg.ok ? 'check' : 'alert' });
    if (after) after(msg.ok);
  }
  function showMe(target) { window.orca.postMessage({ type: 'show_me', target: target }); }
  function showSetting(key) { window.orca.postMessage({ type: 'show_setting', key: key }); }
  function onShowSetting(msg) {
    if (!msg.ok) noteLine('Je n’ai pas trouvé ce réglage dans le slicer.', 'error', 'alert');
    else if (msg.hidden) noteLine('J’ai ouvert la bonne page. Si tu ne vois pas le réglage, active le bouton « Avancé » en haut des réglages.', '', 'info');
  }

  // ---------- Ordres exécutés tout de suite (« penche la pièce de 20° ») ----------
  // Le slicer les exécute dès la réponse, en une seule étape annulable ; la conversation garde ce qui a été fait.
  var commandWaiters = {};
  function commandLine(text, tone, iconName) {
    var line = el('div', 'note-line' + (tone ? ' ' + tone : ''));
    line.appendChild(icon(iconName, 14));
    line.appendChild(el('span', 'note-text', text));
    return line;
  }
  function renderCommands(entry, archived) {
    var a = entry.data;
    var wrap = el('div', 'cmds');
    var list = el('div', 'cmds-list');
    wrap.appendChild(list);
    function show(result) {
      list.textContent = '';
      result.done.forEach(function (d) { list.appendChild(commandLine(d, 'ok', 'check')); });
      if (result.text) list.appendChild(commandLine(result.text, 'error', 'alert'));
      result.skipped.forEach(function (t) { if (t) list.appendChild(commandLine(t, '', 'info')); });
      if (result.undone) list.appendChild(commandLine('Annulé : le plateau est revenu comme avant.', '', 'undo'));
    }
    if (entry.commandsResult) show(entry.commandsResult);
    else if (archived) list.appendChild(commandLine('Ces changements n’ont pas été faits sur le plateau.', '', 'info'));
    else {
      list.appendChild(commandLine('Je modifie le plateau…', '', 'wand'));
      var id = ++plateRequest;
      commandWaiters[id] = function (msg) {
        entry.commandsResult = { done: msg.done || [], text: msg.text || '', skipped: msg.skipped || [] };
        if (entry.hist) entry.hist.text = (summaryForHistory(a, entry.commandsResult)).slice(0, 2000);
        scheduleSave();
        show(entry.commandsResult);
        if (msg.undo_token === undefined || !entry.commandsResult.done.length) return;
        plateUndoLinks.forEach(function (b) { b.remove(); });
        var row = el('div', 'undo-row');
        row.appendChild(doneLabel('Fait sur le plateau'));
        var undo = undoButton('Annuler', function (b) {
          plateAction('undo', function (ok) {
            if (!ok) { b.disabled = false; return; }
            row.remove();
            entry.commandsResult.undone = true;
            scheduleSave();
            show(entry.commandsResult);
          }, { undo_token: msg.undo_token });
        });
        row.appendChild(undo);
        plateUndoLinks = [row];
        list.after(row);
      };
      window.orca.postMessage({ type: 'commands', commands: a.commands, request: id });
    }
    if (a.how_to) {
      var how = el('div', 'howto hidden');
      how.appendChild(rich(a.how_to));
      var tool = Logic.commandTool(a.commands);
      if (tool && !archived) how.appendChild(el('div', 'row-acts')).appendChild(button('Ouvre l’outil sur la pièce', function () {
        window.orca.postMessage({ type: 'open_tool', tool: tool });
      }, 'btn ghost sm', 'eye'));
      var toggle = button('Comment le faire moi-même', function () {
        how.classList.toggle('hidden');
        toggle.setAttribute('aria-expanded', how.classList.contains('hidden') ? 'false' : 'true');
      }, 'disclosure', 'chevron');
      toggle.setAttribute('aria-expanded', 'false');
      wrap.appendChild(toggle);
      wrap.appendChild(how);
    }
    return wrap;
  }

  // Boutons d'action proposés par l'IA. Dans une conversation rouverte, seules les actions sans effet restent.
  var PLATE_KINDS = ['orient', 'arrange', 'scale_to_fit', 'slice'];
  function renderActions(actions, archived) {
    var list = (actions || []).filter(function (a) { return !(archived && PLATE_KINDS.indexOf(a.kind) >= 0); });
    if (!list.length) return null;
    var row = el('div', 'row-acts');
    list.forEach(function (a) {
      var iconName = a.kind === 'show' || a.kind === 'show_setting' || a.kind === 'open_tool' ? 'eye' : 'wand';
      var b = button(a.label, function () {
        if (a.kind === 'show') showMe(a.target);
        else if (a.kind === 'open_tool') window.orca.postMessage({ type: 'open_tool', tool: a.target });
        else if (a.kind === 'show_setting') showSetting(a.target);
        else { b.disabled = true; plateAction(a.kind, function (ok) { if (!ok) b.disabled = false; }); }
      }, 'btn ghost sm', iconName);
      row.appendChild(b);
    });
    return row;
  }

  // ---------- Modèle 3D joint : posé sur le plateau, conseils sur clic seulement ----------
  function onModelAdded(msg) {
    dropPlacing();
    if (!msg.ok) { projectUI.reposing = false; noteLine(msg.text || 'Je n’ai pas pu poser cette pièce sur le plateau.', 'error', 'alert', 'guide'); return; }
    if (msg.adaptation) { syncProjectNames(msg.adaptation.saved); if (msg.name) conv.project.adapted = msg.name; } // adapté dès l'import : pas une deuxième fois
    if (tourSignals) tourSignals.objects = Math.max(tourSignals.objects || 0, 1); // sans attendre le prochain signal
    if (!(conv.project.part && conv.project.part.name)) { conv.project.part = { name: msg.name }; projectChanged(); }
    projectUI.oldPart = null;
    if (projectUI.reposing) { projectUI.reposing = false; renderProject(); noteLine('« ' + msg.name + ' » est de nouveau sur le plateau.', 'ok', 'check', 'guide'); }
    if (projectUI.newProjectFile) {
      projectUI.newProjectFile = false;
      noteLine('L’ancienne pièce est toujours sur le plateau d’Orca : supprime-la avant de découper, un projet = une pièce.', 'warn', 'alert', 'guide');
    }
    var entry = record({ kind: 'model', msg: msg, reduced: false });
    renderModel(entry, false);
    if (msg.fits === false) showTooBig(entry);
  }
  // Pièce trop grande : la carte reste dans l'étape en cours (elle survit au passage à l'étape suivante) jusqu'à ce que
  // tu réduises la pièce ou que tu gardes sa taille. La même carte est dans la discussion.
  var tooBigChat = null; // met à jour la copie de la discussion une fois la pièce réduite
  function dropTooBig() { var b = $('project-alert').querySelector('.too-big'); if (b) b.remove(); }
  function reducePart(entry, done) {
    plateAction('scale_to_fit', function (ok) {
      if (ok) {
        entry.reduced = true;
        scheduleSave();
        dropTooBig();
        if (tooBigChat) { tooBigChat(); tooBigChat = null; }
      }
      done(ok);
    }, null, entry.msg.count);
  }
  function showTooBig(entry) {
    var msg = entry.msg, printer = conv.project.printer;
    var other = printer ? PlyoMachines.machineThatFits(projectUI.printers, printer.preset, msg.size_mm) : null;
    dropTooBig();
    var box = alertBox('warn', FS.modelAddedText(msg).text + (other ? ' Il tient sur ' + other.label + '.' : ''), 'alert');
    box.classList.add('too-big');
    var acts = el('div', 'printer-actions');
    var reduce = button('Réduire pour qu’il tienne', function () {
