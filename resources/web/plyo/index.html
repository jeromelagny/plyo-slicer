    var box = alertBox(a.error ? 'warn' : 'tip', a.error ? 'Je n’ai pas pu adapter les réglages de ce fichier à ton projet : ' + a.error :
      adapted.length ? 'J’ai adapté ce fichier à ton imprimante et à ton filament : ' + adapted.length + ' réglage' + (adapted.length > 1 ? 's' : '') + ' changé' + (adapted.length > 1 ? 's' : '') + '.' :
      'Les réglages de ce fichier conviennent déjà à ton projet.', a.error ? 'alert' : 'check');
    if (adapted.length) {
      var list = el('ul', 'setup-checks');
      adapted.forEach(function (c) { list.appendChild(el('li', '', c.label + ' : ' + String(c.before).replace('.', ',') + ' → ' + String(c.after).replace('.', ','))); });
      box.body.appendChild(list);
    }
    if (dropped.length) {
      var skipped = el('p', 'muted small', 'Écartés (hors des limites sûres) : ' + dropped.map(function (d) { return d.label; }).join(', ') + '.');
      box.body.appendChild(skipped);
    }
    if (adapted.length && a.undo_id && !archived) {
      undoneListeners[a.undo_id] = function () {
        box.body.textContent = '';
        box.body.appendChild(rich('Annulé : j’ai remis les réglages d’avant.'));
      };
      var undo = button('Annuler', function () {
        undo.disabled = true;
        pendingSheet = { kind: 'undo', onResult: function (ok, text) { if (!ok) { undo.disabled = false; noteLine(text, 'error', 'alert'); } } };
        postRequest({ type: 'undo', undo_id: a.undo_id });
      }, 'btn ghost sm', 'undo');
      box.body.appendChild(undo);
    }
    return box;
  }

  // ---------- Lien téléphone (un par conversation) ----------
  // Le panneau crée le lien et garde son QR ; la fenêtre QR (PhoneDialog) l'affiche. Chaque « Envoyer »
  // du téléphone crée un envoi, que le panneau récupère et envoie aussitôt à l'assistant.
  function openPhone() {
    if (requireLogin('Les photos du téléphone passent par le service Plyo.', openPhone)) return;
    refreshAccount().then(function (valid) {
      // Session expirée : logout l'a dit et demande la connexion. Service coupé : l'erreur, là où tu viens de cliquer.
      if (!valid) { if (session) showError('network', openPhone, null, true); return; }
      var purpose = phonePurpose();
      if (!phoneLink && !phoneCreating) {
        // Le but du lien choisit la consigne de la page du téléphone ; un service qui l'ignore crée un lien « défaut ».
        phoneCreating = apiFetch('/api/phone-sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ purpose: purpose }) })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
          .then(function (created) {
            phoneLink = { id: created.id, qr_svg: created.qr_svg, purpose: purpose };
            $('phone-linked').classList.remove('hidden');
            clearInterval(phoneTimer);
            phoneTimer = setInterval(pollPhone, PHONE_POLL_MS);
            return phoneLink;
          });
        phoneCreating.then(function () { phoneCreating = null; }, function () { phoneCreating = null; });
      }
      var ready = phoneLink ? Promise.resolve(phoneLink) : phoneCreating;
      ready
        .then(function (link) { syncPhonePurpose(); window.orca.postMessage({ type: 'phone', link: { id: link.id, qr_svg: link.qr_svg } }); })
        .catch(function () { showError('network', openPhone, null, true); });
    });
  }
  // Ce que le téléphone doit photographier : une carte de calibration qui attend sa photo la reçoit (drainPhoneQueue),
  // sinon l'envoi part à l'assistant comme un défaut.
  function phonePurpose() { return calibCard && calibCard.awaiting ? 'calibration' : 'defect'; }
  // Le lien vaut pour toute la conversation : sa consigne suit l'usage du moment. Un service qui ne connaît pas cette
  // route (404) ou une panne ne change rien : la page du téléphone garde sa consigne.
  function syncPhonePurpose() {
    var want = phonePurpose();
    if (!phoneLink || !session || phoneLink.purpose === want) return;
    phoneLink.purpose = want;
    apiFetch('/api/phone-sessions/' + encodeURIComponent(phoneLink.id) + '/purpose', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ purpose: want }) }).catch(function () {});
  }

  // Coupe le lien (nouvelle conversation, déconnexion, lien expiré). `close` : prévenir le serveur.
  function unlinkPhone(close) {
    if (!phoneLink) return;
    if (close && session) apiFetch('/api/phone-sessions/' + encodeURIComponent(phoneLink.id), { method: 'DELETE' }).catch(function () {});
    clearInterval(phoneTimer);
    phoneLink = null;
    phoneQueue = [];
    $('phone-linked').classList.add('hidden');
  }

  function pollPhone() {
    if (!phoneLink || phoneCollecting || !session) return;
    var id = phoneLink.id;
    apiFetch('/api/phone-sessions/' + encodeURIComponent(id), { method: 'GET' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (s) {
        if (s.expired || s.status === 'closed') {
          unlinkPhone(false);
          noteLine('Le lien avec le téléphone a expiré. Clique sur l’icône du téléphone pour en créer un nouveau.', '', 'phone');
          return;
        }
        if (s.pending_batches > 0) return collectBatch(id);
      })
      .catch(function (status) { if (status === 404) unlinkPhone(false); });
  }

  // Une seule récupération à la fois ; l'envoi récupéré est mis en file (le serveur l'a déjà effacé),
  // puis transmis à l'assistant dès qu'il est libre, pour ne jamais perdre de photos.
  function collectBatch(id) {
    phoneCollecting = true;
    return apiFetch('/api/phone-sessions/' + encodeURIComponent(id) + '/photos', { method: 'GET' })
      .then(function (r) { return r.status === 200 ? r.json() : null; })
      .then(function (batch) {
        if (!batch) return;
        // `missing` : photos de l'envoi que le service n'a pas pu rendre ; les autres partent quand même.
        var missing = Logic.missingPhotosText(batch.missing);
        if (missing) noteLine(missing, 'error', 'alert');
        if (!batch.images || !batch.images.length) { if (!missing) noteLine('Les photos du téléphone n’ont pas pu être récupérées. Renvoie-les depuis le téléphone.', 'error', 'alert'); return; }
        phoneQueue.push({
          message: batch.message,
          photos: batch.images.map(function (img) {
            return { media_type: img.media_type, data: img.data, preview: 'data:' + img.media_type + ';base64,' + img.data };
          })
        });
        drainPhoneQueue();
      })
      .catch(function () { noteLine('Les photos du téléphone n’ont pas pu être récupérées. Renvoie-les depuis le téléphone.', 'error', 'alert'); })
      .then(function () { phoneCollecting = false; });
  }

  function drainPhoneQueue() {
    // Une carte de calibration qui attend sa photo la reçoit à la place d'une nouvelle demande.
    if (calibCard && calibCard.awaiting && phoneQueue.length) { calibCard.receivePhotos(phoneQueue.shift().photos); return; }
    if (busy || !lastValues || !phoneQueue.length) return;
    var next = phoneQueue.shift();
    send(next.message, { photos: next.photos, fromPhone: true });
  }

  // Demande qui attend un « result » (apply, undo, calib_*) : le gestionnaire posé juste avant dans `pendingSheet` lui est
  // attaché par un identifiant, que le slicer renvoie tel quel. Une réponse sans rapport (autre demande, erreur générale) ne
  // peut donc plus déverrouiller ni marquer une fiche.
  function postRequest(message) {
    var waiting = pendingSheet;
    pendingSheet = null;
    if (waiting) { message.request = nextRequest++; waiting.message = message; pendingResults[message.request] = waiting; }
    window.orca.postMessage(message);
  }
  // Annulation refusée : les valeurs d'avant, un bouton par réglage (« Remettre … à … »), un pour tout le lot, et
  // « Montre-moi où il est ». Chaque remise est un nouveau lot vérifié par le slicer, avec son « Annuler ».
  // `into` : la fiche qui a demandé l'annulation (l'offre s'y affiche, sous son message) ; sinon une ligne de la discussion.
  function restoreOffer(list, into) {
    var items = (Array.isArray(list) ? list : []).filter(function (r) { return r && r.key; });
    if (!items.length) return null;
    var lead = items.length > 1 ? 'Je peux remettre les valeurs d’avant :' : 'Je peux remettre la valeur d’avant :', line;
    if (into) { line = el('div', 'note-line restore-offer'); line.appendChild(icon('undo', 14)); line.appendChild(el('span', 'note-text', lead)); into.appendChild(line); }
    else line = noteLine(lead, '', 'undo', 'chat');
    var acts = el('div', 'row-acts');
    function put(group, b) {
      b.disabled = true;
      var names = Logic.namesForApply(null, lastValues && lastValues.context);
      pendingSheet = { kind: 'apply', extras: false, onResult: function (ok, text, result) {
        if (!ok) { b.disabled = false; noteLine(text, 'error', 'alert', 'chat'); return; }
        line.remove();
        var done = noteLine(group.length > 1 ? 'Valeurs d’avant remises.' : 'Remis : ' + group[0].label + ' à ' + Logic.valueText(group[0].value, group[0].key) + '.', 'ok', 'check', 'chat');
        if (result && result.undo_id) done.appendChild(undoButton('Annuler', function (u) {
          pendingSheet = { kind: 'undo', onResult: function (okU, t) { if (!okU) { u.disabled = false; noteLine(t, 'error', 'alert', 'chat'); } else done.remove(); } };
          postRequest({ type: 'undo', undo_id: result.undo_id });
        }));
      } };
      postRequest({ type: 'apply', revert: true, changes: Logic.restoreChanges(group), print_name: names.process, filament_name: names.filament, printer_name: names.printer, why: 'Valeur d’avant remise' });
    }
    items.slice(0, 4).forEach(function (r) { var b = button(Logic.restoreLabel(r), function () { put([r], b); }, 'btn ghost sm', 'undo'); acts.appendChild(b); });
    if (items.length > 1) { var all = button('Tout remettre comme avant', function () { put(items, all); }, 'btn sm', 'undo'); acts.appendChild(all); }
    acts.appendChild(button('Montre-moi où il est', function () { window.orca.postMessage({ type: 'show_setting', key: items[0].key }); }, 'link'));
    line.appendChild(acts);
    if (into) line.scrollIntoView({ block: 'end' }); // l'offre suit le message de refus, sous la fiche
    return line;
  }
  // Lot refusé : ses issues (réessayer, confirmer, montrer le réglage) sous le message. `retry(confirmKey)` relance le lot.
  function refusalButtons(result, retry) {
    var acts = el('div', 'row-acts');
    Logic.refusalActions(result).forEach(function (a) {
      if (a.kind === 'show') acts.appendChild(button(a.label, function () { window.orca.postMessage({ type: 'show_setting', key: a.key }); }, 'link', 'eye'));
      else if (retry) { var b = button(a.label, function () { b.disabled = true; retry(a.kind === 'confirm' ? a.key : null); }, 'btn ghost sm', a.kind === 'retry' ? '' : 'check'); acts.appendChild(b); }
    });
    return acts.children.length ? acts : null;
  }

  // « Annuler » : toujours le même petit bouton discret avec son icône, à droite de « Fait ✓ ».
  function undoButton(label, onClick) {
    var b = button(label || 'Annuler', function () { b.disabled = true; onClick(b); }, 'btn ghost sm', 'undo');
    return b;
  }
  function markCell() { var m = el('span', 'mark'); m.appendChild(icon('check', 14)); return m; }
  // Réglages changés en plus de ce qui était demandé : { title, items, tail } (Logic.addedList, Logic.alsoChangedList) en liste.
  function alsoBlock(list, className) {
    var box = el('div', (className ? className + ' ' : '') + 'also-list');
    box.appendChild(el('p', '', list.title));
    var ul = el('ul');
    list.items.forEach(function (item) { ul.appendChild(el('li', '', item)); });
    box.appendChild(ul);
    if (list.tail) box.appendChild(el('p', '', list.tail));
    return box;
  }
  function doneLabel(text, iconName) { var d = el('span', 'done'); d.appendChild(icon(iconName || 'check', 13)); d.appendChild(txt(text)); return d; }

  // ---------- Calibration guidée par photo ----------
  var CALIB = {
    temperature: { name: 'Tour de température', shows: 'la température où ton filament fait le moins de fils et soude bien ses couches', duration: '≈ 45 min', parts: 'Ta tour, étage par étage', pick: 'Choisis l’étage le plus propre', tower: true },
    flow: { name: 'Test de débit', shows: 'la quantité de plastique juste : ni trous, ni bourrelets sur le dessus', duration: '≈ 20 min par passe', parts: 'Les carrés du test', pick: 'Choisis le carré le plus lisse' },
    retraction: { name: 'Tour de rétraction', shows: 'la rétraction la plus courte qui supprime les fils', duration: '≈ 40 min', parts: 'Ta tour, bande par bande', pick: 'Choisis la bande la plus propre', tower: true },
    pressure_advance: { name: 'Test des angles (pressure advance)', shows: 'le réglage qui rend les angles nets, sans bourrelet', duration: '≈ 10 min', parts: 'Les lignes du motif', pick: 'Choisis la ligne aux angles les plus nets' },
    ironing: { name: 'Plaque de lissage', shows: 'le débit et l’espacement qui donnent le dessus le plus lisse', duration: '≈ 15 min', parts: 'Les carrés de la plaque', pick: 'Choisis le carré le plus lisse' }
  };
  var calibHistory = [];   // calibrations déjà faites pour ce filament sur cette imprimante (slicer)
  var calibCard = null;    // carte du test en cours

  function calibrationOffer(offer, secondary) {
    var info = CALIB[offer.test];
    var box = alertBox('tip', null, 'target');
    var title = el('div', 'offer-title');
    title.appendChild(el('b', '', info.name));
    title.appendChild(el('span', 'muted small', info.duration));
    box.body.appendChild(title);
    box.body.appendChild(el('p', '', offer.reason || ('Ce test montre ' + info.shows + '.')));
    var start = button('Lancer le test', function () {
      start.disabled = true;
      pendingSheet = { kind: 'calib', onResult: function (ok, t) { if (!ok) { start.disabled = false; noteLine(t, 'error', 'alert'); } } };
      postRequest({ type: 'calib_start', test: offer.test, pass: 1 });
    }, secondary ? 'btn ghost sm' : 'btn sm', 'target');
    box.body.appendChild(el('div', 'row-acts')).appendChild(start);
    return box;
  }

  // « Calibrer cette bobine » (UX-34) : les tests guidés, en direct et sans passer par l'IA. Lancer est gratuit ; seule la lecture
  // de la photo du test utilise la jauge.
  var calibChooser = null;
  function openCalibChooser() {
    if (calibChooser) calibChooser.remove();
    var f = conv && conv.project.filament;
    var box = alertBox('tip', PlyoRetouches.calibIntro(f && f.spool ? f.spool.name : ''), 'target');
    var acts = el('div', 'printer-actions');
    PlyoRetouches.CALIB_CHOICES.forEach(function (c) {
      var b = button(c.label, function () {
        acts.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
        pendingSheet = { kind: 'calib', onResult: function (ok, t) { if (!ok) { var n = noteLine(t, 'error', 'alert'); n.appendChild(button('Choisir un autre test', openCalibChooser, 'link')); } } };
        box.remove(); calibChooser = null;
        applyTab('show-chat'); // le test et son choix vivent dans la discussion, comme ceux que propose l'assistant
        postRequest({ type: 'calib_start', test: c.test, pass: 1 });
      }, 'btn ghost sm', 'target');
      acts.appendChild(b);
    });
    acts.appendChild(button('Fermer', function () { box.remove(); calibChooser = null; }, 'link'));
    box.body.appendChild(acts);
    calibChooser = box;
    placeInOpenTab(box);
  }

  function onCalibStarted(msg) {
    delete pendingResults[msg.request];
    if (calibCard) calibCard.box.remove();
    showConversation();
    var info = CALIB[msg.test];
    record({ kind: 'note', text: info.name + ' posé sur le plateau.', tone: '', icon: 'target' });
    var box = el('div', 'ai');
    box.appendChild(whoLine(info.name + (msg.test === 'flow' ? ' — passe ' + msg.pass + ' sur 2' : '')));
    box.appendChild(el('p', '', 'Le test est sur le plateau. Ce qu’il va montrer : ' + info.shows + '. ' + msg.instructions));
    box.appendChild(el('p', 'why', 'Ta pièce et tes réglages sont gardés : « Remettre ma pièce » les ramène à tout moment.'));

    var sheet = el('div', 'sheet');
    var sheetHead = el('header', 'calib-head');
    sheetHead.appendChild(el('span', '', info.parts));
    sheetHead.appendChild(el('b', '', info.pick));
    sheet.appendChild(sheetHead);
    var choice = null;
    var group = 'calib-' + Date.now();
    // Une tour se lit comme on la tient : le haut en premier, avec un repère « En haut » / « En bas ».
    var rows = Logic.calibOrder(msg.sections, info.tower).map(function (s) {
      var row = el('label', 'row');
      var radio = el('input');
      radio.type = 'radio';
      radio.name = group;
      var info2 = el('div', 'calib-row');
      info2.appendChild(el('span', 'name', s.label));
      if (s.where) info2.appendChild(el('span', 'badge-pill', s.where));
      row.appendChild(radio);
      row.appendChild(info2);
      radio.addEventListener('change', function () { choice = s; updateActions(); });
      sheet.appendChild(row);
      return { radio: radio, row: row, s: s };
    });
    // La liste vient du test posé : elle ne suit pas les carrés retirés ensuite du plateau.
    if (msg.test === 'flow') sheet.appendChild(el('p', 'muted small', 'Si tu as retiré un carré du plateau, ne le choisis pas : il n’aura pas été imprimé.'));
    var status = el('div', 'status', 'Pas sûr ? Une fois le test imprimé, envoie-moi une photo : je t’aide à choisir (la lecture de la photo utilise ta jauge).');
    sheet.appendChild(status);
    var footer = el('footer');
    // Libellés courts et parallèles : les deux boutons tiennent côte à côte à 320 px.
    var photoBtn = button('Photo', null, 'btn ai-action', 'camera');
    photoBtn.title = fr('Ajouter une photo depuis l’ordinateur · Action de l’assistant IA');
    var phoneBtn = button('Téléphone', null, 'btn ghost ai-action', 'phone');
    phoneBtn.title = fr('Prendre la photo avec ton téléphone · Action de l’assistant IA');
    var action = button('', null, 'btn full hidden');
    var back = button('Remettre ma pièce', null, 'link');
    footer.appendChild(photoBtn);
    footer.appendChild(phoneBtn);
    footer.appendChild(action);
    footer.appendChild(back);
    sheet.appendChild(footer);
    box.appendChild(sheet);
    thread.appendChild(box);
    scrollDown();

    var card = { box: box, awaiting: true, test: msg.test, pass: msg.pass };
    calibCard = card;
    syncPhonePurpose(); // lien téléphone déjà ouvert : sa page demande maintenant la photo du test

    function updateActions() {
      if (!choice) return;
      action.classList.remove('hidden');
      action.disabled = false;
      action.textContent = fr(msg.test === 'flow' && msg.pass === 1 ? 'Lancer la passe fine' : 'Enregistrer ' + choice.label + ' pour ce filament');
      // Le choix fait, l'enregistrement devient l'action principale ; la photo reste possible en secondaire.
      photoBtn.classList.add('ghost');
      back.scrollIntoView({ block: 'nearest' }); // « Remettre ma pièce » reste visible sous le nouveau bouton
    }

    function setPhotoButtons(enabled) { photoBtn.disabled = !enabled; phoneBtn.disabled = !enabled; }

    function analyze(photos) {
      if (card.analyzing) return;
      card.analyzing = true;
      card.awaiting = false;
      setPhotoButtons(false);
      status.textContent = fr('L’assistant regarde ta photo…');
      scrollDown();
      var body = {
        locale: (lastValues && lastValues.locale) || 'fr',
        test: msg.test,
        pass: msg.test === 'flow' ? msg.pass : undefined,
        images: photos.map(function (p) { return { media_type: p.media_type, data: p.data }; }),
        sections: msg.sections,
        filament: lastValues && lastValues.context ? lastValues.context.filament : undefined,
        printer: lastValues && lastValues.context ? lastValues.context.printer : undefined
      };
      if (!session) {
        status.textContent = fr('Connecte-toi pour que l’assistant lise la photo, ou choisis toi-même le meilleur.');
        card.awaiting = true; card.analyzing = false; setPhotoButtons(true);
        requireLogin('Pour lire la photo de ton test, je l’envoie à l’IA.', function () { analyze(photos); });
        return;
      }
      apiFetch('/api/calibration/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (response) { return response.json().then(function (data) { return { ok: response.ok, data: data }; }); })
        .then(function (r) {
          card.analyzing = false;
          setPhotoButtons(true);
          if (calibCard !== card) return;
          if (!r.ok) {
            if (r.data.error === 'insufficient_credits') setGauge(r.data.gauge, true);
            status.textContent = fr(Logic.errorView(r.data.error, r.data).text + ' Tu peux aussi choisir toi-même le meilleur.');
            card.awaiting = true;
            return;
          }
          if (r.data.credits) setGauge(r.data.credits.gauge);
          if (r.data.status !== 'ok') {
            status.textContent = fr(r.data.retake_advice);
            card.awaiting = true;
            return;
          }
          syncPhonePurpose(); // photo lue : le téléphone sert de nouveau aux défauts
          var win = rows.find(function (x) { return x.s.index === r.data.winner_index; });
          win.radio.checked = true;
          win.row.classList.add('best');
          choice = win.s;
          status.textContent = '';
          status.appendChild(el('strong', '', 'Le meilleur : ' + win.s.label + (CONFIDENCE[r.data.confidence] ? ' · ' + CONFIDENCE[r.data.confidence] : '') + '. '));
          status.appendChild(txt(r.data.explanation + ' Tu as la pièce en main : choisis-en un autre si tu n’es pas d’accord.'));
          updateActions();
          scrollDown();
        })
        .catch(function () { card.analyzing = false; setPhotoButtons(true); if (calibCard === card) { status.textContent = fr(Logic.errorView('network').text + ' Tu peux aussi choisir toi-même le meilleur.'); card.awaiting = true; } });
    }
    card.receivePhotos = analyze;

    photoBtn.addEventListener('click', function () {
      var input = el('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.multiple = true;
      input.addEventListener('change', function () {
        var files = Array.prototype.slice.call(input.files || []).slice(0, MAX_PHOTOS);
        Promise.all(files.map(function (f) { return downscale(f).catch(function () { return null; }); })).then(function (list) {
          var ok = list.filter(Boolean);
          if (ok.length) analyze(ok);
          else noteLine('Cette image ne peut pas être lue : prends plutôt du JPEG ou du PNG.', 'error', 'alert');
        });
      });
      input.click();
    });
    phoneBtn.addEventListener('click', function () { card.awaiting = true; openPhone(); });

    action.addEventListener('click', function () {
      action.disabled = true;
      if (msg.test === 'flow' && msg.pass === 1) {
        pendingSheet = { kind: 'calib', onResult: function (ok, t) { if (!ok) { action.disabled = false; status.textContent = fr(t); } } };
        postRequest({ type: 'calib_start', test: 'flow', pass: 2, base_value: choice.value });
        return;
      }
      pendingSheet = { kind: 'calib_save', onResult: function (ok, t) {
        if (!ok) { action.disabled = false; status.textContent = fr(t); return; }
        record({ kind: 'note', text: info.name + ' : ' + t, tone: 'ok', icon: 'check' });
        footer.textContent = '';
        footer.appendChild(doneLabel(t));
        var restored = false;
        var restore = button('Remettre ma pièce', function () { restoreCalibration(restore, function (okR) { restored = okR; }); }, 'btn');
        footer.appendChild(restore);
        if (msg.test === 'ironing') {
          // Le lissage s'active sur le profil de ta pièce : la remettre d'abord, sinon la remise l'effacerait.
          var on = button('Remettre ma pièce et activer le lissage', null, 'btn ghost');
          on.dataset.keep = '1';
          var activate = function () {
            pendingSheet = { kind: 'apply', onResult: function (okOn, tt) { on.replaceWith(okOn ? doneLabel('Lissage activé') : el('span', 'fail-text', tt)); } };
            postRequest({ type: 'apply', changes: [{ id: 'ironing_type', value: 'top' }], why: 'Plaque de lissage' });
          };
          on.addEventListener('click', function () {
            on.disabled = true;
            if (restored) { activate(); return; }
            restoreCalibration(on, function (okR) { restored = okR; if (okR) activate(); else on.disabled = false; });
          });
          footer.appendChild(on);
        }
      } };
      postRequest({ type: 'calib_save', test: msg.test, value: choice.value });
    });
    back.addEventListener('click', function () { restoreCalibration(back); });
  }

  function restoreCalibration(btn, after) {
    btn.disabled = true;
    pendingSheet = { kind: 'calib_restore', onResult: function (ok, t) {
      if (!ok) { btn.disabled = false; noteLine(t, 'error', 'alert'); if (after) after(false); return; }
      if (calibCard) { calibCard.awaiting = false; calibCard.box.querySelectorAll('button:not([data-keep])').forEach(function (b) { b.disabled = true; }); }
      calibCard = null;
      syncPhonePurpose();
      noteLine(t, 'ok', 'check');
      if (after) after(true);
    } };
    postRequest({ type: 'calib_restore' });
  }

  // ---------- Premiers pas : parcours « Ma première impression », « Tu regardes », fiches ----------
  var fsState = {};
  var tourSignals = null;  // derniers signaux : objets, découpage, temps, poids
  var focusKey = null;
  // Repli de « Montre-moi » quand la zone n'a pas pu être encadrée.
  var WHERE = {
    printer: 'Dans la colonne de gauche, sous « Imprimante » : le nom de ta machine.',
    filament: 'Dans la colonne de gauche, sous « Filament » : la bobine utilisée.',
    slice: 'En haut à droite, le bouton « Découper la plaque ».',
    print: 'En haut à droite, juste à côté de « Découper la plaque ».',
    plate: 'Au centre de la fenêtre : le plateau en 3D.'
  };

  function durationText(seconds) {
    var m = Math.max(1, Math.round(seconds / 60));
    return m < 60 ? 'environ ' + m + ' min' : 'environ ' + Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0');
  }
  function printSummary() {
    if (!tourSignals || !tourSignals.sliced || !tourSignals.time_s) return '';
    var grams = tourSignals.weight_g ? ' et ' + Math.round(tourSignals.weight_g) + ' g de filament' : '';
    return 'Ton impression prendra ' + durationText(tourSignals.time_s) + grams + '.';
  }
  // Étape « Ton filament » : la matière écrite sur la bobine, puis les températures de son étiquette.
  // « 205 », « 205 °C » ou une fourchette « 190-220 » (on prend le milieu, arrondi à 5 °C) ; null si illisible.
  function labelTemp(text) {
    var nums = String(text || '').match(/\d+/g);
    if (!nums) return null;
    var a = +nums[0], b = nums.length > 1 ? +nums[1] : a;
    return Math.round((a + b) / 2 / 5) * 5;
  }

  // Le parcours guidé appartient au projet : il commence quand la fiche est complète, et se range dans la conversation.
  function currentTourStep() {
    if (!conv || PlyoProject.nextStep(conv.project) !== 'ready') return null;
    var step = conv.project.step || 'slice';
    return FS.TOUR_STEPS.indexOf(step) >= 0 ? step : null;
  }
  function setTourStep(step) {
    conv.project.step = step || 'done';
    projectChanged();
  }

  // Parcours d'installation d'une imprimante (recherche réseau, installation, liaison) : seule chose qui reste dans cet emplacement.
  function renderSetupFlow() {
    var slot = $('tour-slot');
    slot.textContent = '';
    document.body.classList.toggle('touring', !!setup.phase);
    if (setup.phase) renderSetup(slot);
  }

  // ---------- « Ça a marché ? » ----------
  // Des réglages proposés par l'IA ont été appliqués : au moins 30 minutes plus tard (au démarrage, puis toutes
  // les 3 heures), une carte demande le résultat. Il est gardé dans la mémoire de la machine, et partagé
  // anonymement seulement si l'utilisateur a coché la case (désactivée par défaut).
  var outcomeAsked = {};      // entrées déjà montrées pendant cette session
  var afterConvLoaded = null; // suite à donner une fois une conversation rouverte (réponse « Non »)
  var outcomeOpening = null;  // correction dont on ouvre le projet pour répondre à sa question (repli : la carte, si l'ouverture échoue)
  function askOutcome() { window.orca.postMessage({ type: 'outcome_pending' }); }
  setInterval(askOutcome, 3 * 60 * 60 * 1000);
  // L'étape Résultat du projet ouvert pose sa question (pas encore répondue) : elle couvre les corrections de cette impression.
  function resultAsks() {
    return !!conv && PlyoJourney.currentStep(conv.project) === 'resultat' && !conv.project.success && !(sendOf() && sendOf().failed);
  }
  function onOutcomePending(items) {
    var card = Logic.outcomeCard((items || []).filter(function (it) { return !outcomeAsked[it.at]; }), new Date(), conv && conv.id, resultAsks());
    if (!card) return;
    outcomeAsked[card.item.at] = true;
    renderOutcome(card.item, card.open);
  }
  var outcomeSeq = 0;
  // Libellés uniques de la question, partout : carte, étape Résultat, fin suivie (UX-22).
  var OUTCOME_YES = 'Oui, c’est réussi', OUTCOME_NO = 'Non, c’est raté', OUTCOME_LATER = 'Pas encore imprimé';
  // `open` : la correction a été imprimée depuis un projet qui n'est pas ouvert ; sa question est dans ce projet (une seule
  // question par impression), la carte l'ouvre. Projet introuvable : la carte pose la question ici.
  function renderOutcome(item, open) {
    var slot = $('outcome-slot');
    slot.textContent = '';
    var q = Logic.outcomeQuestion(item, function (id) { var p = paramOf(id); return p.label === id ? null : p; });
    var box = el('div', 'card');
    // Une question qui attend une réponse : un groupe nommé par son titre, pas une annonce (role="status").
    var titleId = 'outcome-title-' + (++outcomeSeq);
    box.setAttribute('role', 'group');
    box.setAttribute('aria-labelledby', titleId);
    var head = el('header');
    head.appendChild(icon('help', 16));
    var title = el('span', '', q.title);
    title.id = titleId;
    head.appendChild(title);
    box.appendChild(head);
    if (open) {
      var day = Logic.dayText(item.printed || item.at);
      box.appendChild(el('p', '', (day ? 'Le ' + day + ', tu' : 'Tu') + ' as lancé une impression avec les réglages changés' + (item.why ? ' pour « ' + item.why + ' »' : '') +
        '. Ouvre son projet pour me dire si c’est réussi.'));
      var go = button('Ouvrir le projet', function () {
        go.disabled = true;
        outcomeOpening = item;
        afterConvLoaded = function () {
          outcomeOpening = null;
          slot.textContent = '';
          applyTab('show-guide');
          // Le projet ne pose plus la question (déjà répondue, ou plus à l'étape Résultat) : la carte la pose elle-même.
          if (!resultAsks()) renderOutcome(item, false);
          else $('project-card').scrollIntoView({ block: 'nearest' });
        };
        openConversation(item.conv);
        setTimeout(function () { if (outcomeOpening === item && go.isConnected) go.disabled = false; }, 4000); // ouverture refusée (demande en cours) : on peut réessayer
      }, 'btn', 'folder');
      box.appendChild(go);
      slot.appendChild(box);
      return;
    }
    box.appendChild(el('p', '', q.text));
    if (q.changes.length) {
      var list = el('ul', 'meta');
      q.changes.forEach(function (c) { list.appendChild(el('li', '', c)); });
      box.appendChild(list);
    }
    var said = el('textarea', 'field');
    said.maxLength = 200;
    said.rows = 2;
    said.placeholder = fr('Un mot à ajouter ? (facultatif)');
    said.setAttribute('aria-label', 'Un mot à ajouter sur le résultat (facultatif)');
    var share = el('input');
    share.type = 'checkbox';
    share.checked = !!fsState.share_outcomes;
    share.addEventListener('change', function () { window.orca.postMessage({ type: 'firststeps_set', patch: { share_outcomes: share.checked } }); });
    var shareLabel = el('label', 'check-line');
    shareLabel.appendChild(share);
    shareLabel.appendChild(el('span', '', 'Partager anonymement ce résultat pour améliorer Plyo : les noms de tes profils d’imprimante et de filament, le problème, les réglages changés et le jour ; jamais ton compte ni de photo.'));
    function answer(outcome) {
      var note = outcome === 'later' ? '' : said.value.trim();
      // Le mot reste sur l'ordinateur (mémoire de la machine, journal) ; il n'est jamais partagé.
      window.orca.postMessage({ type: 'outcome_set', machine: item.machine, at: item.at, conv: item.conv, outcome: outcome, note: note });
      slot.textContent = '';
      if (outcome === 'later') delete outcomeAsked[item.at]; // redemandé au prochain passage (3 reports au plus)
      if (outcome !== 'later' && share.checked && session)
        // Envoi discret : une réponse { ok, duplicate } (déjà reçu) comme une erreur ne changent rien pour l'utilisateur.
        apiFetch('/api/outcomes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Logic.outcomePayload(item, outcome)) }).catch(function () {});
      if (outcome === 'ok') noteLine('Super ! Je m’en souviendrai pour mes prochains conseils sur cette imprimante.', 'ok', 'check');
      if (outcome === 'bad') renderOutcomeBad(item, note);
      if (outcome === 'later') noteLine('D’accord : je te redemanderai plus tard.', '', 'info', 'guide');
      if (conv) renderProject();
    }
    // Oui et Non pèsent le même poids : la carte ne souffle pas la réponse.
    var answers = el('div', 'answers');
    answers.appendChild(button(OUTCOME_YES, function () { answer('ok'); }, 'btn ghost', 'check'));
    answers.appendChild(button(OUTCOME_NO, function () { answer('bad'); }, 'btn ghost', 'x'));
    box.appendChild(said);
    box.appendChild(answers);
    box.appendChild(button(OUTCOME_LATER, function () { answer('later'); }, 'link'));
    box.appendChild(shareLabel);
    slot.appendChild(box);
  }

  // Lots d'un retour arrière ou d'une réapplication (catalogue, puis ancienne liste : Logic.batchesOf), envoyés l'un après
  // l'autre, chacun vérifié par le slicer comme un lot de l'IA. `extra` : champs ajoutés à chaque lot (`revert`).
  // `done(ok, text, undoIds)` à la fin, ou au premier refus (les lots déjà passés restent annulables).
  function postBatches(batches, why, extra, done) {
    var names = Logic.namesForApply(null, lastValues && lastValues.context), undoIds = [];
    (function next(i) {
      if (i >= batches.length) { done(true, '', undoIds); return; }
      pendingSheet = { kind: 'apply', onResult: function (ok, text, result) {
        if (!ok) { done(false, text, undoIds); return; }
        if (result && result.undo_id) undoIds.push(result.undo_id);
        next(i + 1);
      } };
      postRequest(Object.assign({ type: 'apply', changes: batches[i], print_name: names.process, filament_name: names.filament, printer_name: names.printer, why: why }, extra || {}));
    })(0);
  }
  // « Annuler » d'une remise en plusieurs lots : le plus récent d'abord. `done(ok, text)`.
  function undoBatches(ids, done) {
    (function next(i) {
      if (i < 0) { done(true, ''); return; }
      pendingSheet = { kind: 'undo', onResult: function (ok, t) { if (!ok) { done(false, t); return; } next(i - 1); } };
      postRequest({ type: 'undo', undo_id: ids[i] });
    })(ids.length - 1);
  }
  // Réglages réussis remis (restore_reliable) : ce qui a été fait, et « Annuler » avec l'identifiant rendu par le slicer.
  // `status` : où dire un refus d'annulation.
  function reliableDone(res, status) {
    var done = el('div', 'undo-row');
    var saved = Logic.savedText(res);
    done.appendChild(doneLabel((res.text || 'Réglages réussis remis.') + (saved ? ' ' + saved : ''), 'undo'));
    if (res.undo_id) done.appendChild(undoButton('Annuler', function (u) {
      pendingSheet = { kind: 'undo', onResult: function (ok, t) {
        if (!ok) { u.disabled = false; status.textContent = fr(t); status.classList.remove('hidden'); return; }
        done.replaceWith(doneLabel('Réglages d’avant remis.', 'undo'));
      } };
      postRequest({ type: 'undo', undo_id: res.undo_id });
    }));
    return done;
  }

  // « Ça n'a pas marché » : les réglages essayés sont peut-être encore appliqués. On relit les réglages actuels (relevé du
  // catalogue) et on propose de remettre ceux d'avant là où la valeur essayée est encore en place (sans appel à l'IA), les
  // réglages réussis, une autre piste ou une photo. Un réglage retouché depuis est laissé tel quel, et c'est dit.
  function renderOutcomeBad(item, note) {
    if (!item) return;
    var slot = $('outcome-slot');
    slot.textContent = '';
    var box = el('div', 'card');
    var titleId = 'outcome-title-' + (++outcomeSeq);
    box.setAttribute('role', 'group');
    box.setAttribute('aria-labelledby', titleId);
    var head = el('header');
    head.appendChild(icon('flag', 16));
    var title = el('span', '', 'Ça n’a pas marché');
    title.id = titleId;
    head.appendChild(title);
    var close = button('', function () { slot.textContent = ''; if (conv) renderProject(); }, 'icon-btn push');
    close.title = 'Fermer';
    close.setAttribute('aria-label', 'Fermer');
    close.appendChild(icon('x', 14));
    head.appendChild(close);
    box.appendChild(head);
    var lead = el('p', '', 'Je relis tes réglages…');
    box.appendChild(lead);
    var acts = el('div', 'stack');
    var status = el('p', 'fail-text hidden');
    var revertSlot = el('div');
    acts.appendChild(revertSlot);
    var why = 'Retour aux réglages d’avant' + (item.why ? ' (' + item.why + ')' : '');
    // Relit les réglages actuels, puis dit ce qui peut être remis (et ce qui a été retouché depuis).
    function fillRevert() {
      aiContext().then(function (ctx) {
        if (!box.isConnected) return;
        var plan = Logic.revertPlan(item, lastValues && lastValues.params, ctx && ctx.snapshot ? ctx.snapshot : null);
        lead.textContent = fr(Logic.revertText(plan));
        revertSlot.textContent = '';
        if (!plan.changes.length) {
          if (plan.unread.length) revertSlot.appendChild(button('Relire mes réglages', function () { lead.textContent = fr('Je relis tes réglages…'); fillRevert(); }, 'btn ghost', 'undo'));
          return;
        }
        var undo = button(plan.changes.length > 1 ? 'Remettre mes anciens réglages' : 'Remettre mon ancien réglage', function () {
          undo.disabled = true;
          status.classList.add('hidden');
          // Sans « ask » : un retour en arrière ne doit pas reposer la question « Ça a marché ? ». Valeur d'avant hors des
          // plages d'aujourd'hui : le slicer refuse, et on montre pourquoi.
          postBatches(Logic.batchesOf(plan.changes), why, { revert: true }, function (ok, text, ids) {
            if (!ok) { undo.disabled = false; status.textContent = fr(text); status.classList.remove('hidden'); return; }
            var done = el('div', 'undo-row');
            done.appendChild(doneLabel('Anciens réglages remis. Découpe à nouveau la plaque pour en tenir compte.', 'undo'));
            done.appendChild(button('Découper la plaque', function () { sliceAgain(); }, 'btn ghost sm', 'wand'));
            if (ids.length) done.appendChild(undoButton('Annuler', function (u) {
              undoBatches(ids, function (okU, t) {
                if (!okU) { u.disabled = false; status.textContent = fr(t); status.classList.remove('hidden'); return; }
                fillRevert(); // les réglages essayés sont de nouveau en place : la carte le redit, avec son bouton
              });
            }));
            undo.replaceWith(done);
          });
        }, 'btn', 'undo');
        revertSlot.appendChild(undo);
      });
    }
    fillRevert();
    // Réglages réussis : ceux du filament lors de la dernière impression réussie (bobine, ou imprimante + filament).
    var reliableSlot = el('div');
    acts.appendChild(reliableSlot);
    askReliable(function (info) {
      if (!info.available || !box.isConnected) return;
      reliableSlot.appendChild(el('p', 'muted small', Logic.reliablePreview(info)));
      if (info.count === 0) return;
      var back = button(PlyoSpools.restoreLabel(info.date), function () {
        back.disabled = true;
        status.classList.add('hidden');
        reliableResult = function (res) {
          if (!res.ok) { back.disabled = false; status.textContent = fr(res.text); status.classList.remove('hidden'); return; }
          back.replaceWith(reliableDone(res, status));
        };
        window.orca.postMessage({ type: 'restore_reliable' });
      }, 'btn ghost', 'undo');
      reliableSlot.appendChild(back);
    });
    acts.appendChild(button('Chercher une autre piste', function () {
      var followUp = function () {
        noteInput.value = Logic.retryPrompt(item, note);
        noteInput.focus();
        noteInput.setSelectionRange(noteInput.value.length, noteInput.value.length);
      };
      applyTab('show-chat');
      // La conversation d'origine se recharge sans attendre : la suite vient une fois qu'elle est affichée.
      if (item.conv && (!conv || conv.id !== item.conv)) { afterConvLoaded = function () { applyTab('show-chat'); followUp(); }; openConversation(item.conv); }
      else followUp();
    }, 'btn ghost', 'search'));
    box.appendChild(acts);
    box.appendChild(status);
    // Montrer la pièce : les deux mêmes boutons que partout (avec leur coût).
    var photos = el('div', 'row-acts');
    photos.appendChild(button(PlyoJourney.PHOTO_PHONE, function () { noteInput.value = Logic.retryPrompt(item, note); openPhone(); }, 'link ai-action', 'camera'));
    photos.appendChild(button(PlyoJourney.PHOTO_COMPUTER, function () { noteInput.value = Logic.retryPrompt(item, note); pickFiles(); }, 'link ai-action', 'camera'));
    box.appendChild(photos);
    slot.appendChild(box);
  }

  // Réglages remis à la main : la découpe est à refaire. Projet ouvert : retour à l'étape Préparer, qui découpe et revérifie ;
  // sinon la découpe seule.
  function sliceAgain() {
    if (conv && currentTourStep()) { applyTab('show-guide'); delete conv.project.success; if (tourSignals) tourSignals.sliced = false; setTourStep('slice'); }
    plateAction('slice');
  }

  // ---------- Vérification avant impression ----------
  // Après chaque nouveau découpage, le slicer mesure le plateau ; preflight.js en déduit les risques. Une carte
  // n'apparaît que s'il y en a. Rien n'est envoyé à l'IA, sauf si l'utilisateur clique « En parler à l'assistant ».
  var sliceSig = null;        // signature du dernier découpage vu (null : pas encore de signal)
  var checkAskedFor = null;   // signature du découpage dont la vérification a été demandée
  var preflightManual = false;
  var dismissedRisks = {};    // risques ignorés pendant cette session
  setInterval(function () { window.orca.postMessage({ type: 'tour_signals' }); }, 2000);
  function watchSlice(signals) {
    var r = Logic.newSlice(sliceSig, signals);
    sliceSig = r.sig;
    if (!signals.sliced) plateChecked = ''; // découpe périmée : ce qui avait été vérifié ne vaut plus
    // Plaque déjà découpée en arrivant à l'étape (pièce reconnue sur le plateau) : aucune nouvelle découpe ne lancerait la vérification.
    var unchecked = signals.sliced && !plateChecked && checkAskedFor !== r.sig && conv && PlyoProject.nextStep(conv.project) === 'ready';
    if (r.fire || unchecked) { checkAskedFor = r.sig; window.orca.postMessage({ type: 'preflight' }); }
  }
  function checkPlate() {
    preflightManual = true;
    setTimeout(function () { preflightManual = false; }, 5000); // sans réponse (erreur), le prochain contrôle redevient automatique
    window.orca.postMessage({ type: 'preflight' });
  }
  function onPreflight(data) {
    var manual = preflightManual;
    preflightManual = false;
    // Une carte ignorée ne revient pas d'elle-même tant que ses risques restent les mêmes ; « Vérifier » la remontre.
    var risks = window.PlyoPreflight.preflightRisks(data);
    var fresh = risks.filter(function (r) { return !dismissedRisks[window.PlyoPreflight.riskKey(r)]; });
    openRisks = fresh.length;
    plateChecked = !risks.length ? 'clean' : fresh.length ? 'open' : 'ignored';
    if (data && data.sliced) threadNote('Découpe vérifiée : ' + (risks.length ? risks.length + ' point' + (risks.length > 1 ? 's' : '') + ' à surveiller (' + risks.map(function (r) { return r.kind; }).join(', ') + ')' : 'aucun risque') + '. ' + printSummary(), 'etapes');
    renderPreflight(manual || fresh.length ? risks : [], data);
    // Découpe faite et aucun risque : on passe à l'impression sans demander (jamais si Orca juge la plaque non imprimable).
    var orcaBlocks = !!(tourSignals && tourSignals.ready_for_print === false);
    if (!manual && !orcaBlocks && currentTourStep() === 'slice' && data && data.sliced && data.objects && data.objects.length && PlyoJourney.afterPreflight(openRisks) === 'advance') {
      setTourStep('print'); // d'abord : le changement d'étape efface les messages de l'étape
      var advance = PlyoJourney.advanceNote(risks.length); // une carte déjà ignorée compte : jamais « Pas de risque » avec un risque
      noteLine(advance.text, advance.tone, advance.icon, 'guide');
    } else renderProject();
    // La carte doit se voir, surtout dans un panneau bas : son haut est amené dans la zone visible.
    if (risks.length && (manual || fresh.length) && viewUI.tab === 'guide' && $('preflight-slot').firstChild) scrollToAnswerTop($('preflight-slot').firstChild); // le badge « Voir la suite » invite à défiler jusqu'au bouton
    if (!manual || risks.length) return;
    var slot = $('preflight-slot');
    var close = function () { slot.textContent = ''; };
    if (!data || !data.objects || !data.objects.length) {
      var empty = emptyState('cube', 'Ton plateau est vide', 'Ajoute une pièce : je la vérifie avant que tu lances l’impression.', 'Ajouter un modèle', function () { close(); pickFiles(); });
      empty.querySelector('.btn').classList.add('ghost'); // le bouton plein de l'étape reste celui de la ligne d'action
      empty.appendChild(button('Fermer', close, 'link'));
      slot.appendChild(empty);
    } else if (!data.sliced) {
      slot.appendChild(resultCard('info', 'Rien à signaler pour l’instant', 'Découpe la plaque pour que je vérifie aussi les parties dans le vide.',
        button('Découper la plaque', function () { close(); plateAction('slice'); }, 'btn ghost sm', 'wand'), close));
    } else {
      slot.appendChild(resultCard('check', 'Ta plaque est prête à imprimer', 'Rien à signaler : les pièces tiennent, collent bien au plateau et ne sont pas dans le vide.', null, close));
    }
  }
  // Petite carte de résultat (vérification sans souci) : titre, phrase, action éventuelle, « Fermer ».
  function resultCard(iconName, title, text, action, onClose) {
    var box = el('div', 'card');
    box.setAttribute('role', 'status');
    var head = el('header');
    head.appendChild(icon(iconName, 16));
    head.appendChild(el('span', '', title));
    var x = button('', onClose, 'icon-btn push');
    x.setAttribute('aria-label', 'Fermer');
    x.title = 'Fermer';
    x.appendChild(icon('x', 14));
    head.appendChild(x);
    box.appendChild(head);
    box.appendChild(el('p', 'muted', text));
    if (action) box.appendChild(el('div', 'row-acts')).appendChild(action);
    return box;
  }
  // Carte « Avant d'imprimer » : neutre (le badge ambre porte l'alerte), les soucis rangés par pièce, puis une
  // liste de corrections à cocher et un seul bouton principal, comme la fiche de réglages.
  var preflightSeq = 0;
  // Carte « Corrigé » de la dernière correction de cette conversation : elle reste, avec son « Annuler », quand la nouvelle
  // vérification la remplacerait (sinon le lot appliqué n'aurait plus ni compte rendu ni « Annuler »).
  var preflightKept = null; // { conv, box, note }
  function renderPreflight(risks, data) {
    var PF = window.PlyoPreflight;
    var slot = $('preflight-slot');
    slot.textContent = '';
    preflightFix = null;
    var kept = preflightKept && preflightKept.conv === conv ? preflightKept : null;
    if (kept) {
      if (!risks.length) kept.note.textContent = 'Plaque redécoupée et revérifiée : rien d’autre à signaler.';
      slot.appendChild(kept.box);
    }
    if (!risks.length) return;
    var plan = PF.preflightPlan(data);
    var plateCount = data && data.objects ? data.objects.length : undefined;
    var box = el('div', 'card attention');
    var titleId = 'preflight-title-' + (++preflightSeq);
    box.setAttribute('role', 'group');
    box.setAttribute('aria-labelledby', titleId);
    var head = el('header');
    head.appendChild(icon('alert', 16));
    var title = el('span', '', 'Avant d’imprimer');
    title.id = titleId;
    head.appendChild(title);
    head.appendChild(el('span', 'badge-pill warn', plan.count > 1 ? plan.count + ' pièces' : '1 pièce'));
    var dismiss = button('', function () {
      risks.forEach(function (r) { dismissedRisks[PF.riskKey(r)] = true; });
      closeCard();
    }, 'icon-btn push');
    dismiss.title = 'Ignorer pour cette plaque';
    dismiss.setAttribute('aria-label', 'Ignorer pour cette plaque');
    dismiss.appendChild(icon('x', 14));
    head.appendChild(dismiss);
    box.appendChild(head);

    plan.parts.forEach(function (part) {
      var block = el('div', 'pf-part');
      block.appendChild(el('b', '', part.name));
      var ul = el('ul');
      part.issues.forEach(function (t) { ul.appendChild(el('li', '', t)); });
      block.appendChild(ul);
      box.appendChild(block);
    });

    var list = el('div', 'fix-list');
    list.appendChild(el('div', 'fix-head', 'Ce que je peux corriger'));
    var rows = plan.fixes.map(function (f) {
      var row = el('label', 'row' + (f.checked ? '' : ' off'));
      var check = el('input');
      check.type = 'checkbox';
      check.checked = f.checked;
      var info = el('div');
      info.appendChild(el('div', 'name', f.label));
      info.appendChild(el('div', 'why', f.key === 'orient' ? 'Autre solution : tourner les pièces pour avoir moins de vide.'
        : 'Pour ' + f.objects.map(function (n) { return '« ' + n + ' »'; }).join(', ') + '.'));
      row.appendChild(check);
      row.appendChild(info);
      list.appendChild(row);
      check.addEventListener('change', function () { row.classList.toggle('off', !check.checked); update(); });
      return { fix: f, check: check, row: row };
    });
    box.appendChild(list);

    var fail = el('p', 'fail-text hidden');
    var acts = el('div', 'stack');
    var fixAll = button('', null, 'btn ghost main-choice');
    acts.appendChild(fixAll);
    box.appendChild(acts);
    box.appendChild(fail);
    var talk = button('En parler à l’assistant', function () {
      closeCard();
      send('Avant d’imprimer, Plyo me signale : ' + risks.map(function (r) { return r.text; }).join(' ') + ' Que me conseilles-tu ?');
    }, 'link');
    box.appendChild(talk);

    // Carte fermée : plus de risque ouvert, donc plus de bouton « Appliquer les correctifs » dans la ligne d'action.
    function closeCard() { slot.textContent = ''; if (kept) slot.appendChild(kept.box); preflightFix = null; openRisks = 0; plateChecked = 'ignored'; renderProject(); }
    preflightFix = function () { if (fixAll.disabled) return false; fixAll.click(); return true; };
    function picked() { return rows.filter(function (r) { return r.check.checked; }); }
    // « Tout corriger » tant que la sélection est celle conseillée ; sinon « Corriger » ce qui est coché.
    function update() {
      var n = picked().length;
      var advised = rows.every(function (r) { return r.check.checked === r.fix.checked; });
      fixAll.textContent = fr(!n ? 'Rien de coché' : (advised ? 'Tout corriger (' : 'Corriger (') + n + ')');
      fixAll.disabled = !n;
    }
    update();
    function lock(on) { rows.forEach(function (r) { r.check.disabled = on; }); fixAll.disabled = on; }

    // Réglages cochés en un seul envoi (une étape à annuler), puis les actions sur le plateau, l'une après l'autre.
    fixAll.addEventListener('click', function () {
      var fixes = picked().map(function (r) { return r.fix; });
      var batch = PF.fixBatch(fixes), changes = batch.changes;
      var actions = fixes.filter(function (f) { return f.action; });
      var undoId = 0, plateDone = []; // actions faites sur le plateau, avec leur jeton d'annulation, dans l'ordre
      var mine = conv;
      lock(true);
      fail.classList.add('hidden');
      function stop(text) { lock(false); update(); if (text) { fail.textContent = fr(text); fail.classList.remove('hidden'); } }
      function next(i) {
        if (i >= actions.length) return finished();
        plateAction(actions[i].action, function (ok, msg) {
          if (!ok) { stop(''); return; }
          plateDone.push({ kind: actions[i].action, token: msg && msg.undo_token !== undefined ? msg.undo_token : null });
          next(i + 1);
        }, null, plateCount);
      }
      function finished() {
        box.classList.remove('attention');
        box.textContent = '';
        var h = el('header');
        h.appendChild(icon('check', 16));
        h.appendChild(el('span', '', 'Corrigé'));
        box.appendChild(h);
        // Ce qui a été fait, dit avec les mots des lignes cochées.
        box.appendChild(el('p', 'small', fr('Fait : ' + fixes.map(function (f) { return f.label.charAt(0).toLowerCase() + f.label.slice(1); }).join(', ') + '.')));
        var redo = el('p', 'muted', 'Je redécoupe la plaque et je revérifie.');
        box.appendChild(redo);
        preflightKept = { conv: mine, box: box, note: redo };
        var row = el('div', 'row-acts');
        plateAction('slice'); // la nouvelle vérification remplace cette carte
        // « Annuler » au bout de la ligne « fait », comme partout ailleurs : les actions sur le plateau d'abord (de la dernière
        // à la première, chacune annulable seulement si rien n'a changé depuis), puis les réglages. Ce qui reste en place est dit.
        if (undoId || plateDone.length) h.appendChild(undoButton('Annuler', function (b) {
          var left = plateDone.slice();
          function undoPlate() {
            var last = left[left.length - 1];
            if (!last) return undoSettings();
            if (last.token === null) return undoSettings();
            plateAction('undo', function (ok) { if (!ok) { undoSettings(); return; } left.pop(); undoPlate(); }, { undo_token: last.token }, undefined, true);
          }
          function undoSettings() {
            if (!undoId) return said(false);
            pendingSheet = { kind: 'undo', onResult: function (ok, t) {
              if (!ok && left.length === plateDone.length) { b.disabled = false; noteLine(t, 'error', 'alert'); return; }
              said(ok, ok ? '' : t);
            } };
            postRequest({ type: 'undo', undo_id: undoId });
          }
          function said(settingsUndone, refused) {
            if (preflightKept && preflightKept.box === box) preflightKept = null;
            slot.textContent = '';
            if (refused) noteLine(refused, 'error', 'alert');
            var r = PF.undoText(settingsUndone, plateDone.length - left.length, left.map(function (a) { return a.kind; }));
            if (r.text) noteLine(r.text, r.tone, 'undo');
            if (conv === mine && (settingsUndone || left.length < plateDone.length)) renderProject();
          }
          undoPlate();
        }));
        if (h.lastChild.classList.contains('btn')) h.lastChild.classList.add('push');
        box.appendChild(row);
      }
      if (!changes.length) return next(0);
      pendingSheet = { kind: 'apply', onResult: function (ok, text, result) {
        if (!ok) return stop(text);
        undoId = (result && result.undo_id) || 0;
        next(0);
      } };
      var applyMsg = { type: 'apply', changes: changes, why: 'Vérification avant impression' };
      // Réglages du catalogue (remettre ceux du mode vase…) : pour les profils lus à l'instant, comme toute fiche.
      if (batch.catalog) { var pn = Logic.namesForApply(null, lastValues && lastValues.context); applyMsg.print_name = pn.process; applyMsg.filament_name = pn.filament; applyMsg.printer_name = pn.printer; }
      postRequest(applyMsg);
    });
    slot.appendChild(box);
  }

  // Découpe demandée par le bouton d'une réponse : une fois faite, la même réponse propose la suite (imprimer ou exporter).
  var assistSlice = null;
  function followAssistSlice(signals) {
    var pending = assistSlice;
    if (!pending || !signals.sliced) return;
    assistSlice = null;
    if (pending.conv !== conv || !pending.row.isConnected) return;
    var next = PlyoJourney.afterSliceFollow({ sliced: true, linked: !!signals.linked });
    var b = button(next.label, function () {
      if (conv !== pending.conv) return;
      b.disabled = true;
      // La vérification de la plaque passe avant l'envoi : sans son résultat, ou avec des risques ouverts, on montre le Guide.
      var checked = plateChecked === 'clean' || plateChecked === 'ignored';
      if (currentTourStep() === 'slice' && checked && openRisks === 0) setTourStep('print');
      applyTab('show-guide');
      var a = PlyoJourney.primaryAction(PlyoJourney.currentStep(conv.project), journeyCtx());
      if (checked && (a.kind === 'send' || a.kind === 'export') && a.enabled) { runAction(a.kind); return; }
      b.disabled = false;
      noteLine(plateChecked === 'open' ? 'Regarde d’abord la vérification de ta plaque, ci-dessous.' : plateChecked === '' && plateSliced() ? 'Je vérifie ta plaque : le bouton d’impression apparaît ici juste après.' : 'Il reste une étape avant l’impression : je te la montre ici.', '', 'info', 'guide');
    }, 'btn ghost sm', next.kind === 'send' ? 'send' : 'check');
    pending.row.appendChild(b);
  }
  function onTourSignals(signals) {
    refreshColours();
    if (signals.sliced) { stopSlicing(); orcaUI.failedConv = null; }
    // Découpe demandée qui n'a pas démarré (Orca la refuse sans événement, Plater::reslice) : on demande pourquoi, une fois.
    if (slicing.conv && slicing.conv === conv && !signals.sliced && signals.slicing === false && !slicing.asked && Date.now() - (slicing.since || 0) > 2500) {
      slicing.asked = true;
      askOrca('stalled');
    }
    // Découpée mais non imprimable (contrôles d'Orca) : la raison, une fois par découpe, même sans la fin vue (panneau rouvert).
    if (!signals.sliced) orcaUI.blockSig = '';
    else if (signals.ready_for_print === false && !orcaUI.blockSig) { orcaUI.blockSig = 'asked'; askOrca('blocked'); }
    watchNotices(signals.notices);
    followAssistSlice(signals);
    watchSlice(signals);
    var hadSummary = !!printSummary();
    var wasLinked = !!(tourSignals && tourSignals.linked);
    tourSignals = signals;
    // Pièce posée sur le plateau autrement que par ce panneau (Fichier › Importer d'Orca, glisser-déposer) : elle remplit la fiche.
    if (signals.objects === 0) projectUI.oldPart = null;
    var plated = projectUI.waitingFile || resumeUI.waiting ? null : PlyoProject.partFromPlate(conv && conv.project, signals, projectUI.oldPart);
    if (plated) { conv.project.part = { name: plated, fromPlate: true }; projectUI.oldPart = null; projectChanged(); attachPlate(); }
    var step = currentTourStep();
    // La découpe est périmée (un réglage a changé) : on redécoupe avant d'imprimer, y compris après une correction à l'étape Résultat.
    if ((step === 'print' || step === 'after') && FS.nextTourStep(step, signals, projectUI.fixedAfter === conv) === 'slice') { projectUI.fixedAfter = null; setTourStep('slice'); return; }
    // Le contenu des étapes 4 et 5 (temps, poids, machine reliée) dépend de ces signaux.
    var sig = JSON.stringify([signals.sliced, signals.linked, signals.time_s, signals.objects === 0]);
    if (sig !== onTourSignals.last) { onTourSignals.last = sig; renderProject(); }
  }

  // Aucune imprimante installée : la recherche sur le Wi-Fi démarre d'elle-même en arrivant à l'étape Machine, une fois par session.
  function maybeStartSetup() {
    if (!fsState.needs_printer || setup.phase || setup.offered) return;
    if (!conv || PlyoJourney.currentStep(conv.project) !== 'machine') return;
    startSetup();
  }
  function onFirstSteps(state) {
    var first = !fsState.hasOwnProperty('seen');
    fsState = state;
    // Aucune imprimante installée (premier lancement) : l'assistant commence par elle, une fois par session.
    // La pièce d'abord (lot 6) : l'installation attend l'étape « Machine et bobine » (maybeStartSetup).
    maybeStartSetup();
    renderSetupFlow();
    if (first && state.level === 'expert' && !state.greeted) window.orca.postMessage({ type: 'firststeps_set', patch: { greeted: true } });
    // Un seul fil (lot 5) : plus d'onglet « Poser une question » où ouvrir le confirmé ; son champ de saisie est prêt.
    if (first && state.level === 'expert') noteInput.focus();
    updateStartMenu();
  }
  function updateStartMenu() {
    // Préférence à coche : « Me guider pas à pas » est cochée sauf en mode « Je connais déjà » ; le clic bascule, comme avant.
    $('m-start').setAttribute('aria-checked', String(fsState.level !== 'expert'));
    $('m-layout').setAttribute('aria-checked', String(fsState.layout === 'simple'));
    $('m-start').title = fr(PlyoJourney.startMenuLabel(fsState.level));
    document.body.classList.toggle('novice', fsState.level !== 'expert');
    renderWelcome();
  }

  function explain(key) { window.orca.postMessage({ type: 'explain', key: key }); }

  // Fiche d'un réglage : texte livré dans Plyo (fiches.js), sinon l'aide du slicer ; valeur actuelle jugée hors ligne.
  function onExplain(msg) { applyTab('show-chat'); renderFiche(record({ kind: 'fiche', msg: msg }).msg, false); }
  function renderFiche(msg, archived, reopened) {
    var fiche = window.PLYO_FICHES[msg.key];
    showConversation();
    var box = el('div', 'ai fiche');
    box.appendChild(whoLine('explication gratuite'));
    var label = fiche ? fiche.label : msg.label;
    box.appendChild(el('h3', '', label));
    function part(title, text) { if (text) { box.appendChild(el('h4', '', title)); box.appendChild(el('p', '', text)); } }
    if (fiche) {
      part('À quoi ça sert', fiche.what);
      part('Si c’est trop haut', fiche.high);
      part('Si c’est trop bas', fiche.low);
      part('Faut-il y toucher ?', fiche.touch);
    } else {
      part('À quoi ça sert', msg.tooltip || 'Je n’ai pas encore de fiche pour ce réglage : demande-moi, je t’explique.');
    }
    if (msg.value !== null && msg.value !== undefined) {
      var shown = typeof msg.value === 'number' ? String(msg.value).replace('.', ',') : msg.value;
      var judged = FS.judgeValue({ value: msg.value, min: msg.min === null ? undefined : msg.min, max: msg.max === null ? undefined : msg.max,
        systemValue: typeof msg.system_value === 'number' ? msg.system_value : undefined });
      box.appendChild(el('h4', '', archived ? 'Chez toi, ce jour-là' : 'Chez toi'));
      box.appendChild(el('p', 'value', 'Valeur : ' + shown + (msg.unit ? ' ' + msg.unit : '') + '. ' + judged.text));
    }
    var acts = el('div', 'row-acts');
    acts.appendChild(button('Montre-moi où il est', function () { showSetting(msg.key); }, 'btn ghost sm', 'eye'));
    if (!archived || reopened) acts.appendChild(button('Et dans mon cas, je mets combien ?', function () { send('Pour le réglage « ' + label + ' » : quelle valeur me conseilles-tu dans mon cas, et pourquoi ?'); }, 'btn ghost sm'));
    box.appendChild(acts);
    thread.appendChild(box);
    if (archived) scrollDown(); else scrollToAnswerTop(box); // lue depuis son titre, comme une réponse de l'IA
  }

  $('focus-explain').addEventListener('click', function () { if (focusKey) explain(focusKey); });
  $('focus-close').addEventListener('click', function () { $('focus-chip').classList.add('hidden'); });

  // ---------- Envoi d'une demande ----------
  var CONFIDENCE = { high: 'Confiance élevée', medium: 'Confiance moyenne', low: 'Confiance faible' };

  function renderMe(entry) {
    showConversation();
    var me = el('div', 'me');
    if (entry.thumbs && entry.thumbs.length) {
      var grid = el('div', 'thumbs');
      entry.thumbs.forEach(function (src) { var i = el('img'); i.src = src; i.alt = ''; grid.appendChild(i); });
      me.appendChild(grid);
    }
    if (entry.text) me.appendChild(el('div', 'text', entry.text));
    if (entry.fromPhone) { var f = el('span', 'from'); f.appendChild(icon('phone', 11)); f.appendChild(txt('Envoyé depuis le téléphone')); me.appendChild(f); }
    thread.appendChild(me);
    scrollDown();
    return me;
  }

  // Ta demande dans le fil (vignettes gardées dans la conversation) ; le titre vient de la première demande.
  function addMe(text, photos, fromPhone) {
    var entry = record({ kind: 'me', text: text, thumbs: [], fromPhone: !!fromPhone });
    if (!conv.title) conv.title = Logic.conversationTitle(text, photos.length, new Date().toISOString());
    renderMe({ text: text, fromPhone: fromPhone, thumbs: photos.map(function (p) { return p.preview; }) });
    // La conversation garde des vignettes de 160 px, pas les photos entières.
    Promise.all(photos.map(function (p) { return scaled(p.preview, THUMB_SIDE, 0.7).catch(function () { return null; }); })).then(function (thumbs) {
      entry.thumbs = thumbs.filter(Boolean);
      scheduleSave();
    });
    return entry;
  }

  // Une suggestion envoyée ne doit pas effacer le brouillon : le champ n'est vidé que si c'est lui qui part.
  function clearNoteIfSent(note) { if (noteInput.value.trim() === note) { noteInput.value = ''; growNote(); } }
  // `opts` : { photos (du téléphone), fromPhone, shown (la demande est déjà dans le fil) }.
  function send(text, opts) {
    opts = opts || {};
    var note = (text || '').trim();
    if (busy) return;
    var photos = opts.photos || attachments.slice();
    if (!note && !photos.length) { noteInput.focus(); return; }
    applyTab('send'); // envoyer un message ouvre la Discussion
    // Niveau d'explication deviné (jamais au-dessus d'un choix fait dans le menu) ; un changement est toujours dit.
    var guessed = PlyoMachines.guessLevel(habits, PlyoIntent.detectLevel(conv.history.filter(function (m) { return m.role === 'user'; }).map(function (m) { return m.text; }).concat([note])), PlyoIntent.asksDefinition(note));
    var levelMove = PlyoMachines.levelChange(habits, guessed);
    if (guessed.level !== habits.level || !!guessed.level_hold !== !!habits.level_hold) { habits = guessed; saveHabits(); updateLevelLabel(); }
    renderProject();
    if (!lastValues) { noteLine('Je lis encore tes réglages : réessaie dans une seconde.', '', 'info'); return; }
    // « C'est quoi la rétraction ? » : la fiche du réglage répond, gratuitement et sans compte.
    var ficheKey = !opts.photos && !photos.length ? FS.matchSettingQuestion(note, window.PLYO_FICHES) : null;
    if (ficheKey) {
      if (!opts.shown) addMe(note, [], false);
      levelNotice(levelMove);
      clearNoteIfSent(note);
      explain(ficheKey);
      return;
    }
    if (!opts.photos) { attachments = []; renderAttachments(); clearNoteIfSent(note); }
    var me = opts.me || null;
    if (!opts.shown) me = addMe(note, photos, opts.fromPhone);
    levelNotice(levelMove);
    // Un identifiant par question : la même question renvoyée telle quelle (après une erreur) garde le sien.
    var requestId = opts.requestId || (lastAsked && Logic.sameQuestion(lastAsked, { note: note, photos: photos }) ? lastAsked.id : Logic.newRequestId(window.crypto));
    lastAsked = null;
    var again = { photos: photos, fromPhone: opts.fromPhone, shown: true, me: me, requestId: requestId };
    // Sans compte : la question reste affichée, et repart toute seule après la connexion (afterLogin).
    if (requireLogin('Pour te répondre, j’envoie ta demande à l’IA : connecte-toi, sans mot de passe (tu reçois un code par e-mail). Ta question est gardée : elle partira dès que tu seras connecté.', function () { send(note, again); }, true)) return;
    ask(note, photos, { id: requestId, me: me });
  }
  // ROB-12 : la demande revient dans le champ (texte et photos) sans repartir, jamais par-dessus ce que tu as commencé.
  function restoreDraft(note, photos) {
    if (noteInput.value.trim() || attachments.length) return false;
    noteInput.value = note || '';
    growNote();
    attachments = (photos || []).filter(function (p) { return p && p.preview; }).slice(0, MAX_PHOTOS);
    renderAttachments();
    return true;
  }
  // « Réessayer » renvoie la demande : le brouillon remis dans le champ, s'il n'a pas bougé, n'a plus lieu d'y être.
  function clearDraftIf(note, photos) {
    if (!noteInput.value.trim() && !attachments.length) return;
    if (!Logic.sameQuestion({ note: note, photos: photos }, { note: noteInput.value, photos: attachments })) return;
    noteInput.value = '';
    growNote();
    attachments = [];
    renderAttachments();
  }
  // Question restée « en attente » dans une conversation rouverte : l'application a été fermée pendant la réponse.
  function unansweredCard(entry) {
    var view = Logic.unansweredView(entry.pending);
    var box = alertBox('warn', view.text, 'alert');
    var acts = el('div', 'row-acts');
    function settle() { box.remove(); delete entry.pending; scheduleSave(); }
    var id = function () { return Logic.resendRequestId(entry.pending, new Date(), Logic.newRequestId(window.crypto)); };
    acts.appendChild(button('Renvoyer ma question', function () {
      var rid = id();
      if (!view.photos) { settle(); send(entry.text || '', { photos: [], shown: true, me: entry, requestId: rid }); return; }
      // Photos d'origine perdues : le texte revient dans le champ, tu rejoins tes photos, puis tu envoies (même identifiant).
      settle();
      if (!noteInput.value.trim()) { noteInput.value = entry.text || ''; growNote(); lastAsked = { note: entry.text || '', photos: null, id: rid }; }
      noteLine(view.photos > 1 ? 'Rejoins tes photos, puis envoie.' : 'Rejoins ta photo, puis envoie.', '', 'camera', 'chat');
      pickFiles();
    }, 'btn sm', view.photos ? 'camera' : ''));
    if (view.photos && entry.text) acts.appendChild(button('Renvoyer sans les photos', function () {
      var rid = id();
      settle();
      send(entry.text, { photos: [], shown: true, me: entry, requestId: rid });
    }, 'btn ghost sm'));
    box.body.appendChild(acts);
    thread.appendChild(box);
    return box;
  }

  // Le niveau d'explication deviné vient de changer : on le dit, avec de quoi revenir aux explications détaillées.
  function levelNotice(move) {
    if (move === 'down') { noteLine('Je reprends les explications détaillées.', '', 'info', 'chat'); return; }
    if (move !== 'up') return;
    var line = noteLine('Tu as l’air d’avoir de l’expérience : je te réponds plus court.', '', 'info', 'chat');
    // Le niveau du parcours se déduit aussi de l'usage (lot 6) : proposé d'un clic, jamais changé en silence.
    if (fsState.level !== 'expert') {
      var pro = button('Passer en mode confirmé', function () { pro.remove(); setJourneyLevel('expert'); }, 'link');
      line.appendChild(pro);
    }
    var keep = button('Garde les explications détaillées', function () {
      habits = PlyoMachines.chooseLevel(habits, 'detailed');
      saveHabits();
      updateLevelLabel();
      keep.remove();
      line.appendChild(el('span', 'note-text', ' C’est noté : je garde les explications détaillées.'));
    }, 'link');
    line.appendChild(keep);
  }

  // Juste avant l'appel : ce qui est sur le plateau et ce qui a déjà été appliqué sur cette machine.
  var contextWaiter = null;
  function aiContext() {
    return new Promise(function (resolve) {
      var timer = setTimeout(function () { contextWaiter = null; resolve(null); }, 1500);
      contextWaiter = function (msg) { clearTimeout(timer); contextWaiter = null; resolve(msg); };
      window.orca.postMessage({ type: 'ai_context' });
    });
  }

  // `req` : { id (request_id, un par question, réutilisé par chaque nouvel essai de la même question), me (entrée de la
  // question dans la conversation, marquée « en attente » jusqu'à la réponse ou l'erreur) }.
  function ask(note, photos, req) {
    if (busy) return;          // une seule demande à la fois (un ancien « Réessayer » ne relance rien en parallèle)
    req = req || { id: Logic.newRequestId(window.crypto), me: null };
    busy = true;
    projectSwitched = false;
    sendButton.disabled = true;
    var target = conv;         // la réponse va dans la conversation de la question, quoi qu'il arrive
    var original = photos;     // photos telles que jointes : remises dans le champ après une erreur (jamais réduites)
    var controller = new AbortController();
    var idle = null;
    function touch() { clearTimeout(idle); idle = setTimeout(function () { controller.abort('timeout'); }, IDLE_TIMEOUT_MS); }
    touch();
    var cap = setTimeout(function () { controller.abort('timeout'); }, ANSWER_MAX_MS);
    var started = Date.now(), phase = '';
    var thinking = el('div', 'ai waiting');
    thinking.appendChild(whoLine(''));
    var waitRow = el('div', 'thinking');
    waitRow.setAttribute('role', 'status');
    for (var dot = 0; dot < 3; dot++) waitRow.appendChild(el('i'));
    var thinkingText = txt(Logic.waitingText(0, photos.length > 0, phase));
    var waitText = el('span');
    waitText.appendChild(thinkingText);
    waitRow.appendChild(waitText);
    waitRow.appendChild(button('Annuler', function () { controller.abort('cancel'); }, 'link'));
    thinking.appendChild(waitRow);
    thread.appendChild(thinking);
    // Une longue attente (recherches dans le catalogue, demande déjà en route) se voit : le texte change avec le temps.
    function sayWaiting() { thinkingText.textContent = fr(Logic.waitingText(Date.now() - started, photos.length > 0, phase)); }
    var ticker = setInterval(sayWaiting, 5000);
    answerBox = null;
    updateMoreBadge();
    scrollDown();
    // ROB-13 : la question est « en attente » dans la conversation enregistrée tant que rien n'est revenu.
    if (req.me) { req.me.pending = { id: req.id, at: new Date().toISOString(), photos: photos.length }; scheduleSave(target); }
    var live = null;           // réponse en cours d'écriture
    var out = {};              // événements du flux : final ou error
    var streaming = false;     // le flux a commencé : une coupure arrive pendant la réponse
    // Fin de la demande ; vrai si Orca a ouvert un autre projet entre-temps : le panneau repart alors sur ce projet.
    function finish() {
      clearTimeout(idle);
      clearTimeout(cap);
      clearInterval(ticker);
      thinking.remove();
      if (live) live.box.remove();
      busy = false;
      sendButton.disabled = false;
      if (req.me && req.me.pending) { delete req.me.pending; scheduleSave(target); }
      var switched = projectSwitched;
      projectSwitched = false;
      if (switched) { closeDrawer(); newConversation(); }
      drainPhoneQueue();
      return switched;
    }
    function fail(code, data) {
      var switched = finish();
      // La même question renvoyée telle quelle depuis le champ garde son identifiant (sameQuestion).
      lastAsked = { note: note, photos: original, id: req.id };
      if (code === 'cancel') { restoreDraft(note, original); noteLine(Logic.CANCEL_TEXT, '', 'info'); refreshGaugeSoon(); return; }
      if (code === 'timeout' || code === 'stream_cut') refreshGaugeSoon(); // le flux est fermé comme par « Annuler » : même facturation
      if (switched) { restoreDraft(note, original); switchedNote(Logic.projectSwitchText(false, false)); return; }
      if (code === 'unauthorized') {
        // Nouvel essai automatique après la connexion, avec le même identifiant.
        logout();
        requireLogin('Ta session a expiré : reconnecte-toi, ta demande repartira. Pas de mot de passe, tu reçois un code par e-mail.', function () { send(note, { photos: original, shown: true, me: req.me, requestId: req.id }); }, true);
        return;
      }
      // ROB-12 : rien à retaper, la demande revient dans le champ (sans repartir).
      restoreDraft(note, original);
      showError(code, function () { clearDraftIf(note, original); ask(note, original, req); }, data, false, function () { restoreDraft(note, original); noteInput.focus(); });
    }
    // Tu attendais la réponse dans la Discussion : le message y reste (les notes des Étapes s'effacent au changement d'étape).
    function switchedNote(text) { noteLine(text, 'warn', 'alert', 'chat'); applyTab('show-chat'); }
    function delay(ms) {
      return new Promise(function (resolve, reject) {
        if (controller.signal.aborted) { reject(new Error('aborted')); return; }
        var t = setTimeout(resolve, ms);
        controller.signal.addEventListener('abort', function () { clearTimeout(t); reject(new Error('aborted')); });
      });
    }

    // Profils au moment de la question : les réglages proposés ne s'appliquent qu'à eux (le slicer refuse sinon).
    var sentNames = lastValues && lastValues.context ? Logic.namesForApply(null, lastValues.context) : null;
    var pendingIntent = intentPending(); // questions d'intention affichées : l'IA peut y répondre d'après la phrase
    var plateParts = [];       // pièces sur le plateau au moment de la question (journal des pièces)
    var body = null;
    var limit = Logic.MAX_SEND_BYTES, shrunk = 0, lastBytes = 0, inProgressTries = 0;
    // Photos réduites d'un palier (ROB-03) : toujours depuis l'image jointe, jamais depuis une copie déjà réduite.
    function shrink(step) {
      return Promise.all(original.map(function (p) {
        var src = p.preview || 'data:' + p.media_type + ';base64,' + p.data;
        return scaled(src, step.side, step.quality).then(function (dataUrl) {
          return { media_type: 'image/jpeg', data: dataUrl.split(',')[1], preview: p.preview };
        }, function () { return p; });
      })).then(function (list) { photos = list; });
    }
    // Un envoi : taille vérifiée d'abord (au-delà, l'hébergeur refuserait sans que le panneau sache pourquoi), puis
    // nouvel essai espacé si la même demande tourne encore (409), ou réduction des photos si le service la dit trop lourde (413).
    function attempt() {
      if (controller.signal.aborted) return Promise.reject(new Error('aborted'));
      touch();
      if (photos.length) body.images = photos.map(function (p) { return { media_type: p.media_type, data: p.data }; });
      var json = JSON.stringify(body);
      var bytes = Logic.utf8Bytes(json);
      var plan = Logic.sizePlan(bytes, shrunk, photos.length > 0, limit);
      if (plan.tooBig) return Promise.resolve({ error: 'payload_too_large' });
      if (plan.shrink) { shrunk = plan.step; return shrink(plan.shrink).then(attempt); }
      lastBytes = bytes;
      return apiFetch('/api/diagnose', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/x-ndjson' }, body: json, signal: controller.signal }).then(function (response) {
        if (response.status === 409) return response.json().catch(function () { return {}; }).then(function (data) {
          var wait = Logic.inProgressDelay(inProgressTries++);
