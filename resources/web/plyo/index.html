      reduce.disabled = true;
      reducePart(entry, function (ok) { if (!ok) reduce.disabled = false; });
    }, 'btn ghost sm', 'wand');
    acts.appendChild(reduce);
    if (other) acts.appendChild(button('Refaire la préparation sur ' + other.label, function () { dropTooBig(); projectHandlers.pickPrinter(other.preset, other.label); }, 'btn ghost sm'));
    acts.appendChild(button('Garder cette taille', dropTooBig, 'link'));
    box.body.appendChild(acts);
    $('project-alert').appendChild(box);
    box.scrollIntoView({ block: 'nearest' });
  }
  function renderModel(entry, archived) {
    var msg = entry.msg;
    showConversation();
    var box = el('div', 'ai');
    box.appendChild(whoLine());
    var said = FS.modelAddedText(msg);
    var dims = msg.size_mm.join(' × ') + ' mm';
    function adviceButton() {
      var ask = button('Conseille-moi des réglages pour cette pièce', function () {
        ask.disabled = true;
        send('Je viens de poser « ' + msg.name + ' » sur le plateau (' + dims + '). Quels réglages me conseilles-tu pour l’imprimer ? ' +
          'Si tu as besoin de savoir à quoi sert la pièce, demande-le-moi d’abord.');
      }, 'btn ghost sm');
      return ask;
    }
    if (!said.warn) {
      var ok = el('div', 'note-line ok');
      ok.appendChild(icon('check', 14));
      ok.appendChild(el('span', 'note-text', said.text));
      box.appendChild(ok);
      if (!archived) box.appendChild(el('div', 'row-acts')).appendChild(adviceButton());
    } else {
      var warn = alertBox('warn', said.text, 'alert');
      if (!archived && !entry.reduced) {
        var acts = el('div', 'row-acts');
        var reduce = button('Réduire pour qu’il tienne', function () {
          reduce.disabled = true;
          reducePart(entry, function (done) { if (!done) reduce.disabled = false; });
        }, 'btn sm', 'wand');
        tooBigChat = function () { acts.textContent = ''; acts.appendChild(adviceButton()); };
        acts.appendChild(reduce);
        warn.body.appendChild(acts);
      }
      box.appendChild(warn);
    }
    if (msg.adaptation) box.appendChild(renderAdaptation(msg.adaptation, archived));
    thread.appendChild(box);
    scrollDown();
  }
  // « J'ai adapté ce fichier à ton projet » : les réglages du 3MF repris, ceux écartés, et « Annuler ».
  function renderAdaptation(a, archived) {
    var adapted = Array.isArray(a.adapted) ? a.adapted : [], dropped = Array.isArray(a.dropped) ? a.dropped : [];
    var box = alertBox(a.error ? 'warn' : 'tip', a.error ? 'Je n’ai pas pu adapter les réglages de ce fichier à ton projet : ' + a.error :
      adapted.length ? 'J’ai adapté ce fichier à ton imprimante et à ton filament : ' + adapted.length + ' réglage' + (adapted.length > 1 ? 's' : '') + ' changé' + (adapted.length > 1 ? 's' : '') + '.' :
      'Les réglages de ce fichier conviennent déjà à ton projet.', a.error ? 'alert' : 'check');
    if (adapted.length) {
      var list = el('ul', 'setup-checks');
      adapted.forEach(function (c) { list.appendChild(el('li', '', c.label + ' : ' + String(c.before).replace('.', ',') + ' → ' + String(c.after).replace('.', ','))); });
      box.body.appendChild(list);
    }
    if (dropped.length) {
      var skipped = el('p', 'muted small', 'Écartés (hors des limites sûres) : ' + dropped.map(function (d) { return d.label; }).join(', ') + '.');
      box.body.appendChild(skipped);
    }
    if (adapted.length && a.undo_id && !archived) {
      undoneListeners[a.undo_id] = function () {
        box.body.textContent = '';
        box.body.appendChild(rich('Annulé : j’ai remis les réglages d’avant.'));
      };
      var undo = button('Annuler', function () {
        undo.disabled = true;
        pendingSheet = { kind: 'undo', onResult: function (ok, text) { if (!ok) { undo.disabled = false; noteLine(text, 'error', 'alert'); } } };
        window.orca.postMessage({ type: 'undo', undo_id: a.undo_id });
      }, 'btn ghost sm', 'undo');
      box.body.appendChild(undo);
    }
    return box;
  }

  // ---------- Lien téléphone (un par conversation) ----------
  // Le panneau crée le lien et garde son QR ; la fenêtre QR (PhoneDialog) l'affiche. Chaque « Envoyer »
  // du téléphone crée un envoi, que le panneau récupère et envoie aussitôt à l'assistant.
  function openPhone() {
    if (requireLogin('Les photos du téléphone passent par le service Plyo.', openPhone)) return;
    refreshAccount().then(function (valid) {
      if (!valid) return;
      if (!phoneLink && !phoneCreating) {
        phoneCreating = apiFetch('/api/phone-sessions', { method: 'POST' })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
          .then(function (created) {
            phoneLink = { id: created.id, qr_svg: created.qr_svg };
            $('phone-linked').classList.remove('hidden');
            clearInterval(phoneTimer);
            phoneTimer = setInterval(pollPhone, PHONE_POLL_MS);
            return phoneLink;
          });
        phoneCreating.then(function () { phoneCreating = null; }, function () { phoneCreating = null; });
      }
      var ready = phoneLink ? Promise.resolve(phoneLink) : phoneCreating;
      ready
        .then(function (link) { window.orca.postMessage({ type: 'phone', link: link }); })
        .catch(function () { showError('network', openPhone); });
    });
  }

  // Coupe le lien (nouvelle conversation, déconnexion, lien expiré). `close` : prévenir le serveur.
  function unlinkPhone(close) {
    if (!phoneLink) return;
    if (close && session) apiFetch('/api/phone-sessions/' + encodeURIComponent(phoneLink.id), { method: 'DELETE' }).catch(function () {});
    clearInterval(phoneTimer);
    phoneLink = null;
    phoneQueue = [];
    $('phone-linked').classList.add('hidden');
  }

  function pollPhone() {
    if (!phoneLink || phoneCollecting || !session) return;
    var id = phoneLink.id;
    apiFetch('/api/phone-sessions/' + encodeURIComponent(id), { method: 'GET' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (s) {
        if (s.expired || s.status === 'closed') {
          unlinkPhone(false);
          noteLine('Le lien avec le téléphone a expiré. Clique sur l’icône du téléphone pour en créer un nouveau.', '', 'phone');
          return;
        }
        if (s.pending_batches > 0) return collectBatch(id);
      })
      .catch(function (status) { if (status === 404) unlinkPhone(false); });
  }

  // Une seule récupération à la fois ; l'envoi récupéré est mis en file (le serveur l'a déjà effacé),
  // puis transmis à l'assistant dès qu'il est libre, pour ne jamais perdre de photos.
  function collectBatch(id) {
    phoneCollecting = true;
    return apiFetch('/api/phone-sessions/' + encodeURIComponent(id) + '/photos', { method: 'GET' })
      .then(function (r) { return r.status === 200 ? r.json() : null; })
      .then(function (batch) {
        if (!batch) return;
        // `missing` : photos de l'envoi que le service n'a pas pu rendre ; les autres partent quand même.
        var missing = Logic.missingPhotosText(batch.missing);
        if (missing) noteLine(missing, 'error', 'alert');
        if (!batch.images || !batch.images.length) { if (!missing) noteLine('Les photos du téléphone n’ont pas pu être récupérées. Renvoie-les depuis le téléphone.', 'error', 'alert'); return; }
        phoneQueue.push({
          message: batch.message,
          photos: batch.images.map(function (img) {
            return { media_type: img.media_type, data: img.data, preview: 'data:' + img.media_type + ';base64,' + img.data };
          })
        });
        drainPhoneQueue();
      })
      .catch(function () { noteLine('Les photos du téléphone n’ont pas pu être récupérées. Renvoie-les depuis le téléphone.', 'error', 'alert'); })
      .then(function () { phoneCollecting = false; });
  }

  function drainPhoneQueue() {
    // Une carte de calibration qui attend sa photo la reçoit à la place d'une nouvelle demande.
    if (calibCard && calibCard.awaiting && phoneQueue.length) { calibCard.receivePhotos(phoneQueue.shift().photos); return; }
    if (busy || !lastValues || !phoneQueue.length) return;
    var next = phoneQueue.shift();
    send(next.message, { photos: next.photos, fromPhone: true });
  }

  // « Annuler » : toujours le même petit bouton discret avec son icône, à droite de « Fait ✓ ».
  function undoButton(label, onClick) {
    var b = button(label || 'Annuler', function () { b.disabled = true; onClick(b); }, 'btn ghost sm', 'undo');
    return b;
  }
  function markCell() { var m = el('span', 'mark'); m.appendChild(icon('check', 14)); return m; }
  function doneLabel(text, iconName) { var d = el('span', 'done'); d.appendChild(icon(iconName || 'check', 13)); d.appendChild(txt(text)); return d; }

  // ---------- Calibration guidée par photo ----------
  var CALIB = {
    temperature: { name: 'Tour de température', shows: 'la température où ton filament fait le moins de fils et soude bien ses couches', duration: '≈ 45 min', parts: 'Ta tour, étage par étage', pick: 'Choisis l’étage le plus propre', tower: true },
    flow: { name: 'Test de débit', shows: 'la quantité de plastique juste : ni trous, ni bourrelets sur le dessus', duration: '≈ 20 min par passe', parts: 'Les carrés du test', pick: 'Choisis le carré le plus lisse' },
    retraction: { name: 'Tour de rétraction', shows: 'la rétraction la plus courte qui supprime les fils', duration: '≈ 40 min', parts: 'Ta tour, bande par bande', pick: 'Choisis la bande la plus propre', tower: true },
    pressure_advance: { name: 'Test de pressure advance', shows: 'le réglage qui rend les angles nets, sans bourrelet', duration: '≈ 10 min', parts: 'Les lignes du motif', pick: 'Choisis la ligne aux angles les plus nets' },
    ironing: { name: 'Plaque de lissage', shows: 'le débit et l’espacement qui donnent le dessus le plus lisse', duration: '≈ 15 min', parts: 'Les carrés de la plaque', pick: 'Choisis le carré le plus lisse' }
  };
  var calibHistory = [];   // calibrations déjà faites pour ce filament sur cette imprimante (slicer)
  var calibCard = null;    // carte du test en cours

  function calibrationOffer(offer, secondary) {
    var info = CALIB[offer.test];
    var box = alertBox('tip', null, 'target');
    var title = el('div', 'offer-title');
    title.appendChild(el('b', '', info.name));
    title.appendChild(el('span', 'muted small', info.duration));
    box.body.appendChild(title);
    box.body.appendChild(el('p', '', offer.reason || ('Ce test montre ' + info.shows + '.')));
    var start = button('Lancer le test', function () {
      start.disabled = true;
      pendingSheet = { kind: 'calib', onResult: function (ok, t) { if (!ok) { start.disabled = false; noteLine(t, 'error', 'alert'); } } };
      window.orca.postMessage({ type: 'calib_start', test: offer.test, pass: 1 });
    }, secondary ? 'btn ghost sm' : 'btn sm', 'target');
    box.body.appendChild(el('div', 'row-acts')).appendChild(start);
    return box;
  }

  function onCalibStarted(msg) {
    pendingSheet = null;
    if (calibCard) calibCard.box.remove();
    showConversation();
    var info = CALIB[msg.test];
    record({ kind: 'note', text: info.name + ' posé sur le plateau.', tone: '', icon: 'target' });
    var box = el('div', 'ai');
    box.appendChild(whoLine(info.name + (msg.test === 'flow' ? ' — passe ' + msg.pass + ' sur 2' : '')));
    box.appendChild(el('p', '', 'Le test est sur le plateau. Ce qu’il va montrer : ' + info.shows + '. ' + msg.instructions));
    box.appendChild(el('p', 'why', 'Ta pièce et tes réglages sont gardés : « Remettre ma pièce » les ramène à tout moment.'));

    var sheet = el('div', 'sheet');
    var sheetHead = el('header', 'calib-head');
    sheetHead.appendChild(el('span', '', info.parts));
    sheetHead.appendChild(el('b', '', info.pick));
    sheet.appendChild(sheetHead);
    var choice = null;
    var group = 'calib-' + Date.now();
    // Une tour se lit comme on la tient : le haut en premier, avec un repère « En haut » / « En bas ».
    var rows = Logic.calibOrder(msg.sections, info.tower).map(function (s) {
      var row = el('label', 'row');
      var radio = el('input');
      radio.type = 'radio';
      radio.name = group;
      var info2 = el('div', 'calib-row');
      info2.appendChild(el('span', 'name', s.label));
      if (s.where) info2.appendChild(el('span', 'badge-pill', s.where));
      row.appendChild(radio);
      row.appendChild(info2);
      radio.addEventListener('change', function () { choice = s; updateActions(); });
      sheet.appendChild(row);
      return { radio: radio, row: row, s: s };
    });
    var status = el('div', 'status', 'Pas sûr ? Une fois le test imprimé, envoie-moi une photo : je t’aide à choisir.');
    sheet.appendChild(status);
    var footer = el('footer');
    // Libellés courts et parallèles : les deux boutons tiennent côte à côte à 320 px.
    var photoBtn = button('Photo', null, 'btn', 'camera');
    photoBtn.title = fr('Ajouter une photo depuis l’ordinateur');
    var phoneBtn = button('Téléphone', null, 'btn ghost', 'phone');
    phoneBtn.title = fr('Prendre la photo avec ton téléphone');
    var action = button('', null, 'btn full hidden');
    var back = button('Remettre ma pièce', null, 'link');
    footer.appendChild(photoBtn);
    footer.appendChild(phoneBtn);
    footer.appendChild(action);
    footer.appendChild(back);
    sheet.appendChild(footer);
    box.appendChild(sheet);
    thread.appendChild(box);
    scrollDown();

    var card = { box: box, awaiting: true, test: msg.test, pass: msg.pass };
    calibCard = card;

    function updateActions() {
      if (!choice) return;
      action.classList.remove('hidden');
      action.disabled = false;
      action.textContent = fr(msg.test === 'flow' && msg.pass === 1 ? 'Lancer la passe fine' : 'Enregistrer ' + choice.label + ' pour ce filament');
      // Le choix fait, l'enregistrement devient l'action principale ; la photo reste possible en secondaire.
      photoBtn.classList.add('ghost');
    }

    function setPhotoButtons(enabled) { photoBtn.disabled = !enabled; phoneBtn.disabled = !enabled; }

    function analyze(photos) {
      if (card.analyzing) return;
      card.analyzing = true;
      card.awaiting = false;
      setPhotoButtons(false);
      status.textContent = fr('L’assistant regarde ta photo…');
      scrollDown();
      var body = {
        locale: (lastValues && lastValues.locale) || 'fr',
        test: msg.test,
        pass: msg.test === 'flow' ? msg.pass : undefined,
        images: photos.map(function (p) { return { media_type: p.media_type, data: p.data }; }),
        sections: msg.sections,
        filament: lastValues && lastValues.context ? lastValues.context.filament : undefined,
        printer: lastValues && lastValues.context ? lastValues.context.printer : undefined
      };
      if (!session) {
        status.textContent = fr('Connecte-toi pour que l’assistant lise la photo, ou choisis toi-même le meilleur.');
        card.awaiting = true; card.analyzing = false; setPhotoButtons(true);
        requireLogin('Pour lire la photo de ton test, je l’envoie à l’IA.', function () { analyze(photos); });
        return;
      }
      apiFetch('/api/calibration/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (response) { return response.json().then(function (data) { return { ok: response.ok, data: data }; }); })
        .then(function (r) {
          card.analyzing = false;
          setPhotoButtons(true);
          if (calibCard !== card) return;
          if (!r.ok) {
            if (r.data.error === 'insufficient_credits') setGauge(r.data.gauge, true);
            status.textContent = fr(Logic.errorView(r.data.error, r.data).text + ' Tu peux aussi choisir toi-même le meilleur.');
            card.awaiting = true;
            return;
          }
          if (r.data.credits) setGauge(r.data.credits.gauge);
          if (r.data.status !== 'ok') {
            status.textContent = fr(r.data.retake_advice);
            card.awaiting = true;
            return;
          }
          var win = rows.find(function (x) { return x.s.index === r.data.winner_index; });
          win.radio.checked = true;
          win.row.classList.add('best');
          choice = win.s;
          status.textContent = '';
          status.appendChild(el('strong', '', 'Le meilleur : ' + win.s.label + (CONFIDENCE[r.data.confidence] ? ' · ' + CONFIDENCE[r.data.confidence] : '') + '. '));
          status.appendChild(txt(r.data.explanation + ' Tu as la pièce en main : choisis-en un autre si tu n’es pas d’accord.'));
          updateActions();
          scrollDown();
        })
        .catch(function () { card.analyzing = false; setPhotoButtons(true); if (calibCard === card) { status.textContent = fr(Logic.errorView('network').text + ' Tu peux aussi choisir toi-même le meilleur.'); card.awaiting = true; } });
    }
    card.receivePhotos = analyze;

    photoBtn.addEventListener('click', function () {
      var input = el('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.multiple = true;
      input.addEventListener('change', function () {
        var files = Array.prototype.slice.call(input.files || []).slice(0, MAX_PHOTOS);
        Promise.all(files.map(function (f) { return downscale(f).catch(function () { return null; }); })).then(function (list) {
          var ok = list.filter(Boolean);
          if (ok.length) analyze(ok);
          else noteLine('Cette image ne peut pas être lue : prends plutôt du JPEG ou du PNG.', 'error', 'alert');
        });
      });
      input.click();
    });
    phoneBtn.addEventListener('click', function () { card.awaiting = true; openPhone(); });

    action.addEventListener('click', function () {
      action.disabled = true;
      if (msg.test === 'flow' && msg.pass === 1) {
        pendingSheet = { kind: 'calib', onResult: function (ok, t) { if (!ok) { action.disabled = false; status.textContent = fr(t); } } };
        window.orca.postMessage({ type: 'calib_start', test: 'flow', pass: 2, base_value: choice.value });
        return;
      }
      pendingSheet = { kind: 'calib_save', onResult: function (ok, t) {
        if (!ok) { action.disabled = false; status.textContent = fr(t); return; }
        record({ kind: 'note', text: info.name + ' : ' + t, tone: 'ok', icon: 'check' });
        footer.textContent = '';
        footer.appendChild(doneLabel(t));
        var restored = false;
        var restore = button('Remettre ma pièce', function () { restoreCalibration(restore, function (okR) { restored = okR; }); }, 'btn');
        footer.appendChild(restore);
        if (msg.test === 'ironing') {
          // Le lissage s'active sur le profil de ta pièce : la remettre d'abord, sinon la remise l'effacerait.
          var on = button('Remettre ma pièce et activer le lissage', null, 'btn ghost');
          on.dataset.keep = '1';
          var activate = function () {
            pendingSheet = { kind: 'apply', onResult: function (okOn, tt) { on.replaceWith(okOn ? doneLabel('Lissage activé') : el('span', 'fail-text', tt)); } };
            window.orca.postMessage({ type: 'apply', changes: [{ id: 'ironing_type', value: 'top' }], why: 'Plaque de lissage' });
          };
          on.addEventListener('click', function () {
            on.disabled = true;
            if (restored) { activate(); return; }
            restoreCalibration(on, function (okR) { restored = okR; if (okR) activate(); else on.disabled = false; });
          });
          footer.appendChild(on);
        }
      } };
      window.orca.postMessage({ type: 'calib_save', test: msg.test, value: choice.value });
    });
    back.addEventListener('click', function () { restoreCalibration(back); });
  }

  function restoreCalibration(btn, after) {
    btn.disabled = true;
    pendingSheet = { kind: 'calib_restore', onResult: function (ok, t) {
      if (!ok) { btn.disabled = false; noteLine(t, 'error', 'alert'); if (after) after(false); return; }
      if (calibCard) { calibCard.awaiting = false; calibCard.box.querySelectorAll('button:not([data-keep])').forEach(function (b) { b.disabled = true; }); }
      calibCard = null;
      noteLine(t, 'ok', 'check');
      if (after) after(true);
    } };
    window.orca.postMessage({ type: 'calib_restore' });
  }

  // ---------- Premiers pas : parcours « Ma première impression », « Tu regardes », fiches ----------
  var fsState = {};
  var tourSignals = null;  // derniers signaux : objets, découpage, temps, poids
  var focusKey = null;
  // Repli de « Montre-moi » quand la zone n'a pas pu être encadrée.
  var WHERE = {
    printer: 'Dans la colonne de gauche, sous « Imprimante » : le nom de ta machine.',
    filament: 'Dans la colonne de gauche, sous « Filament » : la bobine utilisée.',
    slice: 'En haut à droite, le bouton « Découper la plaque ».',
    print: 'En haut à droite, juste à côté de « Découper la plaque ».',
    plate: 'Au centre de la fenêtre : le plateau en 3D.'
  };

  function durationText(seconds) {
    var m = Math.max(1, Math.round(seconds / 60));
    return m < 60 ? 'environ ' + m + ' min' : 'environ ' + Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0');
  }
  function printSummary() {
    if (!tourSignals || !tourSignals.sliced || !tourSignals.time_s) return '';
    var grams = tourSignals.weight_g ? ' et ' + Math.round(tourSignals.weight_g) + ' g de filament' : '';
    return 'Ton impression prendra ' + durationText(tourSignals.time_s) + grams + '.';
  }
  // Étape « Ton filament » : la matière écrite sur la bobine, puis les températures de son étiquette.
  // « 205 », « 205 °C » ou une fourchette « 190-220 » (on prend le milieu, arrondi à 5 °C) ; null si illisible.
  function labelTemp(text) {
    var nums = String(text || '').match(/\d+/g);
    if (!nums) return null;
    var a = +nums[0], b = nums.length > 1 ? +nums[1] : a;
    return Math.round((a + b) / 2 / 5) * 5;
  }

  // Le parcours guidé appartient au projet : il commence quand la fiche est complète, et se range dans la conversation.
  function currentTourStep() {
    if (!conv || PlyoProject.nextStep(conv.project) !== 'ready') return null;
    var step = conv.project.step || 'slice';
    return FS.TOUR_STEPS.indexOf(step) >= 0 ? step : null;
  }
  function setTourStep(step) {
    conv.project.step = step || 'done';
    projectChanged();
  }

  // Parcours d'installation d'une imprimante (recherche réseau, installation, liaison) : seule chose qui reste dans cet emplacement.
  function renderSetupFlow() {
    var slot = $('tour-slot');
    slot.textContent = '';
    document.body.classList.toggle('touring', !!setup.phase);
    if (setup.phase) renderSetup(slot);
  }

  // ---------- « Ça a marché ? » ----------
  // Des réglages proposés par l'IA ont été appliqués : au moins 30 minutes plus tard (au démarrage, puis toutes
  // les 3 heures), une carte demande le résultat. Il est gardé dans la mémoire de la machine, et partagé
  // anonymement seulement si l'utilisateur a coché la case (désactivée par défaut).
  var outcomeAsked = {};      // entrées déjà montrées pendant cette session
  var afterConvLoaded = null; // suite à donner une fois une conversation rouverte (réponse « Non »)
  function askOutcome() { window.orca.postMessage({ type: 'outcome_pending' }); }
  setInterval(askOutcome, 3 * 60 * 60 * 1000);
  function onOutcomePending(items) {
    var item = Logic.firstDueOutcome((items || []).filter(function (it) { return !outcomeAsked[it.at]; }), new Date());
    if (!item) return;
    outcomeAsked[item.at] = true;
    renderOutcome(item);
  }
  var outcomeSeq = 0;
  function renderOutcome(item) {
    var slot = $('outcome-slot');
    slot.textContent = '';
    var q = Logic.outcomeQuestion(item, function (id) { var p = paramOf(id); return p.label === id ? null : p; });
    var box = el('div', 'card');
    // Une question qui attend une réponse : un groupe nommé par son titre, pas une annonce (role="status").
    var titleId = 'outcome-title-' + (++outcomeSeq);
    box.setAttribute('role', 'group');
    box.setAttribute('aria-labelledby', titleId);
    var head = el('header');
    head.appendChild(icon('help', 16));
    var title = el('span', '', q.title);
    title.id = titleId;
    head.appendChild(title);
    box.appendChild(head);
    box.appendChild(el('p', '', q.text));
    if (q.changes.length) {
      var list = el('ul', 'meta');
      q.changes.forEach(function (c) { list.appendChild(el('li', '', c)); });
      box.appendChild(list);
    }
    var said = el('textarea', 'field');
    said.maxLength = 200;
    said.rows = 2;
    said.placeholder = fr('Un mot à ajouter ? (facultatif)');
    said.setAttribute('aria-label', 'Un mot à ajouter sur le résultat (facultatif)');
    var share = el('input');
    share.type = 'checkbox';
    share.checked = !!fsState.share_outcomes;
    share.addEventListener('change', function () { window.orca.postMessage({ type: 'firststeps_set', patch: { share_outcomes: share.checked } }); });
    var shareLabel = el('label', 'check-line');
    shareLabel.appendChild(share);
    shareLabel.appendChild(el('span', '', 'Partager anonymement ce résultat pour améliorer Plyo : les noms de tes profils d’imprimante et de filament, le problème, les réglages changés et le jour ; jamais ton compte ni de photo.'));
    function answer(outcome) {
      var note = outcome === 'later' ? '' : said.value.trim();
      // Le mot reste sur l'ordinateur (mémoire de la machine, journal) ; il n'est jamais partagé.
      window.orca.postMessage({ type: 'outcome_set', machine: item.machine, at: item.at, conv: item.conv, outcome: outcome, note: note });
      slot.textContent = '';
      if (outcome === 'later') delete outcomeAsked[item.at]; // redemandé au prochain passage (3 reports au plus)
      if (outcome !== 'later' && share.checked && session)
        // Envoi discret : une réponse { ok, duplicate } (déjà reçu) comme une erreur ne changent rien pour l'utilisateur.
        apiFetch('/api/outcomes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Logic.outcomePayload(item, outcome)) }).catch(function () {});
      if (outcome === 'ok') noteLine('Super ! Je m’en souviendrai pour mes prochains conseils sur cette imprimante.', 'ok', 'check');
      if (outcome === 'bad') renderOutcomeBad(item, note);
    }
    // Oui et Non pèsent le même poids : la carte ne souffle pas la réponse.
    var answers = el('div', 'answers');
    answers.appendChild(button('Oui', function () { answer('ok'); }, 'btn ghost'));
    answers.appendChild(button('Non', function () { answer('bad'); }, 'btn ghost'));
    box.appendChild(said);
    box.appendChild(answers);
    box.appendChild(button('Pas encore imprimé, redemande-moi plus tard', function () { answer('later'); }, 'link'));
    box.appendChild(shareLabel);
    slot.appendChild(box);
  }

  // « Ça n'a pas marché » : les réglages essayés sont encore appliqués. On propose de les retirer (sans appel à
  // l'IA), puis de chercher une autre piste ou d'envoyer une photo.
  function renderOutcomeBad(item, note) {
    var slot = $('outcome-slot');
    slot.textContent = '';
    var box = el('div', 'card');
    var titleId = 'outcome-title-' + (++outcomeSeq);
    box.setAttribute('role', 'group');
    box.setAttribute('aria-labelledby', titleId);
    var head = el('header');
    head.appendChild(icon('flag', 16));
    var title = el('span', '', 'Ça n’a pas marché');
    title.id = titleId;
    head.appendChild(title);
    var close = button('', function () { slot.textContent = ''; }, 'icon-btn push');
    close.title = 'Fermer';
    close.setAttribute('aria-label', 'Fermer');
    close.appendChild(icon('x', 14));
    head.appendChild(close);
    box.appendChild(head);
    var revert = Logic.revertChanges(item, lastValues && lastValues.params);
    box.appendChild(el('p', '', revert.length
      ? 'C’est noté, je ne te reproposerai pas ces réglages. Ils sont encore appliqués : tu peux remettre ceux d’avant, puis on cherche une autre piste.'
      : 'C’est noté, je ne te reproposerai pas ces réglages. Tes réglages ont déjà changé depuis : on peut chercher une autre piste.'));
    var acts = el('div', 'stack');
    var status = el('p', 'fail-text hidden');
    if (revert.length) {
      var undo = button(revert.length > 1 ? 'Remettre mes anciens réglages' : 'Remettre mon ancien réglage', function () {
        undo.disabled = true;
        status.classList.add('hidden');
        pendingSheet = { kind: 'apply', onResult: function (ok, text) {
          // Valeur d'avant hors des plages d'aujourd'hui : le slicer refuse, et on montre pourquoi.
          if (!ok) { undo.disabled = false; status.textContent = fr(text); status.classList.remove('hidden'); return; }
          var done = el('div', 'undo-row');
          done.appendChild(doneLabel('Anciens réglages remis. Découpe à nouveau la plaque pour en tenir compte.', 'undo'));
          undo.replaceWith(done);
        } };
        // Sans « ask » : un retour en arrière ne doit pas reposer la question « Ça a marché ? ».
        window.orca.postMessage({ type: 'apply', revert: true, changes: revert, why: 'Retour aux réglages d’avant' + (item.why ? ' (' + item.why + ')' : '') });
      }, 'btn', 'undo');
      acts.appendChild(undo);
    }
    // Version fiable : les réglages d'une impression qui avait marché, gardés par Plyo pour cette imprimante + ce filament.
    var reliableSlot = el('div');
    acts.appendChild(reliableSlot);
    askReliable(function (info) {
      if (!info.available) return;
      var back = button('Revenir à ma dernière version fiable', function () {
        back.disabled = true;
        status.classList.add('hidden');
        reliableResult = function (res) {
          if (!res.ok) { back.disabled = false; status.textContent = fr(res.text); status.classList.remove('hidden'); return; }
          var done = el('div', 'undo-row');
          done.appendChild(doneLabel(Logic.savedText(res) || res.text, 'undo'));
          back.replaceWith(done);
        };
        window.orca.postMessage({ type: 'restore_reliable' });
      }, 'btn', 'undo');
      reliableSlot.appendChild(back);
    });
    acts.appendChild(button('Chercher une autre piste', function () {
      var followUp = function () {
        noteInput.value = Logic.retryPrompt(item, note);
        noteInput.focus();
        noteInput.setSelectionRange(noteInput.value.length, noteInput.value.length);
      };
      // La conversation d'origine se recharge sans attendre : la suite vient une fois qu'elle est affichée.
      if (item.conv && (!conv || conv.id !== item.conv)) { afterConvLoaded = followUp; openConversation(item.conv); }
      else followUp();
    }, revert.length ? 'btn ghost' : 'btn', 'search'));
    box.appendChild(acts);
    box.appendChild(status);
    box.appendChild(button('Envoyer une photo du résultat', function () {
      noteInput.value = Logic.retryPrompt(item, note);
      pickFiles();
    }, 'link', 'camera'));
    slot.appendChild(box);
  }

  // ---------- Vérification avant impression ----------
  // Après chaque nouveau découpage, le slicer mesure le plateau ; preflight.js en déduit les risques. Une carte
  // n'apparaît que s'il y en a. Rien n'est envoyé à l'IA, sauf si l'utilisateur clique « En parler à l'assistant ».
  var sliceSig = null;        // signature du dernier découpage vu (null : pas encore de signal)
  var checkAskedFor = null;   // signature du découpage dont la vérification a été demandée
  var preflightManual = false;
  var dismissedRisks = {};    // risques ignorés pendant cette session
  setInterval(function () { window.orca.postMessage({ type: 'tour_signals' }); }, 2000);
  function watchSlice(signals) {
    var r = Logic.newSlice(sliceSig, signals);
    sliceSig = r.sig;
    if (!signals.sliced) plateChecked = ''; // découpe périmée : ce qui avait été vérifié ne vaut plus
    // Plaque déjà découpée en arrivant à l'étape (pièce reconnue sur le plateau) : aucune nouvelle découpe ne lancerait la vérification.
    var unchecked = signals.sliced && !plateChecked && checkAskedFor !== r.sig && conv && PlyoProject.nextStep(conv.project) === 'ready';
    if (r.fire || unchecked) { checkAskedFor = r.sig; window.orca.postMessage({ type: 'preflight' }); }
  }
  function checkPlate() {
    preflightManual = true;
    setTimeout(function () { preflightManual = false; }, 5000); // sans réponse (erreur), le prochain contrôle redevient automatique
    window.orca.postMessage({ type: 'preflight' });
  }
  function onPreflight(data) {
    var manual = preflightManual;
    preflightManual = false;
    // Une carte ignorée ne revient pas d'elle-même tant que ses risques restent les mêmes ; « Vérifier » la remontre.
    var risks = window.PlyoPreflight.preflightRisks(data);
    var fresh = risks.filter(function (r) { return !dismissedRisks[window.PlyoPreflight.riskKey(r)]; });
    openRisks = fresh.length;
    plateChecked = !risks.length ? 'clean' : fresh.length ? 'open' : 'ignored';
    renderPreflight(manual || fresh.length ? risks : [], data);
    // Découpe faite et aucun risque : on passe à l'impression sans demander.
    if (!manual && currentTourStep() === 'slice' && data && data.sliced && data.objects && data.objects.length && PlyoJourney.afterPreflight(openRisks) === 'advance') {
      noteLine('Pas de risque détecté : on passe à l’impression.', 'ok', 'check', 'guide');
      setTourStep('print');
    } else renderProject();
    if (!manual || risks.length) return;
    var slot = $('preflight-slot');
    var close = function () { slot.textContent = ''; };
    if (!data || !data.objects || !data.objects.length) {
      var empty = emptyState('cube', 'Ton plateau est vide', 'Ajoute une pièce : je la vérifie avant que tu lances l’impression.', 'Ajouter un modèle', function () { close(); pickFiles(); });
      empty.querySelector('.btn').classList.add('ghost'); // le bouton plein de l'étape reste celui de la ligne d'action
      empty.appendChild(button('Fermer', close, 'link'));
      slot.appendChild(empty);
    } else if (!data.sliced) {
      slot.appendChild(resultCard('info', 'Rien à signaler pour l’instant', 'Découpe la plaque pour que je vérifie aussi les parties dans le vide.',
        button('Découper la plaque', function () { close(); plateAction('slice'); }, 'btn ghost sm', 'wand'), close));
    } else {
      slot.appendChild(resultCard('check', 'Ta plaque est prête à imprimer', 'Rien à signaler : les pièces tiennent, collent bien au plateau et ne sont pas dans le vide.', null, close));
    }
  }
  // Petite carte de résultat (vérification sans souci) : titre, phrase, action éventuelle, « Fermer ».
  function resultCard(iconName, title, text, action, onClose) {
    var box = el('div', 'card');
    box.setAttribute('role', 'status');
    var head = el('header');
    head.appendChild(icon(iconName, 16));
    head.appendChild(el('span', '', title));
    var x = button('', onClose, 'icon-btn push');
    x.setAttribute('aria-label', 'Fermer');
    x.title = 'Fermer';
    x.appendChild(icon('x', 14));
    head.appendChild(x);
    box.appendChild(head);
    box.appendChild(el('p', 'muted', text));
    if (action) box.appendChild(el('div', 'row-acts')).appendChild(action);
    return box;
  }
  // Carte « Avant d'imprimer » : neutre (le badge ambre porte l'alerte), les soucis rangés par pièce, puis une
  // liste de corrections à cocher et un seul bouton principal, comme la fiche de réglages.
  var preflightSeq = 0;
  function renderPreflight(risks, data) {
    var PF = window.PlyoPreflight;
    var slot = $('preflight-slot');
    slot.textContent = '';
    preflightFix = null;
    if (!risks.length) return;
    var plan = PF.preflightPlan(data);
    var plateCount = data && data.objects ? data.objects.length : undefined;
    var box = el('div', 'card attention');
    var titleId = 'preflight-title-' + (++preflightSeq);
    box.setAttribute('role', 'group');
    box.setAttribute('aria-labelledby', titleId);
    var head = el('header');
    head.appendChild(icon('alert', 16));
    var title = el('span', '', 'Avant d’imprimer');
    title.id = titleId;
    head.appendChild(title);
    head.appendChild(el('span', 'badge-pill warn', plan.count > 1 ? plan.count + ' pièces' : '1 pièce'));
    var dismiss = button('', function () {
      risks.forEach(function (r) { dismissedRisks[PF.riskKey(r)] = true; });
      closeCard();
    }, 'icon-btn push');
    dismiss.title = 'Ignorer pour cette plaque';
    dismiss.setAttribute('aria-label', 'Ignorer pour cette plaque');
    dismiss.appendChild(icon('x', 14));
    head.appendChild(dismiss);
    box.appendChild(head);

    plan.parts.forEach(function (part) {
      var block = el('div', 'pf-part');
      block.appendChild(el('b', '', part.name));
      var ul = el('ul');
      part.issues.forEach(function (t) { ul.appendChild(el('li', '', t)); });
      block.appendChild(ul);
      box.appendChild(block);
    });

    var list = el('div', 'fix-list');
    list.appendChild(el('div', 'fix-head', 'Ce que je peux corriger'));
    var rows = plan.fixes.map(function (f) {
      var row = el('label', 'row' + (f.checked ? '' : ' off'));
      var check = el('input');
      check.type = 'checkbox';
      check.checked = f.checked;
      var info = el('div');
      info.appendChild(el('div', 'name', f.label));
      info.appendChild(el('div', 'why', f.key === 'orient' ? 'Autre solution : tourner les pièces pour avoir moins de vide.'
        : 'Pour ' + f.objects.map(function (n) { return '« ' + n + ' »'; }).join(', ') + '.'));
      row.appendChild(check);
      row.appendChild(info);
      list.appendChild(row);
      check.addEventListener('change', function () { row.classList.toggle('off', !check.checked); update(); });
      return { fix: f, check: check, row: row };
    });
    box.appendChild(list);

    var fail = el('p', 'fail-text hidden');
    var acts = el('div', 'stack');
    var fixAll = button('', null, 'btn ghost');
    acts.appendChild(fixAll);
    box.appendChild(acts);
    box.appendChild(fail);
    var talk = button('En parler à l’assistant', function () {
      closeCard();
      send('Avant d’imprimer, Plyo me signale : ' + risks.map(function (r) { return r.text; }).join(' ') + ' Que me conseilles-tu ?');
    }, 'link');
    box.appendChild(talk);

    // Carte fermée : plus de risque ouvert, donc plus de bouton « Appliquer les correctifs » dans la ligne d'action.
    function closeCard() { slot.textContent = ''; preflightFix = null; openRisks = 0; plateChecked = 'ignored'; renderProject(); }
    preflightFix = function () { if (fixAll.disabled) return false; fixAll.click(); return true; };
    function picked() { return rows.filter(function (r) { return r.check.checked; }); }
    // « Tout corriger » tant que la sélection est celle conseillée ; sinon « Corriger » ce qui est coché.
    function update() {
      var n = picked().length;
      var advised = rows.every(function (r) { return r.check.checked === r.fix.checked; });
      fixAll.textContent = fr(!n ? 'Rien de coché' : (advised ? 'Tout corriger (' : 'Corriger (') + n + ')');
      fixAll.disabled = !n;
    }
    update();
    function lock(on) { rows.forEach(function (r) { r.check.disabled = on; }); fixAll.disabled = on; }

    // Réglages cochés en un seul envoi (une étape à annuler), puis les actions sur le plateau, l'une après l'autre.
    fixAll.addEventListener('click', function () {
      var fixes = picked().map(function (r) { return r.fix; });
      var changes = PF.fixChanges(fixes);
      var actions = fixes.filter(function (f) { return f.action; });
      var undoId = 0;
      lock(true);
      fail.classList.add('hidden');
      function stop(text) { lock(false); update(); if (text) { fail.textContent = fr(text); fail.classList.remove('hidden'); } }
      function next(i) {
        if (i >= actions.length) return finished();
        plateAction(actions[i].action, function (ok) { if (ok) next(i + 1); else stop(''); }, null, plateCount);
      }
      function finished() {
        box.classList.remove('attention');
        box.textContent = '';
        var h = el('header');
        h.appendChild(icon('check', 16));
        h.appendChild(el('span', '', 'Corrigé'));
        box.appendChild(h);
        box.appendChild(el('p', 'muted', 'Je redécoupe la plaque et je revérifie.'));
        var row = el('div', 'row-acts');
        plateAction('slice'); // la nouvelle vérification remplace cette carte
        // « Annuler » au bout de la ligne « fait », comme partout ailleurs.
        if (undoId) h.appendChild(undoButton('Annuler', function (b) {
          pendingSheet = { kind: 'undo', onResult: function (ok, t) {
            if (!ok) { b.disabled = false; noteLine(t, 'error', 'alert'); return; }
            slot.textContent = '';
            noteLine('Réglages d’avant remis.', '', 'undo');
          } };
          window.orca.postMessage({ type: 'undo', undo_id: undoId });
        }));
        if (h.lastChild.classList.contains('btn')) h.lastChild.classList.add('push');
        box.appendChild(row);
      }
      if (!changes.length) return next(0);
      pendingSheet = { kind: 'apply', onResult: function (ok, text, result) {
        if (!ok) return stop(text);
        undoId = (result && result.undo_id) || 0;
        next(0);
      } };
      window.orca.postMessage({ type: 'apply', changes: changes, why: 'Vérification avant impression' });
    });
    slot.appendChild(box);
  }

  function onTourSignals(signals) {
    watchSlice(signals);
    var hadSummary = !!printSummary();
    var wasLinked = !!(tourSignals && tourSignals.linked);
    tourSignals = signals;
    // Pièce posée sur le plateau autrement que par ce panneau (Fichier › Importer d'Orca, glisser-déposer) : elle remplit la fiche.
    if (signals.objects === 0) projectUI.oldPart = null;
    var plated = projectUI.waitingFile ? null : PlyoProject.partFromPlate(conv && conv.project, signals, projectUI.oldPart);
    if (plated) { conv.project.part = { name: plated, fromPlate: true }; projectUI.oldPart = null; projectChanged(); }
    var step = currentTourStep();
    // La découpe est périmée (un réglage a changé) : on redécoupe avant d'imprimer, y compris après une correction à l'étape Résultat.
    if ((step === 'print' || step === 'after') && FS.nextTourStep(step, signals, projectUI.fixedAfter === conv) === 'slice') { projectUI.fixedAfter = null; setTourStep('slice'); return; }
    // Le contenu des étapes 4 et 5 (temps, poids, machine reliée) dépend de ces signaux.
    var sig = JSON.stringify([signals.sliced, signals.linked, signals.time_s, signals.objects === 0]);
    if (sig !== onTourSignals.last) { onTourSignals.last = sig; renderProject(); }
  }

  function onFirstSteps(state) {
    var first = !fsState.hasOwnProperty('seen');
    fsState = state;
    // Aucune imprimante installée (premier lancement) : l'assistant commence par elle, une fois par session.
    if (state.needs_printer && !setup.phase && !setup.offered) startSetup();
    renderSetupFlow();
    if (first && state.level === 'expert' && !state.greeted) window.orca.postMessage({ type: 'firststeps_set', patch: { greeted: true } });
  }

  function explain(key) { window.orca.postMessage({ type: 'explain', key: key }); }

  // Fiche d'un réglage : texte livré dans Plyo (fiches.js), sinon l'aide du slicer ; valeur actuelle jugée hors ligne.
  function onExplain(msg) { applyTab('show-chat'); renderFiche(record({ kind: 'fiche', msg: msg }).msg, false); }
  function renderFiche(msg, archived) {
    var fiche = window.PLYO_FICHES[msg.key];
    showConversation();
    var box = el('div', 'ai fiche');
    box.appendChild(whoLine('explication gratuite'));
    var label = fiche ? fiche.label : msg.label;
    box.appendChild(el('h3', '', label));
    function part(title, text) { if (text) { box.appendChild(el('h4', '', title)); box.appendChild(el('p', '', text)); } }
    if (fiche) {
      part('À quoi ça sert', fiche.what);
      part('Si c’est trop haut', fiche.high);
      part('Si c’est trop bas', fiche.low);
      part('Faut-il y toucher ?', fiche.touch);
    } else {
      part('À quoi ça sert', msg.tooltip || 'Je n’ai pas encore de fiche pour ce réglage : demande-moi, je t’explique.');
    }
    if (msg.value !== null && msg.value !== undefined) {
      var shown = typeof msg.value === 'number' ? String(msg.value).replace('.', ',') : msg.value;
      var judged = FS.judgeValue({ value: msg.value, min: msg.min === null ? undefined : msg.min, max: msg.max === null ? undefined : msg.max,
        systemValue: typeof msg.system_value === 'number' ? msg.system_value : undefined });
      box.appendChild(el('h4', '', archived ? 'Chez toi, ce jour-là' : 'Chez toi'));
      box.appendChild(el('p', 'value', 'Valeur : ' + shown + (msg.unit ? ' ' + msg.unit : '') + '. ' + judged.text));
    }
    var acts = el('div', 'row-acts');
    acts.appendChild(button('Montre-moi où il est', function () { showSetting(msg.key); }, 'btn ghost sm', 'eye'));
    if (!archived) acts.appendChild(button('Et dans mon cas, je mets combien ?', function () { send('Pour le réglage « ' + label + ' » : quelle valeur me conseilles-tu dans mon cas, et pourquoi ?'); }, 'btn ghost sm'));
    box.appendChild(acts);
    thread.appendChild(box);
    scrollDown();
  }

  $('focus-explain').addEventListener('click', function () { if (focusKey) explain(focusKey); });
  $('focus-close').addEventListener('click', function () { $('focus-chip').classList.add('hidden'); });

  // ---------- Envoi d'une demande ----------
  var CONFIDENCE = { high: 'Confiance élevée', medium: 'Confiance moyenne', low: 'Confiance faible' };

  function renderMe(entry) {
    showConversation();
    var me = el('div', 'me');
    if (entry.thumbs && entry.thumbs.length) {
      var grid = el('div', 'thumbs');
      entry.thumbs.forEach(function (src) { var i = el('img'); i.src = src; i.alt = ''; grid.appendChild(i); });
      me.appendChild(grid);
    }
    if (entry.text) me.appendChild(el('div', 'text', entry.text));
    if (entry.fromPhone) { var f = el('span', 'from'); f.appendChild(icon('phone', 11)); f.appendChild(txt('Envoyé depuis le téléphone')); me.appendChild(f); }
    thread.appendChild(me);
    scrollDown();
    return me;
  }

  // Ta demande dans le fil (vignettes gardées dans la conversation) ; le titre vient de la première demande.
  function addMe(text, photos, fromPhone) {
    var entry = record({ kind: 'me', text: text, thumbs: [], fromPhone: !!fromPhone });
    if (!conv.title) conv.title = Logic.conversationTitle(text, photos.length, new Date().toISOString());
    renderMe({ text: text, fromPhone: fromPhone, thumbs: photos.map(function (p) { return p.preview; }) });
    // La conversation garde des vignettes de 160 px, pas les photos entières.
    Promise.all(photos.map(function (p) { return scaled(p.preview, THUMB_SIDE, 0.7).catch(function () { return null; }); })).then(function (thumbs) {
      entry.thumbs = thumbs.filter(Boolean);
      scheduleSave();
    });
    return entry;
  }

  // `opts` : { photos (du téléphone), fromPhone, shown (la demande est déjà dans le fil) }.
  function send(text, opts) {
    opts = opts || {};
    var note = (text || '').trim();
    if (busy) return;
    var photos = opts.photos || attachments.slice();
    if (!note && !photos.length) { noteInput.focus(); return; }
    applyTab('send'); // envoyer un message ouvre la Discussion
    var guessed = PlyoMachines.guessLevel(habits, PlyoIntent.detectLevel(conv.history.filter(function (m) { return m.role === 'user'; }).map(function (m) { return m.text; }).concat([note])));
    if (guessed.level !== habits.level) { habits = guessed; saveHabits(); updateLevelLabel(); }
    renderProject();
    if (!lastValues) { noteLine('Je lis encore les réglages du slicer : réessaie dans une seconde.', '', 'info'); return; }
    // « C'est quoi la rétraction ? » : la fiche du réglage répond, gratuitement et sans compte.
    var ficheKey = !opts.photos && !photos.length ? FS.matchSettingQuestion(note, window.PLYO_FICHES) : null;
    if (ficheKey) {
      if (!opts.shown) addMe(note, [], false);
      noteInput.value = ''; growNote();
      explain(ficheKey);
      return;
    }
    if (!opts.photos) { attachments = []; renderAttachments(); noteInput.value = ''; growNote(); }
    if (!opts.shown) addMe(note, photos, opts.fromPhone);
    var again = { photos: photos, fromPhone: opts.fromPhone, shown: true };
    if (requireLogin('Pour te répondre, j’envoie ta demande à l’IA.', function () { send(note, again); })) return;
    ask(note, photos);
  }

  // Juste avant l'appel : ce qui est sur le plateau et ce qui a déjà été appliqué sur cette machine.
  var contextWaiter = null;
  function aiContext() {
    return new Promise(function (resolve) {
      var timer = setTimeout(function () { contextWaiter = null; resolve(null); }, 1500);
      contextWaiter = function (msg) { clearTimeout(timer); contextWaiter = null; resolve(msg); };
      window.orca.postMessage({ type: 'ai_context' });
    });
  }

  function ask(note, photos) {
    if (busy) return;          // une seule demande à la fois (un ancien « Réessayer » ne relance rien en parallèle)
    busy = true;
    sendButton.disabled = true;
    var target = conv;         // la réponse va dans la conversation de la question, quoi qu'il arrive
    var controller = new AbortController();
    var idle = null;
    function touch() { clearTimeout(idle); idle = setTimeout(function () { controller.abort('timeout'); }, IDLE_TIMEOUT_MS); }
    touch();
    var cap = setTimeout(function () { controller.abort('timeout'); }, ANSWER_MAX_MS);
    var thinking = el('div', 'thinking');
    thinking.appendChild(el('i'));
    thinking.appendChild(txt(photos.length ? 'Je regarde ta photo…' : 'Je réfléchis…'));
    thinking.appendChild(button('Annuler', function () { controller.abort('cancel'); }, 'link'));
    thread.appendChild(thinking);
    answerBox = null;
    updateMoreBadge();
    scrollDown();
    var live = null;           // réponse en cours d'écriture
    var out = {};              // événements du flux : final ou error
    function finish() {
      clearTimeout(idle);
      clearTimeout(cap);
      thinking.remove();
      if (live) live.box.remove();
      busy = false;
      sendButton.disabled = false;
      drainPhoneQueue();
    }
    function fail(code, data) {
      finish();
      if (code === 'cancel') { noteLine('Demande annulée.', '', 'info'); return; }
      if (code === 'unauthorized') { logout(); requireLogin('Ta session a expiré.', function () { send(note, { photos: photos, shown: true }); }); return; }
      showError(code, function () { ask(note, photos); }, data);
    }

    // Profils au moment de la question : les réglages proposés ne s'appliquent qu'à eux (le slicer refuse sinon).
    var sentNames = lastValues && lastValues.context ? Logic.namesForApply(null, lastValues.context) : null;
    var pendingIntent = intentPending(); // questions d'intention affichées : l'IA peut y répondre d'après la phrase
    var plateParts = [];       // pièces sur le plateau au moment de la question (journal des pièces)
    aiContext().then(function (ctx) {
      if (ctx && ctx.plate && ctx.plate.objects) plateParts = ctx.plate.objects.map(function (o) { return o.name; });
      var body = {
        locale: lastValues.locale || 'fr',
        settings: { params: lastValues.params.map(function (p) { return { id: p.id, value: p.value, unit: p.unit }; }) },
        context: lastValues.context,
        history: conv.history.slice(-MAX_HISTORY)
      };
      if (photos.length) body.images = photos.map(function (p) { return { media_type: p.media_type, data: p.data }; });
      if (note) body.note = note;
      if (calibHistory.length) body.calibrations = calibHistory;
      if (ctx && ctx.plate) body.plate = ctx.plate;
      if (ctx && ctx.memory && ctx.memory.length) body.memory = ctx.memory;
      if (ctx && ctx.limits && Object.keys(ctx.limits).length) body.filament_limits = ctx.limits;
      // Mode catalogue : toutes les valeurs Filament + Impression, pour que l'assistant puisse proposer n'importe quel réglage.
      if (ctx && ctx.snapshot && Object.keys(ctx.snapshot).length) body.snapshot = ctx.snapshot;
      body.explanation_level = PlyoMachines.levelOf(habits);
      if (pendingIntent) body.intent_questions = pendingIntent;
      return apiFetch('/api/diagnose', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/x-ndjson' }, body: JSON.stringify(body), signal: controller.signal });
    }).then(function (response) {
      if (response.status === 401) return { error: 'unauthorized' };
      var type = response.headers.get('Content-Type') || '';
      if (type.indexOf('ndjson') < 0 || !response.body)
        return response.json().catch(function () { return {}; }).then(function (data) {
          if (response.ok) return { final: data };
          // Corps sans code (proxy, limite de débit) : le statut HTTP suffit à choisir le message.
          var code = data.error || (response.status === 429 ? 'rate_limited' : response.status === 409 ? 'request_in_progress' : 'internal');
          return { error: code, gauge: data.gauge, data: Object.assign({}, data, { retry_after: Logic.retryAfter(data, response.headers.get('Retry-After')) }) };
        });
      // Réponse en flux : les textes s'affichent au fur et à mesure, puis la réponse complète remplace le brouillon.
      var reader = response.body.getReader(), decoder = new TextDecoder(), nd = Logic.ndjsonReader();
      function handle(events) {
        events.forEach(function (ev) {
          if (ev.type === 'partial') { if (!live) { thinking.classList.add('hidden'); live = liveAnswer(function () { controller.abort('cancel'); }); } live.update(ev); }
          else if (ev.type === 'final') out.final = ev;
          else if (ev.type === 'error') { out.error = ev.error; out.data = ev; }
        });
      }
      function pump() {
        return reader.read().then(function (r) {
          touch();
          if (r.done) { handle(nd.end()); return out.final || out.error ? out : { error: 'incomplete_answer' }; }
          handle(nd.push(decoder.decode(r.value, { stream: true })));
          return pump();
        });
      }
      return pump();
    }).then(function (r) {
      if (r.error) {
        if (r.error === 'insufficient_credits') setGauge(r.gauge, true);
        fail(r.error, r.data);
        return;
      }
      done(r.final);
    }).catch(function () {
      // Réponse complète déjà reçue (coupure juste après) : on la garde, elle est payée.
      if (out.final) { done(out.final); return; }
      fail(controller.signal.aborted ? (controller.signal.reason === 'cancel' ? 'cancel' : 'timeout') : 'network');
    });

    function done(a) {
      finish();
      if (a.credits) setGauge(a.credits.gauge);
      // Mode catalogue : les réglages de n'importe quel onglet arrivent dans « changes » ; la fiche les montre comme les autres.
      a.suggestions = (a.suggestions || []).concat(Logic.catalogToSuggestions(a.changes));
      if (sentNames) a.names = sentNames;
      // 2 000 caractères au plus : au-delà, l'API refuserait toutes les demandes suivantes de la conversation.
      target.history.push({ role: 'user', text: ((photos.length ? '(' + photos.length + ' photo(s) envoyée(s)) ' : '') + note).slice(0, 2000) });
      var hist = { role: 'assistant', text: summaryForHistory(a) };
      target.history.push(hist);
      target.history = target.history.slice(-MAX_HISTORY);
      var entry = record({ kind: 'answer', data: a, photoCount: photos.length, question: note, date: new Date().toISOString(), applied: false }, target);
      // Ce que les ordres ont réellement fait remplacera « demandé » dans l'historique (non enregistré avec l'entrée).
      Object.defineProperty(entry, 'hist', { value: hist, enumerable: false, writable: true });
      journalAnswer(a, target, plateParts, photos);
      if (pendingIntent && Array.isArray(a.intent_answers) && a.intent_answers.length && target === conv) applyIntentAnswers(a.intent_answers);
      // Un souci d'affichage n'est pas une erreur réseau : la réponse est gardée, rien n'est redemandé.
      if (target !== conv) return;
      try { renderAnswer(entry, false); }
      catch (e) { noteLine('La réponse est arrivée mais n’a pas pu s’afficher. Rouvre la conversation depuis « Mes conversations ».', 'error', 'alert'); }
    }
  }

  // Une réponse sur une pièce du plateau entre dans le journal des pièces, avec une vignette de la première photo.
  function journalAnswer(a, target, parts, photos) {
    var key = a.defect && a.defect.key;
    if (a.status !== 'ok' || !parts.length || !key || key === 'general_question' || key === 'unknown') return;
    // Un simple ordre sur le plateau (« penche la pièce ») n'est pas un problème d'impression à suivre.
    if (a.commands && a.commands.length && !a.suggestions.length) return;
    var first = photos[0];
    var src = first ? (first.preview || 'data:' + first.media_type + ';base64,' + first.data) : null;
    (src ? scaled(src, 160, 0.7) : Promise.resolve('')).catch(function () { return ''; }).then(function (thumb) {
      var ctx = lastValues.context || {};
      window.orca.postMessage({ type: 'journal_add', conv: target.id, parts: parts.slice(0, 3), printer: ctx.printer || '', filament: ctx.filament || '',
        problem: a.defect.name || '', defect: key, thumb: thumb });
    });
  }

  // Erreur : ce qui s'est passé et l'action suivante. La demande est gardée pour « Réessayer ».
  function showError(code, retry, data) {
    showConversation();
    var view = Logic.errorView(code, data);
    var g = code === 'insufficient_credits' ? Logic.gaugeView(lastGauge) : null;
    // « Une autre demande est en cours » n'est pas une panne : simple information, sans bouton.
    var box = view.action === 'none' ? alertBox('info', view.text, 'info')
      : alertBox('error', view.text + (g && g.resets ? ' Elle se recharge ' + g.resets + '.' : ''), 'alert');
    var acts = el('div', 'row-acts');
    if (view.action === 'credits') acts.appendChild(button('Voir mon utilisation', openUsage, 'btn sm'));
    else if (view.action === 'login') acts.appendChild(button('Me reconnecter', openLogin, 'btn sm'));
    else if (view.action === 'photo') acts.appendChild(button('Choisir une autre photo', function () { box.remove(); pickFiles(); }, 'btn sm', 'camera'));
    else if (view.action === 'retry' && retry) {
      var again = button('Réessayer', function () { box.remove(); retry(); }, 'btn sm');
      acts.appendChild(again);
      // Trop de demandes : le bouton attend la fin du délai annoncé, avec le compte à rebours.
      if (view.wait) {
        var left = view.wait;
        again.disabled = true;
        var tick = function () {
          if (!again.isConnected) return;
          if (left <= 0) { again.disabled = false; again.textContent = fr('Réessayer'); return; }
          again.textContent = fr('Réessayer dans ' + left + ' s');
          left--;
          setTimeout(tick, 1000);
        };
        setTimeout(tick, 0); // une fois la carte dans le fil
      }
    }
    box.body.appendChild(acts);
    thread.appendChild(box);
    scrollDown();
    applyTab('answer');
  }

  // Brouillon de la réponse pendant que l'IA l'écrit ; « Arrêter » reste à portée de main.
  function liveAnswer(onStop) {
    var box = el('div', 'ai');
    var who = whoLine();
    who.appendChild(button('Arrêter', onStop, 'link', 'stop'));
    box.appendChild(who);
    var title = el('h3');
    var diag = el('div', 'diag');
    diag.appendChild(title);
    var explanation = el('div');
    var message = el('div');
    box.appendChild(diag);
    box.appendChild(explanation);
    box.appendChild(message);
    thread.appendChild(box);
    scrollToAnswerTop(box);
    // Le curseur suit la fin du texte en cours d'écriture.
    function set(target, text, caret) {
      target.textContent = '';
      if (!text) return;
      var r = rich(text);
      var last = r.lastElementChild;
      if (caret && last) (last.tagName === 'P' ? last : last.lastElementChild || last).classList.add('caret');
      target.appendChild(r);
    }
    return {
      box: box,
      update: function (p) {
        title.textContent = fr(p.name || '');
        set(explanation, p.explanation, !p.message);
        set(message, p.message, !!p.message);
        updateMoreBadge(); // le brouillon grandit vers le bas, la vue reste sur son début
      }
    };
  }

  // Ce que l'assistant a répondu, pour le renvoyer dans l'historique au tour suivant.
  function summaryForHistory(a, commandsResult) {
    var parts = [a.message];
    var orders = Logic.commandsForHistory(a, commandsResult || null);
    if (orders) parts.push(orders);
    a.questions.forEach(function (q) { parts.push(q.text + ' (' + q.choices.join(' / ') + ')'); });
    a.suggestions.forEach(function (s) { parts.push('suggestion: ' + s.id + ' ' + (s.delta !== null ? 'delta ' + s.delta : '= ' + s.value)); });
    return parts.join('\n').slice(0, 2000);
  }

  // Valeur avant et après pour la fiche de réglages.
  function change(s) {
    if (s.catalog) return { label: s.label, key: s.id, before: s.beforeText || formatValue(s.before, s.unit), after: s.valueText || formatValue(s.value, s.unit) };
    var p = paramOf(s.id);
    var after = s.delta !== null && typeof p.value === 'number' ? p.value + s.delta : s.value;
    return { label: p.label, key: p.key, before: formatValue(p.value, p.unit), after: formatValue(after, p.unit) };
  }

  // Nom du réglage : un clic l'explique (fiche gratuite) quand Plyo en a une.
  function settingName(label, key) {
    if (!key || !window.PLYO_FICHES[key]) return el('div', 'name', label);
    var b = el('button', 'setting-name');
    b.type = 'button';
    b.title = fr('C’est quoi ce réglage ?');
    b.appendChild(txt(label));
    b.appendChild(icon('help', 13));
    b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); explain(key); });
    return b;
  }

  // Une conversation rouverte montre ses fiches en lecture : appliquer un écart calculé sur d'anciennes valeurs serait faux.
  function renderSheet(container, entry, archived) {
    var suggestions = entry.data.suggestions;
    var sheet = el('div', 'sheet');
    var day = entry.date ? dayOf(entry.date) : '';
    sheet.appendChild(el('header', '', archived ? (entry.applied ? 'Réglages appliqués le ' + day : 'Réglages proposés le ' + day) : 'Réglages proposés'));
    var rows = [];
    // Réglages du catalogue groupés par onglet d'Orca (Refroidissement, Qualité…) ; les autres restent en tête, sans titre.
    Logic.groupByTab(suggestions).forEach(function (g) {
      if (g.tab) sheet.appendChild(el('div', 'group-title', g.tab));
      g.items.forEach(function (s) { rows.push(buildRow(s)); });
    });
    function buildRow(s) {
      var c = archived && entry.changes && entry.changes[s.id] ? entry.changes[s.id] : change(s);
      var row = el(archived ? 'div' : 'label', 'row' + (archived ? ' static' : ''));
      var box = null;
      if (archived) row.appendChild(entry.applied ? markCell() : el('span', 'mark', '•'));
      else { box = el('input'); box.type = 'checkbox'; box.checked = Logic.defaultChecked(s); row.classList.toggle('off', !box.checked); row.appendChild(box); }
      var info = el('div');
      info.appendChild(settingName(c.label, c.key));
      var delta = el('div', 'delta');
      delta.appendChild(el('span', 'old', c.before));
      delta.appendChild(el('span', 'arrow', '→'));
      delta.appendChild(el('span', 'new', c.after));
      info.appendChild(delta);
      if (s.reason) info.appendChild(el('div', 'why', s.reason));
      if (!archived && s.beyond) info.appendChild(el('div', 'why', '⚠ Hors de la plage conseillée par le fabricant de ton filament : à toi de décider.'));
      else if (!archived && s.confirm) info.appendChild(el('div', 'why', '⚠ Réglage sensible : vérifie-le avant de l’appliquer.'));
      row.appendChild(info);
      sheet.appendChild(row);
      if (box) box.addEventListener('change', function () { row.classList.toggle('off', !box.checked); updateCount(); });
      return { box: box, s: s, row: row, c: c };
    }
    if (!archived) {
      // Libellés et valeurs gardés tels qu'affichés : une conversation rouverte ne dépend pas des réglages du moment.
      entry.changes = {};
      rows.forEach(function (r) { entry.changes[r.s.id] = r.c; });
      scheduleSave();
    }
    if (archived) {
      if (!entry.applied) sheet.appendChild(el('div', 'status', 'Pour les appliquer aujourd’hui, redemande-moi : tes réglages ont pu changer depuis.'));
      container.appendChild(sheet);
      return;
    }

    var footer = el('footer', 'inline');
    var apply = button('', null, 'btn wide');
    var ignore = button('Ignorer', null, 'btn ghost');
    footer.appendChild(apply);
    footer.appendChild(ignore);
    sheet.appendChild(footer);
    // Modifications manuelles non enregistrées : elles partent avec le lot, on le dit avant d'appliquer.
    var manualNote = el('div', 'status hidden');
    sheet.insertBefore(manualNote, footer);
    askManualEdits(function (items) {
      var line = Logic.manualEditsText(items);
      if (line) { manualNote.textContent = fr(line); manualNote.classList.remove('hidden'); }
    });
    var fail = el('div', 'fail hidden');
    sheet.appendChild(fail);

    function checked() { return rows.filter(function (r) { return r.box.checked; }); }
    function updateCount() {
      var n = checked().length;
      apply.textContent = fr(n ? 'Appliquer ' + n + ' réglage' + (n > 1 ? 's' : '') : 'Aucun réglage coché');
      apply.disabled = !n;
    }
    updateCount();

    function lock(locked) { rows.forEach(function (r) { r.box.disabled = locked; }); apply.disabled = locked; ignore.disabled = locked; }

    apply.addEventListener('click', function () {
      var picked = checked();
      var changes = picked.map(function (r) {
        // Réglage du catalogue : la case cochée à la main vaut confirmation s'il sort de la plage du fabricant.
        if (r.s.catalog) return { key: r.s.id, value: r.s.value, label: r.s.label, confirmed_outside_range: !!r.s.beyond };
        return r.s.delta !== null ? { id: r.s.id, delta: r.s.delta } : { id: r.s.id, value: r.s.value };
      });
      fail.classList.add('hidden');
      lock(true);
      pendingSheet = { kind: 'apply', onResult: function (ok, text, result) {
        if (!ok) { lock(false); updateCount(); fail.textContent = fr(text); fail.classList.remove('hidden'); return; }
        var undoId = result && result.undo_id;
        // La conversation garde ce qui a été appliqué, valeurs comprises, pour la relire plus tard.
        entry.applied = true;
        entry.data.suggestions = picked.map(function (r) { return r.s; });
        scheduleSave();
        rows.forEach(function (r) { if (!r.box.checked) r.row.remove(); else r.box.replaceWith(markCell()); });
        sheet.querySelector('header').textContent = fr('Réglages appliqués');
        footer.textContent = '';
        footer.classList.add('undo-row');
        var preset = lastValues && lastValues.context ? lastValues.context.process : '';
        footer.appendChild(doneLabel('Appliqué'));
        var savedLine = Logic.savedText(result);
        if (savedLine) footer.appendChild(el('p', 'muted small footnote', fr(savedLine)));
        else if (preset) footer.appendChild(el('p', 'muted small footnote', 'Le préréglage « ' + preset + ' » est marqué modifié : enregistre-le si tu veux garder ces réglages.'));
        function showUndone() {
          entry.applied = false;
          scheduleSave();
          footer.textContent = '';
          footer.appendChild(doneLabel('Réglages d’avant remis', 'undo'));
        }
        if (undoId) undoneListeners[undoId] = showUndone;
        footer.appendChild(undoButton('Annuler', function (undoBtn) {
          pendingSheet = { kind: 'undo', onResult: function (okUndo, msg) {
            if (okUndo) return; // la fiche est prévenue par undoneListeners
            undoBtn.disabled = false;
            fail.textContent = fr(msg);
            fail.classList.remove('hidden');
          } };
          window.orca.postMessage({ type: 'undo', undo_id: undoId || 0 });
        }));
      } };
      // `ask` : ces réglages viennent de l'IA, Plyo demandera plus tard si l'impression a marché.
      var names = Logic.namesForApply(entry.data, lastValues && lastValues.context);
      window.orca.postMessage({ type: 'apply', changes: changes, print_name: names.process, filament_name: names.filament, printer_name: names.printer, why: (entry.data.defect && entry.data.defect.name) || '',
        ask: { conv: conv ? conv.id : '', defect: (entry.data.defect && entry.data.defect.key) || '' } });
    });
    ignore.addEventListener('click', function () { sheet.remove(); });
    container.appendChild(sheet);
  }

  // Questions de l'IA : une réponse par question, puis un seul envoi.
  function renderQuestions(container, entry, archived) {
    var qs = entry.data.questions;
    var picks = entry.answers || {};
    var wrap = el('div', 'questions');
    var sendBtn = button('Envoyer mes réponses', null, 'btn sm');
    qs.forEach(function (q, i) {
      wrap.appendChild(el('p', 'q', q.text));
      var row = el('div', 'chips');
      q.choices.forEach(function (c) {
        var chip = el('button', 'chip' + (picks[i] === c ? ' on' : ''), c);
        chip.type = 'button';
        chip.disabled = archived || !!entry.answered;
        chip.addEventListener('click', function () {
          picks[i] = c;
          row.querySelectorAll('.chip').forEach(function (b) { b.classList.toggle('on', b === chip); });
          sendBtn.disabled = !Logic.allAnswered(qs, picks);
        });
        row.appendChild(chip);
      });
      wrap.appendChild(row);
    });
    if (!archived && !entry.answered) {
      sendBtn.disabled = !Logic.allAnswered(qs, picks);
      sendBtn.addEventListener('click', function () {
        entry.answered = true;
        entry.answers = picks;
        scheduleSave();
        wrap.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
        send(Logic.combineAnswers(qs, picks));
      });
      wrap.appendChild(el('div', 'row-acts')).appendChild(sendBtn);
    }
    container.appendChild(wrap);
  }

  // « Signaler » : la réponse semble fausse ou inutile. Gratuit ; sert à corriger l'assistant.
  function feedbackLink(entry) {
    var link = button('Signaler', null, 'link');
    link.addEventListener('click', function () {
      var form = el('div', 'feedback');
      var input = el('textarea', 'field');
      input.maxLength = 1000;
      input.placeholder = 'Qu’est-ce qui ne va pas dans cette réponse ? (facultatif)';
      input.setAttribute('aria-label', 'Ce qui ne va pas');
      var acts = el('div', 'row-acts');
      var go = button('Envoyer le signalement', function () {
        go.disabled = true;
        var a = entry.data;
        apiFetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
          verdict: 'bad', comment: input.value.trim() || undefined, question: (entry.question || '').slice(0, 2000), locale: (lastValues && lastValues.locale) || 'fr',
          answer: { status: a.status, defect: a.defect, message: a.message, suggestions: a.suggestions, actions: a.actions || [] },
          context: lastValues && lastValues.context ? { printer: lastValues.context.printer, filament: lastValues.context.filament } : undefined
        }) })
          .then(function (r) { return r.ok ? null : Promise.reject(); })
          .then(function () { form.replaceWith(doneLabel('Merci, c’est noté : on s’en sert pour corriger l’assistant.')); entry.flagged = true; scheduleSave(); })
          .catch(function () { go.disabled = false; go.textContent = fr('Réessayer l’envoi'); });
      }, 'btn sm');
      acts.appendChild(go);
      acts.appendChild(button('Laisser tomber', function () { form.replaceWith(link); }, 'link'));
      form.appendChild(input);
      form.appendChild(acts);
      link.parentNode.parentNode.insertBefore(form, link.parentNode.nextSibling);
      link.remove();
      input.focus();
    });
    return link;
  }

  function renderAnswer(entry, archived) {
    var a = entry.data;
    showConversation();
    var box = el('div', 'ai');
    box.appendChild(whoLine(entry.photoCount ? 'd’après ' + (entry.photoCount > 1 ? 'tes ' + entry.photoCount + ' photos' : 'ta photo') : ''));

    var isDefect = a.status === 'ok' && a.defect && ['user_goal', 'no_defect', 'unknown', 'general_question'].indexOf(a.defect.key) < 0;
    if (a.status !== 'question' && a.status !== 'off_topic' && a.defect && a.defect.name) {
      var diag = el('div', 'diag');
      diag.appendChild(el('h3', '', a.defect.name));
      if (isDefect && CONFIDENCE[a.confidence]) diag.appendChild(el('span', 'pill', CONFIDENCE[a.confidence]));
      box.appendChild(diag);
      if (a.defect.explanation) box.appendChild(rich(a.defect.explanation));
    }

    if (a.suggestions.length) {
      renderSheet(box, entry, archived);
      if (a.message) { var tip = alertBox('tip', a.message, 'bulb'); box.appendChild(tip); }
    } else if (a.message) {
      box.appendChild(rich(a.message));
    }
    var dropped = Logic.rejectedNote(a);
    if (dropped) box.appendChild(el('p', 'muted small', fr(dropped)));

    if (a.commands && a.commands.length) box.appendChild(renderCommands(entry, archived));
    var actions = renderActions(a.actions, archived);
    if (actions) box.appendChild(actions);
    // Un seul bouton principal par réponse : « Appliquer » s'il y a une fiche, le test passe alors en secondaire.
    if (!archived && a.calibration_offer && CALIB[a.calibration_offer.test]) box.appendChild(calibrationOffer(a.calibration_offer, a.suggestions.length > 0));
    if (a.questions && a.questions.length) renderQuestions(box, entry, archived);

    var foot = el('div', 'ai-foot');
    if (session && a.status !== 'off_topic' && !entry.flagged) foot.appendChild(feedbackLink(entry));
    if (foot.children.length) box.appendChild(foot);
    thread.appendChild(box);
    // Réponse neuve : on reste sur son début (le badge invite à lire la suite) ; réponse rouverte : comme avant, en bas.
    if (archived) scrollDown(); else { scrollToAnswerTop(box); applyTab('answer'); }
  }

  // ---------- Actions ----------
  sendButton.addEventListener('click', function () { send(noteInput.value); });
  // Entrée envoie, Maj + Entrée va à la ligne (pas pendant la saisie d'un caractère composé).
  // Le champ commence sur une ligne et grandit quand on écrit (six lignes au plus).
  function growNote() { noteInput.style.height = 'auto'; noteInput.style.height = Math.min(noteInput.scrollHeight, 132) + 'px'; }
  noteInput.addEventListener('input', growNote);
  noteInput.addEventListener('keydown', function (e) {
    if (Logic.isSendKey(e)) { e.preventDefault(); send(noteInput.value); }
  });
  $('btn-files').addEventListener('click', pickFiles);
  $('btn-phone').addEventListener('click', openPhone);
  $('phone-linked').addEventListener('click', openPhone);
  $('goals').querySelectorAll('.chip').forEach(function (chip) { chip.addEventListener('click', function () { send(chip.textContent); }); });

  // ---------- Messages du slicer ----------
  var autoOpening = null;     // plus de réouverture d'office au lancement : reste à null
  var saveFailedShown = false; // « conversation trop longue » : dit une seule fois
  window.orca.onMessage(function (msg) {
    if (!msg || !msg.type) return;
    if (msg.type === 'session') {
      session = msg.session;
      showLoggedIn(!!session);
      if (session) {
        dropLoginCard();
        refreshAccount();
        if (afterLogin) { var retry = afterLogin; afterLogin = null; retry(); }
      }
    } else if (msg.type === 'values') {
      var firstValues = !lastValues;
      renderValues(msg);
      checkDivergence();
      if (firstValues) askOutcome(); // au démarrage, une fois les libellés des réglages connus
      window.orca.postMessage({ type: 'calib_history' }); // l'historique dépend du filament et de l'imprimante en cours
      drainPhoneQueue();
    } else if (msg.type === 'result') {
      syncProjectNames(msg.saved);
      if (msg.can_restore) offerRestore();
      if (msg.undone_id && undoneListeners[msg.undone_id]) { undoneListeners[msg.undone_id](); delete undoneListeners[msg.undone_id]; }
      if (pendingSheet) { var p = pendingSheet; pendingSheet = null; p.onResult(msg.ok, msg.text, msg); }
      else noteLine(msg.text, msg.ok ? 'ok' : 'error', msg.ok ? 'check' : 'alert');
      // Corriger à l'étape Résultat, c'est préparer la prochaine impression : la découpe est à refaire.
      if (msg.ok && msg.undo_id && currentTourStep() === 'after') {
        projectUI.fixedAfter = conv;
        if (viewUI.tab === 'chat') noteLine('Ces réglages demandent une nouvelle découpe : retourne à l’onglet « Étapes » pour redécouper et réimprimer.', '', 'info');
      }
    } else if (msg.type === 'calib_started') {
      onCalibStarted(msg);
    } else if (msg.type === 'calib_history') {
      calibHistory = Array.isArray(msg.items) ? msg.items : [];
    } else if (msg.type === 'phone_batch_ready') {
      pollPhone(); // la fenêtre QR s'est fermée sur un envoi : on le traite sans attendre le prochain tour
    } else if (msg.type === 'model_added') {
      onModelAdded(msg);
    } else if (msg.type === 'firststeps') {
      onFirstSteps(msg.state || {});
    } else if (msg.type === 'tour_signals') {
      onTourSignals(msg);
    } else if (msg.type === 'show_me') {
      if (!msg.ok && WHERE[msg.target]) noteLine(WHERE[msg.target], '', 'pin', 'guide');
    } else if (msg.type === 'show_setting') {
      onShowSetting(msg);
    } else if (msg.type === 'explain') {
      onExplain(msg);
    } else if (msg.type === 'focus_setting') {
      $('focus-label').textContent = fr(msg.label);
      focusKey = msg.key;
      $('focus-chip').classList.remove('hidden');
    } else if (msg.type === 'ai_context') {
      if (contextWaiter) contextWaiter(msg);
    } else if (msg.type === 'reliable') {
      if (reliableWaiter) { var rw = reliableWaiter; reliableWaiter = null; rw(msg); }
    } else if (msg.type === 'restore_reliable_result') {
      if (reliableResult) { var rr = reliableResult; reliableResult = null; rr(msg); }
    } else if (msg.type === 'manual_edits') {
      if (manualWaiter) { var waiter = manualWaiter; manualWaiter = null; waiter(msg.items || []); }
      var listeners = manualListeners; manualListeners = []; listeners.forEach(function (f) { f(msg.items || []); });
    } else if (msg.type === 'limits') {
      onLimits(msg);
    } else if (msg.type === 'journal') {
      fillJournal(msg.events || []);
    } else if (msg.type === 'printer_scan_result' && projectUI.bgScan) {
      var asked = setup.phase === 'scan'; // l'installation a demandé la même recherche pendant celle d'arrière-plan : le résultat sert aux deux
      onBackgroundScan(msg.printers);
      if (asked) onSetupScan(msg.printers || []);
    } else if (msg.type === 'printer_scan_result') {
      var found = Array.isArray(msg.printers) ? msg.printers : [];
      if (setup.phase === 'scan') onSetupScan(found);
    } else if (msg.type === 'project_changed') {
      // Nouveau projet ou projet ouvert : retour à l'accueil (la conversation précédente reste dans « Mes conversations »).
      if (!busy) { closeDrawer(); newConversation(); }
    } else if (msg.type === 'filament_chosen') {
