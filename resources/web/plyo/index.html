<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant Plyo</title>
<style>
  /* Les variables --orca-* sont injectées par OrcaSlicer (thème clair ou sombre).
     Les valeurs de repli servent seulement à ouvrir la page dans un navigateur. */
  :root {
    --bg: var(--orca-bg, #ffffff);
    --fg: var(--orca-fg, #262e30);
    --muted: var(--orca-muted, #6b6b6b);
    --border: var(--orca-border, #dbdbdb);
    --accent: var(--orca-accent, #009688);
    --font: var(--orca-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--accent); }
  section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  section h2 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  #messages { flex: 1; overflow-y: auto; border-bottom: 1px solid var(--border); }
  .message {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    line-height: 1.4;
  }
  .message + .message { margin-top: 6px; }
  .message.error { border-left-color: #e14747; }
  .empty { color: var(--muted); font-style: italic; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 5px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
  .note { color: var(--muted); font-size: 11px; display: block; }
  td.value.changed { color: var(--accent); font-weight: 600; }
  .actions { display: flex; flex-direction: column; gap: 6px; }
  .actions button { width: 100%; }
  button.secondary {
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
  <header>
    <span class="dot" id="status-dot" title="État de la connexion au slicer"></span>
    <h1>Assistant Plyo</h1>
  </header>

  <section id="messages">
    <h2>Messages</h2>
    <div id="message-list"><p class="empty">En attente du slicer…</p></div>
  </section>

  <section>
    <h2>Paramètres lus</h2>
    <table><tbody id="params"></tbody></table>
    <p class="empty" id="params-empty">Aucun paramètre lu pour l'instant.</p>
  </section>

  <section>
    <h2>Tests</h2>
    <div class="actions">
      <button id="btn-suggest">Appliquer une suggestion factice</button>
      <button id="btn-refuse" class="secondary">Envoyer une valeur hors plage</button>
      <button id="btn-undo" class="secondary" disabled>Annuler la dernière modification</button>
    </div>
  </section>

<script>
(function () {
  var messageList = document.getElementById('message-list');
  var statusDot = document.getElementById('status-dot');

  function showMessage(text, isError) {
    if (messageList.querySelector('.empty')) messageList.innerHTML = '';
    var div = document.createElement('div');
    div.className = 'message' + (isError ? ' error' : '');
    div.textContent = text;
    messageList.appendChild(div);
  }

  // window.orca est fourni par OrcaSlicer (pont JS <-> C++). Absent dans un navigateur.
  if (!window.orca) {
    showMessage('Pont OrcaSlicer absent : page ouverte hors du slicer.', true);
    return;
  }

  var paramsBody = document.getElementById('params');
  var paramsEmpty = document.getElementById('params-empty');
  var undoButton = document.getElementById('btn-undo');
  var previousValues = {};

  function formatValue(p) {
    if (p.value === null || p.value === undefined) return '—';
    if (typeof p.value === 'boolean') return p.value ? 'Oui' : 'Non';
    var n = Math.round(p.value * 1000) / 1000;
    return n.toLocaleString('fr-FR') + (p.unit ? ' ' + p.unit : '');
  }

  function renderValues(msg) {
    paramsBody.innerHTML = '';
    paramsEmpty.style.display = msg.params.length ? 'none' : '';
    msg.params.forEach(function (p) {
      var tr = document.createElement('tr');
      var label = document.createElement('td');
      label.textContent = p.label;
      var key = document.createElement('span');
      key.className = 'note';
      key.textContent = p.key + (p.note ? ' — ' + p.note : '');
      label.appendChild(key);
      var value = document.createElement('td');
      value.className = 'value';
      value.textContent = formatValue(p);
      if (p.id in previousValues && previousValues[p.id] !== p.value) value.classList.add('changed');
      previousValues[p.id] = p.value;
      tr.appendChild(label);
      tr.appendChild(value);
      paramsBody.appendChild(tr);
    });
    undoButton.disabled = !msg.can_undo;
  }

  window.orca.onMessage(function (msg) {
    if (!msg || !msg.type) return;
    if (msg.type === 'status') {
      statusDot.classList.add('on');
      showMessage(msg.text);
    } else if (msg.type === 'values') {
      renderValues(msg);
    } else if (msg.type === 'result') {
      showMessage(msg.text, !msg.ok);
    }
  });

  // Réponses factices de « l'IA », au format que le futur service web enverra.
  document.getElementById('btn-suggest').addEventListener('click', function () {
    window.orca.postMessage({ type: 'apply', changes: [
      { id: 'nozzle_temp', delta: -5 },
      { id: 'retraction', delta: 0.2 }
    ] });
  });
  document.getElementById('btn-refuse').addEventListener('click', function () {
    window.orca.postMessage({ type: 'apply', changes: [{ id: 'nozzle_temp', value: 400 }] });
  });
  undoButton.addEventListener('click', function () {
    window.orca.postMessage({ type: 'undo' });
  });

  window.orca.postMessage({ type: 'ready' });
})();
</script>
</body>
</html>
