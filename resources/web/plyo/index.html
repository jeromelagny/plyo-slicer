<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant Plyo</title>
<style>
  /* Panneau Assistant Plyo — maquette validée : plyo-api/docs/design/assistant-v2-maquette.html.
     Variables --orca-* injectées par OrcaSlicer (thème clair ou sombre, attribut data-orca-theme) ; valeurs de
     repli pour un navigateur. Ton des textes : tutoiement, phrases courtes, toujours l’action suivante.

     Système de design (à réutiliser, ne pas inventer de valeurs à côté) :
     - texte : 11 / 12 / 13 / 15 / 20 px (--fs-*) ;
     - espaces : multiples de 4 px (--s1 à --s6) ;
     - arrondis : 6 px (contrôles), 10 px (cartes), pilule (--r-*) ;
     - boutons : .btn (principal, un seul par carte), .btn.ghost (secondaire), .link (tertiaire), taille .sm ;
     - couleurs de texte et de fond plein en AA (≥ 4,5:1, vérifié par tests/contrast.test.mjs) :
       --accent-fill (fond des boutons pleins), --accent-text, --warn-text, --danger-text ;
       --accent, --warn, --danger restent pour le décor (jauges, bordures, icônes). */
  :root {
    --bg: var(--orca-bg, #ffffff);
    --fg: var(--orca-fg, #262e30);
    --muted: var(--orca-muted, #6b6b6b);
    --border: var(--orca-border, #dbdbdb);
    --accent: var(--orca-accent, #009688);
    --font: var(--orca-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    /* Blanc sur #009688 ne fait que 3,7:1 : les fonds pleins et textes accentués prennent un vert plus sombre. */
    --accent-fill: #00796b;
    --on-accent: #ffffff;
    --accent-text: #00796b;
    --warn: #d18a00;
    --warn-text: #9a5b00;
    --danger: #e14747;
    --danger-text: #c62828;
    --surface: color-mix(in srgb, var(--fg) 5%, var(--bg));
    --raised: color-mix(in srgb, var(--fg) 9%, var(--bg));
    --accent-soft: color-mix(in srgb, var(--accent) 10%, var(--bg));
    --warn-soft: color-mix(in srgb, var(--warn) 12%, var(--bg));
    --danger-soft: color-mix(in srgb, var(--danger) 10%, var(--bg));
    --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-lg: 15px; --fs-xl: 20px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
    --r-sm: 6px; --r-md: 10px; --r-pill: 999px;
    --shadow: 0 8px 24px rgba(0, 0, 0, .18);
    --motion: 150ms;
    color-scheme: light;
  }
  /* Thème sombre d'Orca : textes accentués plus clairs pour rester lisibles sur #2d2d31. */
  :root[data-orca-theme="dark"] {
    --accent-text: #4db6ac;
    --warn-text: #f0a020;
    --danger-text: #ff7b72;
    --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg));
    --shadow: 0 8px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* Le panneau d'Orca injecte des styles par défaut (orca-plugin-defaults : boutons en texte blanc, etc.) avant cette
     feuille sous macOS, mais après elle sous Windows (WebView2), où ils l'emportaient : texte blanc sur fond clair.
     Préfixées par « html », ces règles de base gagnent quel que soit l'ordre d'injection. */
  html, body { height: 100%; }
  html body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: var(--fs-md); line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; }
  html button { font: inherit; color: inherit; }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--accent-fill); }
  textarea { resize: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .ic { display: inline-block; flex: none; vertical-align: -3px; }
  .ic.ai-mark { margin-left: 2px; opacity: .7; }
  .muted { color: var(--muted); }
  .small { font-size: var(--fs-sm); }

  /* Mouvement léger : les cartes arrivent en fondu (150 ms), sauf si le système demande moins d'animations. */
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .ai, .me, .alert, .note-line, .card, .tour, .menu { animation: rise var(--motion) ease-out; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* Boutons : un principal par carte, puis secondaires et liens */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: var(--s1) var(--s3); border-radius: var(--r-sm); font-weight: 600; line-height: 1.25; text-align: center; cursor: pointer; border: 1px solid var(--accent-fill); background: var(--accent-fill); color: var(--on-accent); }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: var(--raised); color: var(--fg); border-color: color-mix(in srgb, var(--fg) 26%, var(--bg)); }
  .btn.ghost:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); filter: none; }
  /* Débutant : « Clique sur ta réponse » au-dessus des choix (masqué pour « Je connais déjà »). */
  .pick-hint { display: flex; align-items: center; gap: var(--s1); margin: 0; color: var(--accent-text); font-size: var(--fs-sm); font-weight: 600; }
  body:not(.novice) .pick-hint { display: none; }
  /* Accueil du débutant : la règle du jeu, seule à l'écran jusqu'à « C'est parti ». */
  #view-guide.welcoming > :not(#welcome-slot) { display: none !important; }
  .welcome { display: flex; flex-direction: column; gap: var(--s3); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); padding: var(--s4); }
  .welcome h2 { margin: 0; font-size: var(--fs-xl); line-height: 1.3; }
  .welcome ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--s3); }
  .welcome li { display: flex; gap: var(--s2); align-items: flex-start; }
  .welcome li .ic { margin-top: 2px; color: var(--accent-text); }
  .welcome .btn { align-self: stretch; min-height: 38px; font-size: var(--fs-lg); }
  /* « Voilà ce que je propose » : on lit les puces, puis on clique (le bouton passe sous l'explication). */
  .step-card.act-after #journey-action, .step-card.act-after .journey-action { display: contents; }
  .step-card.act-after #project-slot { order: 2; }
  .step-card.act-after .journey-action > .btn { order: 3; align-self: flex-start; }
  .btn.sm { min-height: 28px; padding: 2px 10px; font-size: var(--fs-sm); }
  .btn.wide { flex: 1; }
  .link { display: inline-flex; align-items: center; gap: var(--s1); min-height: 24px; border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: var(--fs-sm); padding: 0; }
  .link:hover:not(:disabled) { color: var(--fg); }
  .link:disabled { opacity: .5; cursor: default; }
  /* Volet repliable : « Comment le faire moi-même » */
  .disclosure { display: inline-flex; align-items: center; gap: var(--s1); min-height: 24px; border: 0; background: none; padding: 0; color: var(--fg); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }
  .disclosure .ic { color: var(--muted); transition: transform var(--motion) ease; }
  .disclosure[aria-expanded="true"] .ic { transform: rotate(90deg); }
  .row-acts { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
  .stack { display: flex; flex-direction: column; gap: var(--s2); align-items: stretch; }
  .alert { display: flex; gap: var(--s2); align-items: flex-start; padding: var(--s3); border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); }
  .alert > .ic { margin-top: 2px; color: var(--muted); }
  .alert .alert-body { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; flex: 1; }
  .alert .alert-body > .btn { align-self: flex-start; }
  .alert p { margin: 0; }
  .alert.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); background: var(--warn-soft); }
  .alert.warn > .ic { color: var(--warn-text); }
  .alert.error { border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); background: var(--danger-soft); }
  .alert.error > .ic { color: var(--danger-text); }
  .alert.tip > .ic { color: var(--accent-text); }
  .offer-title { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .chip { padding: 6px var(--s3); border-radius: var(--r-pill); border: 1px solid var(--border); background: transparent; font-size: var(--fs-sm); cursor: pointer; text-align: left; }
  .chip:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-text); }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .chip:disabled { opacity: .55; cursor: default; }
  .badge-pill { display: inline-flex; align-items: center; gap: var(--s1); font-size: var(--fs-xs); font-weight: 600; padding: 1px var(--s2); border-radius: var(--r-pill); white-space: nowrap; background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
  .badge-pill.ok { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
  .badge-pill.warn { background: var(--warn-soft); color: var(--warn-text); border-color: transparent; }
  .badge-pill.bad { background: var(--danger-soft); color: var(--danger-text); border-color: transparent; }

  /* Carte générique (Ça a marché ?, Avant d'imprimer, journal) : neutre, l'état passe par un badge */
  .card { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
  .card > header { display: flex; align-items: center; gap: var(--s2); font-weight: 600; font-size: var(--fs-md); }
  .card > header > .ic { color: var(--accent-text); }
  .card > header .push { margin-left: auto; }
  .card p { margin: 0; }
  .card .meta { color: var(--muted); font-size: var(--fs-sm); }
  .card ul { margin: 0; padding-left: var(--s4); }
  .card.attention > header > .ic { color: var(--warn-text); }
  .card .badge-pill { flex: none; }
  .card > header > span:not(.badge-pill) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pf-part { display: flex; flex-direction: column; gap: 2px; }
  .pf-part b { overflow-wrap: anywhere; }
  .pf-part ul { font-size: var(--fs-sm); }
  .fix-list { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--bg); overflow: hidden; }
  .fix-list .fix-head { padding: 6px var(--s3); font-size: var(--fs-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); }
  .fix-list .row { padding: var(--s2) var(--s3); }
  .journal-list { display: flex; flex-direction: column; gap: var(--s3); }
  .journal-part { background: transparent; }
  .journal-part h4 { margin: 0; font-size: var(--fs-md); font-weight: 600; overflow-wrap: anywhere; }
  .journal-event { display: grid; grid-template-columns: 40px 1fr; gap: var(--s2) var(--s3); align-items: start; border-top: 1px solid var(--border); padding-top: var(--s3); }
  .journal-event .thumb { width: 40px; height: 40px; border-radius: var(--r-sm); object-fit: cover; }
  .journal-event .thumb.placeholder { display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
  .journal-body { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
  .journal-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s2); }
  .journal-top .meta { min-width: 0; }
  .journal-body .problem { font-weight: 600; }
  .journal-event > .row-acts { grid-column: 1 / -1; }

  /* En-tête */
  .top { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s3) var(--s3) var(--s4); border-bottom: 1px solid var(--border); position: relative; flex: none; }
  .top h1 { margin: 0; font-size: var(--fs-lg); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .push { margin-left: auto; }
  /* Jauge d'utilisation du mois : un pourcentage, jamais de crédits par message */
  .gauge { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--border); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; }
  .gauge .gauge-name { color: var(--muted); }
  @media (max-width: 340px) { .gauge .gauge-name { display: none; } }
  .bar { position: relative; display: block; width: 36px; height: 6px; border-radius: var(--r-pill); background: var(--raised); overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: inherit; background: var(--accent); transition: width .3s ease; }
  .low .bar i { background: var(--warn); }
  .empty .bar i { background: var(--danger); }
  .gauge.empty { border-color: var(--danger); color: var(--danger-text); }
  .icon-btn { width: 28px; height: 28px; padding: 0; display: grid; place-items: center; border-radius: var(--r-sm); border: 0; background: transparent; color: var(--muted); cursor: pointer; flex: none; }
  .icon-btn:hover { background: var(--surface); color: var(--fg); }
  /* Micro pendant la dictée : enfoncé, pour qu'on voie qu'un second appui arrête. */
  .icon-btn.on, .icon-btn.on:hover { background: var(--accent-soft); color: var(--accent-text); box-shadow: inset 0 0 0 1px var(--accent); }
  .linked { display: inline-flex; align-items: center; gap: var(--s1); min-height: 28px; padding: 0 var(--s2); border-radius: var(--r-pill); border: 1px solid var(--accent); color: var(--accent-text); background: transparent; font-size: var(--fs-xs); font-weight: 600; cursor: pointer; white-space: nowrap; }
  .menu { position: absolute; right: var(--s2); top: 48px; width: 264px; max-width: calc(100vw - 16px); background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s1); box-shadow: var(--shadow); z-index: 10; }
  .menu button { display: flex; gap: var(--s2); align-items: center; width: 100%; min-height: 32px; text-align: left; padding: 6px var(--s2); border: 0; border-radius: var(--r-sm); background: transparent; cursor: pointer; }
  .menu button .ic { color: var(--muted); }
  /* Préférence : la coche dit l'état actuel ; décochée, la place reste vide pour aligner les libellés. */
  .menu button[role="menuitemcheckbox"] .ic { color: var(--accent-text); }
  .menu button[aria-checked="false"] .ic { visibility: hidden; }
  .menu button:hover:not(:disabled) { background: var(--surface); }
  .menu button:disabled { color: var(--muted); opacity: .55; cursor: default; }
  .menu .group { padding: var(--s2) var(--s2) 2px; color: var(--muted); font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .menu .who { padding: 0 var(--s2) var(--s1); color: var(--muted); font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: var(--s1) 0; }

  /* Zone fixe du haut : fiche du projet, barre des six étapes, prochaine action. Ne défile jamais. */
  #journey-fiche { max-height: 22vh; overflow-y: auto; }
  #journey-fiche:empty { display: none; }
  .journey-extra { white-space: nowrap; }
  .journey { flex: none; background: var(--surface); border-bottom: 1px solid var(--border); padding: var(--s2) var(--s3) var(--s2); display: flex; flex-direction: column; gap: var(--s2); }
  .journey .project { border: 0; background: transparent; padding: 0; margin: 0; gap: var(--s1); }
  .journey .project.compact { flex-direction: row; }
  /* N6 : un bouton .link est une boîte flex, où text-overflow ne coupe pas le texte : bloc, avec points de suspension à la fin ;
     le texte complet est dans le titre (survol) et la fiche dépliée (clic). */
  .project-summary { display: block; position: relative; min-width: 0; flex: 1 1 auto; font-weight: 600; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding-right: 18px; color: var(--muted); text-decoration: none; }
  .project-summary:hover:not(:disabled) { color: var(--fg); }
  /* La fiche se déplie d'un clic : un chevron le dit, pas un soulignement de lien. */
  .project-summary::after { content: "▾"; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .fiche-fold { align-self: flex-start; }
  /* Carte d'Orca : un seul gras (le titre) ; le message d'origine replié quand Plyo a sa propre explication. */
  .orca-fold summary { cursor: pointer; }
  .orca-fold p { margin: var(--s1) 0 0; }
  .orca-acts > .btn { align-self: flex-start; }
  /* Une carte bloquante porte la correction en bouton plein : « Découper », qui échouerait encore, passe en secondaire. */
  .step-card:has(.orca-issue .fix-main) .journey-action .btn:not(.ghost) { background: transparent; color: var(--fg); border-color: var(--border); }
  .journey-busy { display: inline-flex; margin-left: var(--s2); vertical-align: middle; }
  .journey-bar { display: flex; gap: 3px; }
  #journey-bar { margin-bottom: var(--s3); }
  #journey-bar:empty { display: none; }
  .journey:has(#journey-fiche:empty) { display: none; }
  .journey-seg { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; align-items: stretch; }
  .journey-fill { display: block; height: 5px; border-radius: 3px; background: var(--border); }
  .journey-seg.is-done .journey-fill { background: var(--accent); }
  .journey-seg.is-current .journey-fill { background: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .journey-name { font-size: 10px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .journey-seg.is-current .journey-name { color: var(--accent-text); font-weight: 700; }
  .journey-bar.pills .journey-name { font-size: var(--fs-xs); }
  .journey-seg.is-done .journey-name { color: var(--accent-text); }
  /* Étape faite qui se rouvre d'un clic (barre des étapes) */
  .journey-go { display: flex; flex-direction: column; gap: 3px; cursor: pointer; border-radius: 3px; }
  .journey-go:hover .journey-name { text-decoration: underline; }
  .journey-go:hover .journey-fill { background: var(--accent-text); }
  .step-card { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
  /* Consigne sur toute la largeur, son bouton dessous, toujours au même endroit ; un lien éventuel en dernier. */
  .journey-action { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s2); }
  .journey-prompt { font-weight: 700; font-size: 16px; line-height: 1.35; }
  .journey-action > .btn { order: 1; }
  .journey-action > .journey-extra { order: 2; }
  .journey-action:empty { display: none; }
  .suggestions { display: flex; flex-wrap: wrap; gap: var(--s1); margin-bottom: var(--s2); }
  .suggestions:empty { display: none; }
  /* Sous-question d'une étape : un cran sous la consigne (15 px), pour lire en escalier. */
  .intent-q { margin: 0; font-weight: 700; font-size: var(--fs-md); }
  .new-spool, .brand-ask { display: flex; flex-direction: column; gap: var(--s2); }
  .new-spool .brand-ask { margin-top: var(--s2); padding-top: var(--s3); border-top: 1px solid var(--border); }
  .new-spool p, .brand-ask p { margin: 0; }
  /* Choix deviné d'après le nom de la pièce : signalé, sans être choisi à ta place. */
  .btn.suggested { border-color: var(--accent); color: var(--accent-text); }
  .btn.suggested::after { content: "suggéré"; font-size: var(--fs-xs); font-weight: 600; padding: 0 6px; border-radius: var(--r-pill); background: var(--accent-soft); }
  /* L'action principale d'un écran sans bouton plein dans sa ligne d'action (choisir un fichier, valider sa bobine, corriger) :
     un seul bouton plein par écran, là où l'action se fait. */
  #view-guide:not(:has(#journey-action .btn:not(.ghost))) .btn.ghost.main-choice { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
  #view-guide:not(:has(#journey-action .btn:not(.ghost))) .btn.ghost.main-choice:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent-fill); }
  .intent-details summary { cursor: pointer; color: var(--accent-text); }
  .btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }

  /* Corps défilant : accueil puis conversation */
  .body { flex: 1; overflow-y: auto; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
  /* Hiérarchie visuelle (maquette validée le 22/11) : cinq rôles, un traitement chacun. La couleur ne dit que deux choses :
     agis ici (accent) et attention (ambre, rouge). Le reste passe par la taille, le relief et la position.
     1. À faire maintenant : la carte d'étape, seule en relief, liseré d'accent ; son petit titre pour le débutant. */
  .step-card { border-left: 4px solid var(--accent); box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 14px rgba(0, 0, 0, .06); }
  :root[data-orca-theme="dark"] .step-card { background: var(--raised); box-shadow: 0 2px 12px rgba(0, 0, 0, .35); }
  .step-kicker { display: none; margin: 0; font-size: var(--fs-xs); letter-spacing: .07em; text-transform: uppercase; font-weight: 700; color: var(--accent-text); }
  body.novice .step-kicker { display: block; }
  /* 2. Déjà fait : lignes grises et petites (au-dessus de la carte, ou les retours juste dessous), coche en accent, leurs
     gestes (« Annuler », « voir ») en liens discrets. Une alerte ou une erreur garde sa couleur. */
  #step-recap:not(:empty) { margin-bottom: calc(-1 * var(--s1)); }
  #step-recap .note-line, #guide-notes > .note-line:not(.warn):not(.error) { color: var(--muted); font-size: var(--fs-sm); }
  #step-recap .note-line > .ic, #guide-notes > .note-line.ok > .ic { color: var(--accent-text); }
  #step-recap .note-step { color: var(--muted); font-weight: 600; }
  #view-guide > div:empty { display: none; } /* emplacements vides : pas de grand vide entre la carte et la discussion */
  #step-recap .note-line .btn, #guide-notes > .note-line:not(.warn):not(.error):not(.retouches-card) .btn { min-height: 0; padding: 0; border: 0; background: none; color: var(--muted); font-weight: 400; font-size: var(--fs-sm); text-decoration: underline; }
  /* 3. À surveiller : un encadré ambre (risque, machine qui ne répond pas, points ignorés), jamais pour une simple info. */
  .printer-step.warn { padding: var(--s2) var(--s3); border-radius: var(--r-md); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--border)); background: var(--warn-soft); }
  /* 4. Plus tard / à côté : replié, gris (question sur un autre projet, détails : .fold-detail). */
  /* 5. Discussion : une zone à part, titrée, tes messages à droite, les réponses de l'assistant en bulles teintées. */
  .disc-head { display: none; align-items: center; gap: var(--s2); font-size: var(--fs-xs); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
  .disc-head::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
  #view-chat:has(#thread:not(.hidden)) .disc-head { display: flex; }
  .thread > .ai { background: color-mix(in srgb, var(--accent) 7%, var(--bg)); border-radius: 2px var(--r-md) var(--r-md) var(--r-md); padding: var(--s2) var(--s3); }
  :root[data-orca-theme="dark"] .thread > .ai { background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
  #body:has(#view-guide.welcoming) #view-chat { display: none; }
  #step-recap { display: flex; flex-direction: column; gap: var(--s1); }
  #step-recap:empty, #guide-notes:empty { display: none; }
  .note-step { font-weight: 600; }
  .fold-detail { flex-basis: 100%; font-size: var(--fs-sm); }
  .fold-detail summary { cursor: pointer; color: var(--muted); text-decoration: underline; }
  .fold-detail p { margin: var(--s1) 0 0; }
  .view { display: flex; flex-direction: column; gap: var(--s3); }
  .view.hidden { display: none; }
  #guide-notes { display: flex; flex-direction: column; gap: var(--s2); }
  /* Hors du contenu qui défile, à cheval sur la bordure de la zone de saisie : il ne recouvre jamais un bouton ni un résultat. */
  .more-badge { position: absolute; top: 0; right: var(--s3); transform: translateY(-50%); z-index: 2; min-height: 24px; border: 1px solid var(--accent); background: var(--accent-fill); color: var(--on-accent); border-radius: var(--r-pill); padding: 2px 10px; font-weight: 600; font-size: var(--fs-xs); line-height: 1.5; box-shadow: var(--shadow); cursor: pointer; }
  .more-badge.hidden { display: none; }
  .ai { scroll-margin-top: var(--s2); }
  .body > div:empty { display: none; } /* emplacements vides : pas d'espace fantôme en haut */
  .hello { margin: var(--s3) 0 var(--s1); }
  .hello h2 { margin: 0 0 var(--s1); font-size: var(--fs-xl); font-weight: 600; line-height: 1.3; }
  .hello p { margin: 0; color: var(--muted); }
  .home-more { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s3); }
  .home-mini { display: none; color: var(--muted); margin: var(--s1) 0 0; }
  body.touring .home-more { display: none; }
  body.touring .home-mini { display: block; }
  body.touring #view-guide .step-card { display: none; } /* installation en cours : une seule carte à l'écran */
  .action { display: flex; gap: var(--s3); align-items: center; width: 100%; padding: var(--s3); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); cursor: pointer; text-align: left; }
  .action:hover { border-color: var(--accent); }
  .action .badge { width: 36px; height: 36px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
  .action b { display: block; font-size: var(--fs-md); font-weight: 600; }
  .action .sub { display: block; color: var(--muted); font-size: var(--fs-sm); }
  .label { font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: var(--s2) 0 0; }

  /* Messages */
  .thread { display: flex; flex-direction: column; gap: var(--s4); }
  .me { align-self: flex-end; max-width: 86%; display: flex; flex-direction: column; gap: var(--s1); align-items: flex-end; }
  .me .text { background: var(--surface); border: 1px solid var(--border); padding: var(--s2) var(--s3); border-radius: var(--r-md) var(--r-md) 2px var(--r-md); white-space: pre-wrap; overflow-wrap: anywhere; }
  .me .from { font-size: var(--fs-xs); color: var(--muted); display: inline-flex; gap: var(--s1); align-items: center; }
  /* Photos alignées à droite, comme le texte de la demande : 3 par ligne au plus, les dernières se calent à droite. */
  .thumbs { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s1); max-width: calc(3 * 64px + 2 * var(--s1)); }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: var(--r-sm); display: block; }
  .ai { display: flex; flex-direction: column; gap: var(--s2); }
  .ai .who { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); color: var(--muted); }
  .ai .who .link { margin-left: auto; }
  .ai .who i { width: 18px; height: 18px; border-radius: var(--r-sm); background: var(--accent-fill); display: grid; place-items: center; color: var(--on-accent); font-style: normal; font-size: var(--fs-xs); font-weight: 700; }
  .diag { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
  .diag h3 { margin: 0; font-size: var(--fs-lg); font-weight: 600; line-height: 1.35; }
  .pill { font-size: var(--fs-xs); padding: 1px var(--s2); border-radius: var(--r-pill); background: var(--accent-soft); color: var(--accent-text); font-weight: 600; white-space: nowrap; }
  .ai p, .ai h3 { margin: 0; }
  .rich { display: flex; flex-direction: column; gap: 6px; overflow-wrap: anywhere; }
  .rich p { margin: 0; }
  .rich ul, .rich ol { margin: 0; padding-left: var(--s5); display: flex; flex-direction: column; gap: var(--s1); }
  /* Libellé d'Orca : serré, sinon il ouvre un blanc avant la virgule qui suit. */
  .rich .ui { font-weight: 600; padding: 0 2px; margin: 0; border-radius: var(--r-sm); background: var(--raised); white-space: nowrap; }
  .caret::after { content: "▍"; color: var(--accent); animation: blink 1s infinite; }
  .questions { display: flex; flex-direction: column; gap: var(--s2); }
  .q { font-weight: 600; margin: 0; }
  .ai-foot { display: flex; gap: var(--s3); align-items: center; }
  /* Note du fil : alignée à gauche comme une réponse, jamais centrée seule au milieu de l'écran. */
  .note-line { align-self: flex-start; font-size: var(--fs-sm); color: var(--muted); display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; }
  .note-line > .ic { margin-top: 3px; }
  .note-line .note-text { flex: 1 1 0; min-width: 60%; }
  .note-line.ok { color: var(--accent-text); }
  .note-line.quiet { color: var(--muted); font-size: var(--fs-sm); } /* lot 21 : « Je connais déjà », une ligne discrète */
  .note-line.error { color: var(--danger-text); }
  .cmds { display: flex; flex-direction: column; gap: var(--s2); align-items: flex-start; }
  .cmds-list { display: flex; flex-direction: column; gap: var(--s1); align-items: flex-start; }
  .howto { border-left: 3px solid var(--accent); padding: var(--s1) 0 var(--s1) var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
  .thinking { color: var(--muted); font-size: var(--fs-sm); display: flex; gap: var(--s2); align-items: center; }
  .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .thinking i:nth-child(2) { animation-delay: .2s; }
  .thinking i:nth-child(3) { animation-delay: .4s; }
  .thinking i + i { margin-left: -4px; }
  /* Attente d'une réponse : à la place où la réponse arrivera, sous « Assistant », avec « Annuler » à droite. */
  .waiting .thinking { font-size: var(--fs-md); color: var(--fg); }
  .waiting .thinking .link { margin-left: auto; }
  /* « Une impression ratée ? » : les deux façons d'envoyer la photo, en boutons ; l'accueil s'efface pendant ce temps. */
  .photo-ask .photo-acts { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: var(--s2); }
  #view-chat:has(.photo-ask) .hello { display: none; }
  @keyframes blink { 50% { opacity: .2; } }
  .feedback { display: flex; flex-direction: column; gap: var(--s2); }
  .field { width: 100%; min-height: 56px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--bg); color: var(--fg); font: inherit; padding: 6px var(--s2); }
  .field:focus { outline: none; border-color: var(--accent); }
  .field::placeholder { color: var(--muted); }

  /* Fiche de réglages : ancien → nouveau */
  .sheet { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
  .sheet .group-title { padding: var(--s2) var(--s3) 0; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
  .sheet header { padding: var(--s2) var(--s3); font-size: var(--fs-sm); font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); }
  .row { display: grid; grid-template-columns: 18px 1fr; align-items: start; gap: var(--s2) var(--s3); padding: var(--s3); border-bottom: 1px solid var(--border); cursor: pointer; }
  .row:last-of-type { border-bottom: 0; }
  .row input { margin: 3px 0 0; }
  .row .mark { color: var(--accent-text); display: grid; place-items: center; height: 20px; }
  .row .name { font-weight: 600; }
  .setting-name { border: 0; background: none; padding: 0; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s1); text-align: left; }
  .setting-name .ic { color: var(--muted); }
  .setting-name:hover, .setting-name:hover .ic { color: var(--accent-text); }
  .delta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 2px 0; font-variant-numeric: tabular-nums; font-size: var(--fs-lg); }
  .delta .old { color: var(--muted); text-decoration: line-through; }
  .delta .arrow { color: var(--muted); }
  .delta .new { color: var(--accent-text); font-weight: 700; }
  .row .why { color: var(--muted); font-size: var(--fs-sm); }
  .row.off input { opacity: .45; } /* décoché : seule la case s'efface, le texte reste lisible */
  .row.best { background: var(--accent-soft); }
  .row.static { cursor: default; }
  .sheet .status { padding: var(--s2) var(--s3); color: var(--muted); font-size: var(--fs-sm); }
  .sheet .status:empty { display: none; }
  /* Réglage sensible décoché : la case reste bien visible, c'est elle qu'il faut cocher. */
  .row.sensitive.off input { opacity: 1; outline: 2px solid var(--warn); outline-offset: 2px; border-radius: 3px; }
  .sheet.applied .caution, .sheet.undone .caution { display: none; }
  /* Fiche annulée : la valeur d'avant redevient la valeur lisible, celle qui avait été appliquée passe en gris barré. */
  .sheet.undone .row .mark, .sheet.undone .done { color: var(--muted); }
  .sheet.undone .delta .old { color: var(--fg); text-decoration: none; font-weight: 700; }
  .sheet.undone .delta .new { color: var(--muted); text-decoration: line-through; font-weight: 400; }
  /* Réglages changés en plus du lot : une liste, la raison commune dite une seule fois. */
  .also-list { display: flex; flex-direction: column; gap: 2px; }
  .also-list p { margin: 0; }
  .also-list ul { margin: 0; padding-left: var(--s4); }
  .calib-head { display: flex; flex-direction: column; gap: 2px; }
  .calib-head b { color: var(--fg); font-size: var(--fs-md); }
  .calib-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
  .sheet footer { display: flex; flex-wrap: wrap; gap: var(--s2); padding: var(--s3); border-top: 1px solid var(--border); background: var(--bg); align-items: center; }
  .sheet footer .btn { flex: 1 1 calc(50% - 4px); }
  .sheet footer .btn.full { flex-basis: 100%; order: -1; }
  .sheet footer .link { flex-basis: 100%; justify-content: center; }
  .sheet footer.inline .btn { flex: 0 1 auto; }
  .sheet footer.inline .btn.wide { flex: 1; }
  .sheet footer.inline .link { flex-basis: auto; }
  .done { color: var(--accent-text); font-size: var(--fs-sm); font-weight: 600; flex: 1; display: inline-flex; gap: 6px; align-items: flex-start; }
  .done > .ic { margin-top: 2px; }
  .fail { color: var(--danger-text); font-size: var(--fs-sm); padding: 0 var(--s3) var(--s3); background: var(--bg); }
  /* « Fait ✓ · Annuler » : même ligne et même bouton pour toute action annulable */
  .undo-row { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; align-self: stretch; }
  .undo-row .done { flex: 1 1 auto; }
  .undo-row > .btn, .note-line > .btn { flex: none; margin-left: auto; }
  .undo-row .footnote { margin: 0; flex-basis: 100%; order: 2; }

  /* Zone de saisie */
  .composer { position: relative; border-top: 1px solid var(--border); padding: var(--s3) var(--s3) var(--s2); display: flex; flex-direction: column; gap: var(--s2); flex: none; }
  .attached { display: flex; gap: 6px; flex-wrap: wrap; }
  .att { position: relative; width: 48px; height: 48px; }
  .att img { width: 48px; height: 48px; object-fit: cover; border-radius: var(--r-sm); display: block; }
  .att button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .7); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .box { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--s2) var(--s2) 6px var(--s3); }
  .box:focus-within { border-color: var(--accent); }
  .box textarea { width: 100%; border: 0; background: transparent; color: var(--fg); font: inherit; outline: none; min-height: 40px; max-height: 140px; }
  .box textarea::placeholder { color: var(--muted); }
  .tools { display: flex; align-items: center; gap: 2px; }
  .tools .hint { margin-left: auto; margin-right: 6px; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .send { width: 32px; height: 32px; padding: 0; border-radius: var(--r-sm); border: 0; background: var(--accent-fill); color: var(--on-accent); display: grid; place-items: center; cursor: pointer; flex: none; }
  .send:disabled { opacity: .5; cursor: default; }
  /* Une ligne, même à 320 px : le détail (réglages dans des plages sûres) est dans l'aide. */
  .disclaimer { margin: 0; display: flex; justify-content: center; align-items: baseline; gap: var(--s1); font-size: var(--fs-xs); line-height: 1.35; color: var(--muted); white-space: nowrap; min-width: 0; }
  .disclaimer span { overflow: hidden; text-overflow: ellipsis; }
  .disclaimer .link { font-size: var(--fs-xs); min-height: 0; flex: none; }

  /* Premiers pas : carte du parcours, puce « Tu regardes », fiche d'un réglage */
  .project { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); margin-bottom: var(--s3); }
  .project-title { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .project-row { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding: 4px 0; border-bottom: 1px solid var(--border); }
  .project-row:last-of-type { border-bottom: 0; }
  .project-row.current .project-label { font-weight: 600; }
  .project-label { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .project-missing { color: var(--warn-text); font-style: italic; }
  .project-ok { color: var(--accent-text); font-size: var(--fs-sm); margin-left: var(--s1); }
  /* Sous la machine : buse et plateau (question de l'étape Machine) */
  .project-sub { padding-left: 20px; padding-top: 0; }
  .bed-ask { display: flex; flex-direction: column; gap: var(--s2); margin-bottom: var(--s3); }
  .bed-ask p { margin: 0; }
  .bed-choices { display: flex; flex-direction: column; gap: var(--s2); }
  .drop-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s1); width: 100%; min-height: 112px; padding: var(--s4) var(--s3); border: 2px dashed color-mix(in srgb, var(--accent) 55%, var(--border)); border-radius: var(--r-md); background: var(--accent-soft); color: var(--accent-text); font: inherit; font-size: var(--fs-lg); font-weight: 700; cursor: pointer; text-align: center; }
  .drop-zone:hover, .drop-zone:focus-visible { border-color: var(--accent); }
  .drop-zone .drop-sub { font-size: var(--fs-sm); font-weight: 400; color: var(--muted); }
  .pick-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: var(--s2); }
  .pick-card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: var(--s2); min-height: 60px; border-radius: var(--r-md); border: 1px solid color-mix(in srgb, var(--fg) 26%, var(--bg)); background: var(--raised); color: var(--fg); font: inherit; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; text-align: center; }
  .pick-card:hover { border-color: var(--accent); background: var(--accent-soft); }
  .pick-card > .ic:first-child { color: var(--accent-text); }
  .pick-card { position: relative; }
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--s2); }
  .gallery-card { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: var(--s2) var(--s3); min-height: 64px; border-radius: var(--r-md); border: 1px solid color-mix(in srgb, var(--fg) 26%, var(--bg)); background: var(--raised); color: var(--fg); font: inherit; font-weight: 600; text-align: left; cursor: pointer; }
  .gallery-card:hover { border-color: var(--accent); background: var(--accent-soft); }
  .gallery-card > .ic { color: var(--accent-text); }
  .gallery-card .gallery-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--r-sm); background: var(--surface); margin-bottom: 4px; }
  .gallery-card .gallery-credit { font-size: var(--fs-xs); font-weight: 400; color: var(--muted); }
  .gallery-card .gallery-cat { font-size: var(--fs-xs); font-weight: 400; color: var(--muted); text-transform: capitalize; }
  .pick-card > .ai-mark { position: absolute; top: 6px; right: 6px; margin: 0; }
  .machine-cards { display: flex; flex-direction: column; gap: var(--s2); align-items: stretch; }
  .machine-card { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: var(--s2); width: 100%; min-height: 52px; padding: var(--s2) var(--s3); border-radius: var(--r-md); border: 1px solid color-mix(in srgb, var(--fg) 26%, var(--bg)); background: var(--raised); color: var(--fg); font-weight: 600; text-align: left; cursor: pointer; }
  .machine-card:hover { border-color: var(--accent); background: var(--accent-soft); }
  .machine-card > .ic { grid-row: span 2; color: var(--accent-text); }
  .machine-card .machine-sub { grid-column: 2; font-size: var(--fs-sm); font-weight: 400; color: var(--muted); }
  .machine-card .machine-sub.ok { color: var(--accent-text); }
  .bed-choice { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .bed-choice .muted { padding-left: 2px; }
  .bed-choice .btn { width: 100%; justify-content: flex-start; text-align: left; }
  .step-card.bed-first #project-card { display: none; }
  .project-body > .btn { align-self: flex-start; }
  .sheet-help { margin: 0 0 var(--s2); color: var(--muted); font-size: var(--fs-sm); }
  .design-box .design-text { width: 100%; resize: vertical; min-height: 64px; }
  .design-placed .design-said, .design-placed .design-dims { display: block; color: var(--fg); margin-top: 2px; }
  .design-placed .design-dims { color: var(--muted); }
  .how-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: var(--s1); font-size: var(--fs-sm); }
  .project-body { display: flex; flex-direction: column; gap: var(--s2); padding-top: var(--s1); }
  .project-body p, .project-hint { margin: 0; }
  .project-error { color: var(--danger-text); margin: 0; }
  .project-spool { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s1); }
  .spool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--border); margin-right: 6px; vertical-align: -2px; flex: none; }
  .canvas-row { display: flex; align-items: center; gap: var(--s2); }
  .canvas-colour { min-width: 5.5em; }
  .canvas-select { flex: 1; min-width: 0; }
  .manual-row .manual-num { min-width: 1.5em; }
  .manual-tag { display: inline-flex; align-items: center; }
  /* Carte « Couleurs » (lot 20) : la pièce sélectionnée dans la vue 3D est mise en évidence */
  .colour-row.on { background: var(--accent-soft); border-radius: var(--r-md); padding-left: var(--s1); padding-right: var(--s1); }
  .colour-name { display: inline-flex; align-items: center; text-align: left; }
  /* Lot 21 : le nom à gauche (il peut passer à la ligne), la bobine à droite sur une seule ligne ; les parties décalées sous leur pièce */
  .colour-label { flex: 1 1 auto; flex-wrap: wrap; row-gap: 0; }
  .colour-right { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: var(--s1) var(--s2); flex: none; max-width: 62%; }
  .colour-spool { display: inline-flex; align-items: center; white-space: nowrap; }
  .colour-part { margin-left: 12px; padding-left: 12px; border-left: 2px solid var(--border); }
  .colour-detail { flex-basis: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .colour-file-name { display: inline-flex; align-items: center; }
  .colour-same { color: var(--warn-text); }
  .project-temps { padding-left: 20px; }
  .tour { border: 1px solid var(--accent); border-radius: var(--r-md); background: var(--accent-soft); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
  .tour .step { font-size: var(--fs-xs); font-weight: 600; color: var(--accent-text); text-transform: uppercase; letter-spacing: .04em; }
  .tour h3 { margin: 0; font-size: var(--fs-lg); font-weight: 600; }
  .tour p { margin: 0; }
  .tour .where { color: var(--muted); font-size: var(--fs-sm); display: flex; gap: 6px; }
  .tour .where:empty { display: none; }
  .tour .bottom { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
  .focus-chip { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface); font-size: var(--fs-sm); align-self: flex-start; max-width: 100%; }
  .focus-chip b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .focus-chip > span { white-space: nowrap; }
  .focus-chip .go { border: 0; background: none; color: var(--accent-text); cursor: pointer; font: inherit; font-weight: 600; padding: 0; white-space: nowrap; }
  .focus-chip .x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; display: grid; place-items: center; }
  .fiche h4 { margin: var(--s1) 0 0; font-size: var(--fs-sm); color: var(--muted); font-weight: 600; }
  .fiche .value { font-variant-numeric: tabular-nums; }

  /* Volets : réglages lus, conversations, utilisation, aide */
  .drawer { position: absolute; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; }
  .drawer .list { flex: 1; overflow-y: auto; padding: var(--s3) var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
  .drawer table { width: 100%; border-collapse: collapse; }
  .drawer td { padding: var(--s2) 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  .drawer td.value { text-align: right; white-space: nowrap; padding-left: var(--s3); font-variant-numeric: tabular-nums; }
  .drawer .key { display: block; color: var(--muted); font-size: var(--fs-xs); }
  .drawer h3 { margin: var(--s2) 0 0; font-size: var(--fs-md); font-weight: 600; }
  .drawer p { margin: 0; }
  .conv-list { display: flex; flex-direction: column; gap: var(--s2); }
  .printer-row { display: flex; align-items: center; gap: var(--s3); color: var(--accent-text); }
  .printer-info { display: flex; flex-direction: column; color: var(--fg); min-width: 0; flex: 1; }
  .printer-status { display: flex; flex-direction: column; gap: var(--s2); border-top: 1px solid var(--border); padding-top: var(--s2); }
  .printer-step { display: flex; gap: var(--s2); align-items: flex-start; margin: 0; }
  .printer-step .ic { margin-top: 3px; }

  .printer-step .rich p { margin: 0; }
  .printer-step.ok .ic { color: var(--accent-text); }
  .printer-step.warn .ic { color: var(--warn-text); }
  .printer-step.error .ic { color: var(--danger-text); }

  .setup-found { padding: var(--s2) 0; border-top: 1px solid var(--border); }
  .setup-checks { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: var(--s1); }
  .setup-checks .rich p { margin: 0; }
  .setup-search { min-height: 36px; }
  .setup-results { display: flex; flex-wrap: wrap; gap: var(--s2); max-height: 260px; overflow-y: auto; }
  .temp-row { display: flex; gap: var(--s2); }
  .temp-field { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .temp-field .field { min-height: 32px; }
  .conv-item { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) 10px; border: 1px solid var(--border); border-radius: var(--r-sm); }
  .conv-item.current { border-color: var(--accent); }
  .conv-item button.open { flex: 1; border: 0; background: none; text-align: left; cursor: pointer; padding: 0; min-width: 0; }
  .conv-item .t { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item .d { display: block; color: var(--muted); font-size: var(--fs-xs); }
  .conv-confirm { flex: 1; display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
  .conv-confirm p { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .btn.danger { background: transparent; color: var(--danger-text); border-color: var(--danger-text); }
  .empty-state { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s2); padding: var(--s4); border: 1px dashed var(--border); border-radius: var(--r-md); }
  .empty-state > .ic { color: var(--accent-text); }
  .empty-state b { font-size: var(--fs-md); }
  .empty-state p { margin: 0; }
  .gauge-big { display: flex; flex-direction: column; gap: var(--s2); }
  .gauge-big .bar { width: 100%; height: 8px; }
  .gauge-big .pct { font-size: var(--fs-xl); font-weight: 700; font-variant-numeric: tabular-nums; }
  .plans { display: flex; flex-direction: column; gap: var(--s2); }
  .plan { display: flex; flex-direction: column; gap: var(--s1); padding: var(--s3); border: 1px solid var(--border); border-radius: var(--r-md); }
  .plan.current { border-color: var(--accent); background: var(--accent-soft); }
  .plan .head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); font-weight: 600; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .check-line { display: flex; gap: var(--s2); align-items: flex-start; font-size: var(--fs-sm); color: var(--muted); cursor: pointer; }
  .check-line input { margin: 3px 0 0; flex: none; }
  .fail-text { margin: 0; color: var(--danger-text); font-size: var(--fs-sm); }
</style>

  <div class="top">
    <h1 id="title">Assistant Plyo</h1>

    <button class="icon-btn" id="btn-more" type="button" title="Plus d’options" aria-haspopup="menu" aria-label="Plus d’options"></button>

      <div class="group" role="presentation">Projet</div>
      <button type="button" id="m-new" role="menuitem" data-icon="plus">Nouveau projet</button>
      <button type="button" id="m-convs" role="menuitem" data-icon="folder">Mes projets</button>
      <button type="button" id="m-parts" role="menuitem" data-icon="cube">Mes pièces</button>
      <button type="button" id="m-machines" role="menuitem" data-icon="printer">Mes machines</button>
      <button type="button" id="m-intent" role="menuitem" data-icon="help" class="hidden">Reposer les questions sur ma pièce</button>
      <hr>
      <div class="group" role="presentation">Réglages</div>
      <button type="button" id="m-undo" role="menuitem" data-icon="undo" disabled title="Rien à annuler pour l’instant">Annuler les derniers réglages appliqués</button>

      <button type="button" id="m-layout" role="menuitemcheckbox" aria-checked="false" data-icon="check" title="Coché : seulement le plateau et l’assistant ; la barre de réglages de Plyo Slicer est repliée">Disposition simple</button>
      <button type="button" id="m-start" role="menuitemcheckbox" aria-checked="true" data-icon="check">Me guider pas à pas (panneau ouvert au lancement)</button>
      <hr id="m-account-sep">
      <div class="group" role="presentation">Compte</div>
      <div class="who" id="m-email"></div>
      <button type="button" id="m-usage" role="menuitem" data-icon="bars">Mon utilisation</button>
      <button type="button" id="m-logout" role="menuitem" data-icon="logout">Me déconnecter</button>
      <button type="button" id="m-login" role="menuitem" data-icon="login">Me connecter</button>

      <button type="button" id="m-help" role="menuitem" data-icon="help">Aide</button>

  <div class="body" id="body">

         échanges avec l'assistant dessous. -->

    </div>

          <button class="chip" type="button">Je veux plus de détails</button>
        </div>

    </div>
    </div>

  var MAX_SIDE = 1600;
  var THUMB_SIDE = 160;
  var MAX_PHOTOS = 6;
  var MAX_HISTORY = 10;
  var IDLE_TIMEOUT_MS = 60000;    // rien reçu depuis une minute : la demande est abandonnée (le service écrit « wait » toutes les 15 s)
  // Plafond d'une réponse : au-delà de l'échéance du service (270 s), pour qu'une réponse payée ne soit jamais jetée ici.
  var ANSWER_MAX_MS = 285000;

  var NOTICE_KEY = 'plyo.gaugeNotice';

  (function () {
    var host = window.orca, raw = host && host.postMessage ? host.postMessage.bind(host) : null;

      // l'imprimante et le filament : avec les mêmes, une fiche ou un ordre partirait sur le nouveau projet. Refusé ici.
      if (m && (m.type === 'apply' || m.type === 'commands') && busy && projectSwitched) { refuseStale(m); return; }
      if (m && (m.type === 'apply' || m.type === 'commands') && !m.project) m.project = conv ? conv.project : null;
      raw(m);
    };
  })();
  function refuseStale(m) {
    setTimeout(function () {
      var w = m.request && pendingResults[m.request];
      if (m.type === 'apply' && w) { delete pendingResults[m.request]; w.onResult(false, Logic.STALE_PROJECT_TEXT, {}); return; }
      var c = m.type === 'commands' && commandWaiters[m.request];
      if (c) { delete commandWaiters[m.request]; c({ done: [], text: Logic.STALE_PROJECT_TEXT, skipped: [] }); return; }
      noteLine(Logic.STALE_PROJECT_TEXT, 'warn', 'alert');

  var attachments = [];      // [{ media_type, data, preview }]
  var busy = false;
  var projectSwitched = false; // Orca a ouvert un autre projet pendant la réponse en cours : appliqué à la fin (ask, finish)
  var lastAsked = null;      // dernière question restée sans réponse ({ note, photos, id }) : renvoyée telle quelle, même identifiant
  var pendingSheet = null;   // gestionnaire de la prochaine demande envoyée par postRequest (application, annulation, calibration)
  var pendingResults = {};   // identifiant de demande → gestionnaire : chaque « result » va à la demande qui le porte, et à elle seule
  var nextRequest = 1;
  var undoneListeners = {};  // identifiant d'un lot appliqué → fiche à prévenir s'il est annulé (même depuis le menu)

  var BATCH_TAG = Date.now().toString(36);
  var phoneLink = null;      // lien téléphone de la conversation : { id, qr_svg }
  var phoneTimer = null;
  var phoneCreating = null;  // création du lien en cours (évite deux liens sur un double clic)
  var phoneCollecting = false;
  var phoneQueue = [];       // envois du téléphone récupérés, en attente que l'assistant soit libre
  var PHONE_POLL_MS = 3000;

    cube: '<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',

    send: '<path d="M5 12h14M12.5 5.5L19 12l-6.5 6.5"/>',
    more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
    bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    printer: '<path d="M4 21h16M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M6 8h12M12 8v5"/><path d="M10 13h4l-2 3z"/>',
    wifi: '<path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/>',
    pin: '<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
    folder: '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>',
    palette: '<path d="M12 3a9 9 0 0 0 0 18c1 0 1.5-.7 1.5-1.5 0-1.2-1-1.5-1-2.5s.8-1.5 1.8-1.5H17a4 4 0 0 0 4-4c0-4.7-4-8.5-9-8.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    undo: '<path d="M9 7H4V2"/><path d="M4.5 7A8 8 0 1 1 4 14"/>',
    alert: '<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.5"/>',

  // ---------- Fiche « Mon projet » : imprimante, filament (buse et plateau), pièce ----------

  function spoolSuccess() {

  // Correction refusée parce que la fiche du projet est incomplète (`missing` du slicer : printer, part, filament) : un bouton

      if (conv !== mine) return;

      // Corriger sa bobine n'attend pas de pièce : machine et bobine d'abord, la pièce ensuite (PlyoProject.nextStep).
      if (missing.indexOf('part') < 0 && !(conv.project.part && conv.project.part.name)) { conv.project.part_later = true; projectChanged(); }
      applyTab('show-guide');

  // Pendant « Choisir ma machine et ma bobine » : la machine d'abord (étape Machine), puis la bobine, même si la pièce manque
  // encore (un réglage du filament n'en a pas besoin). Quand rien ne manque plus, retour à la discussion proposé.
  function followCompletion() {
    var c = projectUI.completing;
    if (!c || c.conv !== conv) { projectUI.completing = null; return; }
    var p = conv.project, next = PlyoProject.nextStep(p);
    var still = PlyoJourney.stillMissing(p, c.missing);
    if (!PlyoProject.hasPrinter(p) || projectUI.pending) return; // la machine se choisit à son étape (après la pièce, lot 6)
    if (still.indexOf('filament') >= 0) {
      // Une seule fois : « Annuler » dans le choix de la bobine n'y ramène pas de force.
      if (next !== 'filament' && projectUI.editing !== 'filament' && !c.opened) { c.opened = true; projectHandlers.change('filament'); }
      return;
    }
    if (still.length) return; // la pièce : l'étape Pièce est celle en cours
    projectUI.completing = null;
    // Une fiche de réglages attend encore « Appliquer » : c'est elle qu'on annonce, pas « Montre-moi ta pièce » (N2).
    var tip = noteLine(PlyoJourney.completionText(c.done, !!document.querySelector('.sheet > footer.inline:not(.undo-row)')), 'ok', 'check', 'guide');
    tip.appendChild(button('Revenir à la discussion', function () { applyTab('show-chat'); }, 'link'));

  // Messages qui demandent de choisir la machine ou la bobine (refus d'une fiche, invitation à la photo) : ils partent dès que
  // ce qui manquait est choisi (N2), au lieu de rester faux sous la fiche. { conv, missing, clear }.
  var missingNotes = [];
  function watchMissing(missing, clear) { if (conv && Array.isArray(missing) && missing.length) missingNotes.push({ conv: conv, missing: missing.slice(), clear: clear }); }
  function settleMissing() {
    missingNotes = missingNotes.filter(function (w) {
      if (w.conv !== conv) return true; // un autre projet : son message attend qu'on y revienne
      if (PlyoJourney.stillMissing(conv.project, w.missing).length) return true;
      w.clear();
      return false;
    });
  }
  // Mode écrit : sans bobine, l'accueil et une question de l'assistant sur le filament mènent au même choix.
  function spoolMissing() { return !!conv && PlyoSpools.needsSpool(conv.project); }
  function chooseSpoolButton() {

  // Préréglage de l'utilisateur choisi dans Orca, hors registre : proposé une fois par session ; « Non » ne le repropose jamais.
  function checkAdoptOffer() {

  function openConversation(id) {

  // Une conversation rouverte redevient active : son projet 3MF revient sur le plateau (pièce, positions, réglages

  // `attached` : panneau rouvert sur la conversation dont le plateau est encore attaché : le plateau est déjà le sien.
  function restoreConversation(id, c, attached) {
    if (!c || !Array.isArray(c.entries) || busy) return;

    unlinkPhone(true);

    projectUI.oldPart = null;

      project: c.project && typeof c.project === 'object' ? c.project : PlyoProject.emptyProject() };
    if (PlyoProject.nextStep(conv.project) === 'ready' && conv.project.part && !conv.project.adapted) conv.project.adapted = conv.project.part.name; // ancienne conversation : jamais réadaptée

    }
    renderProject();
    // Envoi suivi dont la fin n'est pas encore connue ici : le slicer la renvoie s'il l'a lue pendant que la conversation
    // n'était pas affichée (panneau fermé, autre conversation).
    var sentBefore = sendOf();
    if (sentBefore && sentBefore.watch && !sentBefore.end && !sentBefore.answered) window.orca.postMessage({ type: 'print_watch_replay', id: sentBefore.watch });
    // Plaque déjà découpée : aucune nouvelle découpe ne relancera la vérification, on la fait maintenant.
    if (tourSignals && tourSignals.sliced) window.orca.postMessage({ type: 'preflight' });
    if (!conv.entries.length) return;
    showConversation();
    conv.entries.forEach(function (entry) { try { renderEntry(entry, true, true); } catch (e) { /* élément abîmé : ignoré */ } });
    // Un vrai échange (question, réponse, explication) : on le montre ; une pièce posée seule reste sur Étapes.
    if (conv.entries.some(function (entry) { return entry.kind === 'me' || entry.kind === 'answer' || entry.kind === 'fiche'; })) applyTab('show-chat');
    scrollDown();
  }
  // `reopened` : conversation rouverte, redevenue active (fiches de réglages applicables, questions sur un réglage permises).
  function renderEntry(entry, archived, reopened) {
    if (entry.kind === 'me') {
      var me = renderMe(entry);
      // Marque « en attente » restée : l'application a été fermée pendant la réponse (une conversation ne se rouvre
      // jamais pendant une réponse en cours).
      if (entry.pending && reopened && !busy) unansweredCard(entry);
      return me;
    }
    if (entry.kind === 'answer') return renderAnswer(entry, archived, reopened);
    if (entry.kind === 'fiche') return renderFiche(entry.msg, archived, reopened);
    if (entry.kind === 'model') return renderModel(entry, archived);
    if (entry.kind === 'note') return noteLine(entry.text, entry.tone, entry.icon, 'chat');
  }

  // ---------- Reprise d'un projet à l'ouverture du panneau ----------
  // `waiting` : réponse du slicer attendue (la pièce du plateau n'est pas encore reprise) ; `offer` : projet récent proposé
  // ({ id, title, detail }) ; `declined` : « Nouveau projet » cliqué, l'offre ne revient pas dans ce panneau.
  var resumeUI = { waiting: true, timer: null, offer: null, declined: false };
  function onProjectResume(msg) {
    if (!resumeUI.waiting) return;
    resumeUI.waiting = false;
    clearTimeout(resumeUI.timer);
    // Le plateau est encore celui d'une conversation (panneau fermé puis rouvert) : on la rouvre telle quelle, à son étape.
    if (msg.attached && msg.conversation && Array.isArray(msg.conversation.entries)) { restoreConversation(msg.attached, msg.conversation, true); return; }
    detachPlate(); // conversation neuve : le plateau d'avant n'est plus attaché (ses réglages ne suivent pas)
    var pick = Logic.resumeCandidate(msg.items, Date.now());
    resumeUI.offer = pick ? Object.assign({ id: pick.id }, Logic.projectEntry(pick)) : null;
    renderProject();
  }
  // Proposé en tête de l'étape seulement sur un plateau vide et un projet neuf : jamais quand une pièce est déjà là (elle
  // serait remplacée), ni une fois le projet commencé.
  function renderResume() {
    var slot = $('resume-slot');
    slot.textContent = '';
    var o = resumeUI.offer;
    if (!o || resumeUI.declined || !conv || conv.entries.length || PlyoProject.nextStep(conv.project) === 'ready' || (conv.project.part && conv.project.part.name) || (tourSignals && tourSignals.objects > 0)) return;
    var box = alertBox('info', 'Reprendre « ' + o.title + ' » ?', 'folder');
    if (o.detail) box.body.appendChild(el('p', 'muted small', o.detail));
    var acts = el('div', 'printer-actions');
    acts.appendChild(button('Reprendre', function () { resumeUI.offer = null; slot.textContent = ''; openConversation(o.id); }, 'btn sm', 'undo'));
    acts.appendChild(button('Nouveau projet', function () { resumeUI.offer = null; resumeUI.declined = true; slot.textContent = ''; }, 'btn ghost sm', 'plus'));
    box.body.appendChild(acts);
    slot.appendChild(box);
  }
  // Un ancien projet effacé pour faire de la place : toujours dit, jamais en silence.
  function onConvPruned(msg) {
    (Array.isArray(msg.names) ? msg.names : []).forEach(function (name) { noteLine(Logic.prunedText(name), '', 'info'); });
  }

  // ---------- Compte : session, solde, connexion ----------
  function postJson(path, body) {
    return fetch(PLYO_API_URL + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }

  // Appel authentifié : sur un 401, un seul renouvellement de session puis une nouvelle tentative.
  // Seul un refus du renouvellement (401) renvoie le 401 d'origine, qui déconnecte ; une panne (503)
  // renvoie la réponse du renouvellement, et la session est gardée.
  function apiFetch(path, init) {
    function attempt() {
      var headers = Object.assign({}, init.headers || {}, { Authorization: 'Bearer ' + (session ? session.access_token : '') });
      return fetch(PLYO_API_URL + path, Object.assign({}, init, { headers: headers }));
    }
    return attempt().then(function (response) {
      if (response.status !== 401 || !session) return response;
      return postJson('/api/auth/refresh', { refresh_token: session.refresh_token }).then(function (r) {
        if (r.status === 401) return response;
        if (!r.ok) return r;
        return r.json().then(function (fresh) {
          session = fresh;
          window.orca.postMessage({ type: 'session_save', session: fresh });
          return attempt();
        });
      });
    });
  }

  function paintGauge(root, fill, v) {
    fill.style.width = v.pct + '%';
    root.classList.toggle('low', v.state === 'low');
    root.classList.toggle('empty', v.state === 'empty');
  }

  // quiet : l'erreur « jauge pleine » vient d'être affichée, le message doux ferait doublon.
  var gaugeState = null;       // état de la jauge vu juste avant (passage d'un seuil)
  var noticeShown = null;      // repli en mémoire si le stockage du panneau est indisponible
  function setGauge(g, quiet) {
    var v = Logic.gaugeView(g);
    if (!v) return;
    lastGauge = g;
    var prev = gaugeState;
    gaugeState = v.state;
    $('gauge-label').textContent = fr(v.label);
    $('gauge').title = fr('Jauge IA : ' + v.label + ' utilisés ce mois-ci. Elle se recharge ' + v.resets + '. Clique pour le détail.');
    $('gauge').setAttribute('aria-label', fr('Jauge IA du mois : ' + v.label + ' utilisés'));
    paintGauge($('gauge'), $('gauge-fill'), v);
    // Après la réponse qui a rempli la jauge, pas avant : la réponse s'affiche dans la même tâche.
    if (quiet) { noticeShown = Logic.noticeKey(v.state, g); try { localStorage.setItem(NOTICE_KEY, noticeShown); } catch (e) { /* stockage indisponible */ } return; }
    setTimeout(function () { gaugeNotice(g, v, prev); }, 0);
  }

  // Message doux vers 80 %, puis quand la jauge est pleine : une seule fois par mois (mémorisé sur cet ordinateur).
  function gaugeNotice(g, v, prev) {
    var last = noticeShown;
    try { last = localStorage.getItem(NOTICE_KEY) || last; } catch (e) { /* stockage indisponible : la mémoire suffit */ }
    var kind = Logic.gaugeNotice(g, last, prev);
    if (!kind || !thread.children.length) return;
    noticeShown = Logic.noticeKey(kind, g);
    try { localStorage.setItem(NOTICE_KEY, noticeShown); } catch (e) { /* idem */ }
    var box = kind === 'low'
      ? alertBox('warn', 'Tu as utilisé **' + v.label + '** de ta jauge ce mois-ci. Elle se recharge ' + v.resets + '.')
      : alertBox('warn', 'Ta jauge du mois est pleine. Elle se recharge ' + v.resets + '.');
    var acts = el('div', 'row-acts');
    acts.appendChild(button('Voir mon utilisation', openUsage, 'btn ghost sm'));
    box.body.appendChild(acts);
    thread.appendChild(box);
    scrollDown();
  }

  // Vérifie la session (et la renouvelle au besoin) ; met à jour le solde. Résout à true si la session est valide.
  function refreshAccount() {
    return apiFetch('/api/me', { method: 'GET' })
      .then(function (r) {
        if (r.status === 401) { logout('Ta session a expiré : reconnecte-toi pour continuer.'); return false; }
        if (r.status === 503) { $('gauge-label').textContent = fr('Indisponible'); return false; }
        return r.ok ? r.json().then(function (me) { setGauge(me.gauge); $('m-email').textContent = fr(me.email); return true; }) : false;
      })
      .catch(function () { $('gauge-label').textContent = fr('Hors ligne'); return false; });
  }

  // Après une annulation, le débit n'a pas de ligne « final » et arrive un peu après la fermeture du flux : on relit la jauge deux fois.
  function refreshGaugeSoon() {
    [2000, 8000].forEach(function (ms) { setTimeout(function () { if (session) refreshAccount(); }, ms); });
  }

  function logout(message) {
    unlinkPhone(true);
    session = null;
    window.orca.postMessage({ type: 'session_clear' });
    showLoggedIn(false);
    if (message) noteLine(message, '', 'info');
  }

  function openLogin() { window.orca.postMessage({ type: 'login' }); }

  // Une action qui appelle l'IA sans compte : on dit pourquoi, et la connexion s'ouvre au clic ; l'action repart ensuite.
  var afterLogin = null;
  var loginCard = null; // une seule carte à la fois, retirée une fois connecté
  function dropLoginCard() { if (loginCard) { loginCard.remove(); loginCard = null; } }
  // `whole` : `reason` est déjà une phrase complète, qui dit de se connecter.
  function requireLogin(reason, retry, whole) {
    if (session) return false;
    afterLogin = retry || null;
    dropLoginCard();
    loginCard = alertBox('info', whole ? reason : reason + ' Pour ça, connecte-toi : pas de mot de passe, tu reçois un code par e-mail.', 'info');
    loginCard.body.appendChild(button('Me connecter', openLogin, 'btn sm'));
    placeInOpenTab(loginCard);
    return true;
  }

  // ---------- Volets ----------
  function openDrawer(title, fill) {
    menu.classList.add('hidden');
    $('drawer-title').textContent = fr(title);
    var body = $('drawer-body');
    body.textContent = '';
    fill(body);
    $('drawer').classList.remove('hidden');
  }
  function closeDrawer() { $('drawer').classList.add('hidden'); }
  $('drawer-close').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeDrawer(); menu.classList.add('hidden'); } });

  function openValues() {
    openDrawer('Réglages lus par l’assistant', function (body) {
      body.appendChild(el('p', 'muted', 'Ce que l’assistant voit de ton profil quand tu lui écris. Il ne peut proposer de changer que ces réglages-là.'));
      var table = el('table'), tbody = el('tbody');
      ((lastValues && lastValues.params) || []).forEach(function (p) {
        var tr = el('tr');
        var label = el('td', '', p.label);
        // Le nom technique ne parle qu'aux experts ; la remarque éventuelle reste pour tous.
        var keyText = [fsState.level === 'expert' ? p.key : '', p.note || ''].filter(Boolean).join(' — ');
        if (keyText) label.appendChild(el('span', 'key', keyText));
        tr.appendChild(label);
        tr.appendChild(el('td', 'value', formatValue(p.value, p.unit)));
        tbody.appendChild(tr);
      });
