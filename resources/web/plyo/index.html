  // ---------- Lien téléphone (un par conversation) ----------
  // Le panneau crée le lien et garde son QR ; la fenêtre QR (PhoneDialog) l'affiche. Chaque « Envoyer »
  // du téléphone crée un envoi, que le panneau récupère et envoie aussitôt à l'assistant.
  function openPhone() {
    if (requireLogin('Les photos du téléphone passent par le service Plyo.', openPhone)) return;
    refreshAccount().then(function (valid) {
      if (!valid) return;
      if (!phoneLink && !phoneCreating) {
        phoneCreating = apiFetch('/api/phone-sessions', { method: 'POST' })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
          .then(function (created) {
            phoneLink = { id: created.id, qr_svg: created.qr_svg };
            $('phone-linked').classList.remove('hidden');
            clearInterval(phoneTimer);
            phoneTimer = setInterval(pollPhone, PHONE_POLL_MS);
            return phoneLink;
          });
        phoneCreating.then(function () { phoneCreating = null; }, function () { phoneCreating = null; });
      }
      var ready = phoneLink ? Promise.resolve(phoneLink) : phoneCreating;
      ready
        .then(function (link) { window.orca.postMessage({ type: 'phone', link: link }); })
        .catch(function () { showError('network', openPhone); });
    });
  }

  // Coupe le lien (nouvelle conversation, déconnexion, lien expiré). `close` : prévenir le serveur.
  function unlinkPhone(close) {
    if (!phoneLink) return;
    if (close && session) apiFetch('/api/phone-sessions/' + encodeURIComponent(phoneLink.id), { method: 'DELETE' }).catch(function () {});
    clearInterval(phoneTimer);
    phoneLink = null;
    phoneQueue = [];
    $('phone-linked').classList.add('hidden');
  }

  function pollPhone() {
    if (!phoneLink || phoneCollecting || !session) return;
    var id = phoneLink.id;
    apiFetch('/api/phone-sessions/' + encodeURIComponent(id), { method: 'GET' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (s) {
        if (s.expired || s.status === 'closed') {
          unlinkPhone(false);
          noteLine('Le lien avec le téléphone a expiré. Clique sur l’icône du téléphone pour en créer un nouveau.', '', 'phone');
          return;
        }
        if (s.pending_batches > 0) return collectBatch(id);
      })
      .catch(function (status) { if (status === 404) unlinkPhone(false); });
  }

  // Une seule récupération à la fois ; l'envoi récupéré est mis en file (le serveur l'a déjà effacé),
  // puis transmis à l'assistant dès qu'il est libre, pour ne jamais perdre de photos.
  function collectBatch(id) {
    phoneCollecting = true;
    return apiFetch('/api/phone-sessions/' + encodeURIComponent(id) + '/photos', { method: 'GET' })
      .then(function (r) { return r.status === 200 ? r.json() : null; })
      .then(function (batch) {
        if (!batch) return;
        if (!batch.images.length) { noteLine('Les photos du téléphone n’ont pas pu être récupérées. Renvoie-les depuis le téléphone.', 'error', 'alert'); return; }
        phoneQueue.push({
          message: batch.message,
          photos: batch.images.map(function (img) {
            return { media_type: img.media_type, data: img.data, preview: 'data:' + img.media_type + ';base64,' + img.data };
          })
        });
        drainPhoneQueue();
      })
      .catch(function () { noteLine('Les photos du téléphone n’ont pas pu être récupérées. Renvoie-les depuis le téléphone.', 'error', 'alert'); })
      .then(function () { phoneCollecting = false; });
  }

  function drainPhoneQueue() {
    // Une carte de calibration qui attend sa photo la reçoit à la place d'une nouvelle demande.
    if (calibCard && calibCard.awaiting && phoneQueue.length) { calibCard.receivePhotos(phoneQueue.shift().photos); return; }
    if (busy || !lastValues || !phoneQueue.length) return;
    var next = phoneQueue.shift();
    send(next.message, { photos: next.photos, fromPhone: true });
  }

  // ---------- Import MakerWorld : fiche « créateur → toi » ----------
  // Choix du créateur reportés sur ton profil (même liste que CARRIED_PARAM_IDS dans plyo-api/src/lib/adapt-prompt.ts).
  var CARRIED_PARAM_IDS = ['layer_height', 'wall_loops', 'sparse_infill_density', 'top_shell_layers', 'bottom_shell_layers',
    'support', 'support_type', 'support_style', 'support_on_build_plate_only', 'support_threshold_angle', 'brim_width',
    'ironing_type', 'ironing_speed', 'ironing_flow', 'ironing_spacing'];
  var MONO_ADVICE = 'Ton imprimante ne change pas de couleur toute seule. Trois façons de faire : imprimer en une seule couleur ' +
    '(bouton ci-dessous), changer de bobine à la main avec une pause « changement de couleur » placée dans l’aperçu à la bonne hauteur, ' +
    'ou imprimer séparément les parties de chaque couleur si le modèle s’y prête.';
  var mwSheet = null;

  function findParam(list, id) { return list.find(function (p) { return p.id === id; }) || null; }
  function sameValue(a, b) { return typeof a === 'number' && typeof b === 'number' ? Math.abs(a - b) < 1e-9 : a === b; }
  // Nom d'origine d'un préréglage de projet (« Bambu Lab A1 0.4 nozzle(fichier.3mf) » → « Bambu Lab A1 0.4 nozzle »).
  function baseName(name) { return (name || '').replace(/\([^()]*\.3mf\)$/i, '').trim(); }
  function inRange(p, v) {
    if (typeof v === 'string') return !p.values || p.values.indexOf(v) >= 0; // ex. supports peints « tree(manual) »
    if (typeof v !== 'number') return true;
    return (typeof p.min !== 'number' || v >= p.min - 1e-9) && (typeof p.max !== 'number' || v <= p.max + 1e-9);
  }

  function onMakerWorldImported(msg) {
    if (mwSheet) mwSheet.remove();
    showConversation();
    var creator = msg.creator, mine = msg.mine;
    var multi = creator.filament_count > 1;
    var box = el('div', 'ai');
    mwSheet = box;
    box.appendChild(whoLine('modèle MakerWorld'));
    box.appendChild(el('p', '', 'Ce modèle a été réglé pour « ' + baseName(creator.context.printer) + ' ». Je te remets ton imprimante en gardant les choix du créateur.'));
    record({ kind: 'note', text: 'Modèle MakerWorld importé (réglé pour « ' + baseName(creator.context.printer) + ' »).', tone: '', icon: 'cube' });

    var sheet = el('div', 'sheet');
    sheet.appendChild(el('header', '', 'Créateur → toi'));
    function infoRow(name, before, after, why) {
      var row = el('div', 'row static');
      row.appendChild(el('span', 'mark', '•'));
      var info = el('div');
      info.appendChild(el('div', 'name', name));
      var delta = el('div', 'delta');
      if (before !== null) { delta.appendChild(el('span', 'old', before)); delta.appendChild(el('span', 'arrow', '→')); }
      delta.appendChild(el('span', 'new', after));
      info.appendChild(delta);
      if (why) info.appendChild(el('div', 'why', why));
      row.appendChild(info);
      sheet.appendChild(row);
    }
    var samePrinter = baseName(creator.context.printer) === baseName(mine.context.printer);
    infoRow('Imprimante', samePrinter ? null : baseName(creator.context.printer), baseName(mine.context.printer),
      samePrinter ? 'Même imprimante que le créateur : ton propre profil est remis.' : 'Ton imprimante et ton profil d’impression.');
    if (multi) infoRow('Filaments', null, creator.filament_count + ' filaments du créateur conservés', 'Vérifie que tes bobines correspondent aux couleurs du modèle.');
    else infoRow('Filament', baseName(creator.context.filament), baseName(mine.context.filament), 'Ta bobine : ses températures et sa rétraction s’appliquent.');

    // Lignes cochables : valeur de ton profil → valeur retenue (choix du créateur, puis adaptations de l’IA).
    var rows = {};
    var rowsEl = el('div');
    sheet.appendChild(rowsEl);
    function setRow(id, before, after, why, p) {
      if (rows[id]) rows[id].row.remove();
      var row = el('label', 'row');
      var check = el('input');
      check.type = 'checkbox';
      check.checked = true;
      var info = el('div');
      info.appendChild(el('div', 'name', p.label || id));
      var delta = el('div', 'delta');
      delta.appendChild(el('span', 'old', formatValue(before, p.unit)));
      delta.appendChild(el('span', 'arrow', '→'));
      delta.appendChild(el('span', 'new', formatValue(after, p.unit)));
      info.appendChild(delta);
      info.appendChild(el('div', 'why', why));
      row.appendChild(check);
      row.appendChild(info);
      rowsEl.appendChild(row);
      check.addEventListener('change', function () { row.classList.toggle('off', !check.checked); });
      rows[id] = { row: row, check: check, id: id, value: after };
    }
    CARRIED_PARAM_IDS.forEach(function (id) {
      var c = findParam(creator.params, id), m = findParam(mine.params, id);
      if (!c || c.value === null || (m && sameValue(m.value, c.value))) return;
      if (!inRange(c, c.value)) {
        infoRow(c.label || id, null, formatValue(c.value, c.unit) + ' : non reporté', typeof c.value === 'string'
          ? 'Un choix que Plyo ne sait pas appliquer : ton réglage est gardé.'
          : 'Hors des limites de Plyo (' + formatValue(c.min, c.unit) + ' – ' + formatValue(c.max, c.unit) + ').');
        return;
      }
      setRow(id, m ? m.value : null, c.value, 'Choix du créateur.', c);
    });

    var status = el('div', 'status', 'L’assistant vérifie ce qu’il faut adapter à ta machine…');
    sheet.appendChild(status);

    var footer = el('footer', 'inline');
    var apply = button('Appliquer', null, 'btn wide');
    apply.disabled = true;
    var ignore = button('Ignorer', null, 'btn ghost');
    footer.appendChild(apply);
    footer.appendChild(ignore);
    sheet.appendChild(footer);
    var fail = el('div', 'fail hidden');
    sheet.appendChild(fail);
    box.appendChild(sheet);

    var advice = el('div', 'hidden');
    box.appendChild(advice);
    function showAdvice(text) {
      if (!multi || mine.can_multicolor) return;
      advice.textContent = '';
      var tip = alertBox('tip', text || MONO_ADVICE, 'palette');
      var mono = button('Tout dans mon filament', function () {
        mono.disabled = true;
        pendingSheet = { kind: 'mono', onResult: function (ok, t) { mono.replaceWith(el('div', ok ? 'done' : 'fail', ok ? 'Ton filament est dans tous les emplacements.' : t)); } };
        window.orca.postMessage({ type: 'makerworld_mono' });
      }, 'btn ghost sm');
      tip.body.appendChild(mono);
      advice.appendChild(tip);
      advice.classList.remove('hidden');
    }
    thread.appendChild(box);
    scrollDown();

    function ready(note) {
      status.textContent = note;
      apply.disabled = false;
      scrollDown();
    }

    apply.addEventListener('click', function () {
      var changes = Object.keys(rows).filter(function (id) { return rows[id].check.checked; })
        .map(function (id) { return { id: id, value: rows[id].value }; });
      apply.disabled = true;
      ignore.disabled = true;
      fail.classList.add('hidden');
      pendingSheet = { kind: 'apply', onResult: function (ok, text) {
        if (!ok) { apply.disabled = false; ignore.disabled = false; fail.textContent = text; fail.classList.remove('hidden'); return; }
        Object.keys(rows).forEach(function (id) { if (!rows[id].check.checked) rows[id].row.remove(); else rows[id].check.replaceWith(markCell()); });
        sheet.querySelector('header').textContent = 'Appliqué sur ton imprimante';
        footer.textContent = '';
        footer.appendChild(doneLabel('Appliqué'));
        var undo = button('Annuler', function () {
          pendingSheet = { kind: 'undo', onResult: function (okUndo, t) {
            footer.textContent = '';
            footer.appendChild(okUndo ? doneLabel('Réglages du créateur remis', 'undo') : el('span', 'fail', t));
          } };
          window.orca.postMessage({ type: 'makerworld_undo' });
        }, 'link');
        footer.appendChild(undo);
      } };
      window.orca.postMessage({ type: 'makerworld_apply', keep_filaments: multi, changes: changes });
    });
    ignore.addEventListener('click', function () { box.remove(); if (mwSheet === box) mwSheet = null; });

    if (!session) { showAdvice(''); ready('Connecte-toi pour que l’assistant adapte aussi les réglages à ta machine.'); return; }
    var body = {
      locale: (lastValues && lastValues.locale) || 'fr',
      creator: { context: creator.context, params: creator.params, filament_count: creator.filament_count },
      mine: { context: mine.context, params: mine.params, can_multicolor: mine.can_multicolor }
    };
    apiFetch('/api/adapt', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (response) { return response.json().then(function (data) { return { ok: response.ok, data: data }; }); })
      .then(function (r) {
        if (mwSheet !== box) return; // un autre import a remplacé cette fiche
        if (!r.ok) {
          if (r.data.error === 'insufficient_credits') setGauge(r.data.gauge, true);
          showAdvice('');
          ready(r.data.error === 'insufficient_credits'
            ? 'Ta jauge du mois est pleine : les choix du créateur sont reportés, sans adaptation par l’assistant.'
            : 'L’assistant n’a pas pu adapter les réglages : les choix du créateur sont reportés tels quels.');
          return;
        }
        if (r.data.credits) setGauge(r.data.credits.gauge);
        r.data.suggestions.forEach(function (s) {
          var c = findParam(creator.params, s.id), m = findParam(mine.params, s.id);
          var carried = CARRIED_PARAM_IDS.indexOf(s.id) >= 0;
          var p = (carried ? c : m) || c || m || { label: s.id, unit: '' };
          setRow(s.id, m ? m.value : null, s.value, s.reason, p);
        });
        showAdvice(r.data.multicolor_advice);
        ready(r.data.message);
      })
      .catch(function () {
        if (mwSheet !== box) return;
        showAdvice('');
        ready('Le service Plyo ne répond pas : les choix du créateur sont reportés tels quels.');
      });
  }

  function markCell() { var m = el('span', 'mark'); m.appendChild(icon('check', 14)); return m; }
  function doneLabel(text, iconName) { var d = el('span', 'done'); d.appendChild(icon(iconName || 'check', 13)); d.appendChild(document.createTextNode(text)); return d; }

  // ---------- Calibration guidée par photo ----------
  var CALIB = {
    temperature: { name: 'Tour de température', shows: 'la température où ton filament fait le moins de fils et soude bien ses couches', duration: '≈ 45 min', parts: 'Les étages de ta tour, du bas vers le haut' },
    flow: { name: 'Test de débit', shows: 'la quantité de plastique juste : ni trous, ni bourrelets sur le dessus', duration: '≈ 20 min par passe', parts: 'Les carrés du test' },
    retraction: { name: 'Tour de rétraction', shows: 'la rétraction la plus courte qui supprime les fils', duration: '≈ 40 min', parts: 'Les bandes de ta tour, du bas vers le haut' },
    pressure_advance: { name: 'Test de pressure advance', shows: 'le réglage qui rend les angles nets, sans bourrelet', duration: '≈ 10 min', parts: 'Les lignes du motif' },
    ironing: { name: 'Plaque de lissage', shows: 'le débit et l’espacement qui donnent le dessus le plus lisse', duration: '≈ 15 min', parts: 'Les carrés de la plaque' }
  };
  var calibHistory = [];   // calibrations déjà faites pour ce filament sur cette imprimante (slicer)
  var calibCard = null;    // carte du test en cours

  function calibrationOffer(offer) {
    var info = CALIB[offer.test];
    var box = alertBox('tip', null, 'target');
    box.body.appendChild(el('div', 'name', info.name + ' (' + info.duration + ')'));
    box.body.appendChild(el('div', '', offer.reason || ('Ce test montre ' + info.shows + '.')));
    var start = button('Lancer le test', function () {
      start.disabled = true;
      pendingSheet = { kind: 'calib', onResult: function (ok, t) { if (!ok) { start.disabled = false; noteLine(t, 'error', 'alert'); } } };
      window.orca.postMessage({ type: 'calib_start', test: offer.test, pass: 1 });
    }, 'btn sm');
    box.body.appendChild(el('div', 'row-acts')).appendChild(start);
    return box;
  }

  function onCalibStarted(msg) {
    pendingSheet = null;
    if (calibCard) calibCard.box.remove();
    showConversation();
    var info = CALIB[msg.test];
    record({ kind: 'note', text: info.name + ' posé sur le plateau.', tone: '', icon: 'target' });
    var box = el('div', 'ai');
    box.appendChild(whoLine(info.name + (msg.test === 'flow' ? ' — passe ' + msg.pass + ' sur 2' : '')));
    box.appendChild(el('p', '', 'Le test est sur le plateau. Ce qu’il va montrer : ' + info.shows + '. ' + msg.instructions));
    box.appendChild(el('p', 'why', 'Ta pièce et tes réglages sont gardés : « Remettre ma pièce » les ramène à tout moment.'));

    var sheet = el('div', 'sheet');
    sheet.appendChild(el('header', '', info.parts));
    var choice = null;
    var group = 'calib-' + Date.now();
    var rows = msg.sections.map(function (s) {
      var row = el('label', 'row');
      var radio = el('input');
      radio.type = 'radio';
      radio.name = group;
      var info2 = el('div');
      info2.appendChild(el('div', 'name', s.label));
      row.appendChild(radio);
      row.appendChild(info2);
      radio.addEventListener('change', function () { choice = s; updateActions(); });
      sheet.appendChild(row);
      return { radio: radio, row: row, s: s };
    });
    var status = el('div', 'status', 'Une fois le test imprimé, envoie-moi une photo.');
    sheet.appendChild(status);
    var footer = el('footer');
    var photoBtn = button('Ajouter la photo', null, 'btn', 'camera');
    var phoneBtn = button('Téléphone', null, 'btn ghost', 'phone');
    var action = button('', null, 'btn full hidden');
    var back = button('Remettre ma pièce', null, 'link');
    footer.appendChild(photoBtn);
    footer.appendChild(phoneBtn);
    footer.appendChild(action);
    footer.appendChild(back);
    sheet.appendChild(footer);
    box.appendChild(sheet);
    thread.appendChild(box);
    scrollDown();

    var card = { box: box, awaiting: true, test: msg.test, pass: msg.pass };
    calibCard = card;

    function updateActions() {
      if (!choice) return;
      action.classList.remove('hidden');
      action.disabled = false;
      action.textContent = msg.test === 'flow' && msg.pass === 1 ? 'Lancer la passe fine' : 'Enregistrer pour ce filament sur cette imprimante';
    }

    function setPhotoButtons(enabled) { photoBtn.disabled = !enabled; phoneBtn.disabled = !enabled; }

    function analyze(photos) {
      if (card.analyzing) return;
      card.analyzing = true;
      card.awaiting = false;
      setPhotoButtons(false);
      status.textContent = 'L’assistant regarde ta photo…';
      scrollDown();
      var body = {
        locale: (lastValues && lastValues.locale) || 'fr',
        test: msg.test,
        pass: msg.test === 'flow' ? msg.pass : undefined,
        images: photos.map(function (p) { return { media_type: p.media_type, data: p.data }; }),
        sections: msg.sections,
        filament: lastValues && lastValues.context ? lastValues.context.filament : undefined,
        printer: lastValues && lastValues.context ? lastValues.context.printer : undefined
      };
      if (!session) {
        status.textContent = 'Connecte-toi pour que l’assistant lise la photo, ou choisis toi-même le meilleur.';
        card.awaiting = true; card.analyzing = false; setPhotoButtons(true);
        requireLogin('Pour lire la photo de ton test, je l’envoie à l’IA.', function () { analyze(photos); });
        return;
      }
      apiFetch('/api/calibration/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (response) { return response.json().then(function (data) { return { ok: response.ok, data: data }; }); })
        .then(function (r) {
          card.analyzing = false;
          setPhotoButtons(true);
          if (calibCard !== card) return;
          if (!r.ok) {
            if (r.data.error === 'insufficient_credits') setGauge(r.data.gauge, true);
            status.textContent = Logic.errorView(r.data.error).text + ' Tu peux aussi choisir toi-même le meilleur.';
            card.awaiting = true;
            return;
          }
          if (r.data.credits) setGauge(r.data.credits.gauge);
          if (r.data.status !== 'ok') {
            status.textContent = r.data.retake_advice;
            card.awaiting = true;
            return;
          }
          var win = rows.find(function (x) { return x.s.index === r.data.winner_index; });
          win.radio.checked = true;
          win.row.classList.add('best');
          choice = win.s;
          status.textContent = '';
          status.appendChild(el('strong', '', 'Le meilleur : ' + win.s.label + (CONFIDENCE[r.data.confidence] ? ' · ' + CONFIDENCE[r.data.confidence] : '') + '. '));
          status.appendChild(document.createTextNode(r.data.explanation + ' Tu as la pièce en main : choisis-en un autre si tu n’es pas d’accord.'));
          updateActions();
          scrollDown();
        })
        .catch(function () { card.analyzing = false; setPhotoButtons(true); if (calibCard === card) { status.textContent = Logic.errorView('network').text + ' Tu peux aussi choisir toi-même le meilleur.'; card.awaiting = true; } });
    }
    card.receivePhotos = analyze;

    photoBtn.addEventListener('click', function () {
      var input = el('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.multiple = true;
      input.addEventListener('change', function () {
        var files = Array.prototype.slice.call(input.files || []).slice(0, MAX_PHOTOS);
        Promise.all(files.map(function (f) { return downscale(f).catch(function () { return null; }); })).then(function (list) {
          var ok = list.filter(Boolean);
          if (ok.length) analyze(ok);
          else noteLine('Cette image ne peut pas être lue : prends plutôt du JPEG ou du PNG.', 'error', 'alert');
        });
      });
      input.click();
    });
    phoneBtn.addEventListener('click', function () { card.awaiting = true; openPhone(); });

    action.addEventListener('click', function () {
      action.disabled = true;
      if (msg.test === 'flow' && msg.pass === 1) {
        pendingSheet = { kind: 'calib', onResult: function (ok, t) { if (!ok) { action.disabled = false; status.textContent = t; } } };
        window.orca.postMessage({ type: 'calib_start', test: 'flow', pass: 2, base_value: choice.value });
        return;
      }
      pendingSheet = { kind: 'calib_save', onResult: function (ok, t) {
        if (!ok) { action.disabled = false; status.textContent = t; return; }
        record({ kind: 'note', text: info.name + ' : ' + t, tone: 'ok', icon: 'check' });
        footer.textContent = '';
        footer.appendChild(doneLabel(t));
        var restored = false;
  var saveFailedShown = false;
        var restore = button('Remettre ma pièce', function () { restoreCalibration(restore, function (okR) { restored = okR; }); }, 'btn');
        footer.appendChild(restore);
        if (msg.test === 'ironing') {
          // Le lissage s'active sur le profil de ta pièce : la remettre d'abord, sinon la remise l'effacerait.
          var on = button('Remettre ma pièce et activer le lissage', null, 'btn ghost');
          on.dataset.keep = '1';
          var activate = function () {
            pendingSheet = { kind: 'apply', onResult: function (okOn, tt) { on.replaceWith(okOn ? doneLabel('Lissage activé') : el('span', 'fail', tt)); } };
            window.orca.postMessage({ type: 'apply', changes: [{ id: 'ironing_type', value: 'top' }], why: 'Plaque de lissage' });
          };
          on.addEventListener('click', function () {
            on.disabled = true;
            if (restored) { activate(); return; }
            restoreCalibration(on, function (okR) { restored = okR; if (okR) activate(); else on.disabled = false; });
          });
          footer.appendChild(on);
        }
      } };
      window.orca.postMessage({ type: 'calib_save', test: msg.test, value: choice.value });
    });
    back.addEventListener('click', function () { restoreCalibration(back); });
  }

  function restoreCalibration(btn, after) {
    btn.disabled = true;
    pendingSheet = { kind: 'calib_restore', onResult: function (ok, t) {
      if (!ok) { btn.disabled = false; noteLine(t, 'error', 'alert'); if (after) after(false); return; }
      if (calibCard) { calibCard.awaiting = false; calibCard.box.querySelectorAll('button:not([data-keep])').forEach(function (b) { b.disabled = true; }); }
      calibCard = null;
      noteLine(t, 'ok', 'check');
      if (after) after(true);
    } };
    window.orca.postMessage({ type: 'calib_restore' });
  }

  // ---------- Premiers pas : parcours « Ma première impression », « Tu regardes », fiches ----------
  var fsState = {};
  var tourCard = null;     // { box, where } de l'étape affichée
  var tourTimer = null;
  var tourSignals = null;  // derniers signaux : objets, découpage, temps, poids
  var focusKey = null;
  // Repli de « Montre-moi » quand la zone n'a pas pu être encadrée.
  var WHERE = {
    printer: 'Dans la colonne de gauche, sous « Imprimante » : le nom de ta machine.',
    filament: 'Dans la colonne de gauche, sous « Filament » : la bobine utilisée.',
    slice: 'En haut à droite, le bouton « Découper la plaque ».',
    print: 'En haut à droite, juste à côté de « Découper la plaque ».',
    plate: 'Au centre de la fenêtre : le plateau en 3D.'
  };

  function durationText(seconds) {
    var m = Math.max(1, Math.round(seconds / 60));
    return m < 60 ? 'environ ' + m + ' min' : 'environ ' + Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0');
  }
  function printSummary() {
    if (!tourSignals || !tourSignals.sliced || !tourSignals.time_s) return '';
    var grams = tourSignals.weight_g ? ' et ' + Math.round(tourSignals.weight_g) + ' g de filament' : '';
    return 'Ton impression prendra ' + durationText(tourSignals.time_s) + grams + '.';
  }
  function setTourStep(step) { window.orca.postMessage({ type: 'firststeps_set', patch: { tour_step: step } }); }

  function renderTour() {
    var slot = $('tour-slot');
    slot.textContent = '';
    tourCard = null;
    var step = fsState.level === 'beginner' ? fsState.tour_step : null;
    var active = !!step && FS.TOUR_STEPS.indexOf(step) >= 0;
    document.body.classList.toggle('touring', active);
    if (!active) { stopTourTimer(); return; }
    var n = FS.TOUR_STEPS.indexOf(step) + 1;
    var box = el('div', 'tour');
    box.appendChild(el('div', 'step', 'Ma première impression · étape ' + n + ' sur ' + FS.TOUR_STEPS.length));
    var acts = el('div', 'row-acts');
    var where = el('div', 'where');
    function next() { setTourStep(FS.TOUR_STEPS[n] || null); }
    function tell(iconName, text) { where.textContent = ''; where.appendChild(icon(iconName, 14)); where.appendChild(document.createTextNode(text)); }
    if (step === 'model') {
      box.appendChild(el('h3', '', 'Le modèle à imprimer'));
      box.appendChild(el('p', '', 'On commence par un petit bateau : c’est le test classique, rapide, et parfait pour une première fois.'));
      acts.appendChild(button('Ajouter le bateau', function () { window.orca.postMessage({ type: 'tour_add_benchy' }); }, 'btn sm'));
      acts.appendChild(button('J’ai déjà mon modèle', function () {
        tell('folder', 'Glisse ton fichier (STL ou 3MF) sur le plateau ou dans ce panneau, ou passe par Fichier › Importer. Je passe à la suite dès qu’il est posé.');
        showMe('plate');
      }, 'btn ghost sm'));
    } else if (step === 'presets') {
      box.appendChild(el('h3', '', 'Ton imprimante et ton filament'));
      box.appendChild(el('p', '', 'Vérifie juste que c’est bien ta machine et la bobine que tu vas utiliser. Si c’est bon, tu n’as rien d’autre à régler : le profil s’occupe du reste.'));
      acts.appendChild(button('Montre-moi l’imprimante', function () { showMe('printer'); }, 'btn ghost sm', 'eye'));
      acts.appendChild(button('Montre-moi le filament', function () { showMe('filament'); }, 'btn ghost sm', 'eye'));
      acts.appendChild(button('C’est bon, suivant', next, 'btn sm'));
    } else if (step === 'slice') {
      box.appendChild(el('h3', '', 'Découper'));
      box.appendChild(el('p', '', '« Découper », c’est transformer ton modèle en trajets pour la buse, couche par couche. Clique sur « Découper la plaque » : je te dirai combien de temps ça prendra.'));
      acts.appendChild(button('Montre-moi', function () { showMe('slice'); }, 'btn ghost sm', 'eye'));
      acts.appendChild(button('Découpe pour moi', function () { plateAction('slice'); }, 'btn sm', 'wand'));
    } else if (step === 'print') {
      box.appendChild(el('h3', '', 'Imprimer'));
      var summary = printSummary();
      if (summary) { var s = el('p', 'done'); s.appendChild(icon('check', 13)); s.appendChild(document.createTextNode(summary)); box.appendChild(s); }
      box.appendChild(el('p', '', 'Si ton imprimante est reliée, « Imprimer la plaque » l’envoie directement. Sinon, ouvre la petite flèche de ce bouton, choisis « Exporter le fichier G-code », puis copie le fichier sur la clé USB ou la carte SD de ton imprimante.'));
      acts.appendChild(button('Montre-moi', function () { showMe('print'); }, 'btn ghost sm', 'eye'));
      acts.appendChild(button('C’est lancé, suivant', next, 'btn sm'));
    } else if (step === 'after') {
      box.appendChild(el('h3', '', 'Après l’impression'));
      box.appendChild(el('p', '', 'Quand c’est fini, envoie-moi une photo : je te dis si c’est réussi et comment l’améliorer.'));
      acts.appendChild(button('Téléphone', openPhone, 'btn sm', 'phone'));
      acts.appendChild(button('Ajouter une photo', pickFiles, 'btn ghost sm', 'camera'));
    }
    box.appendChild(acts);
    box.appendChild(where);
    var bottom = el('div', 'bottom');
    bottom.appendChild(button(step === 'after' ? 'Terminer la visite' : 'Passer la visite', function () { setTourStep(null); }, 'link'));
    if (step === 'model' || step === 'slice') bottom.appendChild(button('Passer cette étape', next, 'link'));
    box.appendChild(bottom);
    slot.appendChild(box);
    tourCard = { box: box, where: where, tell: tell };
    startTourTimer();
  }

  function startTourTimer() {
    if (tourTimer) return;
    tourTimer = setInterval(function () { window.orca.postMessage({ type: 'tour_signals' }); }, 2000);
    window.orca.postMessage({ type: 'tour_signals' });
  }
  function stopTourTimer() { if (tourTimer) { clearInterval(tourTimer); tourTimer = null; } }

  function onTourSignals(signals) {
    var hadSummary = !!printSummary();
    tourSignals = signals;
    var step = fsState.level === 'beginner' ? fsState.tour_step : null;
    if (!step) return;
    var nextStep = FS.nextTourStep(step, signals);
    if (nextStep !== step) setTourStep(nextStep);
    else if (step === 'print' && !hadSummary && printSummary()) renderTour();
  }

  function onFirstSteps(state) {
    var first = !fsState.hasOwnProperty('seen');
    fsState = state;
    renderTour();
    if (first && state.level === 'expert' && !state.greeted) {
      $('hello-text').textContent = 'Je suis là si tu as besoin : pose ta question en bas, ou clique dans un réglage du slicer pour que je te l’explique.';
      window.orca.postMessage({ type: 'firststeps_set', patch: { greeted: true } });
    }
  }

  function explain(key) { window.orca.postMessage({ type: 'explain', key: key }); }

  // Fiche d'un réglage : texte livré dans Plyo (fiches.js), sinon l'aide du slicer ; valeur actuelle jugée hors ligne.
  function onExplain(msg) { renderFiche(record({ kind: 'fiche', msg: msg }).msg, false); }
  function renderFiche(msg, archived) {
    var fiche = window.PLYO_FICHES[msg.key];
    showConversation();
    var box = el('div', 'ai fiche');
    box.appendChild(whoLine('explication gratuite'));
    var label = fiche ? fiche.label : msg.label;
    box.appendChild(el('h3', '', label));
    function part(title, text) { if (text) { box.appendChild(el('h4', '', title)); box.appendChild(el('p', '', text)); } }
    if (fiche) {
      part('À quoi ça sert', fiche.what);
      part('Si c’est trop haut', fiche.high);
      part('Si c’est trop bas', fiche.low);
      part('Faut-il y toucher ?', fiche.touch);
    } else {
      part('À quoi ça sert', msg.tooltip || 'Je n’ai pas encore de fiche pour ce réglage : demande-moi, je t’explique.');
    }
    if (msg.value !== null && msg.value !== undefined) {
      var shown = typeof msg.value === 'number' ? String(msg.value).replace('.', ',') : msg.value;
      var judged = FS.judgeValue({ value: msg.value, min: msg.min === null ? undefined : msg.min, max: msg.max === null ? undefined : msg.max,
        systemValue: typeof msg.system_value === 'number' ? msg.system_value : undefined });
      box.appendChild(el('h4', '', archived ? 'Chez toi, ce jour-là' : 'Chez toi'));
      box.appendChild(el('p', 'value', 'Valeur : ' + shown + (msg.unit ? ' ' + msg.unit : '') + '. ' + judged.text));
    }
    var acts = el('div', 'row-acts');
    acts.appendChild(button('Montre-moi où il est', function () { showSetting(msg.key); }, 'btn ghost sm', 'eye'));
    if (!archived) acts.appendChild(button('Et dans mon cas, je mets combien ?', function () { send('Pour le réglage « ' + label + ' » : quelle valeur me conseilles-tu dans mon cas, et pourquoi ?'); }, 'btn ghost sm'));
    box.appendChild(acts);
    thread.appendChild(box);
    scrollDown();
  }

  $('focus-explain').addEventListener('click', function () { if (focusKey) explain(focusKey); });
  $('focus-close').addEventListener('click', function () { $('focus-chip').classList.add('hidden'); });

  // ---------- Envoi d'une demande ----------
  var CONFIDENCE = { high: 'Confiance élevée', medium: 'Confiance moyenne', low: 'Confiance faible' };

  function renderMe(entry) {
    showConversation();
    var me = el('div', 'me');
    if (entry.thumbs && entry.thumbs.length) {
      var grid = el('div', 'thumbs');
      entry.thumbs.forEach(function (src) { var i = el('img'); i.src = src; i.alt = ''; grid.appendChild(i); });
      me.appendChild(grid);
    }
    if (entry.text) me.appendChild(el('div', 'text', entry.text));
    if (entry.fromPhone) { var f = el('span', 'from'); f.appendChild(icon('phone', 11)); f.appendChild(document.createTextNode('Envoyé depuis le téléphone')); me.appendChild(f); }
    thread.appendChild(me);
    scrollDown();
    return me;
  }

  // Ta demande dans le fil (vignettes gardées dans la conversation) ; le titre vient de la première demande.
  function addMe(text, photos, fromPhone) {
    var entry = record({ kind: 'me', text: text, thumbs: [], fromPhone: !!fromPhone });
    if (!conv.title) conv.title = Logic.conversationTitle(text, photos.length, new Date().toISOString());
    renderMe({ text: text, fromPhone: fromPhone, thumbs: photos.map(function (p) { return p.preview; }) });
    // La conversation garde des vignettes de 160 px, pas les photos entières.
    Promise.all(photos.map(function (p) { return scaled(p.preview, THUMB_SIDE, 0.7).catch(function () { return null; }); })).then(function (thumbs) {
      entry.thumbs = thumbs.filter(Boolean);
      scheduleSave();
    });
    return entry;
  }

  // `opts` : { photos (du téléphone), fromPhone, shown (la demande est déjà dans le fil) }.
  function send(text, opts) {
    opts = opts || {};
    var note = (text || '').trim();
    // Une adresse MakerWorld ouvre la page dans une fenêtre Plyo (la page n'est jamais lue par Plyo ni par l'IA).
    if (!opts.photos && /^https:\/\/(www\.)?makerworld\.com\/\S*$/i.test(note)) {
      window.orca.postMessage({ type: 'makerworld', url: note });
      noteInput.value = '';
      noteLine('Page MakerWorld ouverte : connecte-toi si besoin, puis clique sur « Ouvrir dans Bambu Studio » sous le profil voulu.', '', 'info');
      return;
    }
    if (busy) return;
    var photos = opts.photos || attachments.slice();
    if (!note && !photos.length) { noteInput.focus(); return; }
    if (!lastValues) { noteLine('Je lis encore les réglages du slicer : réessaie dans une seconde.', '', 'info'); return; }
    // « C'est quoi la rétraction ? » : la fiche du réglage répond, gratuitement et sans compte.
    var ficheKey = !opts.photos && !photos.length ? FS.matchSettingQuestion(note, window.PLYO_FICHES) : null;
    if (ficheKey) {
      if (!opts.shown) addMe(note, [], false);
      noteInput.value = '';
      explain(ficheKey);
      return;
    }
    if (!opts.photos) { attachments = []; renderAttachments(); noteInput.value = ''; }
    if (!opts.shown) addMe(note, photos, opts.fromPhone);
    var again = { photos: photos, fromPhone: opts.fromPhone, shown: true };
    if (requireLogin('Pour te répondre, j’envoie ta demande à l’IA.', function () { send(note, again); })) return;
    ask(note, photos);
  }

  // Juste avant l'appel : ce qui est sur le plateau et ce qui a déjà été appliqué sur cette machine.
  var contextWaiter = null;
  function aiContext() {
    return new Promise(function (resolve) {
      var timer = setTimeout(function () { contextWaiter = null; resolve(null); }, 1500);
      contextWaiter = function (msg) { clearTimeout(timer); contextWaiter = null; resolve(msg); };
      window.orca.postMessage({ type: 'ai_context' });
    });
  }

  function ask(note, photos) {
    if (busy) return;          // une seule demande à la fois (un ancien « Réessayer » ne relance rien en parallèle)
    busy = true;
    sendButton.disabled = true;
    var target = conv;         // la réponse va dans la conversation de la question, quoi qu'il arrive
    var controller = new AbortController();
    var idle = null;
    function touch() { clearTimeout(idle); idle = setTimeout(function () { controller.abort('timeout'); }, IDLE_TIMEOUT_MS); }
    touch();
    var cap = setTimeout(function () { controller.abort('timeout'); }, ANSWER_MAX_MS);
    var thinking = el('div', 'thinking');
    thinking.appendChild(el('i'));
    thinking.appendChild(document.createTextNode(photos.length ? 'Je regarde ta photo…' : 'Je réfléchis…'));
    thinking.appendChild(button('Annuler', function () { controller.abort('cancel'); }, 'link'));
    thread.appendChild(thinking);
    scrollDown();
    var live = null;           // réponse en cours d'écriture
    var out = {};              // événements du flux : final ou error
    function finish() {
      clearTimeout(idle);
      clearTimeout(cap);
      thinking.remove();
      if (live) live.box.remove();
      busy = false;
      sendButton.disabled = false;
      scrollDown();
      drainPhoneQueue();
    }
    function fail(code) {
      finish();
      if (code === 'cancel') { noteLine('Demande annulée.', '', 'info'); return; }
      if (code === 'unauthorized') { logout(); requireLogin('Ta session a expiré.', function () { send(note, { photos: photos, shown: true }); }); return; }
      showError(code, function () { ask(note, photos); });
    }

    aiContext().then(function (ctx) {
      var body = {
        locale: lastValues.locale || 'fr',
        settings: { params: lastValues.params.map(function (p) { return { id: p.id, value: p.value, unit: p.unit }; }) },
        context: lastValues.context,
        history: conv.history.slice(-MAX_HISTORY)
      };
      if (photos.length) body.images = photos.map(function (p) { return { media_type: p.media_type, data: p.data }; });
      if (note) body.note = note;
      if (calibHistory.length) body.calibrations = calibHistory;
      if (ctx && ctx.plate) body.plate = ctx.plate;
      if (ctx && ctx.memory && ctx.memory.length) body.memory = ctx.memory;
      return apiFetch('/api/diagnose', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/x-ndjson' }, body: JSON.stringify(body), signal: controller.signal });
    }).then(function (response) {
      if (response.status === 401) return { error: 'unauthorized' };
      var type = response.headers.get('Content-Type') || '';
      if (type.indexOf('ndjson') < 0 || !response.body)
        return response.json().then(function (data) { return response.ok ? { final: data } : { error: data.error, gauge: data.gauge }; });
      // Réponse en flux : les textes s'affichent au fur et à mesure, puis la réponse complète remplace le brouillon.
      var reader = response.body.getReader(), decoder = new TextDecoder(), nd = Logic.ndjsonReader();
      function handle(events) {
        events.forEach(function (ev) {
          if (ev.type === 'partial') { if (!live) { thinking.classList.add('hidden'); live = liveAnswer(function () { controller.abort('cancel'); }); } live.update(ev); }
          else if (ev.type === 'final') out.final = ev;
          else if (ev.type === 'error') out.error = ev.error;
        });
      }
      function pump() {
        return reader.read().then(function (r) {
          touch();
          if (r.done) { handle(nd.end()); return out.final || out.error ? out : { error: 'incomplete_answer' }; }
          handle(nd.push(decoder.decode(r.value, { stream: true })));
          return pump();
        });
      }
      return pump();
    }).then(function (r) {
      if (r.error) {
        if (r.error === 'insufficient_credits') setGauge(r.gauge, true);
        fail(r.error);
        return;
      }
      done(r.final);
    }).catch(function () {
      // Réponse complète déjà reçue (coupure juste après) : on la garde, elle est payée.
      if (out.final) { done(out.final); return; }
      fail(controller.signal.aborted ? (controller.signal.reason === 'cancel' ? 'cancel' : 'timeout') : 'network');
    });

    function done(a) {
      finish();
      if (a.credits) setGauge(a.credits.gauge);
      target.history.push({ role: 'user', text: (photos.length ? '(' + photos.length + ' photo(s) envoyée(s)) ' : '') + note });
      target.history.push({ role: 'assistant', text: summaryForHistory(a) });
      target.history = target.history.slice(-MAX_HISTORY);
      var entry = record({ kind: 'answer', data: a, photoCount: photos.length, question: note, date: new Date().toISOString(), applied: false }, target);
      // Un souci d'affichage n'est pas une erreur réseau : la réponse est gardée, rien n'est redemandé.
      if (target !== conv) return;
      try { renderAnswer(entry, false); }
      catch (e) { noteLine('La réponse est arrivée mais n’a pas pu s’afficher. Rouvre la conversation depuis « Mes conversations ».', 'error', 'alert'); }
    }
  }

  // Erreur : ce qui s'est passé et l'action suivante. La demande est gardée pour « Réessayer ».
  function showError(code, retry) {
    showConversation();
    var view = Logic.errorView(code);
    var g = code === 'insufficient_credits' ? Logic.gaugeView(lastGauge) : null;
    var box = alertBox('error', view.text + (g && g.resets ? ' Elle se recharge ' + g.resets + '.' : ''), 'alert');
    var acts = el('div', 'row-acts');
    if (view.action === 'credits') acts.appendChild(button('Voir mon utilisation', openUsage, 'btn sm'));
    else if (view.action === 'login') acts.appendChild(button('Me reconnecter', openLogin, 'btn sm'));
    else if (retry) acts.appendChild(button('Réessayer', function () { box.remove(); retry(); }, 'btn sm'));
    box.body.appendChild(acts);
    thread.appendChild(box);
    scrollDown();
  }

  // Brouillon de la réponse pendant que l'IA l'écrit ; « Arrêter » reste à portée de main.
  function liveAnswer(onStop) {
    var box = el('div', 'ai');
    var who = whoLine();
    who.appendChild(button('Arrêter', onStop, 'link', 'stop'));
    box.appendChild(who);
    var title = el('h3');
    var diag = el('div', 'diag');
    diag.appendChild(title);
    var explanation = el('div');
    var message = el('div');
    box.appendChild(diag);
    box.appendChild(explanation);
    box.appendChild(message);
    thread.appendChild(box);
    // Le curseur suit la fin du texte en cours d'écriture.
    function set(target, text, caret) {
      target.textContent = '';
      if (!text) return;
      var r = rich(text);
      var last = r.lastElementChild;
      if (caret && last) (last.tagName === 'P' ? last : last.lastElementChild || last).classList.add('caret');
      target.appendChild(r);
    }
    return {
      box: box,
      update: function (p) {
        title.textContent = p.name || '';
        set(explanation, p.explanation, !p.message);
        set(message, p.message, !!p.message);
        scrollDown();
      }
    };
  }

  // Ce que l'assistant a répondu, pour le renvoyer dans l'historique au tour suivant.
  function summaryForHistory(a) {
    var parts = [a.message];
    a.questions.forEach(function (q) { parts.push(q.text + ' (' + q.choices.join(' / ') + ')'); });
    a.suggestions.forEach(function (s) { parts.push('suggestion: ' + s.id + ' ' + (s.delta !== null ? 'delta ' + s.delta : '= ' + s.value)); });
    return parts.join('\n').slice(0, 2000);
  }

  // Valeur avant et après pour la fiche de réglages.
  function change(s) {
    var p = paramOf(s.id);
    var after = s.delta !== null && typeof p.value === 'number' ? p.value + s.delta : s.value;
    return { label: p.label, key: p.key, before: formatValue(p.value, p.unit), after: formatValue(after, p.unit) };
  }

  // Nom du réglage : un clic l'explique (fiche gratuite) quand Plyo en a une.
  function settingName(label, key) {
    if (!key || !window.PLYO_FICHES[key]) return el('div', 'name', label);
    var b = el('button', 'setting-name');
    b.type = 'button';
    b.title = 'C’est quoi ce réglage ?';
    b.appendChild(document.createTextNode(label));
    b.appendChild(icon('help', 13));
    b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); explain(key); });
    return b;
  }

  // Une conversation rouverte montre ses fiches en lecture : appliquer un écart calculé sur d'anciennes valeurs serait faux.
  function renderSheet(container, entry, archived) {
    var suggestions = entry.data.suggestions;
    var sheet = el('div', 'sheet');
    var day = entry.date ? new Date(entry.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) : '';
    sheet.appendChild(el('header', '', archived ? (entry.applied ? 'Réglages appliqués le ' + day : 'Réglages proposés le ' + day) : 'Réglages proposés'));
    var rows = suggestions.map(function (s) {
      var c = archived && entry.changes && entry.changes[s.id] ? entry.changes[s.id] : change(s);
      var row = el(archived ? 'div' : 'label', 'row' + (archived ? ' static' : ''));
      var box = null;
      if (archived) row.appendChild(entry.applied ? markCell() : el('span', 'mark', '•'));
      else { box = el('input'); box.type = 'checkbox'; box.checked = true; row.appendChild(box); }
      var info = el('div');
      info.appendChild(settingName(c.label, c.key));
      var delta = el('div', 'delta');
      delta.appendChild(el('span', 'old', c.before));
      delta.appendChild(el('span', 'arrow', '→'));
      delta.appendChild(el('span', 'new', c.after));
      info.appendChild(delta);
      if (s.reason) info.appendChild(el('div', 'why', s.reason));
      row.appendChild(info);
      sheet.appendChild(row);
      if (box) box.addEventListener('change', function () { row.classList.toggle('off', !box.checked); updateCount(); });
      return { box: box, s: s, row: row, c: c };
    });
    if (!archived) {
      // Libellés et valeurs gardés tels qu'affichés : une conversation rouverte ne dépend pas des réglages du moment.
      entry.changes = {};
      rows.forEach(function (r) { entry.changes[r.s.id] = r.c; });
      scheduleSave();
    }
    if (archived) {
      if (!entry.applied) sheet.appendChild(el('div', 'status', 'Pour les appliquer aujourd’hui, redemande-moi : tes réglages ont pu changer depuis.'));
      container.appendChild(sheet);
      return;
    }

    var footer = el('footer', 'inline');
    var apply = button('', null, 'btn wide');
    var ignore = button('Ignorer', null, 'btn ghost');
    footer.appendChild(apply);
    footer.appendChild(ignore);
    sheet.appendChild(footer);
    var fail = el('div', 'fail hidden');
    sheet.appendChild(fail);

    function checked() { return rows.filter(function (r) { return r.box.checked; }); }
    function updateCount() {
      var n = checked().length;
      apply.textContent = n ? 'Appliquer ' + n + ' réglage' + (n > 1 ? 's' : '') : 'Aucun réglage coché';
      apply.disabled = !n;
    }
    updateCount();

    function lock(locked) { rows.forEach(function (r) { r.box.disabled = locked; }); apply.disabled = locked; ignore.disabled = locked; }

    apply.addEventListener('click', function () {
      var picked = checked();
      var changes = picked.map(function (r) { return r.s.delta !== null ? { id: r.s.id, delta: r.s.delta } : { id: r.s.id, value: r.s.value }; });
      fail.classList.add('hidden');
      lock(true);
      pendingSheet = { kind: 'apply', onResult: function (ok, text, result) {
        if (!ok) { lock(false); updateCount(); fail.textContent = text; fail.classList.remove('hidden'); return; }
        var undoId = result && result.undo_id;
        // La conversation garde ce qui a été appliqué, valeurs comprises, pour la relire plus tard.
        entry.applied = true;
        entry.data.suggestions = picked.map(function (r) { return r.s; });
        scheduleSave();
        rows.forEach(function (r) { if (!r.box.checked) r.row.remove(); else r.box.replaceWith(markCell()); });
        sheet.querySelector('header').textContent = 'Réglages appliqués';
        footer.textContent = '';
        var preset = lastValues && lastValues.context ? lastValues.context.process : '';
        footer.appendChild(doneLabel('Appliqué' + (preset ? ' : préréglage « ' + preset + ' » marqué modifié, à enregistrer si tu veux le garder' : '')));
        function showUndone() {
          entry.applied = false;
          scheduleSave();
          footer.textContent = '';
          footer.appendChild(doneLabel('Réglages d’avant remis', 'undo'));
        }
        if (undoId) undoneListeners[undoId] = showUndone;
        var undoBtn = button('Annuler', function () {
          undoBtn.disabled = true;
          pendingSheet = { kind: 'undo', onResult: function (okUndo, msg) {
            if (okUndo) return; // la fiche est prévenue par undoneListeners
            undoBtn.disabled = false;
            fail.textContent = msg;
            fail.classList.remove('hidden');
          } };
          window.orca.postMessage({ type: 'undo', undo_id: undoId || 0 });
        }, 'link');
        footer.appendChild(undoBtn);
      } };
      window.orca.postMessage({ type: 'apply', changes: changes, why: (entry.data.defect && entry.data.defect.name) || '' });
    });
    ignore.addEventListener('click', function () { sheet.remove(); });
    container.appendChild(sheet);
  }

  // Questions de l'IA : une réponse par question, puis un seul envoi.
  function renderQuestions(container, entry, archived) {
    var qs = entry.data.questions;
    var picks = entry.answers || {};
    var wrap = el('div', 'questions');
    var sendBtn = button('Envoyer mes réponses', null, 'btn sm');
    qs.forEach(function (q, i) {
      wrap.appendChild(el('p', 'q', q.text));
      var row = el('div', 'chips');
      q.choices.forEach(function (c) {
        var chip = el('button', 'chip' + (picks[i] === c ? ' on' : ''), c);
        chip.type = 'button';
        chip.disabled = archived || !!entry.answered;
        chip.addEventListener('click', function () {
          picks[i] = c;
          row.querySelectorAll('.chip').forEach(function (b) { b.classList.toggle('on', b === chip); });
          sendBtn.disabled = !Logic.allAnswered(qs, picks);
        });
        row.appendChild(chip);
      });
      wrap.appendChild(row);
    });
    if (!archived && !entry.answered) {
      sendBtn.disabled = !Logic.allAnswered(qs, picks);
      sendBtn.addEventListener('click', function () {
        entry.answered = true;
        entry.answers = picks;
        scheduleSave();
        wrap.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
        send(Logic.combineAnswers(qs, picks));
      });
      wrap.appendChild(el('div', 'row-acts')).appendChild(sendBtn);
    }
    container.appendChild(wrap);
  }

  // « Signaler » : la réponse semble fausse ou inutile. Gratuit ; sert à corriger l'assistant.
  function feedbackLink(entry) {
    var link = button('Signaler', null, 'link');
    link.addEventListener('click', function () {
      var form = el('div', 'feedback');
      var input = el('textarea');
      input.maxLength = 1000;
      input.placeholder = 'Qu’est-ce qui ne va pas dans cette réponse ? (facultatif)';
      input.setAttribute('aria-label', 'Ce qui ne va pas');
      var acts = el('div', 'row-acts');
      var go = button('Envoyer le signalement', function () {
        go.disabled = true;
        var a = entry.data;
        apiFetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
          verdict: 'bad', comment: input.value.trim() || undefined, question: (entry.question || '').slice(0, 2000), locale: (lastValues && lastValues.locale) || 'fr',
          answer: { status: a.status, defect: a.defect, message: a.message, suggestions: a.suggestions, actions: a.actions || [] },
          context: lastValues && lastValues.context ? { printer: lastValues.context.printer, filament: lastValues.context.filament } : undefined
        }) })
          .then(function (r) { return r.ok ? null : Promise.reject(); })
          .then(function () { form.replaceWith(doneLabel('Merci, c’est noté : on s’en sert pour corriger l’assistant.')); entry.flagged = true; scheduleSave(); })
          .catch(function () { go.disabled = false; go.textContent = 'Réessayer l’envoi'; });
      }, 'btn sm');
      acts.appendChild(go);
      acts.appendChild(button('Laisser tomber', function () { form.replaceWith(link); }, 'link'));
      form.appendChild(input);
      form.appendChild(acts);
      link.parentNode.parentNode.insertBefore(form, link.parentNode.nextSibling);
      link.remove();
      input.focus();
    });
    return link;
  }

  function renderAnswer(entry, archived) {
    var a = entry.data;
    showConversation();
    var box = el('div', 'ai');
    box.appendChild(whoLine(entry.photoCount ? 'd’après ' + (entry.photoCount > 1 ? 'tes ' + entry.photoCount + ' photos' : 'ta photo') : ''));

    var isDefect = a.status === 'ok' && a.defect && ['user_goal', 'no_defect', 'unknown', 'general_question'].indexOf(a.defect.key) < 0;
    if (a.status !== 'question' && a.status !== 'off_topic' && a.defect && a.defect.name) {
      var diag = el('div', 'diag');
      diag.appendChild(el('h3', '', a.defect.name));
      if (isDefect && CONFIDENCE[a.confidence]) diag.appendChild(el('span', 'pill', CONFIDENCE[a.confidence]));
      box.appendChild(diag);
      if (a.defect.explanation) box.appendChild(rich(a.defect.explanation));
    }

    if (a.suggestions.length) {
      renderSheet(box, entry, archived);
      if (a.message) { var tip = alertBox('tip', a.message, 'bulb'); box.appendChild(tip); }
    } else if (a.message) {
      box.appendChild(rich(a.message));
    }

    var actions = renderActions(a.actions, archived);
    if (actions) box.appendChild(actions);
    if (!archived && a.calibration_offer && CALIB[a.calibration_offer.test]) box.appendChild(calibrationOffer(a.calibration_offer));
    if (a.questions && a.questions.length) renderQuestions(box, entry, archived);

    var foot = el('div', 'ai-foot');
    if (session && a.status !== 'off_topic' && !entry.flagged) foot.appendChild(feedbackLink(entry));
    if (foot.children.length) box.appendChild(foot);
    thread.appendChild(box);
    scrollDown();
  }

  // ---------- Actions ----------
  sendButton.addEventListener('click', function () { send(noteInput.value); });
  // Entrée envoie, Maj + Entrée va à la ligne (pas pendant la saisie d'un caractère composé).
  noteInput.addEventListener('keydown', function (e) {
    if (Logic.isSendKey(e)) { e.preventDefault(); send(noteInput.value); }
  });
  $('btn-files').addEventListener('click', pickFiles);
  $('btn-phone').addEventListener('click', openPhone);
  $('phone-linked').addEventListener('click', openPhone);
  document.querySelector('[data-action="files"]').addEventListener('click', pickFiles);
  document.querySelector('[data-action="model"]').addEventListener('click', pickFiles);
  document.querySelector('[data-action="phone"]').addEventListener('click', openPhone);
  $('goals').querySelectorAll('.chip').forEach(function (chip) { chip.addEventListener('click', function () { send(chip.textContent); }); });

  // ---------- Messages du slicer ----------
  var restored = false;
  window.orca.onMessage(function (msg) {
    if (!msg || !msg.type) return;
    if (msg.type === 'session') {
      session = msg.session;
      showLoggedIn(!!session);
      if (session) {
        refreshAccount();
        if (afterLogin) { var retry = afterLogin; afterLogin = null; retry(); }
      }
    } else if (msg.type === 'values') {
      renderValues(msg);
      window.orca.postMessage({ type: 'calib_history' }); // l'historique dépend du filament et de l'imprimante en cours
      drainPhoneQueue();
    } else if (msg.type === 'result') {
      if (msg.undone_id && undoneListeners[msg.undone_id]) { undoneListeners[msg.undone_id](); delete undoneListeners[msg.undone_id]; }
      if (pendingSheet) { var p = pendingSheet; pendingSheet = null; p.onResult(msg.ok, msg.text, msg); }
      else noteLine(msg.text, msg.ok ? 'ok' : 'error', msg.ok ? 'check' : 'alert');
    } else if (msg.type === 'calib_started') {
      onCalibStarted(msg);
    } else if (msg.type === 'calib_history') {
      calibHistory = Array.isArray(msg.items) ? msg.items : [];
    } else if (msg.type === 'makerworld_imported') {
      onMakerWorldImported(msg);
    } else if (msg.type === 'makerworld_opened') {
      noteLine('Modèle reçu de MakerWorld : le slicer le télécharge et l’ouvre.', '', 'cube');
    } else if (msg.type === 'phone_batch_ready') {
      pollPhone(); // la fenêtre QR s'est fermée sur un envoi : on le traite sans attendre le prochain tour
    } else if (msg.type === 'model_added') {
      onModelAdded(msg);
    } else if (msg.type === 'firststeps') {
      onFirstSteps(msg.state || {});
    } else if (msg.type === 'tour_signals') {
      onTourSignals(msg);
    } else if (msg.type === 'show_me') {
      if (!msg.ok && tourCard && WHERE[msg.target]) tourCard.tell('pin', WHERE[msg.target]);
      else if (!msg.ok && WHERE[msg.target]) noteLine(WHERE[msg.target], '', 'pin');
    } else if (msg.type === 'show_setting') {
      onShowSetting(msg);
    } else if (msg.type === 'explain') {
      onExplain(msg);
    } else if (msg.type === 'focus_setting') {
      $('focus-label').textContent = msg.label;
      focusKey = msg.key;
      $('focus-chip').classList.remove('hidden');
    } else if (msg.type === 'ai_context') {
      if (contextWaiter) contextWaiter(msg);
    } else if (msg.type === 'plate_action') {
      onPlateAction(msg);
    } else if (msg.type === 'conv_list') {
      // Au lancement : la dernière conversation est rouverte ; ensuite, la liste remplit le volet.
      if (!restored) { restored = true; if (msg.items && msg.items.length && !(conv && conv.entries.length)) openConversation(msg.items[0].id); }
      else fillConversations(msg.items || []);
    } else if (msg.type === 'conv_save_failed') {
      if (!saveFailedShown) { saveFailedShown = true; noteLine('Cette conversation est devenue trop longue pour être gardée : commence-en une nouvelle depuis le menu « ⋯ ».', 'error', 'alert'); }
    } else if (msg.type === 'conv_loaded') {
      if (msg.conversation) restoreConversation(msg.id, msg.conversation);
      else noteLine('Cette conversation n’a pas pu être ouverte.', 'error', 'alert');
    }
  });

  startConversation();
  showLoggedIn(false);
  window.orca.postMessage({ type: 'ready' });
  window.orca.postMessage({ type: 'session_load' });
  window.orca.postMessage({ type: 'firststeps_state' });
  window.orca.postMessage({ type: 'conv_list' });
})();
</script>
</body>
</html>
