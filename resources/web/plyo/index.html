  // Modifications manuelles non enregistrées (profils impression et filament), demandées au slicer.
  var manualWaiter = null;
  var manualListeners = []; // autres demandeurs des modifications manuelles (questions d'intention), servis en plus de manualWaiter
  function askManualEdits(callback) {
    manualWaiter = callback;
    window.orca.postMessage({ type: 'manual_edits_get' });
  }

  // Version fiable (réglages de la dernière impression réussie) : le slicer dit s'il y en a une, puis la remet à la demande.
  var reliableWaiter = null, reliableResult = null;
  function askReliable(callback) {
    reliableWaiter = callback;
    window.orca.postMessage({ type: 'reliable_get' });
  }

  function onLimits(msg) {
    if (msg.ok === false) noteLine('Ces températures ne sont pas valables : la plage de ta bobine n’a pas été enregistrée.', 'error', 'alert', 'guide');
    if (projectUI.spool.open) { projectUI.spool.limits = msg.limits || null; if (msg.ok === undefined && conv) renderProject(); }
  }

  function openConversations() {
    openDrawer('Mes projets', function (body) {
      body.appendChild(el('p', 'muted', 'Chaque pièce a son projet : son plateau, ses réglages et ta discussion avec moi. Tes projets restent sur cet ordinateur ; au-delà de 30, je range le plus ancien et je te le dis.'));
      var list = el('div', 'conv-list');
      body.appendChild(list);
      list.appendChild(el('p', 'muted', 'Chargement…'));
      convListTarget = list;
      window.orca.postMessage({ type: 'conv_list' });
    });
  }
  var convListTarget = null;
  function fillConversations(items) {
    if (!convListTarget || $('drawer').classList.contains('hidden')) return;
    var list = convListTarget;
    list.textContent = '';
    if (!items.length) {
      list.appendChild(emptyState('folder', 'Pas encore de projet', 'Ajoute une pièce à l’étape Pièce, ou pose une question : ton projet sera gardé ici.',
        'Poser une question', function () { closeDrawer(); applyTab('show-chat'); noteInput.focus(); }));
      return;
    }
    items.forEach(function (it) {
      var entry = Logic.projectEntry(it);
      var row = el('div', 'conv-item' + (conv && conv.id === it.id ? ' current' : ''));
      var open = el('button', 'open');
      open.type = 'button';
      open.appendChild(el('span', 't', entry.title));
      open.appendChild(el('span', 'd', entry.detail));
      open.addEventListener('click', function () { closeDrawer(); openConversation(it.id); });
      var del = el('button', 'icon-btn');
      del.type = 'button';
      del.title = 'Supprimer ce projet';
      del.setAttribute('aria-label', 'Supprimer « ' + entry.title + ' »');
      del.appendChild(icon('x', 14));
      // Jamais en un clic : la question remplace la ligne, « Garder » la remet.
      del.addEventListener('click', function () { confirmDelete(row, it, entry); });
      row.appendChild(open);
      row.appendChild(del);
      list.appendChild(row);
    });
  }
  function confirmDelete(row, it, entry) {
    var kept = Array.prototype.slice.call(row.childNodes);
    row.textContent = '';
    row.classList.add('confirm');
    var box = el('div', 'conv-confirm');
    box.appendChild(el('p', '', Logic.deleteQuestion(entry)));
    var acts = el('div', 'printer-actions');
    acts.appendChild(button('Supprimer', function () {
      if (conv && conv.id === it.id) newConversation();
      window.orca.postMessage({ type: 'conv_delete', id: it.id });
    }, 'btn sm danger', 'x'));
    var keep = button('Garder', function () { row.textContent = ''; row.classList.remove('confirm'); kept.forEach(function (n) { row.appendChild(n); }); }, 'btn ghost sm');
    acts.appendChild(keep);
    box.appendChild(acts);
    row.appendChild(box);
    keep.focus();
  }

  // Relier : vérifier le profil, tester la connexion, puis la fenêtre « Connexion » d'Orca préremplie (OK = enregistré).
  var link = null; // { printer, box } en cours
  function linkStep(text, tone, iconName) {
    if (!link) return null;
    var box = link.box;
    box.textContent = '';
    box.classList.remove('hidden');
    var line = el('div', 'printer-step' + (tone ? ' ' + tone : ''));
    if (iconName) line.appendChild(icon(iconName, 14));
    line.appendChild(rich(text));
    box.appendChild(line);
    return box;
  }
  function startLink(printer, box, onDone) {
    link = { printer: printer, box: box, onDone: onDone || null };
    linkStep('Je vérifie ton profil d’imprimante…', '', 'search');
    window.orca.postMessage({ type: 'printer_link_check', printer: printer });
  }
  function onLinkState(msg) {
    if (!link) return;
    var name = link.printer.name || 'ton imprimante';
    if (!msg.ok) { linkStep('Je ne peux pas relier cette imprimante.', 'error', 'alert'); return; }
    if (msg.linked) { linkStep('Déjà reliée à ton profil « ' + msg.current + ' ».', 'ok', 'check'); return; }
    if (msg.matches) { testLink(); return; }
    var candidates = Array.isArray(msg.candidates) ? msg.candidates : [];
    var box = linkStep('Ton profil actuel est « ' + msg.current + ' », mais l’imprimante trouvée est **' + name + '**. ' +
      (candidates.length ? 'Choisis le profil qui lui correspond :' : 'Je n’ai pas encore son profil : cherche son modèle ci-dessous.'), 'warn', 'alert');
    var acts = el('div', 'printer-actions');
    candidates.forEach(function (c) {
      acts.appendChild(button('Utiliser « ' + c + ' »', function () {
        linkStep('Je change de profil…', '', 'search');
        window.orca.postMessage({ type: 'printer_select_profile', name: c });
      }, 'btn ghost sm'));
    });
    // Pas l'assistant de configuration d'Orca (autres mots, autre ton) : la recherche du panneau, sur la marque trouvée.
    if (!candidates.length) acts.appendChild(button('Ajouter mon imprimante', function () {
      var found = link.printer;
      projectUI.adopt = true;
      setup.found = found; setup.query = found.brand || ''; setup.offered = true;
      openSearch();
    }, 'btn sm', 'plus'));
    box.appendChild(acts);
  }
  function onProfileSelected(msg) {
    if (!link) return;
    if (!msg.ok) { linkStep('Je n’ai pas pu changer de profil. Choisis-le à la main sous « Imprimante », puis réessaie.', 'error', 'alert'); return; }
    startLink(link.printer, link.box);
  }
  function testLink() {
    linkStep('Je teste la connexion avec ' + (link.printer.name || 'ton imprimante') + '…', '', 'wifi');
    window.orca.postMessage({ type: 'printer_link_test', printer: link.printer, access_code: link.code || '' });
  }
  // Ce qu'il faut faire quand le test échoue, selon le type de connexion.
  var LINK_HELP = {
    octoprint: 'OctoPrint demande une **clé API** : dans OctoPrint, ouvre Paramètres, puis Clé API, et copie-la dans la fenêtre « Connexion ».',
    flashforge: 'Flashforge demande le **numéro de série** et le **code de vérification** : tu les trouves sur l’écran de l’imprimante, dans Réglages, puis Réseau.',
    elegoolink: 'Vérifie que le mode réseau local est activé sur l’écran de l’imprimante.'
  };
  // L'imprimante répond mais refuse : elle demande son code d'accès (affiché sur son écran). Gardé le temps du test et de
  // l'enregistrement, puis rangé dans le profil d'imprimante par le slicer.
  function askAccessCode(wrong) {
    var name = link.printer.name || 'ton imprimante';
    var box = linkStep((wrong ? 'Ce code d’accès est refusé par **' + name + '**. Vérifie-le sur son écran et réessaie.' :
      '**' + name + '** est joignable, mais elle demande son **code d’accès**. Tu le trouves sur son écran, dans les réglages réseau.'), 'warn', 'alert');
    var input = el('input', 'field');
    input.type = 'password';
    input.maxLength = 64;
    input.autocomplete = 'off';
    input.placeholder = 'Code d’accès de l’imprimante';
    input.setAttribute('aria-label', 'Code d’accès de l’imprimante');
    function submit() {
      var code = input.value.trim();
      if (!code) { input.focus(); return; }
      link.code = code;
      testLink();
    }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    box.appendChild(input);
    var acts = el('div', 'printer-actions');
    acts.appendChild(button('Tester avec ce code', submit, 'btn sm', 'wifi'));
    box.appendChild(acts);
    setTimeout(function () { input.focus(); }, 0);
  }
  function onLinkTested(msg) {
    if (!link) return;
    if (msg.ok) {
      var okBox = linkStep('La connexion fonctionne. Enregistre-la dans ton profil d’imprimante pour envoyer tes impressions directement.', 'ok', 'check');
      var webui = typeof msg.webui === 'string' ? msg.webui : '';
      okBox.appendChild(button('Enregistrer la connexion', function () {
        linkStep('J’enregistre…', '', 'search');
        window.orca.postMessage({ type: 'printer_link_save', printer: link.printer, webui: webui, access_code: link.code || '' });
      }, 'btn sm', 'check'));
      return;
    }
    if (msg.auth) { askAccessCode(!!link.code); return; }
    var box = linkStep('Je n’arrive pas à joindre ' + (link.printer.name || 'l’imprimante') + '. ' +
      (LINK_HELP[link.printer.host_type] || 'Vérifie qu’elle est allumée et sur le même Wi-Fi, puis réessaie.'), 'error', 'alert');
    if (msg.message) box.appendChild(el('p', 'muted small', msg.message));
    var acts = el('div', 'printer-actions');
    acts.appendChild(button('Réessayer', testLink, 'btn sm'));
    acts.appendChild(button('Ouvrir la fenêtre Connexion', function () { window.orca.postMessage({ type: 'printer_link_dialog', printer: link.printer }); }, 'btn ghost sm'));
    box.appendChild(acts);
  }
  function onLinkSaved(msg) {
    if (!link) return;
    if (msg.ok) {
      linkStep('C’est relié ! Ton profil d’imprimante s’appelle maintenant « ' + msg.profile + ' ». `Envoyer et imprimer` enverra tes impressions directement à ' + (link.printer.name || 'ton imprimante') + '. ' + PlyoMachines.linkSummary(link.printer.host_type), 'ok', 'check');
      if (link.onDone) link.onDone();
    }
    else linkStep('Je n’ai pas pu enregistrer la connexion. Réessaie, ou ouvre la fenêtre « Connexion » depuis le bouton Wi-Fi à côté de « Imprimante ».', 'error', 'alert');
  }
  function onLinkDialogClosed(msg) {
    if (!link) return;
    if (msg.saved) {
      linkStep('C’est relié ! `Envoyer et imprimer` enverra maintenant tes impressions directement à ' + (link.printer.name || 'ton imprimante') + '. ' + PlyoMachines.linkSummary(link.printer.host_type), 'ok', 'check');
      if (link.onDone) link.onDone();
    } else {
      var box = linkStep('Rien n’a été enregistré. Tu peux recommencer quand tu veux.', '', 'info');
      box.appendChild(button('Relier', function () { startLink(link.printer, link.box); }, 'btn sm'));
    }
  }

  // ---------- Configurer l'imprimante (remplace l'assistant de configuration d'Orca) ----------
  // Recherche sur le réseau, « C'est la tienne ? », installation du profil, puis liaison. Sans Wi-Fi : recherche
  // dans le catalogue des imprimantes fournies. Les adresses restent dans ce panneau, jamais envoyées au service.
  var setup = { phase: null, offered: false, printers: [], catalog: null, query: '', pick: null, found: null };
  function startSetup() {
    projectUI.adopt = true;
    setup = { phase: 'scan', offered: true, printers: [], catalog: setup.catalog, query: '', pick: null, found: null, retried: false };
    window.orca.postMessage({ type: 'printer_scan' });
  }
  function setupPhase(phase) { setup.phase = phase; renderSetupFlow(); }
  function endSetup() {
    setup.phase = null;
    if (!setup.preset) projectUI.adopt = false; // « Plus tard » : rien d'installé, l'alerte « Orca est passé sur… » reprend sa place
    renderSetupFlow();
    // Une imprimante vient d'être installée et sélectionnée dans Orca : elle devient celle du projet.
    if (projectUI.adopt && setup.preset) { window.orca.postMessage({ type: 'project_state' }); window.orca.postMessage({ type: 'project_printers' }); }
  }
  function onSetupScan(printers) {
    // La première recherche tombe souvent pendant la demande d'autorisation (réseau local sur macOS, pare-feu sur
    // Windows) et ne voit rien : on relance une fois tout seul avant d'annoncer « aucune imprimante ».
    if (!printers.length && !setup.retried) { setup.retried = true; window.orca.postMessage({ type: 'printer_scan' }); return; }
    setup.printers = printers;
    // Rien trouvé : on demande directement le modèle (pas de carte d'échec d'entrée) ; l'aide Wi-Fi reste à un clic.
    if (printers.length) setupPhase('found'); else { setup.noneFound = true; openSearch(); }
  }
  function onSetupCatalog(catalog) { setup.catalog = catalog; if (setup.phase === 'search') renderSetupFlow(); }
  function openSearch() {
    if (!setup.catalog) window.orca.postMessage({ type: 'setup_catalog' });
    setupPhase('search');
  }
  // Choix d'un modèle (trouvé ou cherché) : une seule taille de buse, installée d'office ; plusieurs, la question (0,4 mm
  // d'abord, la plus courante : PlyoMachines.nozzleChoice). Personne ne reçoit un profil 0,4 mm sans l'avoir vu.
  // Modèle choisi pour une imprimante au code inconnu (Creality « F003 »…) : gardé sur cet ordinateur et, avec un compte,
  // partagé anonymement (le serveur ne garde qu'une empreinte et ne publie qu'un code confirmé par deux personnes).
  function learnModel(printer, model) {
    if (!printer || !printer.code || printer.match || !printer.brand || !model) return;
    var report = { brand: printer.brand, code: printer.code, model: model };
    window.orca.postMessage(Object.assign({ type: 'model_learned' }, report));
    if (session) apiFetch('/api/printer-models', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(report) }).catch(function () {});
  }
  // Table partagée des codes confirmés : lue au démarrage, gardée par le slicer pour la recherche d'imprimantes.
  function loadSharedModels() {
    if (!PLYO_API_URL) return;
    fetch(PLYO_API_URL + '/api/printer-models').then(function (r) { return r.ok ? r.json() : null; })
      .then(function (reply) { if (reply) window.orca.postMessage({ type: 'models_shared', reply: reply }); }).catch(function () {});
  }
  function chooseModel(match, printer) {
    learnModel(printer, match && match.model);
    setup.pick = match;
    setup.found = printer || null;
    setup.linkBox = null;
    setup.change = null;
    var choice = PlyoMachines.nozzleChoice(match.nozzles);
    // Débutant : la buse livrée (0,4 mm) sans question ; l'écran de fin le dit, « Changer de buse » reste dans la fiche.
    var novice = fsState.level !== 'expert' && !choice.auto ? PlyoMachines.noviceNozzle(match.nozzles) : '';
    setup.nozzleAuto = !!novice;
    if (choice.auto) installModel(choice.auto);
    else if (novice) installModel(novice);
    else setupPhase('nozzle');
  }
  // « Changer de buse » (fiche) : la même question pour la machine du projet, puis la même installation (une autre variante du
  // même modèle, sélectionnée dans Plyo Slicer comme à l'installation ; aucun profil n'est modifié). La machine du projet suit.
  function startNozzleChange(offer) {
    if (setup.phase) return;
    projectUI.adopt = true;
    setup = { phase: null, offered: setup.offered, printers: [], catalog: setup.catalog, query: '', pick: { vendor: offer.vendor, model: offer.model, nozzles: offer.nozzles }, found: null, change: { from: offer.current } };
    applyTab('show-guide');
    setupPhase('nozzle');
  }
  var NOZZLE_AUTO_TEXT = 'J’ai pris la buse de 0,4 mm, celle livrée avec presque toutes les imprimantes. Tu en as monté une autre ? « Changer de buse », dans ta fiche en haut du panneau.';
  function installModel(nozzle) {
    setup.nozzle = nozzle;
    setupPhase('installing');
    window.orca.postMessage({ type: 'setup_install', vendor: setup.pick.vendor, model: setup.pick.model, nozzle: nozzle });
  }
  function onSetupInstalled(msg) {
    var change = setup.change;
    if (msg.cancelled) { setupPhase(change ? 'nozzle' : setup.found ? 'found' : 'search'); return; }
    if (!msg.ok) { setup.error = true; setupPhase(change ? 'nozzle' : setup.found ? 'found' : 'search'); return; }
    setup.error = false;
    setup.preset = msg.preset;
    window.orca.postMessage({ type: 'get_values' });
    if (change) {
      // Buse changée : la machine du projet devient ce profil (endSetup), et la préparation est à refaire.
      // La phrase est dite une fois la machine du projet changée (onProjectState) : le changement d'étape effacerait celle-ci.
      projectUI.adoptNote = 'C’est noté : buse de ' + PlyoMachines.nozzleText(setup.nozzle) + ' sur ta machine. Plyo Slicer est passé sur le profil « ' + msg.preset + ' ». Changer de buse refait la préparation : filament, vérification et découpe.';
      endSetup();
      return;
    }
    setupPhase(setup.found ? 'link' : 'done');
  }
  function renderSetup(slot) {
    var box = el('div', 'tour setup');
    box.appendChild(el('div', 'step', 'Ton imprimante'));
    var acts = el('div', 'row-acts');
    var later = button('Plus tard', endSetup, 'link');
    if (setup.phase === 'scan') {
      box.appendChild(el('h3', '', 'Je cherche ton imprimante…'));
      box.appendChild(el('p', '', 'Allume-la si ce n’est pas déjà fait : je regarde sur le Wi-Fi de ta maison. Ça prend une dizaine de secondes.'));
      acts.appendChild(button('Je préfère la choisir dans la liste', openSearch, 'btn ghost sm', 'search'));
    } else if (setup.phase === 'found') {
      box.appendChild(el('h3', '', setup.printers.length === 1 ? 'J’ai trouvé une imprimante' : 'J’ai trouvé des imprimantes'));
      if (setup.error) box.appendChild(alertBox('error', 'Je n’ai pas pu installer ce profil. Réessaie, ou choisis ton imprimante dans la liste.'));
      setup.printers.forEach(function (p) {
        var row = el('div', 'printer-row setup-found');
        row.appendChild(icon('wifi', 16));
        var info = el('div', 'printer-info');
        info.appendChild(el('b', '', p.match ? p.match.model : (p.name || 'Imprimante')));
        info.appendChild(el('span', 'muted small', p.ip + (p.match ? '' : ' · modèle inconnu')));
        row.appendChild(info);
        if (p.match) row.appendChild(button('C’est la mienne', function () { chooseModel(p.match, p); }, 'btn sm'));
        else row.appendChild(button('Choisir son modèle', function () { setup.found = p; setup.query = p.brand || ''; openSearch(); }, 'btn ghost sm'));
        box.appendChild(row);
      });
      acts.appendChild(button('Ce n’est pas la mienne', openSearch, 'btn ghost sm', 'search'));
    } else if (setup.phase === 'none') {
      box.appendChild(el('h3', '', 'Elle est en Wi-Fi mais je ne la vois pas'));
      box.appendChild(el('p', '', 'Trois choses à vérifier :'));
      var list = el('ol', 'setup-checks');
      ['Elle est **allumée**, avec son écran actif.',
       'Elle est **connectée au Wi-Fi** : sur son écran, va dans Réglages, puis Réseau ou Wi-Fi, choisis ta box et entre le **mot de passe du Wi-Fi** (souvent écrit sous la box ou sur une étiquette).',
       'Elle est sur **le même Wi-Fi que cet ordinateur** (pas le Wi-Fi « invités » de la box).'].forEach(function (t) {
        var li = el('li'); li.appendChild(rich(t)); list.appendChild(li);
      });
      box.appendChild(list);
      box.appendChild(el('p', 'muted small', 'Beaucoup d’imprimantes n’ont pas de Wi-Fi : ce n’est pas grave, on passera par la clé USB ou la carte SD.'));
      acts.appendChild(button('Chercher encore', function () { startSetup(); renderSetupFlow(); }, 'btn sm', 'search'));
      acts.appendChild(button('La choisir dans la liste', openSearch, 'btn ghost sm'));
    } else if (setup.phase === 'search') {
      // Imprimante trouvée sur le réseau sans modèle reconnu : on part de sa marque (tous ses modèles d'Orca s'affichent).
      var foundBrand = setup.found && setup.found.brand;
      box.appendChild(el('h3', '', foundBrand ? 'Quel modèle de ' + foundBrand + ' est-ce ?' : 'Quelle imprimante as-tu ?'));
      if (foundBrand) box.appendChild(el('p', '', 'Je l’ai trouvée sur ton réseau (' + setup.found.ip + '), mais elle ne dit pas son modèle. Son nom est écrit dessus, souvent à l’avant.'));
      else box.appendChild(el('p', '', 'Son nom est écrit dessus, souvent à l’avant : par exemple « Ender 3 V3 », « K1C » ou « A1 mini ».'));
      if (setup.error) box.appendChild(alertBox('error', 'Je n’ai pas pu installer ce profil. Réessaie ou choisis-en un autre.'));
      var input = el('input', 'field setup-search');
      input.type = 'search';
      input.placeholder = 'Tape le nom de ton imprimante';
      input.setAttribute('aria-label', 'Nom de ton imprimante');
      // Un nom de modèle n'est pas un mot : ni bulle de correction de macOS, ni correction à la frappe (« MK4 »).
      input.setAttribute('autocorrect', 'off');
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('spellcheck', 'false');
      input.value = setup.query;
      var results = el('div', 'setup-results');
      function refresh() {
        setup.query = input.value;
        results.textContent = '';
        if (!setup.catalog) { results.appendChild(el('p', 'muted small', 'Chargement de la liste…')); return; }
        var found = PlyoMachines.searchModels(setup.catalog, setup.query);
        if (setup.query && !found.length) results.appendChild(el('p', 'muted small', 'Aucune imprimante ne correspond. Essaie avec moins de mots, par exemple juste « Ender ».'));
        found.forEach(function (m) { results.appendChild(button(m.model, function () { chooseModel(m, setup.found); }, 'btn ghost sm setup-pick')); });
        // Plusieurs modèles proches (V3, V3 SE, V3 KE…) : où lire le nom exact.
        if (found.length > 1) results.appendChild(el('p', 'muted small', 'Plusieurs modèles se ressemblent : le nom exact est écrit sur ta machine, souvent à l’avant ou au dos, ou sur son carton.'));
      }
      input.addEventListener('input', refresh);
      box.appendChild(input);
      box.appendChild(results);
      if (setup.noneFound) box.appendChild(button('Elle est en Wi-Fi mais je ne la vois pas', function () { setupPhase('none'); }, 'link'));
      refresh();
      setTimeout(function () { input.focus(); }, 0);
      acts.appendChild(button('Chercher sur le Wi-Fi', function () { startSetup(); renderSetupFlow(); }, 'btn ghost sm', 'wifi'));
    } else if (setup.phase === 'nozzle') {
      var nq = PlyoMachines.nozzleChoice(setup.pick.nozzles, setup.change ? setup.change.from : '');
      box.appendChild(el('h3', '', nq.title || 'Quelle taille de buse ?'));
      if (setup.error && setup.change) box.appendChild(alertBox('error', 'Je n’ai pas pu installer ce profil. Réessaie, ou garde ta buse d’aujourd’hui.'));
      box.appendChild(el('p', '', nq.text || ''));
      // 0,4 mm d'abord, marquée comme la plus courante ; la buse d'aujourd'hui (changement) ne se réinstalle pas.
      (nq.choices || [{ value: nq.auto, label: PlyoMachines.nozzleText(nq.auto) }]).forEach(function (c) {
        var b = button(c.label, function () { if (c.current) endSetup(); else installModel(c.value); }, 'btn ghost sm' + ((setup.change ? c.current : c.common) ? ' on' : ''));
        acts.appendChild(b);
      });
      if (nq.help) box.appendChild(el('p', 'muted small', nq.help));
      if (setup.change) later = button('Annuler', endSetup, 'link');
    } else if (setup.phase === 'installing') {
      box.appendChild(el('h3', '', setup.change ? 'Je passe sur la buse de ' + PlyoMachines.nozzleText(setup.nozzle) + '…' : 'J’installe ' + setup.pick.model + '…'));
      box.appendChild(el('p', '', setup.change ? 'Profil de ' + setup.pick.model + ' pour cette buse, qualités d’impression et filaments conseillés.' : 'Profil de l’imprimante, qualités d’impression et filaments conseillés.'));
      later = null;
    } else if (setup.phase === 'link') {
      box.appendChild(el('h3', '', setup.pick.model + ' est installée'));
      box.appendChild(el('p', '', 'Dernière étape : je la relie pour que tes impressions partent directement dessus.'));
      if (setup.nozzleAuto) box.appendChild(el('p', 'muted small', NOZZLE_AUTO_TEXT));
      // La liaison écrit dans son propre bloc : gardé d'un affichage à l'autre, et lancée une seule fois.
      if (!setup.linkBox) {
        setup.linkBox = el('div', 'printer-status');
        startLink(setup.found, setup.linkBox, function () { setup.phase = 'done'; setTimeout(renderSetupFlow, 1500); });
      }
      box.appendChild(setup.linkBox);
      later = button('Passer cette étape', function () { setupPhase('done'); }, 'link');
    } else if (setup.phase === 'done') {
      box.appendChild(el('h3', '', 'Ton imprimante est prête'));
      box.appendChild(rich(setup.found ? 'Elle est installée et reliée : à l’étape Imprimer, `Envoyer et imprimer` lui enverra tes impressions.' :
        'Elle est installée. Pour imprimer : à l’étape Imprimer, `Exporter le fichier`, puis copie-le sur la clé USB ou la carte SD de ton imprimante.'));
      if (setup.nozzleAuto) box.appendChild(el('p', 'muted small', NOZZLE_AUTO_TEXT));
      acts.appendChild(button('Continuer', endSetup, 'btn sm', 'check'));
      later = null;
    }
    if (acts.children.length) box.appendChild(acts);
    if (later) { var foot = el('div', 'row-acts'); foot.appendChild(later); box.appendChild(foot); }
    slot.appendChild(box);
  }

  // ---------- Journal des pièces ----------
  var journalTarget = null;
  function openJournal() {
    openDrawer('Mes pièces', function (body) {
      body.appendChild(el('p', 'muted', 'Les pièces que tu as imprimées ou exportées avec l’assistant : le problème vu, les réglages appliqués et le résultat. Tout reste sur cet ordinateur.'));
      var list = el('div', 'journal-list');
      list.appendChild(el('p', 'muted', 'Chargement…'));
      body.appendChild(list);
      journalTarget = list;
      window.orca.postMessage({ type: 'journal_list' });
    });
  }
  // `projects` : identifiants des projets encore gardés (absent : on ne sait pas, le bouton reste).
  function fillJournal(events, projects) {
    if (!journalTarget || $('drawer').classList.contains('hidden')) return;
    var list = journalTarget;
    list.textContent = '';
    var groups = Logic.journalGroups(events);
    if (!groups.length) {
      list.appendChild(emptyState('cube', 'Pas encore de pièce', 'Exporte ou imprime une pièce, ou pose une question à son sujet : elle apparaîtra ici, avec les réglages essayés et le résultat. Ses projets en cours sont dans « Mes projets ».',
        'Poser une question', function () { closeDrawer(); noteInput.focus(); }));
      return;
    }
    var here = lastValues && lastValues.context;
    groups.forEach(function (g) {
      var card = el('div', 'card journal-part');
      card.appendChild(el('h4', '', g.part));
      g.events.forEach(function (e) {
        var row = el('div', 'journal-event');
        // Sans photo, une vignette neutre avec l'icône de pièce plutôt qu'un carré gris vide.
        if (e.thumb) { var img = el('img', 'thumb'); img.src = e.thumb; img.alt = ''; row.appendChild(img); }
        else { var ph = el('span', 'thumb placeholder'); ph.appendChild(icon('cube', 20)); row.appendChild(ph); }
        var col = el('div', 'journal-body');
        var top = el('div', 'journal-top');
        top.appendChild(el('span', 'meta', [dayOf(e.at), Logic.shortMachine(e.printer, e.filament)].filter(Boolean).join(' · ')));
        var st = Logic.journalStatus(e);
        top.appendChild(el('span', 'badge-pill' + (st.tone ? ' ' + st.tone : ''), st.label));
        col.appendChild(top);
        col.appendChild(el('p', 'problem', Logic.journalProblem(e)));
        var q = Logic.outcomeQuestion(e, function (id) { var p = paramOf(id); return p.label === id ? null : p; });
        if (q.changes.length) {
          var ul = el('ul', 'meta');
          q.changes.forEach(function (c) { ul.appendChild(el('li', '', c)); });
          col.appendChild(ul);
        }
        if (e.note) col.appendChild(el('p', 'meta', 'Ton mot : « ' + e.note + ' »'));
        var acts = el('div', 'row-acts');
        if (!Array.isArray(projects) || projects.indexOf(e.conv) >= 0) {
          var reopen = button('Ouvrir le projet', function () { closeDrawer(); openConversation(e.conv); }, 'btn ghost sm', 'folder');
          reopen.title = fr('Rouvrir le projet de cette pièce : son plateau, ses réglages et ta discussion');
          acts.appendChild(reopen);
        } else col.appendChild(el('p', 'meta', 'Son projet a été supprimé : ses réglages restent ici.'));
        var again = Logic.reapplyChanges(e, here, lastValues && lastValues.params);
        if (again) {
          var re = button('Réappliquer', function () {
            re.disabled = true;
            // Lot du catalogue (clés d'Orca) ou de l'ancienne liste, vérifié par le slicer comme les autres, avec son « Annuler ».
            postBatches(Logic.batchesOf(again), 'Journal : ' + g.part, null, function (ok, text, ids) {
              if (!ok) { re.disabled = false; noteLine(text, 'error', 'alert'); return; }
              closeDrawer();
              var line = noteLine('Réglages de « ' + g.part + ' » réappliqués.', 'ok', 'check');
              if (ids.length) line.appendChild(undoButton('Annuler', function (u) {
                undoBatches(ids, function (okU, t) { if (!okU) { u.disabled = false; noteLine(t, 'error', 'alert'); return; } line.remove(); noteLine('Réglages d’avant remis.', 'ok', 'undo'); });
              }));
            });
          }, 'btn ghost sm', 'wand');
          re.title = fr('Remettre ces réglages sur ton profil actuel');
          acts.appendChild(re);
        }
        if (!again && e.changes && e.changes.length && e.outcome !== 'bad')
          col.appendChild(el('p', 'meta', 'Trouvés pour une autre imprimante ou un autre filament : pas réappliqués ici.'));
        row.appendChild(col);
        row.appendChild(acts); // sur toute la largeur : les deux boutons tiennent sur une ligne à 320 px
        card.appendChild(row);
      });
      list.appendChild(card);
    });
  }

    openDrawer('Mon utilisation', function (body) {
      var big = el('div', 'gauge-big');
      var pct = el('div', 'pct', '…');
      var bar = el('span', 'bar'), fill = el('i');
      bar.appendChild(fill);
      var when = el('p', 'muted', '');
      big.appendChild(pct);
      big.appendChild(bar);
      big.appendChild(when);
      body.appendChild(big);
      var extra = el('p', 'muted hidden', '');
      body.appendChild(extra);
      body.appendChild(el('h3', '', 'Ta formule'));
      var plan = el('div', 'plan current');
      var planHead = el('div', 'head');
      var planName = el('span', '', '');
      planHead.appendChild(planName);
      planHead.appendChild(el('span', 'badge-pill ok', 'En cours'));
      plan.appendChild(planHead);
      var planText = el('p', 'muted', '');
      plan.appendChild(planText);
      body.appendChild(plan);
      var soon = el('div', 'card');
      var soonHead = el('header');
      soonHead.appendChild(icon('bulb', 16));
      soonHead.appendChild(el('span', '', 'Les formules arrivent'));
      soon.appendChild(soonHead);
      soon.appendChild(el('p', 'muted', 'Bientôt : Plyo+ et Pro pour une jauge plus grande chaque mois. Plyo+ correspond à environ 100 questions ou 40 photos par mois, Pro à environ 330 questions ou 130 photos. Plyo+ ouvre aussi les pièces sur mesure et plusieurs photos dans une même demande. Une recharge sans abonnement agrandira aussi ta jauge (ce que tu n’en utilises pas reste le mois suivant).'));
      soon.appendChild(el('p', 'muted', 'Le slicer, l’onglet Étapes et l’envoi à l’imprimante ne touchent jamais la jauge. Tu verras les formules ici dès qu’elles seront prêtes ; d’ici là, ta jauge gratuite se recharge chaque mois.'));
      body.appendChild(soon);
      body.appendChild(el('h3', '', 'Comment la jauge se remplit'));
      body.appendChild(rich('Chaque demande à l’IA remplit un peu ta jauge : un peu plus avec des photos, rien quand la demande sort de l’impression 3D. Une réponse commencée va toujours jusqu’au bout.'));
      body.appendChild(rich('Toujours gratuit : l’accueil, le parcours en étapes, les explications des réglages (le « ? » à côté d’un réglage, ou « c’est quoi la rétraction ? »), « Montre-moi où il est », la pose d’un modèle sur le plateau et le lancement des tests de calibration.'));
      function show(g) {
        var v = Logic.gaugeView(g);
        if (!v) return;
        pct.textContent = fr(v.label + ' utilisés ce mois-ci');
        when.textContent = fr(Logic.gaugeResetText(g));
        paintGauge(big, fill, v);
        extra.textContent = fr(Logic.gaugeExtraText(g));
        extra.classList.toggle('hidden', !extra.textContent);
        planName.textContent = fr(v.plan);
        planText.textContent = fr(PLAN_TEXT[g.plan] || PLAN_TEXT.gratuit);
      }
      show(lastGauge);
      var loading = el('p', 'muted', lastGauge ? '' : 'Chargement…');
      if (!lastGauge) body.appendChild(loading);
      apiFetch('/api/me/credits', { method: 'GET' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (data) { loading.remove(); setGauge(data.gauge); show(data.gauge); })
        .catch(function () {
          loading.textContent = fr('Le détail n’a pas pu être chargé. Vérifie ta connexion, puis rouvre ce volet.');
          if (!loading.parentNode) body.appendChild(loading);
        });
    });
  }

  // ---------- Menu « ⋯ » ----------
  $('btn-more').addEventListener('click', function (e) { e.stopPropagation(); menu.classList.toggle('hidden'); });
  document.addEventListener('click', function (e) { if (!menu.contains(e.target)) menu.classList.add('hidden'); });
  $('m-new').addEventListener('click', function () { menu.classList.add('hidden'); newConversation(); });
  $('m-convs').addEventListener('click', openConversations);
  $('m-parts').addEventListener('click', openJournal);
  // « Mes machines » (gérer, masquer, reprendre des habitudes) : un geste rare, rangé ici plutôt que dans l'étape Machine.
  $('m-machines').addEventListener('click', function () { menu.classList.add('hidden'); openMachinesDrawer(); });
  $('m-usage').addEventListener('click', openUsage);
  $('gauge').addEventListener('click', openUsage);
  $('m-undo').addEventListener('click', function () { menu.classList.add('hidden'); window.orca.postMessage({ type: 'undo' }); });
  $('m-intent').addEventListener('click', function () {
    menu.classList.add('hidden');
    habits = PlyoMachines.stopAsking(habits, false);
    saveHabits();
    if (conv) {
      intentUI.changing = conv; // les questions elles-mêmes, pas « Comme la dernière fois »
      var redo = PlyoProject.nextStep(conv.project) === 'ready';
      // Plaque déjà découpée : retour à Préparer avec les questions ; la découpe sera refaite avec les nouvelles réponses.
      conv.project.intent = redo && tourSignals && tourSignals.sliced ? { reask: true } : {};
      if (redo) conv.project.step = 'slice';
      intentUI.idk = false; intentUI.manual = null; projectChanged();

  // ---------- Réglages lus par le slicer ----------
  function formatValue(value, unit) {
    if (value === null || value === undefined) return '—';
    if (typeof value === 'boolean') return value ? 'Oui' : 'Non';
    if (typeof value === 'string') return Logic.choiceLabel(value);
    return (Math.round(value * 1000) / 1000).toLocaleString('fr-FR') + (unit ? ' ' + unit : '');
  }

  function renderValues(msg) {
    lastValues = msg;
    $('m-undo').disabled = !msg.can_undo;
    $('m-undo').title = fr(msg.can_undo ? 'Remet les réglages d’avant la dernière application' : 'Rien à annuler pour l’instant');
  }

  function paramOf(id) {
    return (lastValues && lastValues.params.find(function (x) { return x.id === id; })) || { label: id, unit: '', value: null };
  }

  // ---------- Photos : réduites à 1 600 px, JPEG 85 % (vignette de 160 px gardée dans la conversation) ----------
  // La vue web peut signaler l'image chargée avant de l'avoir décodée : le dessin reste alors vide, et un canevas
  // vide exporté en JPEG donne une image noire. On attend donc le décodage, on peint un fond blanc, et on vérifie
  // que l'image a bien été dessinée (un second essai, puis abandon plutôt qu'une photo noire).
  function drawn(ctx, w, h) {
    var px = ctx.getImageData(0, 0, w, h).data;
    var step = Math.max(4, Math.floor(px.length / 4 / 400) * 4);
    for (var i = 0; i < px.length; i += step) if (px[i] < 250 || px[i + 1] < 250 || px[i + 2] < 250) return true;
    return false;
  }
  function scaled(src, side, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      function render(retry) {
        var scale = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        if (drawn(ctx, canvas.width, canvas.height)) return resolve(canvas.toDataURL('image/jpeg', quality));
        if (retry) return setTimeout(function () { render(false); }, 150);
        reject(new Error('blank'));
      }
      img.onload = function () {
        var ready = img.decode ? img.decode().catch(function () {}) : Promise.resolve();
        ready.then(function () { render(true); });
      };
      img.onerror = function () { reject(new Error('unreadable')); };
      img.src = src;
    });
  }
  function downscale(file) {
    var url = URL.createObjectURL(file);
    return scaled(url, MAX_SIDE, 0.85).then(function (dataUrl) {
      URL.revokeObjectURL(url);
      return { media_type: 'image/jpeg', data: dataUrl.split(',')[1], preview: dataUrl };
    }, function (e) { URL.revokeObjectURL(url); throw e; });
  }

  function addAttachments(list) {
    list.forEach(function (a) { if (attachments.length < MAX_PHOTOS) attachments.push(a); });
    if (attachments.length >= MAX_PHOTOS) noteLine(MAX_PHOTOS + ' photos au plus par demande.', '', 'info');
    renderAttachments();
  }

  function renderAttachments() {
    attachedEl.textContent = '';
    attachedEl.classList.toggle('hidden', !attachments.length);
    attachments.forEach(function (a, i) {
      var box = el('div', 'att');
      var img = el('img');
      img.src = a.preview;
      img.alt = 'Photo ' + (i + 1);
      var remove = el('button');
      remove.type = 'button';
      remove.title = 'Retirer cette photo';
      remove.setAttribute('aria-label', 'Retirer la photo ' + (i + 1));
      remove.appendChild(icon('x', 10));
      remove.addEventListener('click', function () { attachments.splice(i, 1); renderAttachments(); });
      box.appendChild(img);
      box.appendChild(remove);
      attachedEl.appendChild(box);
    });
  }

  function pickFiles() { fileInput.click(); }
  fileInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(fileInput.files || []);
    fileInput.value = '';
    addFiles(files);
  });

  // Photos → pièces jointes de la demande ; modèles 3D → posés sur le plateau par Plyo (gratuit).
  var MAX_MODEL_BYTES = 150 * 1024 * 1024;
  function addFiles(all) {
    var models = all.filter(function (f) { return FS.isModelFile(f.name); });
    var files = all.filter(function (f) { return !FS.isModelFile(f.name); });
    // Plusieurs pièces d'un coup : la première comme d'habitude, les autres ajoutées au même plateau, une à la fois (onModelAdded).
    if (models.length) { projectUI.modelQueue = models.slice(1); sendModel(models[0]); }
    if (!files.length) return;
    Promise.all(files.map(function (f) { return downscale(f).catch(function () { return null; }); })).then(function (list) {
      var ok = list.filter(Boolean);
      if (ok.length < list.length) noteLine(FS.unreadableFileText(files.filter(function (f, i) { return !list[i]; })[0].name), 'error', 'alert');
      addAttachments(ok);
      noteInput.focus();
    });
  }

  // Un projet = une pièce, et la pièce vient après l'imprimante et le filament (fiche « Mon projet »).
  function sendModel(file) {
    applyTab('show-guide'); // la pièce se pose et se vérifie dans le Guide
    // La pièce d'abord (lot 6) : posée tout de suite, sur la machine en cours d'Orca si aucune n'est encore choisie ; elle reste
    // au choix de la machine, et un 3MF est adapté une fois machine et bobine choisies (needsAdaptation). Une pièce reprise du
    // plateau sans machine choisie cède la place au fichier déposé (retirée à l'import, avec « Annuler »).
    var adopted = conv.project.part && conv.project.part.fromPlate;
    if (adopted && !PlyoProject.hasPrinter(conv.project)) {
      conv.project.part = null;
      if (tourSignals && tourSignals.objects > 0) projectUI.newProjectFile = true;
    }
    var part = conv.project.part && conv.project.part.name;
    // « Ajouter une pièce à ce plateau » : la pièce rejoint ce projet.
    if (projectUI.addingPart && part) { addToPlate(file); return; }
    // « Ta pièce » rouverte depuis la barre : le fichier choisi ouvre son projet sans question de plus (le geste était voulu).
    if (projectUI.editing === 'part' && part && file.name !== part) {
      partInNewProject(function () { projectUI.waitingFile = file; projectUI.newProjectFile = true; projectChanged(); });
      return;
    }
    if (projectUI.editing === 'part') { projectUI.editing = null; renderProject(); }
    if (part && file.name !== part) { offerNewProject(file); return; }
    if (part && !(tourSignals && tourSignals.objects === 0)) { projectUI.modelQueue = []; noteLine('« ' + part + ' » est déjà sur le plateau.', '', 'info', 'guide'); return; }
    // La pièce de ce projet n'est plus sur le plateau (relance d'Orca, pièce supprimée) : on la repose, le projet continue.
    projectUI.reposing = !!part;
    importModel(file);
  }
  // Une autre pièce, c'est un autre projet : on propose une nouvelle conversation avec sa propre fiche.
  function offerNewProject(file) {
    var slot = $('project-alert');
    slot.textContent = '';
    var more = projectUI.modelQueue ? projectUI.modelQueue.length : 0;
    var box = alertBox('tip', (more ? '« ' + file.name + ' » et ' + more + (more > 1 ? ' autres pièces' : ' autre pièce') : '« ' + file.name + ' »') + ' : sur le même plateau que « ' + conv.project.part.name + ' », ou dans un nouveau projet ?', 'cube');
    var acts = el('div', 'printer-actions');
    // Une impression de plusieurs pièces : elles partagent le plateau (rangé ensuite par Plyo Slicer).
    acts.appendChild(button('L’ajouter à ce plateau', function () { slot.textContent = ''; addToPlate(file); }, 'btn sm'));
    acts.appendChild(button('Nouveau projet', function () {
      slot.textContent = '';
      if (busy) { blockedWhileBusy(); return; }
      newConversation();
      projectUI.waitingFile = file;
      projectUI.newProjectFile = true;
      projectChanged();
    }, 'btn ghost sm'));
    acts.appendChild(button('Annuler', function () { slot.textContent = ''; projectUI.modelQueue = []; }, 'link'));
    box.body.appendChild(acts);
    slot.appendChild(box);
  }
  function dropPlacing() { if (projectUI.placing) { projectUI.placing.remove(); projectUI.placing = null; } }

  // ---------- Fil du projet (project-thread.js) : ce qui se passe, quel que soit l'onglet, transmis à l'assistant ----------
  function threadNote(text, from) {
    if (conv && PlyoThread.add(conv.project, from || (viewUI.tab === 'chat' ? 'discussion' : 'etapes'), text)) scheduleSave();
  }

  // La discussion a appris où en est l'impression (« c'est raté », « elle tourne ») : l'onglet Étapes suit, par les mêmes
  // gestes que ses boutons (mémoire des corrections, bobine, journal compris).
  function applyPrintOutcome(outcome) {
    if (!conv || !outcome || outcome === 'none') return;
    var move = PlyoThread.outcomeMoves(PlyoJourney.currentStep(conv.project), outcome, { success: !!conv.project.success, failed: !!(sendOf() && sendOf().failed) });
    if (!move.moves.length) return;
    move.moves.forEach(function (m) { stepHandlers[m](); });
    noteLine(move.text, 'ok', 'check', 'chat');
  }

  // ---------- « Crée-moi une pièce » (pièces sur mesure) ----------
  // L'IA décrit (plyo-api /api/design), le panneau vérifie et construit (design-builder.js, manifold-3d), le slicer pose le
  // STL comme un fichier choisi. Retouche : la pièce en cours repart avec la demande, la nouvelle remplace l'ancienne.
  var designUI = { open: false, conv: null, retouch: false, text: '', busy: false, questions: [], answers: [], conversation: [], part: null, message: '', failed: false, needsLogin: false, placing: null };
  function designStart(retouch) {
    var keep = retouch ? (designUI.conv === conv && designUI.part) || (conv.project.design && conv.project.design.part) || null : null;
    designUI = { open: true, conv: conv, retouch: !!retouch, text: '', images: [], busy: false, questions: [], answers: [], conversation: [], part: keep, message: '', failed: false, needsLogin: !session, placing: null };
    renderProject();
  }
  var designLib = { promise: null };
  // manifold-3d, lue par le slicer dans ses ressources (la page est chargée comme texte) : module ES rendu classique, puis
  // instancié avec ses octets WebAssembly (la politique de sécurité permet 'wasm-unsafe-eval', jamais eval).
  function loadDesignLib() {
    if (designLib.promise) return designLib.promise;
    designLib.promise = new Promise(function (resolve, reject) { designLib.resolve = resolve; designLib.reject = reject; });
    window.orca.postMessage({ type: 'design_lib_get' });
    return designLib.promise;
  }
  function onDesignLib(msg) {
    var lib = designLib;
    if (!lib.resolve) return;
    if (!msg.ok) { designLib = { promise: null }; lib.reject(new Error('bibliothèque introuvable')); return; }
    try {
      var code = String(msg.js).replace(/import\.meta\.url/g, '"plyo://manifold.js"').replace(/export default Module;?\s*$/, 'window.__plyoManifold = Module;');
      var tag = document.createElement('script');
      var known = document.querySelector('script[nonce]');
      tag.nonce = known ? known.nonce : '';
      tag.textContent = code;
      document.head.appendChild(tag);
      var raw = atob(msg.wasm), bytes = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      window.__plyoManifold({ wasmBinary: bytes }).then(function (w) {
        w.setup();
        lib.resolve({ Manifold: w.Manifold, CrossSection: w.CrossSection });
      }, function (e) { designLib = { promise: null }; lib.reject(e); });
    } catch (e) { designLib = { promise: null }; lib.reject(e); }
  }
  function designSay(text, failed) { designUI.busy = false; designUI.message = text; designUI.failed = !!failed; renderProject(); }
  function designSubmit() {
    if (designUI.busy) return;
    if (!session) { designUI.needsLogin = true; renderProject(); return; }
    if (!String(designUI.text || '').trim()) { designSay('Décris ta pièce en quelques mots.', true); return; }
    designUI.busy = true; designUI.message = ''; designUI.failed = false;
    renderProject();
    loadDesignLib().catch(function () {}); // en parallèle de la conception
    var asked = designUI, body = PlyoDesignFlow.request(designUI, { locale: (navigator.language || 'fr'), material: conv.project.filament && !conv.project.filament.proposed ? conv.project.filament.type : '', requestId: Logic.newRequestId(window.crypto) });
    apiFetch('/api/design', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, j: j }; });
    }).then(function (res) {
      if (designUI !== asked) return; // annulé ou autre projet entre-temps
      var j = res.j || {};
      if (j.credits && j.credits.gauge) setGauge(j.credits.gauge);
      if (res.status === 401) { designUI.needsLogin = true; designSay('Ta session a expiré : reconnecte-toi pour créer ta pièce.', true); return; }
      if (j.error === 'plan_required') { designUI.planRequired = true; designSay(PlyoDesignFlow.TEXT.planRequired, false); return; }
      if (res.status !== 200) {
        if (j.error === 'insufficient_credits' && j.gauge) setGauge(j.gauge, true);
        designSay(Logic.errorView(j.error || 'upstream_error', j).text, true);
        return;
      }
      designUI.conversation.push({ role: 'user', text: body.text });
      if (j.message) designUI.conversation.push({ role: 'assistant', text: j.message });
      if (j.status === 'question' && Array.isArray(j.questions) && j.questions.length) {
        designUI.busy = false; designUI.questions = j.questions; designUI.answers = []; designUI.message = j.message || ''; designUI.text = '';
        renderProject();
        return;
      }
      if (j.status !== 'design') { designUI.text = ''; designSay(j.message || 'Je ne peux pas dessiner cette pièce.', false); return; }
      designPlace(j);
    }).catch(function () { if (designUI === asked) designSay(Logic.errorView('network').text, true); });
  }
  function designPlace(answer) {
    var asked = designUI;
    loadDesignLib().then(function (M) {
      if (designUI !== asked) return;
      var built = PlyoDesign.build(M, answer.part);
      if (!built.ok) { designSay('Je n’ai pas pu fabriquer cette pièce (' + built.error + '). Redécris-la plus simplement.', true); return; }
      var stl = PlyoDesign.toSTL(built.mesh, answer.part.name), bin = '';
      for (var i = 0; i < stl.length; i += 0x8000) bin += String.fromCharCode.apply(null, stl.subarray(i, i + 0x8000));
      var name = PlyoDesignFlow.fileName(answer.part);
      conv.project.design = { part: answer.part }; // gardée avec le projet : retouches depuis la discussion, et après un redémarrage
      scheduleSave();
      designUI = { open: false, conv: conv, retouch: false, text: '', busy: false, questions: [], answers: [], conversation: asked.conversation, part: answer.part, message: '', failed: false, needsLogin: false,
        placing: { message: answer.message || '', size: built.size, name: name, retouch: !!asked.retouch } };
      projectUI.placing = noteLine('Je pose « ' + answer.part.name + ' » sur le plateau…', '', 'cube', 'guide');
      window.orca.postMessage({ type: 'model_add', name: name, data: btoa(bin), project: conv.project, conv: conv.id,
        replace: asked.retouch || PlyoProject.replacesPlate(conv.project, projectUI.oldPart, projectUI.newProjectFile) });
      renderProject();
    }, function () { if (designUI === asked) designSay('Je n’arrive pas à charger l’outil de dessin des pièces. Relance Plyo Slicer, puis réessaie.', true); });
  }
  // Pièce créée posée : ce que c'est, ses cotes (les supposées signalées), et « Changer quelque chose ».
  function designPlaced(msg) {
    var p = designUI.placing;
    if (!p || designUI.conv !== conv || msg.name !== p.name.replace(/\.stl$/, '') && msg.name !== p.name) return;
    designUI.placing = null;
    if (!msg.ok) return;
    threadNote('Pièce ' + (p.retouch ? 'retouchée' : 'dessinée') + ' par Plyo : « ' + designUI.part.name + ' », ' + PlyoDesign.sizeText(p.size) + (p.message ? '. ' + p.message : '.'));
    // Retouchée après la préparation (ou après « Bravo, c'est réussi ! ») : nouvelle pièce, le parcours repart de Préparer,
    // comme « Réimprimer cette pièce » ; d'abord, car le changement d'étape efface les messages de l'étape.
    var redo = PlyoDesignFlow.redoesPreparation(PlyoJourney.currentStep(conv.project), p.retouch);
    if (redo) {
      delete conv.project.success;
      // La découpe et la vérification parlaient de l'ancienne pièce (le slicer ne le dit qu'au signal suivant) : périmées tout de suite.
      if (tourSignals) tourSignals.sliced = false;
      plateChecked = null; openRisks = 0; $('preflight-slot').textContent = ''; preflightFix = null;
      threadNote('Retour à « Préparer » : la pièce a changé.', 'etapes');
      setTourStep('slice');
    }
    // Une seule carte de pièce : celle de la dernière version.
    $('guide-notes').querySelectorAll('.design-placed').forEach(function (old) { old.remove(); });
    var part = designUI.part, line = noteLine(PlyoDesignFlow.TEXT.placed + ' : « ' + part.name + ' », ' + PlyoDesign.sizeText(p.size) + '.', 'ok', 'cube', 'guide');
    line.classList.add('design-placed');
    var dims = PlyoDesignFlow.dimensionLines(part);
    if (p.message) line.querySelector('.note-text').appendChild(el('span', 'design-said', ' ' + p.message));
    if (dims.length) line.querySelector('.note-text').appendChild(el('span', 'design-dims', ' Cotes : ' + dims.join(', ') + '. ' + PlyoDesignFlow.TEXT.check));
    if (redo) line.querySelector('.note-text').appendChild(el('span', 'design-said', ' ' + PlyoDesignFlow.REDO_TEXT));
    line.appendChild(button(PlyoDesignFlow.TEXT.change, function () { designStart(true); }, 'btn ghost sm', 'wand'));
  }
  // Croquis ou photo joint à la description : réduit à 1 600 px au plus (JPEG), pour rester sous la limite du service.
  function designAttach() {
    // Dans la page, caché : WebKit (macOS) ne signale pas toujours le fichier choisi par un champ resté hors de la page.
    var pick = document.createElement('input');
    pick.type = 'file';
    pick.accept = 'image/png,image/jpeg,image/webp';
    pick.className = 'hidden';
    document.body.appendChild(pick);
    pick.addEventListener('change', function () {
      var file = pick.files && pick.files[0], mine = designUI;
      pick.remove();
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          var g = c.getContext('2d');
          g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
          g.drawImage(img, 0, 0, c.width, c.height);
          var url = c.toDataURL('image/jpeg', 0.85);
          if (designUI !== mine || mine.images.length >= PlyoDesignFlow.MAX_IMAGES) return;
          mine.images.push({ name: file.name.slice(0, 60), media_type: 'image/jpeg', data: url.slice(url.indexOf(',') + 1) });
          renderProject();
        };
        img.onerror = function () { designSay('Je n’ai pas pu lire cette image : choisis un fichier PNG ou JPEG.', true); };
        img.src = String(reader.result);
      };
      reader.readAsDataURL(file);
    });
    pick.click();
  }
  var designHandlers = {
    input: function (t) { designUI.text = t; },
    attach: designAttach,
    removeImage: function (i) { designUI.images.splice(i, 1); renderProject(); },
    submit: designSubmit,
    plans: openUsage,
    answer: function (i, choice) {
      designUI.answers[i] = choice;
      if (designUI.answers.filter(Boolean).length < designUI.questions.length) { renderProject(); return; }
      designUI.text = PlyoDesignFlow.answersText(designUI.questions, designUI.answers);
      designUI.questions = []; designUI.answers = [];
      designSubmit();
    },
    cancel: function () { designUI.open = false; designUI.busy = false; renderProject(); },
    login: function () { openLogin(); }
  };
  // Pièces suivantes d'un même choix (ou ajoutées à ce plateau) : posées sans remplacer, puis le plateau est rangé par Orca.
  function nextQueuedModel() {
    var next = projectUI.modelQueue && projectUI.modelQueue.shift();
    if (next) { importModel(next, true); return; }
    if (projectUI.arrangeAfter) {
      projectUI.arrangeAfter = false;
      var tooBig = projectUI.tooBigNames || [];
      projectUI.tooBigNames = [];
      plateAction('arrange', function (ok) {
        // Une pièce plus grande que le plateau : Orca ne peut rien ranger. On le dit (la carte « trop grande » propose de la réduire).
        if (tooBig.length) noteLine(PlyoJourney.arrangeTooBigText(tooBig), 'warn', 'alert', 'guide');
        else if (!ok) noteLine('Je n’ai pas pu ranger les pièces sur le plateau. Dans Plyo Slicer, le bouton « Organiser » (touche A) le fait aussi.', 'warn', 'alert', 'guide');
      }, null, null, true);
    } else projectUI.tooBigNames = [];
  }

  // Libellé d'un bouton : sans compte, « Demander à l'assistant » dit qu'il faut se connecter (la question part après, afterLogin).

  function orcaActions(actions, box) {

    var wrap = main ? el('div', 'stack orca-acts') : acts;

  // « Annuler les derniers réglages de l'assistant » depuis une carte d'Orca : le dernier lot appliqué (comme le menu « ⋯ »),
  // puis la découpe repart et dit à son tour si Orca est d'accord.
  function undoLastFromCard(b, box) {
    b.disabled = true;
    var mine = conv;
    pendingSheet = { kind: 'undo', onResult: function (ok, text) {
      if (!ok) { b.disabled = false; noteLine(text || 'Je n’ai pas pu annuler.', 'error', 'alert', 'guide'); return; }

      var fixed = alertBox('tip', '', 'check');

      return;
    }
    if (msg.purpose === 'blocked') { rememberIssues(issues); showOrcaIssues(issues, {}); renderProject(); return; }
    // Bulle d'Orca apparue sur le plateau (ERR-11) : sa carte, sans redire une carte déjà là. Orca découpe : on redemandera.
    if (msg.purpose === 'notices') {
      if (msg.busy) { orcaUI.notices = []; return; }
      var shown = window.PlyoPreflight.noticeIssues(issues, orcaUI.noticeAsk, orcaUI.known).filter(function (i) {
        return !$('project-alert').querySelector('.orca-issue[data-code="' + i.code + '"]');
      });
      rememberIssues(shown);
      if (shown.length) showOrcaIssues(shown, { warnings: true, keep: true });
      return;
    }
    if (msg.purpose === 'after_apply') {
      var wait = orcaUI.afterApply;
      if (!wait) return;
      // Le lot n'est pas encore pris en compte par Orca : on relit un peu plus tard (cinq fois au plus).
      if ((msg.pending || msg.busy) && wait.tries < 5) { wait.tries += 1; setTimeout(function () { askOrca('after_apply'); }, 700); return; }
      orcaUI.afterApply = null;
      // Erreurs : toujours (la prochaine découpe serait refusée) ; avertissements : ceux des réglages du lot, ou nouveaux.
      var said = issues.filter(function (i) {
        return i.source === 'validate_error' || (i.source === 'validate_warning' && (wait.keys.indexOf(i.opt_key) >= 0 || !orcaUI.known[window.PlyoPreflight.issueKey(i)]));
      });
      rememberIssues(issues);
      if (said.length) showOrcaIssues(said, { warnings: true, keep: true });
    }
  }

  // ---------- Ordres exécutés tout de suite (« penche la pièce de 20° ») ----------
  // Le slicer les exécute dès la réponse, en une seule étape annulable ; la conversation garde ce qui a été fait.
  var commandWaiters = {};
  function commandLine(text, tone, iconName) {
    var line = el('div', 'note-line' + (tone ? ' ' + tone : ''));
    line.appendChild(icon(iconName, 14));
    line.appendChild(el('span', 'note-text', text));
    return line;
  }
  function renderCommands(entry, archived) {
    var a = entry.data;
    var wrap = el('div', 'cmds');
    var list = el('div', 'cmds-list');
    wrap.appendChild(list);
    function show(result) {
      list.textContent = '';
      result.done.forEach(function (d) { list.appendChild(commandLine(d || 'Fait sur le plateau', 'ok', 'check')); }); // jamais une coche sans texte (N1)
      if (result.text) list.appendChild(commandLine(result.text, 'error', 'alert'));
      result.skipped.forEach(function (t) { if (t) list.appendChild(commandLine(t, '', 'info')); });
      if (result.undone) list.appendChild(commandLine('Annulé : le plateau est revenu comme avant.', '', 'undo'));
    }
    if (entry.commandsResult) show(entry.commandsResult);
    else if (archived) list.appendChild(commandLine('Ces changements n’ont pas été faits sur le plateau.', '', 'info'));
    else {
      list.appendChild(commandLine('Je modifie le plateau…', '', 'wand'));
      var id = ++plateRequest;
      commandWaiters[id] = function (msg) {
        entry.commandsResult = { done: msg.done || [], text: msg.text || '', skipped: msg.skipped || [] };
        if (entry.hist) entry.hist.text = (summaryForHistory(a, entry.commandsResult)).slice(0, 2000);
        scheduleSave();
        show(entry.commandsResult);
        if (msg.undo_token === undefined || !entry.commandsResult.done.length) return;
        plateUndoLinks.forEach(function (b) { b.remove(); });
        var row = el('div', 'undo-row');
        row.appendChild(doneLabel('Fait sur le plateau'));
        var undo = undoButton('Annuler', function (b) {
          plateAction('undo', function (ok) {
            if (!ok) { b.disabled = false; return; }
            row.remove();
            entry.commandsResult.undone = true;
            scheduleSave();
            show(entry.commandsResult);
          }, { undo_token: msg.undo_token });
        });
        row.appendChild(undo);
        plateUndoLinks = [row];
        list.after(row);
        // Le récapitulatif et son « Annuler » doivent se voir (N1), pas rester sous le bord de la discussion ni sous le badge
        // « Voir la suite » : au milieu de la zone, comme le compte rendu d'une fiche appliquée.
        if (viewUI.tab === 'chat' && row.isConnected) { row.scrollIntoView({ block: 'center' }); updateMoreBadge(); }
      };
      // Chaque ordre part avec son texte (celui de l'IA, sinon celui de Plyo) : le slicer le rend pour chaque ordre fait.
      window.orca.postMessage({ type: 'commands', commands: (a.commands || []).map(function (c) { return c && typeof c === 'object' && !Array.isArray(c) ? Object.assign({}, c, { summary: Logic.commandSummary(c) }) : c; }), request: id });
    }
    if (a.how_to) {
      var how = el('div', 'howto hidden');
      how.appendChild(rich(a.how_to));
      var tool = Logic.commandTool(a.commands);
      if (tool && !archived) how.appendChild(el('div', 'row-acts')).appendChild(button('Ouvre l’outil sur la pièce', function () {
        window.orca.postMessage({ type: 'open_tool', tool: tool });
      }, 'btn ghost sm', 'eye'));
      var toggle = button('Comment le faire moi-même', function () {
        how.classList.toggle('hidden');
        toggle.setAttribute('aria-expanded', how.classList.contains('hidden') ? 'false' : 'true');
      }, 'disclosure', 'chevron');
      toggle.setAttribute('aria-expanded', 'false');
      wrap.appendChild(toggle);
      wrap.appendChild(how);
    }
    return wrap;
  }

  // Boutons d'action proposés par l'IA. Dans une conversation rouverte, seules les actions sans effet restent.
  var PLATE_KINDS = ['orient', 'arrange', 'scale_to_fit', 'slice'];
  function renderActions(actions, archived) {
    // Une action que ce panneau ne sait pas exécuter n'a pas de bouton ; un test d'Orca ne se relance pas d'une conversation rouverte.
    var list = (actions || []).filter(function (a) { return Logic.actionSupported(a) && !(archived && a.kind === 'open_calibration') && !(archived && (PLATE_KINDS.indexOf(a.kind) >= 0 || a.kind === 'remember_success' || a.kind === 'redesign')); });
    if (!list.length) return null;
    var row = el('div', 'row-acts');
    list.forEach(function (a) {
      var iconName = a.kind === 'show' || a.kind === 'show_setting' || a.kind === 'open_tool' ? 'eye' : 'wand';
      var b = button(a.label, function () {
        if (a.kind === 'show' && a.target === 'preview') showPreview(b);
        else if (a.kind === 'open_calibration') confirmRawTest(a.target, row, b);
        else if (a.kind === 'show') showMe(a.target);
        else if (a.kind === 'open_tool') window.orca.postMessage({ type: 'open_tool', tool: a.target });
        else if (a.kind === 'show_setting') showSetting(a.target);
        else if (a.kind === 'redesign') {
          // Retouche demandée dans la discussion : elle part au concepteur avec la pièce en cours ; on suit dans « Étapes ».
          b.disabled = true;
          designStart(true);
          designUI.text = String(a.target || '').slice(0, 200);
          applyTab('show-guide');
          designSubmit();
        }
        else if (a.kind === 'remember_success') {
          // Le slicer marque le dernier envoi (pointeur gardé, marche aussi après un redémarrage d'Orca), seulement s'il est
          // celui de la bobine de cette conversation, récent et pas déclaré raté ; sa réponse dit ce qui est noté, ou pourquoi pas.
          b.disabled = true;
          if (sendOf()) { sendOf().marked = true; scheduleSave(); } // « Oui, c'est réussi » n'envoie plus rien pour cet envoi
          markSendAnswered(); // réussite dite dans la discussion : la question de fin de cet envoi ne vient plus
          var convSpool = conv && conv.project && conv.project.filament && conv.project.filament.spool;
          window.orca.postMessage({ type: 'spool_success', spool: (convSpool && convSpool.id) || '' });
        } else {
          b.disabled = true;
          if (a.kind === 'slice') assistSlice = { conv: conv, row: row };
          plateAction(a.kind, function (ok) { if (!ok) { b.disabled = false; if (a.kind === 'slice') assistSlice = null; } });
        }
      }, 'btn ghost sm', iconName);
      row.appendChild(b);
    });
    return row;
  }

  // Action « show » / « preview » : l'onglet « Aperçu » d'Orca, et ce qu'on y regarde.
  var previewWaiters = {}, rawTestWaiters = {}, rawTestRequest = 0;
  function showPreview(b) {
    var id = ++rawTestRequest;
    b.disabled = true;
    previewWaiters[id] = function (msg) {
      b.disabled = false;
      noteLine(Logic.previewText(msg), msg.ok && msg.sliced ? 'ok' : msg.ok ? 'warn' : 'error', msg.ok ? 'eye' : 'alert');
    };
    window.orca.postMessage({ type: 'show_preview', request: id });
  }
  // Action « open_calibration » : ce qui va se passer est dit AVANT, et rien ne part sans « Ouvrir le test ».
  function confirmRawTest(target, row, b) {
    var t = Logic.rawTestText(target);
    if (!t || row.nextElementSibling && row.nextElementSibling.classList.contains('raw-test')) return;
    var box = alertBox('warn', t.before, 'alert');
    box.classList.add('raw-test');
    var acts = el('div', 'row-acts');
    var go = button('Ouvrir le test', function () {
      go.disabled = true; later.disabled = true; b.disabled = true;
      var id = ++rawTestRequest;
      // Le projet d'avant (max_flow, vfa) : la conversation qu'on quitte, pour proposer d'y revenir.
      var from = conv ? { id: conv.id, title: conv.title || '' } : null;
      rawTestWaiters[id] = function (msg) { box.remove(); b.disabled = false; rawTestDone(msg, from); };
      window.orca.postMessage({ type: 'open_calibration', target: target, request: id });
    }, 'btn sm', 'wand');
    var later = button('Pas maintenant', function () { box.remove(); }, 'link');
    acts.appendChild(go);
    acts.appendChild(later);
    box.body.appendChild(acts);
    row.after(box);
    box.scrollIntoView({ block: 'nearest' });
  }
  // Après le test : comment le lire, et comment revenir à sa pièce (la conversation d'avant, dont le slicer a écrit le projet).
  function rawTestDone(msg, from) {
    var r = Logic.rawTestResult(msg);
    var box = alertBox(r.tone === 'ok' ? 'tip' : r.tone === 'error' ? 'error' : 'info', r.text, r.tone === 'ok' ? 'bulb' : r.tone === 'error' ? 'alert' : 'info');
    if (r.back && from && from.id && (!conv || conv.id !== from.id)) {
      var acts = el('div', 'row-acts');
      acts.appendChild(button('Revenir à ma pièce', function () { openConversation(from.id); }, 'btn ghost sm', 'undo'));
      box.body.appendChild(acts);
    }
    placeInOpenTab(box);
  }

  // ---------- Modèle 3D joint : posé sur le plateau, conseils sur clic seulement ----------
  function onModelAdded(msg) {
    dropPlacing();
    if (!msg.ok && msg.busy) { projectUI.reposing = false; noteLine(msg.text, 'warn', 'alert', 'guide'); return; } // le projet d'avant n'est pas encore rangé
    if (!msg.ok && msg.sample) {
      // Le bateau de test manque (installation abîmée) : la seule issue est un fichier à soi, et on dit où en trouver un.
      var none = noteLine((msg.text || 'Je n’ai pas pu poser le petit bateau de test.') + ' Choisis un fichier sur ton ordinateur, ou télécharge un modèle gratuit (par exemple sur printables.com), puis reviens ici.', 'error', 'alert', 'guide');
      none.appendChild(button('Choisir un fichier', function () { pickFiles(); }, 'link'));
      return;
    }
    if (!msg.ok) {
      projectUI.reposing = false;
      projectUI.adding = false;
      projectUI.modelQueue = []; // les pièces suivantes du même choix ne sont pas posées sans celle-ci
      // Fichier refusé par Orca (ERR-14) : une raison probable et une issue ; le message d'Orca, s'il en ouvre un, est cité dessous.
      var failLine = noteLine(msg.reason === 'orca_refused' ? msg.text : (msg.text || 'Je n’ai pas pu poser cette pièce sur le plateau.') + ' Je prends les fichiers STL, 3MF, OBJ, STEP et AMF.', 'error', 'alert', 'guide');
      failLine.appendChild(button('Choisir un autre fichier', function () { pickFiles(); }, 'link'));
      modelFail = { line: failLine, at: Date.now(), quotes: [], ask: null };
      var seen = modelDialogs.pending;
      clearTimeout(modelDialogs.timer);
      modelDialogs = { pending: [], timer: null };
      seen.forEach(function (d) { quoteUnderModelFail(d.text); });
      return;
    }
    flushModelDialogs(); // pièce posée malgré un message d'Orca : une erreur reste montrée
    if (msg.adaptation) { syncProjectNames(msg.adaptation.saved); if (msg.name) conv.project.adapted = msg.name; } // adapté dès l'import : pas une deuxième fois
    if (tourSignals) tourSignals.objects = Math.max(tourSignals.objects || 0, 1); // sans attendre le prochain signal
    attachDone(); // pièce posée : le slicer a attaché le plateau
    var old = projectUI.oldPart;
    projectUI.oldPart = null;
    var firstPose = !(conv.project.part && conv.project.part.name);
    var adding = !!projectUI.adding && !firstPose;
    projectUI.adding = false;
    // Lot 21 : couleurs prévues par le 3MF, gardées dans la fiche du projet (la carte « Couleurs » les montre même après le choix
    // des bobines). Un nouveau projet repart sans elles.
    if (Array.isArray(msg.file_colours) && msg.file_colours.length) conv.project.file_colours = msg.file_colours.slice(0, 16);
    else if (firstPose || msg.replaced > 0) delete conv.project.file_colours;
    coloursUI.posed = conv;
    threadNote((firstPose ? 'Pièce posée : « ' : adding ? 'Pièce ajoutée au plateau : « ' : 'Pièce remplacée : « ') + msg.name + ' »' + (Array.isArray(msg.size_mm) ? ', ' + msg.size_mm.map(function (x) { return Math.round(x); }).join(' × ') + ' mm' : '') + (msg.fits === false ? ' (trop grande pour le plateau)' : '') + '.', 'etapes');
    if (firstPose) { conv.project.part = { name: msg.name }; delete conv.project.part_later; projectChanged(); }
    else if (adding) {
      // Une pièce de plus dans ce projet : le plateau a changé, la découpe est à refaire, et il sera rangé (nextQueuedModel).
      conv.project.part.extra = (Array.isArray(conv.project.part.extra) ? conv.project.part.extra : []).concat([msg.name]).slice(0, 30);
      projectUI.arrangeAfter = true;
      if (tourSignals) tourSignals.sliced = false;
      var at = PlyoJourney.currentStep(conv.project);
      if (at === 'imprimer' || at === 'resultat') { delete conv.project.success; setTourStep('slice'); } else projectChanged();
    }
    else scheduleSave();
    if (projectUI.reposing) { projectUI.reposing = false; renderProject(); noteLine('« ' + msg.name + ' » est de nouveau sur le plateau.', 'ok', 'check', 'guide'); }
    projectUI.newProjectFile = false;
    if (msg.replaced > 0) showReplaced(msg, old);
    // Machine pas encore confirmée : la taille est mesurée sur le plateau de la machine en cours d'Orca. On ne la tait que si
    // le projet en vise une autre (machine proposée différente) ; sinon c'est bien la tienne, et « trop grande » est vrai.
    var measuredElsewhere = !PlyoProject.hasPrinter(conv.project) && !!(conv.project.printer && conv.project.printer.preset) && conv.project.printer.preset !== orcaPrinterName();
    if (msg.fits === false && measuredElsewhere) msg = Object.assign({}, msg, { fits: true });
    if (msg.fits === false) projectUI.tooBigNames = (projectUI.tooBigNames || []).concat([msg.name]); // dit après le rangement
    var entry = record({ kind: 'model', msg: msg, reduced: false });
    // Un seul fil (lot 5) : une première pièce bien posée est dite dans la carte d'étape (après le changement d'étape, qui
    // efface les messages), pas une deuxième fois dans les échanges ; elle reste dans l'historique du projet.
    var inStep = msg.fits !== false && (firstPose || adding) && !FS.modelAddedText(msg).warn;
    if (!inStep) renderModel(entry, false);
    if (msg.fits === false) showTooBig(entry);
    else if (adding) noteLine('« ' + msg.name + ' » ajoutée : ' + (1 + conv.project.part.extra.length) + ' pièces sur le plateau.', 'ok', 'check', 'guide');
    else if (inStep) noteLine(FS.modelAddedText(msg).text, 'ok', 'check', 'guide');
    // Fichier en plusieurs couleurs sur une machine à une seule bobine (PlyoColours, single_spool_machine) : tout s'imprime avec
    // ta bobine, dit une fois ; une machine qui a en fait plusieurs bobines se déclare d'un clic.
    if (msg.colours_ignored > 1) {
      var mono = noteLine(PlyoJourney.coloursIgnoredText(msg.name, msg.colours_ignored), '', 'palette', 'guide');
      mono.appendChild(button('Ma machine a plusieurs bobines', function () { mono.remove(); openManual(); }, 'link'));
    }
    nextQueuedModel();
  }
  // Nouveau projet : l'ancienne pièce a été retirée. La ligne et son « Annuler » restent visibles d'une étape à l'autre, jusqu'à la découpe.
  function dropReplaced() { var b = $('project-alert').querySelector('.part-replaced'); if (b) b.remove(); }
  function showReplaced(msg, old) {
    dropReplaced();
    var mine = conv, line = el('div', 'note-line part-replaced');
    line.appendChild(icon('check', 14));
    line.appendChild(el('span', 'note-text', PlyoProject.replacedText(old ? old.label : msg.replaced_name, msg.replaced)));
    line.appendChild(undoButton('Annuler', function (b) {
      plateAction('undo', function (ok) {
        if (!ok) { b.disabled = false; return; }
        line.remove();
        if (conv !== mine) return;
        // Retour à l'état d'avant le choix du fichier : l'ancienne pièce sur le plateau, la fiche qui attend une pièce.
        detachPlate();
        conv.project.part = null;
        delete conv.project.adapted;
        delete conv.project.file_colours;
        delete conv.project.step;
        delete conv.project.intent;
        intentUI.idk = false;
        dropTooBig();
        projectUI.oldPart = old || { label: msg.replaced_name, name: msg.replaced_name, objects: msg.replaced };
        projectChanged();
        noteLine('« ' + projectUI.oldPart.label + ' » est de nouveau sur le plateau.', 'ok', 'check', 'guide'); // après le changement d'étape, qui efface les messages
      }, { undo_token: msg.undo_token });
    }));
    plateUndoLinks.forEach(function (b) { b.remove(); });
    plateUndoLinks = [line]; // un seul « Annuler » actif : une autre action sur le plateau le retire
    $('project-alert').appendChild(line);
  }
  // Pièce trop grande : la carte reste dans l'étape en cours (elle survit au passage à l'étape suivante) jusqu'à ce que
  // tu réduises la pièce ou que tu gardes sa taille. La même carte est dans la discussion.
  var tooBigChat = null; // met à jour la copie de la discussion une fois la pièce réduite
  function dropTooBig() { var b = $('project-alert').querySelector('.too-big'); if (b) b.remove(); }
  function reducePart(entry, done) {
    plateAction('scale_to_fit', function (ok) {
      if (ok) {
        entry.reduced = true;
        scheduleSave();
        dropTooBig();
        if (tooBigChat) { tooBigChat(); tooBigChat = null; }
        // La découpe avait été refusée pour cette taille : elle repart seule, le parcours reprend.
        if (projectUI.sliceRefused === conv) { projectUI.sliceRefused = null; plateAction('slice'); }
      }
      done(ok);
    }, null, entry.msg.count);
  }
  // `refused` : Orca ne découpera pas tant que la pièce a cette taille ; garder la taille n'est donc plus une issue.
  function showTooBig(entry, refused) {
    var msg = entry.msg, printer = conv.project.printer;
    var other = printer ? PlyoMachines.machineThatFits(projectUI.printers, printer.preset, msg.size_mm) : null;
    dropTooBig();
    var box = alertBox('warn', (refused ? 'Je n’ai pas lancé la découpe. ' : '') + FS.modelAddedText(msg).text + (other ? ' Il tient sur ' + other.label + '.' : ''), 'alert');
    box.classList.add('too-big');
    var acts = el('div', 'printer-actions');
    var reduce = button('Réduire pour qu’il tienne', function () {
      reduce.disabled = true;
      reducePart(entry, function (ok) { if (!ok) reduce.disabled = false; });
    }, 'btn ghost sm', 'wand');
    acts.appendChild(reduce);
    if (other) acts.appendChild(button('Refaire la préparation sur ' + other.label, function () { dropTooBig(); projectUI.sliceRefused = null; projectHandlers.pickPrinter(other.preset, other.label); }, 'btn ghost sm'));
    acts.appendChild(button(refused ? 'Fermer' : 'Garder cette taille', dropTooBig, 'link'));
    box.body.appendChild(acts);
    $('project-alert').appendChild(box);
    box.scrollIntoView({ block: 'nearest' });
  }
  function renderModel(entry, archived) {
    var msg = entry.msg;
    showConversation();
    var box = el('div', 'ai');
    box.appendChild(whoLine());
    var said = FS.modelAddedText(msg);
    var dims = msg.size_mm.join(' × ') + ' mm';
    function adviceButton() {
      var ask = button('Conseille-moi des réglages pour cette pièce', function () {
        ask.disabled = true;
        send('Je viens de poser « ' + msg.name + ' » sur le plateau (' + dims + '). Quels réglages me conseilles-tu pour l’imprimer ? ' +
          'Si tu as besoin de savoir à quoi sert la pièce, demande-le-moi d’abord.');
      }, 'btn ghost sm');
      return ask;
    }
    if (!said.warn) {
      var ok = el('div', 'note-line ok');
      ok.appendChild(icon('check', 14));
      ok.appendChild(el('span', 'note-text', said.text));
      box.appendChild(ok);
      if (!archived) box.appendChild(el('div', 'row-acts')).appendChild(adviceButton());
    } else {
      var warn = alertBox('warn', said.text, 'alert');
      if (!archived && !entry.reduced) {
        var acts = el('div', 'row-acts');
        var reduce = button('Réduire pour qu’il tienne', function () {
          reduce.disabled = true;
          reducePart(entry, function (done) { if (!done) reduce.disabled = false; });
        }, 'btn sm', 'wand');
        tooBigChat = function () { acts.textContent = ''; acts.appendChild(adviceButton()); };
        acts.appendChild(reduce);
        warn.body.appendChild(acts);
      }
      box.appendChild(warn);
    }
    if (msg.adaptation) box.appendChild(renderAdaptation(msg.adaptation, archived));
    thread.appendChild(box);
    scrollDown();
  }
  // « J'ai adapté ce fichier à ton projet » : les réglages du 3MF repris, ceux écartés, et « Annuler ».
  function renderAdaptation(a, archived) {
    var adapted = Array.isArray(a.adapted) ? a.adapted : [], dropped = Array.isArray(a.dropped) ? a.dropped : [];
